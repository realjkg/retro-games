<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>The Bard's Tale — The Sewers of Skara Brae</title>
<meta name="description" content="The Bard's Tale: a browser recreation of Interplay's 1985 dungeon crawler. Six adventurers, a town under a winter that will not end, and the sewers under it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%BB%3C/text%3E%3C/svg%3E">
<!-- Installed to the home screen the game runs with no browser chrome at all,
     which is the only way to stop iOS sliding its toolbars over a game in play. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0a0806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bard's Tale">
<style>
:root{--bg:#0d0a08;--panel:#171210;--panel2:#221a15;--ink:#e8ddc8;--dim:#9a8b76;
  --gold:#d8a838;--line:#3a2c22;--blood:#a8321e;--mana:#4a7fd0;--good:#4caf6a}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#eee7da;--panel:#fffaf0;--panel2:#f5ecdd;--ink:#241b12;
    --dim:#6b5b47;--line:#d6c8b0}
}
:root[data-theme="dark"]{--bg:#0d0a08;--panel:#171210;--panel2:#221a15;--ink:#e8ddc8;
  --dim:#9a8b76;--line:#3a2c22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Nothing here is text to select: a long press on a control should hold the
   control, not raise iOS Safari's selection handles and its Copy callout. */
html,body,.btn,.menuitem,#status,#overlay,#roster,#log,canvas,.pc{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;
  padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
#wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:5px;flex:1}
#status{font-size:12px;line-height:1.35;padding:5px 8px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;display:flex;justify-content:space-between;gap:8px}
#status b{color:var(--gold)}
#stage{position:relative;width:100%;aspect-ratio:16/11;background:#000;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#roster{width:100%;border-collapse:collapse;font-size:11px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
#roster td{padding:2px 4px;border-top:1px solid var(--line);white-space:nowrap}
#roster tr:first-child td{border-top:none}
#roster .nm{width:36%;overflow:hidden;text-overflow:ellipsis}
#roster .hp{color:var(--blood);text-align:right}
#roster .sp{color:var(--mana);text-align:right}
#roster .ac{color:var(--dim);text-align:right}
#roster .st{color:var(--gold);text-align:right;font-size:10px}
#roster tr.dead td{opacity:.42}
#roster tr.sel td{background:var(--panel2)}
#roster tr.act td{background:var(--panel2)}
#roster tr.act td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
#log{height:74px;overflow-y:auto;font-size:11.5px;line-height:1.45;padding:5px 8px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  -webkit-overflow-scrolling:touch}
#log div{margin:0 0 1px}
#log .say{color:var(--gold)}
#log .hit{color:var(--blood)}
#log .ok{color:var(--good)}
#log .dim{color:var(--dim)}
#pads{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.padrow{display:flex;align-items:center;justify-content:center;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  font-size:14px;line-height:1.05;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;cursor:pointer;touch-action:none;text-align:center;
  padding:0 6px;min-width:58px;height:46px}
.btn small{font-size:8.5px;font-weight:600;letter-spacing:.03em;opacity:.6;text-transform:uppercase}
.btn:active,.btn.on{background:var(--gold);color:#1a1207;border-color:var(--gold)}
.btn[disabled]{opacity:.35}
.btn.wide{flex:1}
#overlay{position:absolute;inset:0;background:rgba(10,8,6,.95);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;padding:12px;text-align:center;overflow-y:auto}
#overlay.hidden{display:none}
#overlay.splash{background:linear-gradient(rgba(8,6,4,0) 0%,rgba(8,6,4,.3) 30%,rgba(8,6,4,.95) 62%);
  justify-content:flex-end;padding:10px 12px 12px}
/* A fight's side menus sit at the bottom over a scrim, because whatever you are
   choosing between, you want to keep looking at the thing in front of you. */
#overlay.low{background:linear-gradient(rgba(8,6,4,0) 0%,rgba(8,6,4,.55) 34%,rgba(8,6,4,.96) 60%);
  justify-content:flex-end;padding:8px 10px 10px;gap:4px}
#overlay.low .scroll{justify-content:flex-end;gap:4px}
#overlay.low h1{font-size:14px}
#overlay.low .sub{font-size:10.5px;margin:0}
#overlay.low .menuitem{padding:6px 9px;font-size:12px}
#fightbar{flex-wrap:wrap;gap:5px}
#fightbar .btn{height:40px;min-width:0;flex:1 1 30%;font-size:12px}
#fightbar .who{width:100%;text-align:center;font-size:11px;color:var(--gold);margin-bottom:1px}
h1{font-size:19px;margin:0;letter-spacing:.1em;color:var(--gold);font-weight:800}
h2{font-size:14px;margin:0;color:var(--gold);letter-spacing:.06em}
.sub{font-size:11.5px;color:var(--dim);margin:0 0 3px;max-width:400px;line-height:1.5}
.menuitem{width:min(330px,92%);padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel2);font-size:13px;cursor:pointer;color:var(--ink);text-align:left;
  display:flex;justify-content:space-between;gap:10px}
.menuitem b{color:var(--gold);font-weight:600}
.menuitem.sel{border-color:var(--gold);background:var(--gold);color:#1a1207}
.menuitem.sel b{color:#1a1207}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:min(340px,96%)}
.grid2 .menuitem,.grid3 .menuitem{width:auto}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;width:min(340px,96%)}
small.tip{color:var(--dim);font-size:10.5px;max-width:400px;line-height:1.5}
.scroll{max-height:100%;overflow-y:auto;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:6px}
#sound{position:absolute;right:6px;top:6px;z-index:3;min-width:0;height:26px;font-size:9px;padding:0 6px}
.sheet{font-size:11px;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;width:min(330px,94%);line-height:1.6}
.sheet .r{display:flex;justify-content:space-between;gap:10px}
.sheet .r span:last-child{color:var(--gold)}
@media (pointer:fine){#pads .hint{display:block}}
.hint{display:none;font-size:10px;color:var(--dim);text-align:center}
/* Every pressable control carries its own touch-action. The shared zoom
   guard below steps aside for anything pressable - it has to, or it eats
   the click that a fast second press makes - and it does that on the
   understanding that a control is already exempt from double-tap zoom.
   .menuitem never was, so double-tapping a menu button zoomed the page. */
.menuitem,#sound,#fs,#install,button,a{touch-action:manipulation}
</style>
</head>
<body>
<!-- arcade:start -->
<script data-shared="arcade">
/* ---- the coin-op bits every game here shares ----
 *
 * A high score table with three-letter initials, the entry screen that goes
 * with it, and one save slot. Eight games, one implementation, so the letters
 * are chosen the same way in all of them: three cells, the live one lit and
 * blinking, up and down to turn the letter, left and right to move along, fire
 * to take it. Type the letters straight in if you have a keyboard.
 *
 * The screen is built out of DOM rather than drawn into each game's canvas.
 * Half of these games draw their menus and half write markup, and the point of
 * this is that the entry screen is the same one everywhere; a canvas version
 * would have had to be written twice and would have drifted.
 *
 * Nothing here assumes anything about the page it is in beyond document.body.
 * It reads the host's colours through CSS custom properties where they exist
 * and falls back to its own where they do not.
 *
 * This file is the one copy. tools/sync-arcade.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  /* In a browser globalThis is window and this is the same object; under a test
   * harness the page's script runs in a context where they are not, and an
   * Arcade hung only on `window` would leave the bare name undefined. */
  var root=(typeof globalThis!=='undefined'&&globalThis)||window;
  if(typeof document==='undefined'||root.Arcade)return;

  /* Storage is namespaced per game, and every touch of it is guarded: it is
   * absent in a file:// sandbox on some browsers and throws on read in private
   * mode on others, and a high score table is never worth a dead page. */
  function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
  function put(k,v){try{localStorage.setItem(k,String(v));return true;}catch(e){return false;}}
  function drop(k){try{localStorage.removeItem(k);}catch(e){}}
  function readJSON(k,d){
    var raw=get(k,null);
    if(raw===null)return d;
    try{var v=JSON.parse(raw);return v===null?d:v;}catch(e){return d;}
  }

  /* A-Z, then the digits, then the three marks an arcade cabinet usually gave
   * you. A blank is last so it is one step back from A. */
  var GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-!_';
  var BLANK='_';                       /* drawn as a space, stored as a space */

  var CSS=''+
  '.ac-wrap{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'+
    'justify-content:center;padding:14px;background:rgba(6,5,10,.93);'+
    'font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;'+
    '-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}'+
  '.ac-card{width:min(380px,100%);max-height:100%;overflow-y:auto;text-align:center;'+
    'background:var(--panel,#14141f);border:1px solid var(--line,#2e2e42);'+
    'border-radius:12px;padding:14px 12px;color:var(--ink,#e6e6f2)}'+
  '.ac-h{font-size:15px;letter-spacing:.16em;font-weight:800;margin:0 0 2px;'+
    'color:var(--gold,#e8c63a)}'+
  '.ac-sub{font-size:11.5px;line-height:1.5;color:var(--dim,#9a8b76);margin:0 0 10px}'+
  '.ac-cells{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}'+
  '.ac-cell{width:52px;height:64px;display:flex;align-items:center;justify-content:center;'+
    'font-size:34px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'border:2px solid var(--line,#2e2e42);border-radius:8px;background:var(--panel2,#1e1e2d);'+
    'color:var(--ink,#e6e6f2)}'+
  /* the live cell: lit, and blinking so it is unmistakably the one you are on */
  '.ac-cell.on{border-color:var(--gold,#e8c63a);color:#16130a;'+
    'background:var(--gold,#e8c63a);animation:ac-blink 1s steps(1,end) infinite}'+
  '@keyframes ac-blink{0%,55%{opacity:1}56%,100%{opacity:.45}}'+
  '@media (prefers-reduced-motion:reduce){.ac-cell.on{animation:none}}'+
  '.ac-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}'+
  '.ac-b{background:var(--panel2,#1e1e2d);border:1px solid var(--line,#2e2e42);'+
    'border-radius:9px;color:var(--ink,#e6e6f2);font:inherit;font-size:15px;'+
    'padding:10px 4px;cursor:pointer;touch-action:manipulation}'+
  '.ac-b:active{background:var(--gold,#e8c63a);color:#16130a;border-color:var(--gold,#e8c63a)}'+
  '.ac-b.wide{grid-column:span 4;font-size:13px;font-weight:700;letter-spacing:.06em}'+
  '.ac-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'font-size:13px;line-height:1.85;text-align:left;margin:4px 0 10px}'+
  '.ac-row{display:flex;gap:8px;align-items:baseline;padding:0 4px;border-radius:5px}'+
  '.ac-row.me{background:rgba(232,198,58,.16);color:var(--gold,#e8c63a)}'+
  '.ac-rank{width:2.2em;color:var(--dim,#9a8b76);text-align:right}'+
  '.ac-ini{width:3.6em;letter-spacing:.18em}'+
  '.ac-sc{flex:1;text-align:right;font-weight:700}'+
  '.ac-x{width:7.5em;text-align:right;color:var(--dim,#9a8b76);font-size:11px}'+
  '.ac-empty{color:var(--dim,#9a8b76);font-size:12px;padding:12px 0}';

  function styles(){
    if(document.getElementById('ac-style'))return;
    var s=document.createElement('style');
    s.id='ac-style';s.textContent=CSS;
    (document.head||document.documentElement).appendChild(s);
  }

  var cfg={game:'game',slots:8,title:'HIGH SCORES',extraLabel:''};

  var K={
    scores:function(){return 'arcade.'+cfg.game+'.scores';},
    slot:function(){return 'arcade.'+cfg.game+'.slot';},
    last:function(){return 'arcade.'+cfg.game+'.initials';}
  };

  function table(){
    var rows=readJSON(K.scores(),[]);
    if(!rows||!rows.length||typeof rows.length!=='number')return[];
    return rows.filter(function(r){
      return r&&typeof r.score==='number'&&isFinite(r.score);
    }).map(function(r){
      return{ini:String(r.ini||'AAA').slice(0,3),score:Math.floor(r.score),
        at:r.at||0,extra:r.extra===undefined?'':String(r.extra)};
    }).sort(function(a,b){return b.score-a.score||a.at-b.at;}).slice(0,cfg.slots);
  }
  /* A score gets in if the table is short or it beats the last row. Ties go to
   * whoever got there first, which is what the sort above does. */
  function qualifies(score){
    if(typeof score!=='number'||!isFinite(score)||score<=0)return false;
    var t=table();
    return t.length<cfg.slots||score>t[t.length-1].score;
  }
  function record(ini,score,extra){
    var t=table();
    var row={ini:String(ini||'AAA').toUpperCase().slice(0,3),score:Math.floor(score),
      at:Date.now(),extra:extra===undefined?'':String(extra)};
    t.push(row);
    t.sort(function(a,b){return b.score-a.score||a.at-b.at;});
    t=t.slice(0,cfg.slots);
    put(K.scores(),JSON.stringify(t));
    put(K.last(),row.ini);
    return row;
  }

  /* ---- the screens ---- */
  var open=null;                       /* the overlay on screen, if any */
  function close(){
    if(!open)return;
    document.removeEventListener('keydown',open.key,true);
    if(open.el&&open.el.parentNode)open.el.parentNode.removeChild(open.el);
    open=null;
  }
  /* Can this document be built on at all? A page with no createElement is not
   * a page a screen can be put on, and the answer must be no rather than a
   * throw: the moment this is asked is the moment a game has just ended, and a
   * high score table is never worth taking the game down with it. */
  function buildable(){
    return !!(document&&typeof document.createElement==='function'&&document.body&&
      typeof document.body.appendChild==='function');
  }
  function frame(){
    styles();
    var w=document.createElement('div');w.className='ac-wrap';
    var c=document.createElement('div');c.className='ac-card';
    w.appendChild(c);
    document.body.appendChild(w);
    return{wrap:w,card:c};
  }
  function button(parent,label,fn,cls){
    var b=document.createElement('button');
    b.type='button';b.className='ac-b'+(cls?' '+cls:'');b.textContent=label;
    b.addEventListener('click',function(e){e.preventDefault();fn();});
    parent.appendChild(b);
    return b;
  }
  function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function show(opts){
    opts=opts||{};
    if(!buildable()){if(opts.onClose)opts.onClose();return null;}
    close();
    var f=frame(),rows=table();
    var h=document.createElement('p');h.className='ac-h';h.textContent=cfg.title;
    f.card.appendChild(h);
    if(opts.sub){
      var sb=document.createElement('p');sb.className='ac-sub';sb.textContent=opts.sub;
      f.card.appendChild(sb);
    }
    var list=document.createElement('div');list.className='ac-rows';
    if(!rows.length){
      var e=document.createElement('div');e.className='ac-empty';
      e.textContent='Nobody has been here yet.';
      list.appendChild(e);
    }
    rows.forEach(function(r,i){
      var row=document.createElement('div');
      row.className='ac-row'+(opts.mark&&r.at===opts.mark?' me':'');
      row.innerHTML='<span class="ac-rank">'+(i+1)+'</span>'+
        '<span class="ac-ini"></span><span class="ac-sc"></span>'+
        (cfg.extraLabel?'<span class="ac-x"></span>':'');
      row.querySelector('.ac-ini').textContent=r.ini;
      row.querySelector('.ac-sc').textContent=fmt(r.score);
      if(cfg.extraLabel)row.querySelector('.ac-x').textContent=r.extra||'';
      list.appendChild(row);
    });
    f.card.appendChild(list);
    var pad=document.createElement('div');pad.className='ac-pad';
    f.card.appendChild(pad);
    var done=opts.onClose||function(){};
    button(pad,'BACK',function(){close();done();},'wide');
    open={el:f.wrap,key:function(ev){
      if(ev.key==='Escape'||ev.key==='Enter'||ev.key===' '){
        ev.preventDefault();ev.stopPropagation();close();done();
      }
    }};
    document.addEventListener('keydown',open.key,true);
    return f;
  }

  /* The entry screen. Three cells, the live one lit; the rest is one keydown
   * handler taken at the capture phase so the game underneath never sees the
   * letters being chosen. */
  function entry(score,extra,then){
    if(!buildable()){then(null);return null;}
    close();
    var f=frame();
    var seed=(get(K.last(),'AAA')+'AAA').slice(0,3).toUpperCase();
    var idx=[0,1,2].map(function(i){
      var p=GLYPHS.indexOf(seed[i]);return p<0?0:p;
    });
    var at=0,fin=false;

    var h=document.createElement('p');h.className='ac-h';
    h.textContent='NEW HIGH SCORE';
    var sub=document.createElement('p');sub.className='ac-sub';
    sub.textContent=fmt(Math.floor(score))+(extra?'  ·  '+extra:'')+
      '  —  enter your initials';
    f.card.appendChild(h);f.card.appendChild(sub);

    var cells=document.createElement('div');cells.className='ac-cells';
    var cellEls=[0,1,2].map(function(){
      var d=document.createElement('div');d.className='ac-cell';
      cells.appendChild(d);return d;
    });
    f.card.appendChild(cells);
    function paint(){
      for(var i=0;i<3;i++){
        var g=GLYPHS[idx[i]];
        cellEls[i].textContent=g===BLANK?' ':g;
        cellEls[i].className='ac-cell'+(i===at?' on':'');
      }
    }
    function turn(d){idx[at]=(idx[at]+d+GLYPHS.length)%GLYPHS.length;paint();}
    function move(d){at=Math.max(0,Math.min(2,at+d));paint();}
    function setGlyph(ch){
      var p=GLYPHS.indexOf(ch);
      if(p<0)return false;
      idx[at]=p;
      if(at<2){at++;}
      paint();return true;
    }
    function finish(){
      if(fin)return;
      fin=true;
      var ini=idx.map(function(i){
        var g=GLYPHS[i];return g===BLANK?' ':g;
      }).join('').replace(/\s+$/,'');
      if(!ini)ini='AAA';
      var row=record(ini,score,extra);
      close();
      then(row);
    }

    var pad=document.createElement('div');pad.className='ac-pad';
    f.card.appendChild(pad);
    button(pad,'◀',function(){move(-1);});
    button(pad,'▲',function(){turn(1);});
    button(pad,'▼',function(){turn(-1);});
    button(pad,'▶',function(){move(1);});
    button(pad,'ENTER',finish,'wide');

    open={el:f.wrap,key:function(ev){
      var k=ev.key;
      var used=true;
      if(k==='ArrowUp'||k==='w'||k==='W')turn(1);
      else if(k==='ArrowDown'||k==='s'||k==='S')turn(-1);
      else if(k==='ArrowLeft'||k==='a'||k==='A')move(-1);
      else if(k==='ArrowRight'||k==='d'||k==='D')move(1);
      else if(k==='Enter')finish();
      else if(k==='Backspace'){if(at>0)move(-1);else turn(0);}
      else if(k&&k.length===1&&setGlyph(k.toUpperCase())){/* typed straight in */}
      else used=false;
      if(used){ev.preventDefault();ev.stopPropagation();}
    }};
    document.addEventListener('keydown',open.key,true);
    paint();
    return f;
  }

  root.Arcade={
    /* name the game once, at boot */
    init:function(o){
      o=o||{};
      cfg.game=String(o.game||'game');
      cfg.slots=Math.max(1,Math.min(20,o.slots||8));
      if(o.title)cfg.title=String(o.title);
      cfg.extraLabel=o.extraLabel?String(o.extraLabel):'';
      return this;
    },
    glyphs:GLYPHS,
    table:table,
    qualifies:qualifies,
    /* Offer the entry screen if the score is worth one; `then` gets the row
     * that was written, or null if it was not a high score at all. */
    submit:function(score,extra,then){
      then=then||function(){};
      if(!qualifies(score)||!buildable()){then(null);return false;}
      entry(score,extra,then);
      return true;
    },
    /* whether a screen can be put up here at all */
    canAsk:buildable,
    show:function(opts){show(opts);return this;},
    close:close,
    isOpen:function(){return !!open;},
    /* for the tests and for a player who wants their table back */
    clear:function(){drop(K.scores());return this;},
    record:record,
    /* ---- the save slot ----
     * One per game. What goes in it is the game's business; all this does is
     * keep it, namespaced, and admit when it could not. */
    save:function(state){
      try{return put(K.slot(),JSON.stringify({v:1,at:Date.now(),state:state}));}
      catch(e){return false;}
    },
    load:function(){
      var s=readJSON(K.slot(),null);
      return s&&s.state!==undefined?s.state:null;
    },
    savedAt:function(){
      var s=readJSON(K.slot(),null);
      return s&&s.at?s.at:0;
    },
    hasSave:function(){return this.load()!==null;},
    clearSave:function(){drop(K.slot());return this;}
  };
})();
</script>

<script>
'use strict';
/* The Bard's Tale — The Sewers of Skara Brae
 *
 * A party of six, a town in a winter that will not end, and three levels of
 * sewer under it. The view is 256x176 logical pixels drawn with
 * image-rendering:pixelated; everything below works in those and never in CSS.
 */
const VW=256,VH=176;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* One seeded generator for everything the game has to be able to reproduce:
 * the dungeons are the same dungeons on every machine and in every test run. */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;                       /* combat and encounters: really random */

/* ---------- who you can be ---------- */

  halfelf:  {name:'Half-Elf', mod:{iq:1,dx:1},                     hp:3},

/* hd is the die the class rolls for hit points at every level; sp is the die

  helm:     {name:'Iron Helm',    kind:'helm',  ac:1,      cost:80,  use:'heavy'},

/* What a class is allowed to put on. Nothing stops you buying it; it simply

/* ---------- spells ---------- */

  {code:'FIHO',name:'Fire Horn',     cls:'ma',at:3,sp:8, where:'fight',fx:'group',  amt:[2,6],

  {code:'MIBL',name:'Mind Blade',    cls:'so',at:1,sp:4, where:'fight',fx:'dmg',    amt:[2,5],

  {code:'SOSI',name:'Sorcerer Sight',cls:'so',at:2,sp:3, where:'walk', fx:'reveal',
   text:'the walls thin out for a moment'},
  {code:'HOLY',name:'Holy Word',     cls:'so',at:3,sp:9, where:'fight',fx:'group',  amt:[3,6],
   text:'a word that the undead cannot hear twice'},
  {code:'PHDO',name:'Phase Door',    cls:'wi',at:1,sp:5, where:'walk', fx:'phase',

  {code:'APAR',name:'Apport Arcane', cls:'wi',at:2,sp:10,where:'walk', fx:'exit',

  {code:'DEST',name:'Death Strike',  cls:'wi',at:3,sp:12,where:'fight',fx:'slay',

];
const SPELL_BY_CODE={};SPELLS.forEach(s=>SPELL_BY_CODE[s.code]=s);
function knownSpells(pc){

}

/* ---------- the bard's six songs ---------- */
/* A song lasts a handful of turns and costs a swallow from the bard's flask,
 * which is what the game charges instead of spell points. */
const SONGS=[
  {name:"Sanctuary Score", fx:'ac',   amt:2, turns:12,text:'the party is harder to touch'},
  {name:"Traveller's Tune",fx:'regen',amt:1, turns:20,text:'wounds close as you walk'},

  {name:"Lucklaran",       fx:'luck', amt:2, turns:16,text:'the dice lean your way'}
];

/* ---------- what is down there ---------- */
/* `lv` is the sewer level it starts turning up on; `n` is how many come at
 * once; `xp` and `gold` are per monster. */
const MONSTERS=[
  {id:'rat',   name:'Sewer Rat',    plural:'Sewer Rats',    lv:1,n:[3,6],hp:[1,4], ac:8,hit:0,dmg:[1,3],xp:20,  gold:[3,10]},
  {id:'kobold',name:'Kobold',       plural:'Kobolds',       lv:1,n:[2,5],hp:[1,6], ac:7,hit:1,dmg:[1,6],xp:40, gold:[6,16]},
  {id:'slime', name:'Mud Man',      plural:'Mud Men',       lv:1,n:[1,3],hp:[2,6], ac:6,hit:1,dmg:[1,8],xp:70, gold:[10,26],slow:true},
  {id:'gremlin',name:'Gremlin',     plural:'Gremlins',      lv:2,n:[2,4],hp:[2,6], ac:5,hit:2,dmg:[1,6],xp:110, gold:[16,40],steal:true},
  {id:'skel',  name:'Skeleton',     plural:'Skeletons',     lv:2,n:[2,5],hp:[2,8], ac:5,hit:2,dmg:[1,8],xp:140, gold:[22,50], undead:true},
  {id:'zerk',  name:'Berserker',    plural:'Berserkers',    lv:2,n:[2,4],hp:[3,6], ac:4,hit:3,dmg:[2,6],xp:200, gold:[30,70]},
  {id:'wererat',name:'Wererat',     plural:'Wererats',      lv:3,n:[1,3],hp:[3,8], ac:3,hit:3,dmg:[2,5],xp:300, gold:[45,95]},
  {id:'jester',name:'Crazed Jester',plural:'Crazed Jesters',lv:3,n:[1,3],hp:[3,8],ac:3,hit:3,dmg:[2,6],xp:380,gold:[55,115],spell:'ARFI'},
  {id:'ghoul', name:'Ghoul',        plural:'Ghouls',        lv:3,n:[2,4],hp:[4,8], ac:2,hit:4,dmg:[2,6],xp:450,gold:[65,135],undead:true},
  {id:'madgod',name:'The Mad God',  plural:'The Mad God',   lv:9,n:[1,1],hp:[12,10],ac:0,hit:6,dmg:[3,8],xp:3000,gold:[900,900],boss:true,spell:'FIHO'}
];
const MON_BY_ID={};MONSTERS.forEach(m=>MON_BY_ID[m.id]=m);

/* ---------- the world ---------- */
/* Skara Brae is drawn by hand, because it is a place rather than a maze: the
 * Guild on the north street, Garth's beside it, the Temple and the Scarlet Bard
 * on the flanks, the Review Board in the south, and in the middle of it the
 * grate house with the way down.
 *
 *   #  wall      .  street      ~  the inside of a building, which you cannot
 *   +  door         enter from here
 *   G  Adventurers' Guild   E  Garth's Equipment   T  Temple
 *   V  the Scarlet Bard     R  Review Board        S  the sewer grate
 */
const TOWN=[
"######################",
"#....................#",
"#.##########.#######.#",
"#.#~~~~~~~~#.#~~~~~#.#",
"#.#~~~~~~~~#.#~~~~~#.#",
"#.####G#####.###E###.#",
"#....................#",
"#.####.#####+#####.#.#",
"#.#~~#.#.........#.#~#",
"#.#~~#.#.........#.#~#",
"#.T~~#.#....S....#.V~#",
"#.#~~#.#.........#.#~#",
"#.####.#.........#.#~#",
"#......###########...#",
"#.##################.#",
"#.#~~~~~~~~~~~~~~~~#.#",
"#.#~~~~~~~~~~~~~~~~#.#",
"#.########R#########.#",
"#....................#",
"#.##################.#",
"#....................#",
"######################"];
const SIZE=22;

/* The sewers are cut by a generator with a fixed seed, so level two is the same
 * level two on every machine, in every test run and every time you come back to
 * it. Perfect mazes are miserable to walk, so a tenth of the dead ends are
 * opened up afterwards, which is what gives the loops you can run a fight into.
 *
 *   <  up      >  down     D  a dark square that puts your light out
 *   S  a spinner, which turns you somewhere you did not choose
 *   X  a teleporter        $  something somebody left
 *   B  the Mad God's floor
 */
function carve(seed){
  const rr=mulberry(seed);
  const g=[];
  for(let y=0;y<SIZE;y++)g.push(new Array(SIZE).fill('#'));
  const CN=10, cx=i=>1+i*2;                 /* ten cells a side, at odd columns */
  const seen=[];
  for(let i=0;i<CN;i++)seen.push(new Array(CN).fill(false));
  const stack=[[0,0]];seen[0][0]=true;g[cx(0)][cx(0)]='.';
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const opts=[[1,0],[-1,0],[0,1],[0,-1]]
      .map(([dx,dy])=>[x+dx,y+dy,dx,dy])
      .filter(([nx,ny])=>nx>=0&&ny>=0&&nx<CN&&ny<CN&&!seen[ny][nx]);
    if(!opts.length){stack.pop();continue;}
    const [nx,ny,dx,dy]=opts[Math.floor(rr()*opts.length)];
    seen[ny][nx]=true;
    g[cx(y)+dy][cx(x)+dx]='.';
    g[cx(ny)][cx(nx)]='.';
    stack.push([nx,ny]);
  }
  /* braid: open a tenth of the dead ends so the place has loops in it */
  for(let y=1;y<SIZE-1;y++)for(let x=1;x<SIZE-1;x++){
    if(g[y][x]!=='.')continue;
    const open=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>g[y+dy][x+dx]==='.').length;
    if(open===1&&rr()<0.22){
      const shut=[[1,0],[-1,0],[0,1],[0,-1]]
        .filter(([dx,dy])=>g[y+dy][x+dx]==='#'&&x+dx*2>0&&y+dy*2>0&&x+dx*2<SIZE-1&&y+dy*2<SIZE-1);
      if(shut.length){const[dx,dy]=shut[Math.floor(rr()*shut.length)];g[y+dy][x+dx]='.';}
    }
  }
  return g;
}
/* Breadth-first from a square, so features can be placed by how far away they
 * are rather than by where they happen to land. */
function reach(g,sx,sy){
  const dist=[];for(let y=0;y<SIZE;y++)dist.push(new Array(SIZE).fill(-1));
  dist[sy][sx]=0;const q=[[sx,sy]];
  for(let i=0;i<q.length;i++){
    const[x,y]=q[i];
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=SIZE||ny>=SIZE)continue;
      if(g[ny][nx]==='#'||dist[ny][nx]>=0)continue;
      dist[ny][nx]=dist[y][x]+1;q.push([nx,ny]);
    }
  }
  return dist;
}
function buildLevel(n){
  const g=carve(0xBADD1+n*7919);
  const rr=mulberry(0x51DE+n*104729);
  const up=[1,1];
  g[1][1]='<';
  const dist=reach(g,1,1);
  /* the way down is the furthest square there is from the way in */
  let best=[1,1],bd=-1;
  for(let y=1;y<SIZE-1;y++)for(let x=1;x<SIZE-1;x++)
    if(dist[y][x]>bd){bd=dist[y][x];best=[x,y];}
  g[best[1]][best[0]]=n===3?'B':'>';
  /* and everything else goes on a dead end, which is where you would put it */
  const ends=[];
  for(let y=1;y<SIZE-1;y++)for(let x=1;x<SIZE-1;x++){
    if(g[y][x]!=='.')continue;
    const open=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>g[y+dy][x+dx]!=='#').length;
    if(open===1&&dist[y][x]>4)ends.push([x,y]);
  }
  for(let i=ends.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[ends[i],ends[j]]=[ends[j],ends[i]];}
  const plan=n===1?['$','$','D','S','$']
           :n===2?['$','D','S','X','$','D','$']
                 :['$','D','D','S','X','$','$','X'];
  plan.forEach((ch,i)=>{if(ends[i])g[ends[i][1]][ends[i][0]]=ch;});
  return {grid:g,up,down:best,dist};
}
const LEVELS=[null,buildLevel(1),buildLevel(2),buildLevel(3)];
function tileAt(depth,x,y){
  if(x<0||y<0||x>=SIZE||y>=SIZE)return '#';
  return depth===0?TOWN[y][x]:LEVELS[depth].grid[y][x];
}
const SOLID='#~';
const solid=(depth,x,y)=>SOLID.indexOf(tileAt(depth,x,y))>=0;

/* ---------- adventurers ---------- */
function statBonus(v){return v>=18?3:v>=16?2:v>=14?1:v<=7?-1:0;}
function rollStats(race){
  const m=RACES[race].mod,out={};
  STATS.forEach(s=>out[s]=clamp(8+d(2,5)+(m[s]||0),3,18));
  return out;
}
function meetsReq(stats,cls){
  const req=CLASSES[cls].req;
  return Object.keys(req).every(k=>stats[k]>=req[k]);
}
function mkChar(name,race,cls,stats){
  const pc={name:name.slice(0,10),race,cls,lvl:1,xp:0,
    gear:{weapon:null,body:null,shield:null,helm:null},pack:[],status:'ok',
    song:0,flask:CLASSES[cls].hd===8&&cls==='bard'?3:0};
  STATS.forEach(s=>pc[s]=stats[s]);
  const C=CLASSES[cls];
  /* half the die flat plus a roll of it: a first-level warrior is somewhere
   * between thirteen and twenty-two rather than between four and sixteen,
   * which is the difference between the sewers being hard and being a joke */
  pc.maxhp=Math.max(6,Math.round(C.hd*0.6)+d(1,C.hd)+statBonus(pc.cn)+RACES[race].hp);
  pc.hp=pc.maxhp;
  pc.maxsp=C.sp?Math.max(2,d(1,C.sp)+statBonus(pc.iq)):0;
  pc.sp=pc.maxsp;
  return pc;
}
function acOf(pc){
  let ac=10-statBonus(pc.dx);
  for(const slot of['body','shield','helm']){
    const id=pc.gear[slot];
    if(id)ac-=ITEMS[id].ac||0;
  }
  if(pc.cls==='monk')ac-=Math.floor(pc.lvl/2)+1;
  if(P.buff.ac)ac-=P.buff.ac;
  return ac;
}
function weaponOf(pc){
  const id=pc.gear.weapon;
  return id?ITEMS[id]:{name:'bare hands',dmg:pc.cls==='monk'?[1,4+pc.lvl]:[1,2]};
}
function alive(pc){return pc.status==='ok'||pc.status==='poisoned';}
function nextXp(pc){return pc.lvl*pc.lvl*600;}

/* ---------- the party ---------- */
const P={
  roster:[],                 /* up to six, in marching order */
  gold:600,
  depth:0,x:6,y:6,dir:0,     /* 0 north, 1 east, 2 south, 3 west */
  light:0,                   /* turns of light left */
  buff:{},                   /* ac / tohit / regen / find, each with turns left */
  fight:null,
  steps:0,
  found:{},                  /* squares already looted */
  flag:{madgod:false}
};
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const DIRNAME=['north','east','south','west'];

function party(){return P.roster;}
function living(){return P.roster.filter(alive);}
function front(){return P.roster.filter(alive).slice(0,4);}
function wipedOut(){return P.roster.length>0&&living().length===0;}

/* ---------- the log ---------- */
const LOGMAX=120;
const logLines=[];
function say(text,cls){
  logLines.push({text,cls:cls||''});
  if(logLines.length>LOGMAX)logLines.shift();
  paintLog();
}
function blank(){say(' ');}

/* ---------- time passing ---------- */
/* One step, one turn: light burns down, songs run out, poison bites, and the
 * bard's regeneration puts a point back. */
function tick(n){
  n=n||1;
  for(let i=0;i<n;i++){
    P.steps++;
    if(P.light>0&&P.depth>0)P.light--;
    if(P.buffT)for(const k of Object.keys(P.buffT)){
      P.buffT[k]--;
      if(P.buffT[k]<=0){delete P.buffT[k];delete P.buff[k];}
    }
    if(P.buff.regen&&P.steps%4===0)
      living().forEach(pc=>{pc.hp=Math.min(pc.maxhp,pc.hp+P.buff.regen);});
    P.roster.forEach(pc=>{
      if(pc.status==='poisoned'){
        pc.hp-=1;
        if(pc.hp<=0){pc.hp=0;pc.status='dead';say(pc.name+' dies of the poison.','hit');}
      }
    });
  }
}
function addBuff(fx,amt,turns){
  P.buff[fx]=amt;
  P.buffT=P.buffT||{};
  P.buffT[fx]=turns;
}

/* ---------- walking ---------- */
function ahead(){const[dx,dy]=DIRS[P.dir];return[P.x+dx,P.y+dy];}
function turn(n){P.dir=(P.dir+n+4)%4;paint();}
function step(){
  if(P.fight)return;
  const[nx,ny]=ahead();
  if(solid(P.depth,nx,ny)){say('A wall.','dim');Snd.bump();paint();return;}
  P.x=nx;P.y=ny;
  tick(1);
  Snd.step();
  const t=tileAt(P.depth,P.x,P.y);
  square(t);
  if(!P.fight&&!overlayUp())maybeEncounter();
  paint();
}
function square(t){
  if(P.depth===0){
    const svc={G:'guild',E:'garth',T:'temple',V:'tavern',R:'review',S:'grate'}[t];
    if(svc)openService(svc);
    return;
  }
  if(t==='<'||t==='>'){askStairs(t);return;}
  if(t==='B'&&!P.flag.madgod){startFight(['madgod'],true);return;}
  if(t==='S'){
    P.dir=Math.floor(R()*4);
    say('The floor turns under you. You are facing '+DIRNAME[P.dir]+' — or you think you are.','say');
    Snd.magic();return;
  }
  if(t==='D'){
    if(P.light>0){P.light=0;say('The dark here eats your light.','say');Snd.magic();}
    else say('It is very dark.','dim');
    return;
  }
  if(t==='X'){
    const open=[];
    for(let y=1;y<SIZE-1;y++)for(let x=1;x<SIZE-1;x++)
      if(tileAt(P.depth,x,y)==='.')open.push([x,y]);
    const[nx,ny]=open[Math.floor(R()*open.length)];
    P.x=nx;P.y=ny;
    say('The floor drops away and puts you down somewhere else.','say');
    Snd.magic();return;
  }
  if(t==='$'){
    const key=P.depth+':'+P.x+','+P.y;
    if(P.found[key]){say('Somebody has been here. You were somebody.','dim');return;}
    P.found[key]=true;
    const g=d(P.depth+1,40)+20*P.depth;
    P.gold+=g;
    say('A strongbox, and '+g+' gold in it.','ok');
    if(R()<0.4){
      const id=pick(['potion','potion','torch','ropes','dagger','shortsw','leather','buckler']);
      P.roster[0].pack.push(id);
      say(P.roster[0].name+' takes '+ITEMS[id].name+'.','ok');
    }
    Snd.coin();
  }
}
/* An encounter is more likely the deeper you are and the longer you have gone
 * without one; walking into the same corridor forever will still find you. */
let quiet=0;
function maybeEncounter(){
  quiet++;
  const chance=P.depth===0?0.02:0.055+P.depth*0.02+quiet*0.004;
  if(R()>chance)return;
  quiet=0;
  const lv=P.depth||1;
  const pool=MONSTERS.filter(m=>!m.boss&&m.lv<=lv+(P.depth?0:0));
  if(!pool.length)return;
  const groups=[pick(pool).id];
  if(R()<0.35&&P.depth>1)groups.push(pick(pool).id);
  if(R()<0.15&&P.depth>2)groups.push(pick(pool).id);
  startFight(groups,false);
}

/* ---------- monsters on the floor ---------- */
function mkGroup(id,depth){
  const m=MON_BY_ID[id];
  const n=m.boss?1:clamp(m.n[0]+Math.floor(R()*(m.n[1]-m.n[0]+1)),1,9);
  const list=[];
  for(let i=0;i<n;i++)list.push({hp:d(m.hp[0],m.hp[1]),alive:true});
  return{id,m,list,name:n===1?m.name:n+' '+m.plural};
}
function groupAlive(g){return g.list.some(u=>u.alive);}
function countAlive(g){return g.list.filter(u=>u.alive).length;}
function startFight(ids,boss){
  P.fight={groups:ids.map(id=>mkGroup(id,P.depth)),round:0,orders:[],who:0,boss:!!boss,
    surprise:R()<0.18};
  blank();
  say(boss?'Something very large is already standing up.'
          :'You have company.','say');
  P.fight.groups.forEach(g=>say('  '+g.name,'say'));
  Snd.fight();
  beginRound();
}

/* ---------- a round of it ---------- */
function beginRound(){
  const f=P.fight;
  f.round++;f.orders=[];f.who=0;
  if(f.round===1&&f.surprise){
    say('They were waiting for you.','hit');
    resolveMonsters();
    f.surprise=false;
    if(!P.fight)return;
  }
  nextOrder();
}
function nextOrder(){
  const f=P.fight;
  while(f.who<P.roster.length&&!alive(P.roster[f.who]))f.who++;
  if(f.who>=P.roster.length){resolveRound();return;}
  askOrder(P.roster[f.who]);
}
function setOrder(o){
  const f=P.fight;
  f.orders[f.who]=o;
  f.who++;
  nextOrder();
}

function toHit(pc,mon){
  const w=weaponOf(pc);
  const bonus=pc.lvl+CLASSES[pc.cls].hit+statBonus(pc.st)+(P.buff.tohit||0);
  return d(1,20)+bonus>=10+mon.ac;
}
/* Whether a character can get at a group at all. What matters is not which
 * number the group has but how many live groups are standing in front of it:
 * as the front ones fall the back ones come forward. Without that, a third
 * group is out of melee reach for ever, and a party that has spent its spell
 * points is in a fight that cannot end — which is how a playthrough found this,
 * at round ninety-seven. */
function meleeReaches(gi,pc){
  if(weaponOf(pc).reach)return true;
  const f=P.fight;
  if(!f)return gi<2;
  let ahead=0;
  for(let i=0;i<gi;i++)if(groupAlive(f.groups[i]))ahead++;
  return ahead<2;
}
/* Damage lands on the front one of a group, and the group is only as dead as
 * its last member; returns whether that one went down. */
function hurtGroup(g,dmg){
  const u=g.list.find(u=>u.alive);
  if(!u)return false;
  u.hp-=dmg;
  if(u.hp<=0){u.alive=false;return true;}
  return false;
}
function attack(pc,gi){
  const f=P.fight,g=f.groups[gi];
  if(!g||!groupAlive(g)){say(pc.name+' has nothing left to swing at.','dim');return;}
  if(!meleeReaches(gi,pc)){say(pc.name+' cannot reach that far back.','dim');return;}
  const w=weaponOf(pc);
  const swings=1+(pc.cls==='warrior'?Math.floor(pc.lvl/4):0);
  for(let i=0;i<swings;i++){
    if(!groupAlive(g))break;
    if(!toHit(pc,g.m)){say(pc.name+' misses the '+g.m.name+'.','dim');continue;}
    let dmg=d(w.dmg[0],w.dmg[1])+statBonus(pc.st);
    const critter=(pc.cls==='rogue'||pc.cls==='hunter');
    if(critter&&d(1,100)<=3+pc.lvl*2){
      dmg+=d(2,8);
      say(pc.name+' finds the gap. '+g.m.name+' drops.','ok');
      hurtGroup(g,9999);
      continue;
    }
    dmg=Math.max(1,dmg);
    const died=hurtGroup(g,dmg);
    say(pc.name+' hits the '+g.m.name+' for '+dmg+(died?'. It falls.':'.'),'hit');
  }
  Snd.hit();
}
function castAt(pc,sp,gi,ally){
  if(pc.sp<sp.sp){say(pc.name+' has not the power.','dim');return;}
  pc.sp-=sp.sp;
  Snd.magic();
  const f=P.fight;
  if(sp.fx==='dmg'||sp.fx==='group'||sp.fx==='slay'){
    const g=f&&f.groups[gi];
    if(!g||!groupAlive(g)){say('The spell finds nothing.','dim');return;}
    if(sp.fx==='slay'){
      if(g.m.boss&&d(1,100)>18){say(sp.name+' washes over it and does nothing.','dim');return;}
      hurtGroup(g,9999);
      say(sp.name+': the '+g.m.name+' simply stops.','ok');
      return;
    }
    if(sp.fx==='group'){
      let n=0;
      for(const u of g.list){
        if(!u.alive)continue;
        u.hp-=d(sp.amt[0],sp.amt[1])+pc.lvl;
        if(u.hp<=0){u.alive=false;n++;}
      }
      say(sp.name+' — '+sp.text+'. '+(n?n+' fall.':'They hold.'),'hit');
      return;
    }
    const dmg=d(sp.amt[0],sp.amt[1])+Math.floor(pc.lvl/2);
    const died=hurtGroup(g,dmg);
    say(sp.name+' hits the '+g.m.name+' for '+dmg+(died?'. It falls.':'.'),'hit');
    return;
  }
  if(sp.fx==='heal'){
    const t=ally||pc;
    const before=t.hp;
    if(t.status==='dead'){say('That is past healing here.','dim');pc.sp+=sp.sp;return;}
    t.hp=Math.min(t.maxhp,t.hp+d(sp.amt[0],sp.amt[1])+pc.lvl);
    t.status=t.status==='poisoned'?'ok':t.status;
    say(sp.name+': '+t.name+' takes back '+(t.hp-before)+' points.','ok');
    return;
  }
  if(sp.fx==='light'){P.light=Math.max(P.light,sp.amt);say(sp.name+' — '+sp.text+'.','ok');return;}
  if(sp.fx==='ac'){addBuff('ac',sp.amt,14);say(sp.name+' — '+sp.text+'.','ok');return;}
  if(sp.fx==='tohit'){addBuff('tohit',sp.amt,12);say(sp.name+' — '+sp.text+'.','ok');return;}
  if(sp.fx==='locate'){
    say('You are on level '+P.depth+' at '+P.x+', '+P.y+', facing '+DIRNAME[P.dir]+'.','ok');return;}
  if(sp.fx==='reveal'){addBuff('find',1,20);say(sp.name+' — '+sp.text+'.','ok');return;}
  if(sp.fx==='untrap'){say(sp.name+' — '+sp.text+'.','ok');return;}
  if(sp.fx==='phase'){
    const[dx,dy]=DIRS[P.dir];
    const nx=P.x+dx*2,ny=P.y+dy*2;
    if(solid(P.depth,nx,ny)){say('There is too much stone that way.','dim');return;}
    P.x=nx;P.y=ny;say(sp.name+' — '+sp.text+'.','ok');return;
  }
  if(sp.fx==='exit'){
    if(P.depth===0){say('You are already outside.','dim');return;}
    P.depth=0;P.x=12;P.y=8;P.dir=2;P.light=0;P.fight=null;
    say(sp.name+' — '+sp.text+'.','ok');return;
  }
}
function sing(pc,song){
  if(pc.flask<=0){say(pc.name+"'s flask is empty. Try the Scarlet Bard.",'dim');return;}
  pc.flask--;
  const s=SONGS[song];
  if(s.fx==='light')P.light=Math.max(P.light,s.amt);
  else addBuff(s.fx,s.amt,s.turns);
  say(pc.name+' plays '+s.name+' — '+s.text+'.','ok');
  Snd.song();
}
function useItem(pc,idx,ally){
  const id=pc.pack[idx];
  if(!id)return;
  const it=ITEMS[id];
  if(it.heal){
    const t=ally||pc;
    if(t.status==='dead'){say('Not while they are dead.','dim');return;}
    const before=t.hp;
    t.hp=Math.min(t.maxhp,t.hp+d(it.heal[0],it.heal[1]));
    if(t.status==='poisoned')t.status='ok';
    say(t.name+' drinks and takes back '+(t.hp-before)+' points.','ok');
  }else if(it.light){
    P.light=Math.max(P.light,it.light);say(pc.name+' lights a torch.','ok');
  }else if(it.rope){
    say('The rope is no use here.','dim');return;
  }else{say('Nothing happens.','dim');return;}
  pc.pack.splice(idx,1);
  Snd.magic();
}
function tryRun(){
  const f=P.fight;
  if(f.boss){say('It is between you and the only door.','hit');return false;}
  const n=f.groups.reduce((t,g)=>t+countAlive(g),0);
  const luck=living().reduce((t,pc)=>t+statBonus(pc.lk),0);
  if(d(1,20)+luck>=8+n){
    say('You get out of there.','ok');
    P.fight=null;closeFightbar();
    const[dx,dy]=DIRS[P.dir];
    if(!solid(P.depth,P.x-dx,P.y-dy)){P.x-=dx;P.y-=dy;}
    hideOverlay();paint();
    return true;
  }
  say('They cut you off.','hit');
  return false;
}

function resolveRound(){
  const f=P.fight;
  if(!f)return;
  closeFightbar();hideOverlay();
  blank();
  say('— round '+f.round+' —','dim');
  for(let i=0;i<P.roster.length;i++){
    const pc=P.roster[i],o=f.orders[i];
    if(!pc||!alive(pc)||!o)continue;
    if(o.k==='attack')attack(pc,o.g);
    else if(o.k==='defend'){pc.defending=true;say(pc.name+' guards.','dim');}
    else if(o.k==='cast')castAt(pc,o.sp,o.g,o.ally);
    else if(o.k==='sing')sing(pc,o.song);
    else if(o.k==='use')useItem(pc,o.idx,o.ally);
    else if(o.k==='run'){if(tryRun())return;}
    if(!P.fight)return;
    if(victory())return;
  }
  resolveMonsters();
  if(!P.fight)return;
  P.roster.forEach(pc=>pc.defending=false);
  tick(1);
  if(victory())return;
  if(wipedOut()){defeat();return;}
  beginRound();
}
function resolveMonsters(){
  const f=P.fight;
  /* Only so many of them can get at you at once. Without this a floor with
   * three groups of four on it lands twelve blows a round on four people and
   * nothing that walks down there at level three ever walks back. */
  let reach=6;
  for(const g of f.groups){
    if(!groupAlive(g))continue;
    if(reach<=0)break;
    const n=Math.min(countAlive(g),4,reach);
    reach-=n;
    if(g.m.spell&&d(1,100)<=25){
      const sp=SPELL_BY_CODE[g.m.spell];
      const t=pick(front().length?front():living());
      if(t){
        const dmg=d(sp.amt[0],sp.amt[1])+g.m.lv;
        t.hp-=dmg;
        say('The '+g.m.name+' casts '+sp.name+'. '+t.name+' takes '+dmg+'.','hit');
        if(t.hp<=0)downs(t);
      }
      continue;
    }
    for(let i=0;i<n;i++){
      const targets=front().length?front():living();
      if(!targets.length)break;
      const t=pick(targets);
      let ac=acOf(t);
      if(t.defending)ac-=3;
      if(d(1,20)+g.m.hit+g.m.lv<10+ac){say('The '+g.m.name+' misses '+t.name+'.','dim');continue;}
      let dmg=d(g.m.dmg[0],g.m.dmg[1]);
      t.hp-=dmg;
      say('The '+g.m.name+' hits '+t.name+' for '+dmg+'.','hit');
      if(g.m.steal&&P.gold>0&&d(1,100)<=20){
        const took=Math.min(P.gold,d(2,40));P.gold-=took;
        say('It goes through your purse and takes '+took+' gold.','hit');
      }
      if(t.hp<=0)downs(t);
    }
  }
  Snd.hit();
}
function downs(pc){
  pc.hp=0;pc.status='dead';
  say(pc.name+' is down.','hit');
  Snd.die();
}
function victory(){
  const f=P.fight;
  if(!f)return false;
  if(f.groups.some(groupAlive))return false;
  let xp=0,gold=0;
  f.groups.forEach(g=>g.list.forEach(u=>{xp+=g.m.xp;gold+=d(g.m.gold[0],g.m.gold[1]);}));
  const each=xp;
  living().forEach(pc=>pc.xp+=each);
  P.gold+=gold;
  blank();
  say('That is the last of them. '+each+' experience each, and '+gold+' gold.','ok');
  if(f.boss){
    P.flag.madgod=true;
    say('The Mad God is a heap of cold stone. Whatever it was guarding is yours.','ok');
    P.gold+=2000;
    say('Two thousand gold, and the way out is behind you.','ok');
  }
  P.fight=null;
  Snd.win();
  closeFightbar();hideOverlay();paint();
  return true;
}
function defeat(){
  P.fight=null;closeFightbar();
  blank();
  say('The party is dead in the dark under Skara Brae.','hit');
  Snd.die();
  showDefeat();
}

/* ---------- sound ---------- */
/* Oscillators only: there is no sample data in the page and nothing is fetched,
 * which is what keeps the game a single file that runs from a folder. */
const Snd={ctx:null,on:load('bt.sound','1')==='1',
  boot(){if(this.ctx)return;
    try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();}catch(e){this.ctx=null;}},
  tone(type,f0,f1,dur,gain,delay){
    if(!this.on)return;this.boot();const c=this.ctx;if(!c)return;
    try{if(c.state==='suspended')c.resume();}catch(e){}
    const t=c.currentTime+(delay||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(gain,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  },
  noise(dur,gain,f,delay){
    if(!this.on)return;this.boot();const c=this.ctx;if(!c)return;
    try{if(c.state==='suspended')c.resume();}catch(e){}
    const n=Math.max(1,Math.floor(c.sampleRate*dur));
    const buf=c.createBuffer(1,n,c.sampleRate),dd=buf.getChannelData(0);
    for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource();s.buffer=buf;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f||600;
    const g=c.createGain();g.gain.value=gain;
    s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(c.currentTime+(delay||0));
  },
  step(){this.noise(0.07,0.05,320);},
  bump(){this.tone('square',120,70,0.1,0.05);},
  hit(){this.noise(0.15,0.12,700);this.tone('sawtooth',260,110,0.14,0.05);},
  die(){this.noise(0.5,0.16,300);this.tone('sawtooth',200,40,0.5,0.07);},
  magic(){[523,659,784].forEach((f,i)=>this.tone('sine',f,f*1.5,0.16,0.045,i*0.05));},
  coin(){[880,1174].forEach((f,i)=>this.tone('triangle',f,f,0.1,0.05,i*0.07));},
  fight(){[196,233,294].forEach((f,i)=>this.tone('sawtooth',f,f,0.2,0.05,i*0.11));},
  win(){[392,494,587,784].forEach((f,i)=>this.tone('triangle',f,f,0.18,0.055,i*0.12));},
  song(){[440,554,659,880,659,554].forEach((f,i)=>this.tone('triangle',f,f,0.13,0.05,i*0.1));},
  door(){this.noise(0.25,0.08,180);}
};

/* ---------- monster pictures ---------- */
/* Each one is drawn into a 48x48 buffer at whole pixels and then blown up with
 * smoothing off, so what reaches the screen is pixel art whatever size the
 * page is. Drawn rather than written out as a grid because a grid of forty-
 * eight rows is unreadable in a source file, and these have to be legible
 * enough to tell a ghoul from a wererat at a glance. */
const MP={K:'#141018',D:'#2c2620',S:'#6e6458',W:'#dcd6c4',F:'#c98b64',N:'#7a5230',
  R:'#a8321e',O:'#d97b21',Y:'#e8c249',G:'#4a7a3a',B:'#3c5fa8',P:'#7a4a9a',
  E:'#e84c2a',C:'#5ad1e6',M:'#9a3050',T:'#3a3a44'};
function mkArt(draw){
  const cv=document.createElement('canvas');cv.width=cv.height=48;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  const A={
    box:(x,y,w,h,c)=>{g.fillStyle=MP[c]||c;g.fillRect(x|0,y|0,w|0,h|0);},
    disc:(cx,cy,r,c)=>{g.fillStyle=MP[c]||c;
      for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));
        g.fillRect((cx-w)|0,(cy+y)|0,(w*2+1)|0,1);}},
    tri:(x0,y0,x1,y1,x2,y2,c)=>{g.fillStyle=MP[c]||c;g.beginPath();
      g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineTo(x2,y2);g.closePath();g.fill();},
    band:(y,x0,x1,c)=>{g.fillStyle=MP[c]||c;g.fillRect(x0|0,y|0,(x1-x0)|0,1);},
    /* a taper: a limb or a tail, from one width to another */
    limb:(x0,y0,x1,y1,w0,w1,c)=>{g.fillStyle=MP[c]||c;
      const n=Math.max(2,Math.round(Math.hypot(x1-x0,y1-y0)));
      for(let i=0;i<=n;i++){const t=i/n,w=Math.max(1,Math.round(w0+(w1-w0)*t));
        g.fillRect(Math.round(x0+(x1-x0)*t-w/2),Math.round(y0+(y1-y0)*t-w/2),w,w);}},
    mirror:()=>{const d=g.getImageData(0,0,48,48);
      for(let y=0;y<48;y++)for(let x=0;x<24;x++){
        const a=(y*48+x)*4,b=(y*48+47-x)*4;
        for(let k=0;k<4;k++)d.data[b+k]=d.data[a+k];}
      g.putImageData(d,0,0);}
  };
  draw(A);
  return cv;
}

/* ---------- a 5x7 bitmap font ---------- */
/* Two hex digits per row, five bits used. The page's own text is HTML; this is
 * only for the handful of words that belong inside the picture. */
const FONT={
'0':'0E1113151911 0E','1':'040C0404040 40E','2':'0E110102040 81F','3':'1F0204020111 0E',
'4':'02060A121F02 02','5':'1F101E010111 0E','6':'06081 01E11110E','7':'1F01020408 0808',
'8':'0E11110E11110E','9':'0E11110F01020C',
'A':'0E11111F111111','B':'1E11111E11111E','C':'0E1110101011 0E','D':'1C1211111112 1C',
'E':'1F10101E10101F','F':'1F10101E101010','G':'0E111017111 10F','H':'1111111F111111',
'I':'0E04040404040E','J':'0702020202120C','K':'1112141814 1211','L':'1010101010101F',
'M':'111B1515111111','N':'1119151311 1111','O':'0E1111111111 0E','P':'1E11111E101010',
'Q':'0E1111111512 0D','R':'1E11111E141211','S':'0F10100E01011E','T':'1F0404040404 04',
'U':'1111111111110E','V':'111111111 10A04','W':'1111111515 1B11','X':'11110A040A1111',
'Y':'11110A04040404','Z':'1F010204081 01F',
' ':'00000000000000','-':'0000001F000000','!':'0404040404 0004','.':'00000000000004',
',':'00000000040408','/':'01020204080810',':':'00040400040400',"'":'04040000000000'};
function glyph(ch){
  const s=(FONT[ch]||FONT['-']).replace(/ /g,'');
  const r=[];for(let i=0;i<7;i++)r.push(parseInt(s.substr(i*2,2),16)||0);
  return r;
}
const textW=s=>String(s).length*6-1;
function drawText(g,str,x,y,col){
  g.fillStyle=col||'#e8ddc8';
  str=String(str).toUpperCase();
  let px=Math.round(x);
  for(const ch of str){
    const rows=glyph(ch);
    for(let r=0;r<7;r++){
      const bits=rows[r];if(!bits)continue;
      for(let c=0;c<5;c++)if(bits&(1<<(4-c)))g.fillRect(px+c,Math.round(y)+r,1,1);
    }
    px+=6;
  }
}
const drawTextC=(g,s,y,col)=>drawText(g,s,(VW-textW(s))/2,y,col);

/* ---------- the view ---------- */
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const VIEW={x0:6,y0:6,x1:250,y1:158};
const CXP=(VIEW.x0+VIEW.x1)/2, CYP=(VIEW.y0+VIEW.y1)/2-6;
const MAXD=5;
function frameAt(k){
  const s=Math.pow(0.545,k);
  return{x0:CXP-(CXP-VIEW.x0)*s,x1:CXP+(VIEW.x1-CXP)*s,
         y0:CYP-(CYP-VIEW.y0)*s,y1:CYP+(VIEW.y1-CYP)*s};
}
/* k steps ahead, side -1 for the left hand and +1 for the right */
function cellAt(k,side){
  const[fx,fy]=DIRS[P.dir],[rx,ry]=DIRS[(P.dir+1)%4];
  return[P.x+fx*k+rx*(side||0),P.y+fy*k+ry*(side||0)];
}
function lit(){return P.depth===0||P.light>0;}
/* How much light reaches a slab. In the dark a torch gives you two squares and
 * a rumour of the third, which is most of what the sewers are about. */
function shade(k){
  if(P.depth===0)return[0.95,0.8,0.66,0.54,0.44,0.36][k]||0.3;
  if(!lit())return[0.30,0.16,0.07,0.03,0.02,0.02][k]||0;
  return[1,0.8,0.62,0.47,0.35,0.26][k]||0.2;
}
function tone(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f),gg=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);
  return'rgb('+r+','+gg+','+b+')';
}
function quad(x0,y0,x1,y1,x2,y2,x3,y3,col){
  g.fillStyle=col;g.beginPath();
  g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.closePath();g.fill();
}
function drawWorld(){
  const dark=P.depth>0&&!lit();
  const wallC=P.depth===0?'#7a6f60':'#5a5344';
  const floorC=P.depth===0?'#453f37':'#2e2b24';
  const ceilC=P.depth===0?'#1b2436':'#1a1712';
  /* sky or ceiling above, ground below, both running to the vanishing point */
  const far=frameAt(MAXD);
  g.fillStyle=tone(floorC,P.depth===0?1:(dark?0.35:1));
  g.fillRect(VIEW.x0,VIEW.y0,VIEW.x1-VIEW.x0,VIEW.y1-VIEW.y0);
  quad(VIEW.x0,VIEW.y0,VIEW.x1,VIEW.y0,far.x1,far.y0,far.x0,far.y0,
       tone(ceilC,P.depth===0?1:(dark?0.5:1)));
  /* how far you can see before something stops you */
  let block=MAXD+1;
  for(let k=1;k<=MAXD;k++){const[x,y]=cellAt(k,0);if(solid(P.depth,x,y)){block=k;break;}}
  if(block<=MAXD){
    const b=frameAt(block),f=shade(block-1);
    g.fillStyle=tone(wallC,f);
    g.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
    /* courses of stone, so a dead end is a wall and not a flat colour */
    g.fillStyle='rgba(0,0,0,'+(0.28*f).toFixed(2)+')';
    const h=(b.y1-b.y0)/5;
    for(let i=1;i<5;i++)g.fillRect(b.x0,b.y0+h*i,b.x1-b.x0,1);
    for(let i=0;i<5;i++){
      const y=b.y0+h*i,off=(i%2)?0:(b.x1-b.x0)/4;
      for(let x=b.x0+off;x<b.x1;x+=(b.x1-b.x0)/2)g.fillRect(x,y,1,h);
    }
  }
  const last=Math.min(block-1,MAXD-1);
  for(let k=last;k>=0;k--){
    const a=frameAt(k),b=frameAt(k+1),f=shade(k);
    const[lx,ly]=cellAt(k,-1),[rx,ry]=cellAt(k,1);
    if(solid(P.depth,lx,ly))
      quad(a.x0,a.y0,b.x0,b.y0,b.x0,b.y1,a.x0,a.y1,tone(wallC,f*0.82));
    else
      quad(a.x0,a.y0,b.x0,b.y0,b.x0,b.y1,a.x0,a.y1,tone(ceilC,f*0.7));
    if(solid(P.depth,rx,ry))
      quad(a.x1,a.y0,b.x1,b.y0,b.x1,b.y1,a.x1,a.y1,tone(wallC,f*0.62));
    else
      quad(a.x1,a.y0,b.x1,b.y0,b.x1,b.y1,a.x1,a.y1,tone(ceilC,f*0.55));
    /* the floor of this slab, a shade lighter than the one behind it */
    quad(a.x0,a.y1,b.x0,b.y1,b.x1,b.y1,a.x1,a.y1,tone(floorC,f*0.9));
    quad(a.x0,a.y0,b.x0,b.y0,b.x1,b.y0,a.x1,a.y0,tone(ceilC,f*0.85));
    /* and the seam between slabs, which is what makes distance readable */
    g.strokeStyle='rgba(0,0,0,'+(0.5*f).toFixed(2)+')';g.lineWidth=1;
    g.beginPath();g.moveTo(b.x0,b.y0);g.lineTo(b.x0,b.y1);
    g.moveTo(b.x1,b.y0);g.lineTo(b.x1,b.y1);g.stroke();
    decorate(k,a,b,f);
  }
  g.strokeStyle='#1a1712';g.lineWidth=2;
  g.strokeRect(VIEW.x0-1,VIEW.y0-1,VIEW.x1-VIEW.x0+2,VIEW.y1-VIEW.y0+2);
}
/* Doors and stairs, drawn in the slab they are actually in. */
const DOORS='+GETVRS';
function decorate(k,a,b,f){
  const[cx,cy]=cellAt(k,0);
  const t=tileAt(P.depth,cx,cy);
  if(k>0&&DOORS.indexOf(t)>=0){
    const w=(b.x1-b.x0)*0.44,hh=(b.y1-b.y0)*0.78;
    const x=CXP-w/2,y=b.y1-hh;
    g.fillStyle=tone('#5a3a1e',f);g.fillRect(x,y,w,hh);
    g.fillStyle=tone('#3a2412',f);g.fillRect(x+1,y+1,w-2,hh-2);
    g.fillStyle=tone('#8a6a34',f);g.fillRect(x+w*0.72,y+hh*0.5,Math.max(1,w*0.1),Math.max(1,hh*0.07));
    if(t!=='+'){
      const label={G:'GUILD',E:'GARTH',T:'TEMPLE',V:'TAVERN',R:'REVIEW',S:'SEWER'}[t];
      if(label&&k<=2)drawText(g,label,CXP-textW(label)/2,y-9,tone('#d8a838',Math.min(1,f+0.2)));
    }
  }
  if(t==='<'||t==='>'){
    const w=(b.x1-b.x0)*0.7,x=CXP-w/2;
    for(let i=0;i<4;i++){
      const y=b.y1+(a.y1-b.y1)*(i/4);
      g.fillStyle=tone(t==='>'?'#241f19':'#6a6152',f*(1-i*0.12));
      g.fillRect(x-(a.x1-b.x1)*(i/8),y,w+(a.x1-b.x1)*(i/4),Math.max(1,(a.y1-b.y1)/5));
    }
    if(k<=2)drawText(g,t==='>'?'DOWN':'UP',CXP-textW(t==='>'?'DOWN':'UP')/2,b.y1-10,
      tone('#d8a838',Math.min(1,f+0.25)));
  }
  if(t==='$'&&!P.found[P.depth+':'+cx+','+cy]&&k<=2){
    const w=(b.x1-b.x0)*0.3;
    g.fillStyle=tone('#8a6a34',f);g.fillRect(CXP-w/2,b.y1-w*0.6,w,w*0.6);
    g.fillStyle=tone('#d8a838',f);g.fillRect(CXP-w/2,b.y1-w*0.6,w,2);
  }
}

/* The fight, drawn over the corridor it is happening in. */
function drawFight(){
  const f=P.fight;
  g.fillStyle='rgba(8,6,4,0.62)';
  g.fillRect(VIEW.x0,VIEW.y0,VIEW.x1-VIEW.x0,VIEW.y1-VIEW.y0);
  const live=f.groups.filter(groupAlive);
  const show=live.length?live:f.groups;
  /* whole-number scaling only: three groups at two-and-a-bit times size would
     overrun the canvas and land the art on half-pixels */
  const S=show.length>=3?1:2;
  const w=48*S,gap=8;
  const total=show.length*w+(show.length-1)*gap;
  let x=Math.round(CXP-total/2);
  const y=Math.round(VIEW.y0+6);
  show.forEach((grp,i)=>{
    const img=ART[grp.id];
    if(img)g.drawImage(img,x,y,w,w);
    drawText(g,String(i+1),x+2,y+2,'#d8a838');
    x+=w+gap;
  });
  /* The names go underneath as a list rather than one under each picture: at
   * three groups a picture is forty-eight pixels wide and 'CRAZED JESTERS' is
   * eighty-four, and clipping it to fit gave 'CRAZED J'. */
  let ly=y+w+4;
  show.forEach((grp,i)=>{
    const n=countAlive(grp);
    const label=(i+1)+') '+(n>1?n+' '+grp.m.plural:grp.m.name);
    drawText(g,label,Math.round(CXP-textW(label)/2),ly,n?'#e8ddc8':'#6e6458');
    ly+=9;
  });
}
function drawHud(){
  g.fillStyle='#0d0a08';g.fillRect(0,VIEW.y1+3,VW,VH-VIEW.y1-3);
  const where=P.depth===0?'SKARA BRAE':'SEWERS '+P.depth;
  drawText(g,where,4,VH-11,'#9a8b76');
  const c='N E S W'.split(' ')[P.dir];
  drawText(g,'FACING '+c,VW-6-textW('FACING '+c),VH-11,'#d8a838');
  if(P.depth>0){
    const l=P.light>0?'LIGHT '+P.light:'DARK';
    drawText(g,l,Math.round(CXP-textW(l)/2),VH-11,P.light>0?'#5ad1e6':'#a8321e');
  }
}
function paintView(){
  g.fillStyle='#0d0a08';g.fillRect(0,0,VW,VH);
  if(P.roster.length)drawWorld();
  else{
    drawTextC(g,"THE BARD'S TALE",50,'#d8a838');
    drawTextC(g,'SKARA BRAE',64,'#9a8b76');
  }
  if(P.fight)drawFight();
  drawHud();
}

/* ---------- the page around it ---------- */
function el(id){return document.getElementById(id);}
const rbody=el('rbody'),logEl=el('log'),ov=el('overlay');
function paintLog(){
  logEl.innerHTML=logLines.map(l=>'<div class="'+l.cls+'">'+l.text+'</div>').join('');
  logEl.scrollTop=logEl.scrollHeight;
}
const STATUS={ok:'',poisoned:'POIS',dead:'DEAD'};
function paintRoster(){
  const f=P.fight;
  rbody.innerHTML=P.roster.map((pc,i)=>{
    const cls=[alive(pc)?'':'dead',f&&f.who===i?'act':''].filter(Boolean).join(' ');
    return '<tr class="'+cls+'">'+
      '<td class="nm">'+(i+1)+' '+esc(pc.name)+'</td>'+
      '<td class="dim">'+CLASSES[pc.cls].name.slice(0,4).toUpperCase()+' '+pc.lvl+'</td>'+
      '<td class="ac">AC '+acOf(pc)+'</td>'+
      '<td class="hp">'+pc.hp+'/'+pc.maxhp+'</td>'+
      '<td class="sp">'+(pc.maxsp?pc.sp+'/'+pc.maxsp:'—')+'</td>'+
      '<td class="st">'+(STATUS[pc.status]||'')+'</td></tr>';
  }).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function paint(){
  paintView();paintRoster();
  el('gold').textContent=P.gold;
  el('place').textContent=P.depth===0?'Skara Brae':'The Sewers, level '+P.depth;
  const busy=!!P.fight||overlayUp();
  ['bfwd','bturnl','bturnr'].forEach(id=>el(id).disabled=busy);
}

/* ---------- overlays ---------- */
/* One menu builder for the whole game: a title, a line of explanation, a list
 * of choices and an optional way back. The keyboard walks it, a tap takes it. */
let menuItems=[],menuGo=[],menuSel=0,menuBack=null;
function overlayUp(){return !ov.classList.contains('hidden');}
function hideOverlay(){
  ov.className='hidden';ov.innerHTML='';
  menuItems=[];menuGo=[];menuBack=null;
  paint();
}
function menu(o){
  const parts=['<div class="scroll">'];
  if(o.title)parts.push('<h1>'+esc(o.title)+'</h1>');
  if(o.sub)parts.push('<p class="sub">'+o.sub+'</p>');
  if(o.html)parts.push(o.html);
  (o.items||[]).forEach(it=>{
    parts.push('<button class="menuitem" type="button"'+(it.off?' disabled':'')+'>'+
      '<span>'+esc(it.label)+'</span>'+(it.right?'<b>'+esc(it.right)+'</b>':'')+'</button>');
  });
  if(o.tip)parts.push('<small class="tip">'+o.tip+'</small>');
  parts.push('</div>');
  ov.className=o.cls||'';
  ov.innerHTML=parts.join('');
  menuItems=Array.from(ov.querySelectorAll('.menuitem'));
  menuGo=(o.items||[]).map(it=>it.go);
  menuBack=o.back||null;
  menuSel=Math.max(0,(o.items||[]).findIndex(it=>!it.off));
  menuItems.forEach((m,i)=>m.addEventListener('click',()=>{
    if((o.items[i]||{}).off)return;
    menuSel=i;paintMenu();
    const f=menuGo[i];if(f)f();
  }));
  paintMenu();
  paint();
}
function paintMenu(){menuItems.forEach((m,i)=>m.classList.toggle('sel',i===menuSel));}
function menuMove(n){
  if(!menuItems.length)return;
  for(let i=0;i<menuItems.length;i++){
    menuSel=(menuSel+n+menuItems.length)%menuItems.length;
    if(!menuItems[menuSel].disabled)break;
  }
  paintMenu();
}
function menuEnter(){const f=menuGo[menuSel];if(f)f();}

/* ---------- making a party ---------- */
let draft=null;
function newGame(){
  P.roster=[];P.gold=600;P.depth=0;P.x=6;P.y=6;P.dir=0;P.light=0;
  P.buff={};P.buffT={};P.found={};P.flag={madgod:false};P.fight=null;P.steps=0;
  closeFightbar();
  logLines.length=0;
  say('Skara Brae, and the snow has not stopped in three years.','say');
  Snd.boot();
  guild();
}
const NAMES=['Brann','Tarna','Kylo','Merrow','Sable','Dunn','Ysolde','Gorm','Pike',
  'Wren','Halvard','Isolde','Rook','Fenn','Mab','Orrin','Thessa','Galt'];
function guild(){
  const full=P.roster.length>=6;
  menu({title:"ADVENTURERS' GUILD",
    sub:P.roster.length?P.roster.length+' of six. '+
        (P.roster.length>=2?'You can leave when you are ready.':'Two at the very least.')
       :'Nobody walks into the sewers alone.',
    items:[
      {label:'MAKE A CHARACTER',off:full,go:createName},

      {label:'DISBAND SOMEBODY',off:!P.roster.length,go:disbandScreen},
      {label:'SAVE THE PARTY',off:!P.roster.length,go:()=>{saveGame();say('Saved.','ok');guild();}},
      {label:'OUT INTO THE STREET',off:P.roster.length<2,go:()=>{hideOverlay();
        say('You step out into the snow.','dim');}}

function createName(){
  const suggested=NAMES[Math.floor(R()*NAMES.length)];
  menu({title:'WHO IS THIS?',
    html:'<input id="nmin" maxlength="10" value="'+esc(suggested)+'" '+
      'style="width:min(240px,80%);padding:8px;border-radius:8px;border:1px solid var(--line);'+
      'background:var(--panel2);color:var(--ink);font:inherit;font-size:14px;text-align:center">',
    items:[
      {label:'ANOTHER NAME',go:createName},
      {label:'CARRY ON',go:()=>{
        const v=(el('nmin').value||suggested).trim()||suggested;
        draft={name:v};createRace();}},
      {label:'NEVER MIND',go:guild}
    ]});
}
function createRace(){
  menu({title:draft.name,sub:'What are they?',
    items:RACE_ORDER.map(k=>({label:RACES[k].name,
      right:Object.keys(RACES[k].mod).map(s=>s.toUpperCase()+(RACES[k].mod[s]>0?'+':'')+
        RACES[k].mod[s]).join(' ')||'even',
      go:()=>{draft.race=k;draft.stats=rollStats(k);createClass();}})).concat(
      [{label:'BACK',go:createName}])});
}
function createClass(){
  const st=draft.stats;
  menu({title:draft.name+' the '+RACES[draft.race].name,
    html:'<div class="sheet">'+STATS.map(s=>
      '<div class="r"><span>'+{st:'Strength',iq:'Intellect',dx:'Dexterity',
        cn:'Constitution',lk:'Luck'}[s]+'</span><span>'+st[s]+'</span></div>').join('')+'</div>',
    sub:'Some doors are shut by the dice. Roll again if you like.',
    items:[{label:'ROLL AGAIN',go:()=>{draft.stats=rollStats(draft.race);createClass();}}]
      .concat(CLASS_ORDER.map(k=>({label:CLASSES[k].name,
        right:meetsReq(st,k)?'':Object.keys(CLASSES[k].req).map(r=>r.toUpperCase()+' '+
          CLASSES[k].req[r]).join(' '),
        off:!meetsReq(st,k),
        go:()=>{
          const pc=mkChar(draft.name,draft.race,k,st);
          starterKit(pc);
          P.roster.push(pc);
          say(pc.name+' the '+RACES[pc.race].name+' '+CLASSES[pc.cls].name+' joins you.','ok');
          guild();
        }})))
      .concat([{label:'BACK',go:createRace}])});
}
/* Nobody starts naked: the guild hands out what the class can hold. */
function starterKit(pc){
  const a=CLASSES[pc.cls].armour;
  if(a==='all'){pc.gear.weapon='shortsw';pc.gear.body='leather';pc.gear.shield='buckler';}
  else if(a==='light'){pc.gear.weapon=pc.cls==='hunter'?'bow':'dagger';pc.gear.body='leather';}
  else{pc.gear.weapon='staff';pc.gear.body='robes';}
  pc.pack.push('torch');
}
function orderScreen(){
  menu({title:'MARCHING ORDER',
    sub:'The first four take the blows. Tap two to swap them.',
    items:P.roster.map((pc,i)=>({label:(i+1)+'  '+pc.name,
      right:(i<4?'front':'back')+' · '+CLASSES[pc.cls].name,
      go:()=>{
        if(draft&&draft.swap!==undefined&&draft.swap!==i){
          const j=draft.swap;
          [P.roster[i],P.roster[j]]=[P.roster[j],P.roster[i]];
          draft=null;orderScreen();
        }else{draft={swap:i};orderScreen();}
      }})).concat([{label:'DONE',go:()=>{draft=null;guild();}}]),
    tip:draft&&draft.swap!==undefined?'Now tap the one to swap with.':''});
}
function disbandScreen(){
  menu({title:'DISBAND',sub:'They go back to whatever they were doing.',
    items:P.roster.map((pc,i)=>({label:pc.name,right:CLASSES[pc.cls].name,
      go:()=>{say(pc.name+' leaves the party.','dim');P.roster.splice(i,1);guild();}}))
      .concat([{label:'BACK',go:guild}])});
}

function openService(which){

function garth(){

    items:[
      {label:'BUY',go:buyWho},
      {label:'SELL',go:sellWho},

    ]});

function leaveShop(){
  hideOverlay();
  stepBack();
}
/* Coming out of a building puts you back in the street you came from, which is
 * the only sane thing to do when the door is a square you stand on. */
function stepBack(){
  const[dx,dy]=DIRS[P.dir];
  if(!solid(P.depth,P.x-dx,P.y-dy)&&tileAt(P.depth,P.x-dx,P.y-dy)!=='~'){
    P.x-=dx;P.y-=dy;
  }
  P.dir=(P.dir+2)%4;
  paint();
}
function buyWho(){
  menu({title:'BUY FOR WHOM?',sub:'Gold: '+P.gold,
    items:P.roster.map((pc,i)=>({label:pc.name,right:CLASSES[pc.cls].name,
      go:()=>buyList(i)})).concat([{label:'BACK',go:garth}])});
}
function buyList(i){
  const pc=P.roster[i];
  menu({title:'FOR '+pc.name.toUpperCase(),sub:'Gold: '+P.gold,
    items:Object.keys(ITEMS).map(id=>{
      const it=ITEMS[id];
      const ok=canUse(pc,id)&&P.gold>=it.cost;
      return{label:it.name,right:it.cost+'g'+(canUse(pc,id)?'':' — no'),off:!ok,
        go:()=>{
          P.gold-=it.cost;pc.pack.push(id);
          equipBest(pc);
          say(pc.name+' buys '+it.name+'.','ok');Snd.coin();
          buyList(i);
        }};
    }).concat([{label:'BACK',go:buyWho}])});
}
/* Whatever is in the pack that the character can hold and that is better than
 * what they have on, goes on. Nobody carries plate in a sack. */
function equipBest(pc){
  const slots={weapon:'weapon',body:'body',shield:'shield',helm:'helm'};
  for(const id of pc.pack.slice()){
    const it=ITEMS[id];
    const slot=slots[it.kind];
    if(!slot||!canUse(pc,id))continue;
    const cur=pc.gear[slot]?ITEMS[pc.gear[slot]]:null;
    const score=x=>x?(x.ac||0)*10+(x.dmg?x.dmg[0]*x.dmg[1]:0):-1;
    if(score(it)>score(cur)){
      if(slot==='shield'&&pc.gear.weapon&&ITEMS[pc.gear.weapon].hands===2)continue;
      if(cur)pc.pack.push(pc.gear[slot]);
      pc.gear[slot]=id;
      pc.pack.splice(pc.pack.indexOf(id),1);
    }
  }
}
function sellWho(){
  menu({title:'SELL WHAT?',sub:'Gold: '+P.gold,
    items:P.roster.flatMap((pc,i)=>pc.pack.map((id,j)=>({
      label:pc.name+': '+ITEMS[id].name,right:Math.floor(ITEMS[id].cost/2)+'g',
      go:()=>{
        P.gold+=Math.floor(ITEMS[id].cost/2);
        pc.pack.splice(j,1);
        say(pc.name+' sells '+ITEMS[id].name+'.','ok');Snd.coin();
        sellWho();
      }}))).concat([{label:'BACK',go:garth}])});
}
/* What the Temple charges. The first pass had a resurrection at six hundred a
 * level against monsters that dropped three gold, so a party that lost anybody
 * lost them for good and then lost everybody. */
const TEMPLE={wound:8,poison:70,dead:220};
function temple(){
  const jobs=P.roster.map((pc,i)=>{
    if(pc.status==='dead')return{pc,i,what:'dead',cost:TEMPLE.dead*pc.lvl};
    if(pc.status==='poisoned')return{pc,i,what:'poison',cost:TEMPLE.poison};
    if(pc.hp<pc.maxhp)return{pc,i,what:'wound',cost:TEMPLE.wound*(pc.maxhp-pc.hp)};
    return null;
  }).filter(Boolean);
  menu({title:'TEMPLE OF THE MOON',sub:'Gold: '+P.gold,
    items:jobs.map(j=>({
      label:j.pc.name+' — '+{dead:'dead',poison:'poisoned',wound:'wounded'}[j.what],
      right:j.cost+'g',off:P.gold<j.cost,
      go:()=>{
        P.gold-=j.cost;
        j.pc.status='ok';j.pc.hp=j.pc.maxhp;
        say('The priests see to '+j.pc.name+'.','ok');Snd.magic();
        temple();
      }})).concat(
      jobs.length?[]:[{label:'NOBODY NEEDS US',off:true,go:null}],
      [{label:'LEAVE',go:leaveShop}])});
}
function tavern(){
  const RUMOURS=[
    'Mangar sits at the top of a tower that has no door at the bottom.',
    'The grate in the plaza has been unlocked since the first winter.',
    'There is a thing under the third level that used to be a god.',
    'Some floors down there turn you around. Count your steps, not your turns.',
    'A dark square will take your light and not give it back.',
    'The Review Board will not promote a corpse. Temple first.'
  ];
  const bards=P.roster.filter(pc=>pc.cls==='bard');
  menu({title:'THE SCARLET BARD',sub:'Gold: '+P.gold,
    items:[
      {label:'BUY A ROUND',right:'50g',off:P.gold<50||!bards.length,
       go:()=>{P.gold-=50;bards.forEach(b=>b.flask=Math.min(6,b.flask+3));
         say('The flasks are full again.','ok');Snd.coin();tavern();}},
      {label:'LISTEN',go:()=>{say('"'+pick(RUMOURS)+'"','say');tavern();}},
      {label:'LEAVE',go:leaveShop}],
    tip:bards.length?'':'No bard in the party, so the drink is just a drink.'});
}
function review(){
  const ready=P.roster.filter(pc=>pc.xp>=nextXp(pc)&&pc.status!=='dead');
  menu({title:'REVIEW BOARD',
    sub:ready.length?'Somebody has earned something.':'Come back with more behind you.',
    items:P.roster.map(pc=>({
      label:pc.name,right:pc.xp+' / '+nextXp(pc),
      off:!(pc.xp>=nextXp(pc)&&pc.status!=='dead'),
      go:()=>{levelUp(pc);review();}}))
      .concat([{label:'LEAVE',go:leaveShop}])});
}
function levelUp(pc){
  pc.xp-=nextXp(pc);
  pc.lvl++;
  const C=CLASSES[pc.cls];
  const hp=Math.max(1,d(1,C.hd)+statBonus(pc.cn));
  pc.maxhp+=hp;pc.hp+=hp;
  if(C.sp){const sp=Math.max(1,d(1,C.sp)+statBonus(pc.iq));pc.maxsp+=sp;pc.sp+=sp;}
  say(pc.name+' is now level '+pc.lvl+'. '+hp+' more hit points.','ok');
  const learned=knownSpells(pc).filter(s=>s.at===Math.ceil(pc.lvl/2));
  learned.forEach(s=>say('  learns '+s.code+' — '+s.name,'ok'));
  Snd.win();
}

function askStairs(t){
  const up=t==='<';
  menu({title:up?'STAIRS UP':'STAIRS DOWN',
    items:[
      {label:up?(P.depth===1?'OUT INTO THE PLAZA':'UP A LEVEL'):'DOWN A LEVEL',
       go:()=>{

          if(P.depth===1){P.depth=0;P.x=12;P.y=10;P.dir=2;P.light=0;
            say('You come up through the grate into the snow.','say');}
          else{P.depth--;const dn=LEVELS[P.depth].down;P.x=dn[0];P.y=dn[1];}
