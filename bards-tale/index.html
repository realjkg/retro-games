/* ---------- giving orders ---------- */
/* The orders go in the button pad rather than over the picture: whatever you
 * are deciding, you should be able to see what you are deciding about. */
const fightbar=el('fightbar');
function askOrder(pc){
  const f=P.fight;
  hideOverlay();
  const spells=knownSpells(pc).filter(s=>s.where==='fight'||s.where==='any');
  const acts=[
    {label:'ATTACK',go:()=>pickGroup(g2=>setOrder({k:'attack',g:g2}),pc)},
    {label:'DEFEND',go:()=>setOrder({k:'defend'})},
    {label:'CAST',off:!spells.length||pc.sp<=0,
     go:()=>pickSpell(pc,spells,sp=>{
       if(sp.fx==='heal')pickAlly(a=>setOrder({k:'cast',sp,ally:a}));
       else if(sp.fx==='dmg'||sp.fx==='group'||sp.fx==='slay')
         pickGroup(g2=>setOrder({k:'cast',sp,g:g2}),pc);
       else setOrder({k:'cast',sp});
     },()=>askOrder(pc))},
    {label:'SING',off:pc.cls!=='bard'||pc.flask<=0,
     go:()=>pickSong(pc,s=>setOrder({k:'sing',song:s}),()=>askOrder(pc))},
    {label:'ITEM',off:!pc.pack.length,
     go:()=>pickItem(pc,idx=>{
       const it=ITEMS[pc.pack[idx]];
       if(it.heal)pickAlly(a=>setOrder({k:'use',idx,ally:a}));
       else setOrder({k:'use',idx});
     },()=>askOrder(pc))},
    {label:'RUN',off:!!f.boss,go:()=>setOrder({k:'run'})}
  ];
  fightbar.hidden=false;
  fightbar.innerHTML='<div class="who">'+esc(pc.name)+' — round '+f.round+'</div>'+
    acts.map(a=>'<button class="btn" type="button"'+(a.off?' disabled':'')+'>'+
      esc(a.label)+'</button>').join('');
  Array.from(fightbar.querySelectorAll('button')).forEach((b,i)=>{
    if(acts[i].off)return;
    b.addEventListener('click',()=>{Snd.boot();acts[i].go();});
  });
  fightOrder=acts;fightSel=acts.findIndex(a=>!a.off);
  paintFightbar();
  paint();
}
let fightOrder=[],fightSel=0;
function paintFightbar(){
  Array.from(fightbar.querySelectorAll('button')).forEach((b,i)=>
    b.classList.toggle('on',i===fightSel));
}
function fightMove(n){
  if(!fightOrder.length)return;
  for(let i=0;i<fightOrder.length;i++){
    fightSel=(fightSel+n+fightOrder.length)%fightOrder.length;
    if(!fightOrder[fightSel].off)break;
  }
  paintFightbar();
}
function fightEnter(){const a=fightOrder[fightSel];if(a&&!a.off)a.go();}
function closeFightbar(){fightbar.hidden=true;fightbar.innerHTML='';fightOrder=[];}
function pickGroup(then,pc){
  const f=P.fight;
  menu({cls:'low',title:'AT WHICH?',
    items:f.groups.map((g,i)=>({label:(i+1)+') '+g.name,
      right:groupAlive(g)?(pc&&!meleeReaches(i,pc)?'out of reach':''):'down',
      off:!groupAlive(g),go:()=>then(i)}))
      .concat([{label:'BACK',go:()=>askOrder(P.roster[f.who])}])});
}
function pickSpell(pc,spells,then,back){
  menu({cls:P.fight?'low':'',title:'WHICH SPELL?',sub:pc.name+' has '+pc.sp+' spell points.',
    items:spells.map(s=>({label:s.code+'  '+s.name,right:s.sp+'sp',off:pc.sp<s.sp,
      go:()=>then(s)})).concat([{label:'BACK',go:back}])});
}
function pickSong(pc,then,back){
  menu({cls:P.fight?'low':'',title:'WHICH SONG?',sub:pc.name+' has '+pc.flask+' swallows left.',
    items:SONGS.map((s,i)=>({label:s.name,right:s.text,go:()=>then(i)}))
      .concat([{label:'BACK',go:back}])});
}
function pickItem(pc,then,back){
  menu({cls:P.fight?'low':'',title:'WHICH ITEM?',
    items:pc.pack.map((id,i)=>({label:ITEMS[id].name,go:()=>then(i)}))
      .concat([{label:'BACK',go:back}])});
}
function pickAlly(then){
  menu({cls:P.fight?'low':'',title:'FOR WHOM?',
    items:P.roster.map((pc,i)=>({label:pc.name,
      right:pc.status==='dead'?'dead':pc.hp+'/'+pc.maxhp,
      go:()=>then(pc)}))});
}

/* ---------- out of a fight ---------- */
function castMenu(){
  if(P.fight)return;
  const casters=P.roster.filter(pc=>alive(pc)&&knownSpells(pc).length&&pc.sp>0);
  if(!casters.length){say('Nobody here has a spell left.','dim');return;}
  menu({title:'WHO CASTS?',
    items:casters.map(pc=>({label:pc.name,right:pc.sp+'sp',
      go:()=>{
        const spells=knownSpells(pc).filter(s=>s.where!=='fight');
        if(!spells.length){say(pc.name+' knows nothing for out here.','dim');hideOverlay();return;}
        pickSpell(pc,spells,sp=>{
          if(sp.fx==='heal')pickAlly(a=>{castAt(pc,sp,0,a);hideOverlay();});
          else{castAt(pc,sp,0);hideOverlay();}
        },castMenu);
      }})).concat([{label:'NEVER MIND',go:hideOverlay}])});
}
function singMenu(){
  if(P.fight)return;
  const bards=P.roster.filter(pc=>alive(pc)&&pc.cls==='bard'&&pc.flask>0);
  if(!bards.length){say('No bard with anything left in the flask.','dim');return;}
  const pc=bards[0];
  pickSong(pc,i=>{sing(pc,i);hideOverlay();},hideOverlay);
}
function useMenu(){
  if(P.fight)return;
  const who=P.roster.filter(pc=>alive(pc)&&pc.pack.length);
  if(!who.length){say('Nobody is carrying anything to use.','dim');return;}
  menu({title:'WHO USES WHAT?',
    items:who.map(pc=>({label:pc.name,right:pc.pack.length+' things',
      go:()=>pickItem(pc,idx=>{
        const it=ITEMS[pc.pack[idx]];
        if(it.heal)pickAlly(a=>{useItem(pc,idx,a);hideOverlay();});
        else{useItem(pc,idx);hideOverlay();}
      },useMenu)})).concat([{label:'NEVER MIND',go:hideOverlay}])});
}
function partyMenu(){
  menu({title:'THE PARTY',
    items:P.roster.map(pc=>({label:pc.name,
      right:CLASSES[pc.cls].name+' '+pc.lvl,go:()=>sheet(pc)}))
      .concat([{label:'CLOSE',go:hideOverlay}])});
}
function sheet(pc){
  const w=weaponOf(pc);
  const gear=['weapon','body','shield','helm'].map(s=>pc.gear[s]?ITEMS[pc.gear[s]].name:'—');
  const spells=knownSpells(pc);
  menu({title:pc.name,
    sub:RACES[pc.race].name+' '+CLASSES[pc.cls].name+', level '+pc.lvl,
    html:'<div class="sheet">'+
      STATS.map(s=>'<div class="r"><span>'+{st:'Strength',iq:'Intellect',dx:'Dexterity',
        cn:'Constitution',lk:'Luck'}[s]+'</span><span>'+pc[s]+'</span></div>').join('')+
      '<div class="r"><span>Hit points</span><span>'+pc.hp+' / '+pc.maxhp+'</span></div>'+
      (pc.maxsp?'<div class="r"><span>Spell points</span><span>'+pc.sp+' / '+pc.maxsp+'</span></div>':'')+
      (pc.cls==='bard'?'<div class="r"><span>Flask</span><span>'+pc.flask+'</span></div>':'')+
      '<div class="r"><span>Armour class</span><span>'+acOf(pc)+'</span></div>'+
      '<div class="r"><span>Experience</span><span>'+pc.xp+' / '+nextXp(pc)+'</span></div>'+
      '<div class="r"><span>Weapon</span><span>'+esc(w.name)+'</span></div>'+
      '<div class="r"><span>Worn</span><span>'+esc(gear.slice(1).join(', '))+'</span></div>'+
      '<div class="r"><span>Carrying</span><span>'+
        esc(pc.pack.map(id=>ITEMS[id].name).join(', ')||'nothing')+'</span></div>'+
      (spells.length?'<div class="r"><span>Knows</span><span>'+
        spells.map(s=>s.code).join(' ')+'</span></div>':'')+
      '</div>',
    items:[{label:'BACK',go:partyMenu}],back:partyMenu});
}
function gameMenu(){
  menu({title:'MENU',sub:'Gold: '+P.gold+' · '+P.steps+' steps taken',
    items:[
      {label:'SAVE',off:!P.roster.length,go:()=>{saveGame();say('Saved.','ok');hideOverlay();}},
      {label:'LOAD THE SAVED PARTY',off:!load('bt.save',null),go:()=>{loadGame();}},
      {label:'BACK TO THE TITLE',go:showSplash},
      {label:'CLOSE',go:hideOverlay}]});
}

/* ---------- keeping it ---------- */
function saveGame(){
  save('bt.save',JSON.stringify({v:1,roster:P.roster,gold:P.gold,depth:P.depth,
    x:P.x,y:P.y,dir:P.dir,light:P.light,found:P.found,flag:P.flag,steps:P.steps}));
}
function loadGame(){
  const raw=load('bt.save',null);
  if(!raw)return false;
  let s;try{s=JSON.parse(raw);}catch(e){return false;}
  if(!s||!s.roster||!s.roster.length)return false;
  P.roster=s.roster;P.gold=s.gold|0;P.depth=s.depth|0;P.x=s.x|0;P.y=s.y|0;
  P.dir=s.dir|0;P.light=s.light|0;P.found=s.found||{};P.flag=s.flag||{madgod:false};
  P.steps=s.steps|0;P.buff={};P.buffT={};P.fight=null;
  closeFightbar();
  logLines.length=0;
  say('You pick up where you left off.','say');
  hideOverlay();
  return true;
}

/* ---------- input ---------- */
function held(id,fn){
  const b=el(id);
  b.addEventListener('click',e=>{e.preventDefault();Snd.boot();if(!b.disabled)fn();});
}
held('bfwd',()=>{if(!overlayUp())step();});
held('bturnl',()=>{if(!overlayUp())turn(-1);});
held('bturnr',()=>{if(!overlayUp())turn(1);});
el('bparty').addEventListener('click',()=>{Snd.boot();if(P.roster.length)partyMenu();});
el('bcast').addEventListener('click',()=>{Snd.boot();if(!overlayUp())castMenu();});
el('bsing').addEventListener('click',()=>{Snd.boot();if(!overlayUp())singMenu();});
el('buse').addEventListener('click',()=>{Snd.boot();if(!overlayUp())useMenu();});
el('bmenu').addEventListener('click',()=>{Snd.boot();gameMenu();});

document.addEventListener('keydown',ev=>{
  const k=ev.key;
  const typing=ev.target&&ev.target.tagName==='INPUT';
  if(typing&&k!=='Enter')return;
  if(!overlayUp()&&fightOrder.length){
    if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ArrowUp'){fightMove(-1);ev.preventDefault();}
    else if(k==='ArrowRight'||k==='d'||k==='D'||k==='ArrowDown'){fightMove(1);ev.preventDefault();}
    else if(k==='Enter'||k===' '){fightEnter();ev.preventDefault();}
    return;
  }
  if(overlayUp()){
    if(k==='ArrowUp'||k==='w'||k==='W'){menuMove(-1);ev.preventDefault();}
    else if(k==='ArrowDown'||k==='s'||k==='S'){menuMove(1);ev.preventDefault();}
    else if(k==='Enter'||k===' '){menuEnter();ev.preventDefault();}
    else if(k==='Escape'&&menuBack){menuBack();ev.preventDefault();}
    return;
  }
  if(k==='ArrowUp'||k==='w'||k==='W'){step();ev.preventDefault();}
  else if(k==='ArrowLeft'||k==='a'||k==='A'){turn(-1);ev.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){turn(1);ev.preventDefault();}
  else if(k==='ArrowDown'||k==='s'||k==='S'){turn(2);ev.preventDefault();}
  else if(k==='c'||k==='C')castMenu();
  else if(k==='b'||k==='B')singMenu();
  else if(k==='u'||k==='U')useMenu();
  else if(k==='p'||k==='P'){if(P.roster.length)partyMenu();}
  else if(k==='Escape')gameMenu();
  Snd.boot();
});

el('sound').addEventListener('click',()=>{
  Snd.on=!Snd.on;save('bt.sound',Snd.on?'1':'0');
  el('soundstate').textContent=Snd.on?'on':'off';
  if(Snd.on){Snd.boot();Snd.coin();}
});
el('soundstate').textContent=Snd.on?'on':'off';

/* ---------- boot ---------- */
bakeMonsters();
showSplash();
paint();

if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

<script data-shared="no-zoom">
/* ---- the pinch and the double tap ---- *
 *
 * iOS Safari has ignored `user-scalable=no` and `maximum-scale` in the viewport
 * meta tag since iOS 10. Every one of these pages carried both and neither did
 * anything, so a double tap anywhere - on the glass, on a control, on the black
 * - zoomed the page, and a zoomed page puts the controls off the edge of the
 * screen. In a game with a clock running that is not an inconvenience, it is a
 * death, and full screen does not help because the zoom is applied to the
 * visual viewport on top of whatever the layout is doing.
 *
 * Three things are needed and the meta tag is none of them:
 *
 *   1. gesturestart / gesturechange / gestureend. This is how WebKit offers a
 *      pinch, and it exists on no other engine.
 *   2. A non-passive touchend that eats the second tap of a double tap. It has
 *      to be non-passive or preventDefault is ignored outright, and it has to
 *      be touchend rather than dblclick, because the zoom is committed before
 *      a dblclick is ever dispatched.
 *   3. A way back for a player who is zoomed already, because neither of the
 *      above can un-zoom a page that is. Rewriting the viewport meta is the
 *      only lever a page has over WebKit's zoom, and it only fires on a real
 *      change, so the content is toggled rather than re-set.
 *
 * This file is the one copy. tools/sync-nozoom.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  var D=document, W=window;
  if(!D.addEventListener)return;
  for(var i=0,g=["gesturestart","gesturechange","gestureend"];i<g.length;i++)
    D.addEventListener(g[i],function(e){e.preventDefault();},{passive:false});
  /* Eating the second tap of a double tap eats the click the browser makes
   * out of it, and every game here has controls that listen for one - so on a
   * control this would cost the player every second press of a fast mash,
   * which in a game about pressing fire quickly is worse than the zoom. The
   * controls do not need it: a button carrying touch-action none or
   * manipulation is already exempt from double-tap zoom on every engine that
   * honours it. So the guard leaves anything pressable alone and covers the
   * rest of the page, which is where the zoom was coming from. */
  var PRESSABLE="button,a,input,select,textarea,label,[data-cmd],[role=button]";
  function pressable(t){
    return !!(t&&t.closest&&t.closest(PRESSABLE));
  }
  var lastTap=0;
  D.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTap<=350&&e.cancelable&&!pressable(e.target))e.preventDefault();
    lastTap=now;
  },{passive:false});
  /* A second finger is a pinch wherever it lands, and no game here wants one. */
  D.addEventListener("touchstart",function(e){
    if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault();
  },{passive:false});

  var vv=W.visualViewport, meta=D.querySelector('meta[name="viewport"]');
  if(!vv||!meta)return;
  var base=meta.getAttribute("content"), fixing=false;
  function unzoom(){
    if(fixing||vv.scale<=1.01)return;
    fixing=true;
    meta.setAttribute("content",base+", minimum-scale=1");
    W.setTimeout(function(){
      meta.setAttribute("content",base);
      fixing=false;
      if(W.scrollTo)W.scrollTo(0,0);
    },50);
  }
  vv.addEventListener("resize",unzoom);
  vv.addEventListener("scroll",unzoom);
  W.__unzoom=unzoom;                 // so a harness can ask for it directly
})();
</script>
