/* ---------- drawing ---------- */
const cv=el('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);}
function spr(img,x,y){g.drawImage(img,Math.round(x),Math.round(y));}
const WALLC='#1d3fb8',WALLHI='#4f7dff',MORTAR='#0b1a5c';
function drawRoom(rm){
  rect(0,0,W,H,'#000');
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const t=rm.g[ty*COLS+tx],x=tx*T,y=ty*T;
    if(t===OUTER||t===INNER){
      /* brick: two courses a tile, the joints staggered */
      rect(x,y,T,T,t===OUTER?WALLC:'#2a4ad0');
      rect(x,y,T,1,WALLHI);
      rect(x,y+3,T,1,MORTAR);rect(x,y+7,T,1,MORTAR);
      rect(x+((tx+ty)%2?1:5),y,1,3,MORTAR);rect(x+((tx+ty)%2?5:1),y+4,1,3,MORTAR);
    }else if(t===RUBBLE){
      const h=(tx*31+ty*17)%7;
      rect(x+h%5,y+1+h%3,2,1,'#3a4a8a');rect(x+(h*3)%6,y+5,1,1,'#2a3670');rect(x+5,y+(h%4)+2,2,2,'#26305f');
    }
  }
  /* the way out: daylight in the opening, and a sign */
  const C=G.castle;
  if(C&&rm===C.rooms[C.exitRoom]){
    const s=C.exitSide,blink=(G.t*2|0)%2;
    const tiles=[];
    if(s==='n'||s==='s'){for(let x=DOOR_X0;x<=DOOR_X1;x++)tiles.push([x,s==='n'?0:ROWS-1]);}
    else for(let y=DOOR_Y0;y<=DOOR_Y1;y++)tiles.push([s==='w'?0:COLS-1,y]);
    for(const[tx,ty]of tiles){rect(tx*T,ty*T,T,T,'#0a3a14');
      for(let i=0;i<3;i++)rect(tx*T+((i*3+tx+ty)%7),ty*T+i*3+1,1,2,'#14f53c');}
    const lx=s==='w'?12:s==='e'?W-28:DOOR_X0*T+6,ly=s==='n'?12:s==='s'?H-18:DOOR_Y0*T-8;
    if(blink)txt('EXIT',lx,ly,'#14f53c');
  }
}
function drawChest(c){
  const x=c.tx*T,y=c.ty*T;
  if(c.state==='wrecked'){
    rect(x+1,y+5,4,2,'#7a3a12');rect(x+7,y+4,3,3,'#8a4a1a');rect(x+12,y+5,3,2,'#6a2a0a');
    rect(x+5,y+6,2,1,'#b06020');return;
  }
  const body=c.strong?'#8a90a8':'#c05a18',dark=c.strong?'#4a5068':'#6a2a08',lid=c.strong?'#b8bed0':'#ff6a3c';
  if(c.state==='open'){
    rect(x,y+3,16,5,body);rect(x+1,y+4,14,2,'#000');rect(x,y+7,16,1,dark);
    rect(x+1,y,14,3,lid);rect(x+1,y+2,14,1,dark);
    return;
  }
  rect(x,y+1,16,7,body);rect(x,y+1,16,2,lid);rect(x,y+3,16,1,dark);rect(x,y+7,16,1,dark);
  if(c.strong){rect(x+1,y+2,1,1,dark);rect(x+14,y+2,1,1,dark);rect(x+1,y+6,1,1,dark);rect(x+14,y+6,1,1,dark);}
  /* the lock: gold, or a splintered hole where it was shot off */
  if(c.state==='unlocked')rect(x+7,y+4,2,2,'#000');
  else{rect(x+7,y+3,2,3,'#ffd84a');rect(x+7,y+5,2,1,'#6a4a0a');}
}
function aimPose(d){return d===0||d===4?'H':d===5||d===6||d===7?'U':'D';}
function playerSprite(){
  const P=G.P,kind=P.uniform?'disguised':'player',flip=P.face<0;
  if(P.dead){
    const legs=G.dieT<0.35?'kneel':'lying';
    return figure(kind,'H',legs,flip);
  }
  if(P.busy)return figure(kind,(G.t*5|0)%2?'rum1':'rum2','stand',flip);
  if(P.holstered){
    if(P.moving)return figure(kind,'hol',WALKCYCLE[Math.floor(P.dist/6)%4],flip);
    return figure(kind,(P.idle|0)%2===1?'hol2':'hol','stand',flip,(P.idle%2.6)>2.45);
  }
  const pose=aimPose(P.dir);
  if(P.moving)return figure(kind,pose,WALKCYCLE[Math.floor(P.dist/6)%4],flip);
  /* standing still he breathes: the gun sinks and rises once a second, and
   * now and then he blinks */
  const breath=(P.idle|0)%2===1;
  const blink=(P.idle%2.6)>2.45;
  return figure(kind,breath?pose+'2':pose,'stand',flip,blink);
}
function guardSprite(gd){
  const flip=gd.face<0;
  if(gd.st==='dead')return figure(gd.kind,'H','lying',flip);
  if(gd.st==='dying')return figure(gd.kind,'H',gd.dying<0.25?'kneel':'lying',flip);
  const breath=(gd.phase|0)%2===1;
  if(gd.st==='hup')return figure(gd.kind,breath?'hup2':'hup','stand',flip,(gd.phase%1.8)>1.6);
  /* while someone is questioned nobody walks: they stand and breathe */
  const walking=G.state!=='question'&&(gd.st==='patrol'||gd.st==='enter'||(gd.st==='alert'&&gd.walking));
  const armed=gd.st==='alert'||gd.st==='enter'||gd.st==='challenge';
  const torso=armed?(breath?'H2':'H'):(breath?'carry2':'carry');
  if(walking)return figure(gd.kind,armed?'H':'carry',WALKCYCLE[Math.floor(gd.dist/6)%4],flip);
  return figure(gd.kind,torso,'stand',flip,(gd.phase%2.2)>2.05);
}
function drawFig(img,x,y,flip){
  /* figures are anchored on their feet; lying bodies are wider */
  const w=img.width;
  spr(img,x-(w>11?8:flip?6:5),y-16);
}
let bubbles=[];
function drawBubble(text,x,y,col){
  const w=txtW(text)+4;
  let bx=clamp(Math.round(x-w/2),1,W-w-1),by=clamp(Math.round(y),1,H-9);
  /* a squad shouting at once: each shout above the last, not on top of it */
  for(let n=0;n<6&&bubbles.some(b=>bx<b[0]+b[2]&&bx+w>b[0]&&by<b[1]+10&&by+10>b[1]);n++)
    by=by-10<1?by+30:by-10;
  bubbles.push([bx,by,w]);
  rect(bx,by,w,9,'#000');rect(bx,by,w,1,col);rect(bx,by+8,w,1,col);
  txt(text,bx+2,by+2,col);
}
function render(){
  if(!G.castle)return;
  const rm=room(),P=G.P;
  drawRoom(rm);
  for(const c of rm.chests)drawChest(c);
  /* bodies on the floor first, then everyone standing, back to front */
  for(const gd of rm.guards)if(gd.st==='dead')drawFig(guardSprite(gd),gd.x,gd.y,gd.face<0);
  const figs=rm.guards.filter(gd=>gd.st!=='dead').map(gd=>({y:gd.y,img:guardSprite(gd),x:gd.x,f:gd.face<0,gd}));
  if(G.state!=='escaping'||G.escT<1.1)figs.push({y:P.y,img:playerSprite(),x:P.x,f:P.face<0,me:true});
  figs.sort((a,b)=>a.y-b.y);
  for(const f of figs){
    if(f.me&&P.flash>0&&(G.t*30|0)%2){
      /* hit, and still standing: he flashes, violet if nothing can hurt him */
      const tint=G.impenetrable||G.demo?'#e060f0':'#14cffd';
      const img=f.img;drawFig(img,f.x,f.y,f.f);
      const bx=f.x-(f.f?6:5);
      rect(bx-1,f.y-17,13,1,tint);rect(bx-1,f.y,13,1,tint);
      rect(bx-1,f.y-17,1,18,tint);rect(bx+11,f.y-17,1,18,tint);
      continue;
    }
    drawFig(f.img,f.x,f.y,f.f);
  }
  for(const s of G.shots)rect(s.x-1,s.y-1,2,2,s.from==='p'?'#ffffff':'#ffd84a');
  for(const n of G.nades){
    rect(n.x-1,n.y,3,1,'#222a44');
    rect(n.x-1,n.y-n.z-3,3,3,'#3a7a2a');rect(n.x,n.y-n.z-4,1,1,'#bbbbbb');
    if(n.fuse>=0&&(G.t*16|0)%2)rect(n.x,n.y-4,1,1,'#ff5a4a');
  }
  for(const b of G.booms){
    const r=4+b.t*48;
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2+b.t*3;
      rect(b.x+Math.cos(a)*r,b.y-6+Math.sin(a)*r*0.7,2,2,i%3?'#ff9a3c':'#ffffff');}
    if(b.t<0.15)rect(b.x-6,b.y-12,12,12,'#ffffff');
  }
  for(const s of G.sparks){rect(s.x-2,s.y,5,1,s.c);rect(s.x,s.y-2,1,5,s.c);}
  bubbles=[];
  /* what the guards are shouting, over their heads; not while one is
   * questioning him, when it is on the card instead */
  if(G.state!=='question')for(const gd of rm.guards)if(gd.say){
    /* above everyone standing under it, not across the next man's face */
    const half=txtW(gd.say.text)/2+4;
    let top=gd.y;
    for(const o of rm.guards.concat([P]))if(o.st!=='dead'&&Math.abs(o.x-gd.x)<half&&Math.abs(o.y-gd.y)<32)top=Math.min(top,o.y);
    drawBubble(gd.say.text,gd.x,top-27,gd.kind==='ss'?'#e060f0':'#ffffff');
  }
  if(P.busy){
    const w=16,f=clamp(P.busy.t/P.busy.dur,0,1);
    rect(P.x-8,P.y-22,w,3,'#000');rect(P.x-8,P.y-21,Math.round(w*f),1,'#ffd84a');
  }
  if(G.msg)drawBubble(G.msg.text,W/2,H-20,G.msg.col);
  /* the alarm: the screen's edges beat red with the heart, and flare when it goes */
  if(G.hunt&&(G.hunt.on||G.dread>0)&&!G.demo){
    const k=G.dread>0?Math.min(1,G.dread*1.4):Math.max(0,1-G.hunt.beat*2.2)*0.8;
    if(k>0.05){
      g.globalAlpha=k;
      const c='#d01010',b=G.dread>0?4:2;
      rect(0,0,W,b,c);rect(0,H-b,W,b,c);rect(0,0,b,H,c);rect(W-b,0,b,H,c);
      if(G.dread>0.5){g.globalAlpha=(G.dread-0.5)*0.5;rect(0,0,W,H,c);}
      g.globalAlpha=1;
    }
  }
}

/* ---------- input ---------- */
function press(k,on){
  if(on)Snd.boot();
  if(G.state!=='play'&&menuItems.length&&!ov.classList.contains('hidden')){
    if(!on)return;
    if(G.state==='question'&&k==='holster'){drawDuringQuestions();return;}
    if(k==='up')menuNav(-1);else if(k==='down')menuNav(1);else if(k==='fire'||k==='search')menuGo();
    return;
  }
  if(k==='fire'||k==='gren'||k==='search'||k==='holster'){if(on&&G.state==='play')taps[k]=true;if(k==='fire')keys.fire=on;return;}
  keys[k]=on;
}
const KEYMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',
  ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',' ':'fire',
  x:'aim',X:'aim',Shift:'aim',e:'search',E:'search',g:'gren',G:'gren',h:'holster',H:'holster'};
document.addEventListener('keydown',ev=>{
  const k=ev.key;
  if(k==='p'||k==='P'||k==='Escape'){togglePause();ev.preventDefault();return;}
  if(k==='Enter'){if(G.state!=='play')menuGo();ev.preventDefault();return;}
  const m=KEYMAP[k];
  if(m){if(!ev.repeat||(m!=='fire'&&m!=='gren'&&m!=='search'&&m!=='holster'))press(m,true);ev.preventDefault();}
});
document.addEventListener('keyup',ev=>{
  const m=KEYMAP[ev.key];
  if(m)press(m,false);
});
/* A held control stays held until the finger comes off it; without capture a
 * thumb that drifts past the edge of AIM lets go of it. */
function hold(id,k){
  const b=el(id);
  const on=e=>{
    e.preventDefault();
    try{b.setPointerCapture(e.pointerId);}catch(err){}
    press(k,true);b.classList.add('on');
  };
  const off=e=>{
    if(e){e.preventDefault();
      try{if(b.hasPointerCapture(e.pointerId))b.releasePointerCapture(e.pointerId);}catch(err){}}
    press(k,false);b.classList.remove('on');
  };
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);
}
hold('bf','fire');hold('ba','aim');hold('bs','search');hold('bg','gren');hold('bh','holster');
hold('j0','fire');hold('j1','aim');

/* ---------- the joystick ---------- */
/* Eight ways, fed by whatever is being pushed: the stick on the glass, or a
 * real one through the Gamepad API. A direction is pressed and released only
 * when it changes, so a held stick is a held key. */
const DIRKEYS=['up','down','left','right'];
function stickDirs(x,y){
  const d=Math.hypot(x,y);
  if(d<0.3)return{};
  const a=Math.atan2(y,x),o=dirTo(Math.cos(a),Math.sin(a)),[dx,dy]=DIRS[o];
  return{up:dy<0,down:dy>0,left:dx<0,right:dx>0};
}
function feed(src,want){
  for(const k of DIRKEYS){
    const on=!!want[k];
    if(on!==!!src[k]){src[k]=on;press(k,on);}
  }
}
/* ---- the stick on the glass ----
 * Galaga's handling, on the Apple's stick. It takes the pointer captive on the
 * way down, so a thumb that slides off the well mid-dodge keeps walking
 * instead of letting go; it is touch-action none, so a drag is never a
 * scroll, a pull-to-refresh or the start of a pinch; and it is analogue, like
 * the Apple's own, which read its stick through the paddle inputs: a small
 * push is a slow step. Released, by any route, it springs back and he stops.
 */
const Stick={x:0,y:0,held:false,dirs:{},id:null};
/* How far the knob may travel: the well's half-width less the knob's own,
 * measured rather than assumed, so it never rides out over the rim. */
function stickRadius(){
  const r=el('stick').getBoundingClientRect(),k=el('knob');
  const kw=(k&&k.offsetWidth)||30;
  if(!r||!r.width)return 30;
  return Math.max(16,r.width/2-kw/2-2);
}
function stickAt(ev){
  const box=el('stick').getBoundingClientRect();
  const Rr=stickRadius();
  let dx=ev.clientX-(box.left+box.width/2),dy=ev.clientY-(box.top+box.height/2);
  const d=Math.hypot(dx,dy);if(d>Rr){dx*=Rr/d;dy*=Rr/d;}
  Stick.x=dx/Rr;Stick.y=dy/Rr;Stick.held=true;
  paintStick(dx,dy);
  feed(Stick.dirs,stickDirs(Stick.x,Stick.y));
}
function paintStick(dx,dy){
  el('knob').style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
  const sh=el('shaft'),len=Math.hypot(dx,dy);
  sh.style.height=len.toFixed(1)+'px';
  sh.style.transform='rotate('+(Math.atan2(dy,dx)*180/Math.PI-90).toFixed(1)+'deg)';
}
function stickOff(){
  Stick.x=Stick.y=0;Stick.id=null;Stick.held=false;paintStick(0,0);
  el('stick').classList.remove('on');
  feed(Stick.dirs,{});
}
(function(){
  const s=el('stick');
  s.addEventListener('pointerdown',e=>{
    e.preventDefault();Snd.boot();Stick.id=e.pointerId;
    try{s.setPointerCapture(e.pointerId);}catch(err){}
    s.classList.add('on');stickAt(e);
  });
  s.addEventListener('pointermove',e=>{if(Stick.id===e.pointerId){e.preventDefault();stickAt(e);}});
  for(const t of['pointerup','pointercancel','lostpointercapture'])
    s.addEventListener(t,e=>{if(Stick.id===e.pointerId)stickOff();});
  /* a gesture the browser swallows still lets go of the stick, or he walks on
   * after the thumb has gone */
  for(const t of['pointerup','pointercancel'])
    document.addEventListener(t,e=>{if(Stick.id===e.pointerId)stickOff();},true);
})();
/* The analogue reading, from the stick on the glass or a real one: which way,
 * and how hard. A dead zone in the middle, then the speed follows the push. */
function analog(){
  let x,y;
  if(Stick.held){x=Stick.x;y=Stick.y;}
  else if(Pad.held){x=Pad.x;y=Pad.y;}
  else return null;
  const l=Math.hypot(x,y);
  if(l<0.2)return{x:0,y:0,m:0};
  return{x:x/l,y:y/l,m:Math.min(1,(l-0.2)/0.65)};
}

/* A real joystick or gamepad: the stick or d-pad walks, A fires, B searches,
 * X throws, a shoulder button aims, START pauses. */
const Pad={dirs:{},b:{},start:false,x:0,y:0,held:false};
function pollPads(){
  let gp=null;
  try{const all=navigator.getGamepads?navigator.getGamepads():[];
    for(const p of all)if(p&&p.connected!==false){gp=p;break;}}catch(e){}
  if(!gp){Pad.held=false;feed(Pad.dirs,{});return;}
  const b=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5));
  Pad.x=gp.axes[0]||0;Pad.y=gp.axes[1]||0;Pad.held=Math.hypot(Pad.x,Pad.y)>0.2;
  const want=stickDirs(Pad.x,Pad.y);
  if(b(12))want.up=true;if(b(13))want.down=true;if(b(14))want.left=true;if(b(15))want.right=true;
  feed(Pad.dirs,want);
  const map={fire:b(0),search:b(1),gren:b(2),holster:b(3),aim:b(4)||b(5)||b(6)||b(7)};
  for(const k in map)if(map[k]!==!!Pad.b[k]){Pad.b[k]=map[k];press(k,map[k]);}
  const st=b(9);
  if(st&&!Pad.start){if(G.state==='play'||G.state==='paused')togglePause();else menuGo();}
  Pad.start=st;
}
el('bp').addEventListener('click',togglePause);

el('sound').addEventListener('click',()=>{
  Snd.on=!Snd.on;save('wolfenstein.sound',Snd.on?'1':'0');
  el('soundstate').textContent=Snd.on?'on':'off';
  if(Snd.on){Snd.boot();Snd.item();}
});
el('soundstate').textContent=Snd.on?'on':'off';

/* Going to the background pauses: a phone call must not get you shot. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&G.state==='play')togglePause();
});

for(const t of['pointerdown','touchend','keydown','click'])
  document.addEventListener(t,()=>Snd.unlock(),{capture:true,passive:true});

/* ---------- boot ---------- */
Voice.init();
showSplash();

let last=0;
function frame(ts){
  const t=ts/1000;
  let dt=last?t-last:0;
  last=t;
  if(dt>0.1)dt=0.1;                   /* a backgrounded tab must not fast-forward */
  pollPads();
  stepGame(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if('serviceWorker'in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>

<script data-shared="no-zoom">
/* ---- the pinch and the double tap ---- *
 *
 * iOS Safari has ignored `user-scalable=no` and `maximum-scale` in the viewport
 * meta tag since iOS 10. Every one of these pages carried both and neither did
 * anything, so a double tap anywhere - on the glass, on a control, on the black
 * - zoomed the page, and a zoomed page puts the controls off the edge of the
 * screen. In a game with a clock running that is not an inconvenience, it is a
 * death, and full screen does not help because the zoom is applied to the
 * visual viewport on top of whatever the layout is doing.
 *
 * Three things are needed and the meta tag is none of them:
 *
 *   1. gesturestart / gesturechange / gestureend. This is how WebKit offers a
 *      pinch, and it exists on no other engine.
 *   2. A non-passive touchend that eats the second tap of a double tap. It has
 *      to be non-passive or preventDefault is ignored outright, and it has to
 *      be touchend rather than dblclick, because the zoom is committed before
 *      a dblclick is ever dispatched.
 *   3. A way back for a player who is zoomed already, because neither of the
 *      above can un-zoom a page that is. Rewriting the viewport meta is the
 *      only lever a page has over WebKit's zoom, and it only fires on a real
 *      change, so the content is toggled rather than re-set.
 *
 * This file is the one copy. tools/sync-nozoom.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  var D=document, W=window;
  if(!D.addEventListener)return;
  for(var i=0,g=["gesturestart","gesturechange","gestureend"];i<g.length;i++)
    D.addEventListener(g[i],function(e){e.preventDefault();},{passive:false});
  /* Eating the second tap of a double tap eats the click the browser makes
   * out of it, and every game here has controls that listen for one - so on a
   * control this would cost the player every second press of a fast mash,
   * which in a game about pressing fire quickly is worse than the zoom. The
   * controls do not need it: a button carrying touch-action none or
   * manipulation is already exempt from double-tap zoom on every engine that
   * honours it. So the guard leaves anything pressable alone and covers the
   * rest of the page, which is where the zoom was coming from. */
  var PRESSABLE="button,a,input,select,textarea,label,[data-cmd],[role=button]";
  function pressable(t){
    return !!(t&&t.closest&&t.closest(PRESSABLE));
  }
  var lastTap=0;
  D.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTap<=350&&e.cancelable&&!pressable(e.target))e.preventDefault();
    lastTap=now;
  },{passive:false});
  /* A second finger is a pinch wherever it lands, and no game here wants one. */
  D.addEventListener("touchstart",function(e){
    if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault();
  },{passive:false});

  var vv=W.visualViewport, meta=D.querySelector('meta[name="viewport"]');
  if(!vv||!meta)return;
  var base=meta.getAttribute("content"), fixing=false;
  function unzoom(){
    if(fixing||vv.scale<=1.01)return;
    fixing=true;
    meta.setAttribute("content",base+", minimum-scale=1");
    W.setTimeout(function(){
      meta.setAttribute("content",base);
      fixing=false;
      if(W.scrollTo)W.scrollTo(0,0);
    },50);
  }
  vv.addEventListener("resize",unzoom);
  vv.addEventListener("scroll",unzoom);
  W.__unzoom=unzoom;                 // so a harness can ask for it directly
})();
</script>

<script data-shared="launcher">
/* ---- the way back to the launcher ----
 *
 * Every game here is its own page, and until now only one of them had a link
 * back to the collection it belongs to: open a game directly, or install it to
 * a home screen, and the rest of the cabinet was unreachable without editing
 * the address bar.
 *
 * Where it goes took two tries and a measurement.
 *
 * Seven of these pages are flex columns whose wrap has flex:1, so the last
 * child of the body settles at the bottom of the viewport on its own: under
 * the controls, covering nothing. Law of the West is not one of them - its
 * whole interface is a position:fixed #app over a body with no flow at all,
 * and appended there the link landed at the top of the page and shoved the
 * game down it.
 *
 * Pinning it to the bottom of the viewport instead fixed that one and broke
 * seven: measured against every control on every page, a fixed chip sat on a
 * full-screen button in five of them and on Galaga's thumb stick.
 *
 * So it goes in the flow; and if the flow turns out not to have put it near
 * the bottom - which is what a body with nothing in it looks like from here -
 * it moves into whatever element is actually covering the screen and rides
 * that one's layout instead.
 *
 * The lettering is the collection's own: monospace, wide-spaced, upper case,
 * and split a little cyan to the left and magenta to the right the way a
 * mistuned tube did it.
 *
 * This file is the one copy. tools/sync-launcher.js writes it into each page
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  if(typeof document==='undefined')return;
  if(document.getElementById('rg-launch'))return;

  var CSS=''+
  '#rg-launch{display:block;margin:8px auto calc(env(safe-area-inset-bottom) + 2px);'+
    'padding:6px 13px;border-radius:999px;flex:0 0 auto;'+
    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;'+
    'font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;'+
    'text-decoration:none;color:#fff8e6;background:rgba(10,7,19,.72);'+
    'border:1px solid rgba(255,210,127,.32);text-align:center;width:max-content;'+
    'max-width:92%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;'+
    'text-shadow:-1px 0 0 rgba(56,232,255,.75),1px 0 0 rgba(255,62,165,.75),'+
      '0 0 10px rgba(255,210,127,.45)}'+
  '#rg-launch:hover,#rg-launch:focus-visible{border-color:rgba(255,210,127,.7);'+
    'background:rgba(20,14,32,.9);outline:none}'+
  '#rg-launch:active{transform:translateY(1px)}'+
  '#rg-launch .rg-c{color:#ffd27f;text-shadow:none;margin-right:.5em}'+
  /* a tube that has been on a while */
  '@keyframes rg-flick{0%,96%,100%{opacity:1}97%{opacity:.78}98%{opacity:1}99%{opacity:.88}}'+
  '#rg-launch{animation:rg-flick 9s steps(1) infinite}'+
  '@media (prefers-reduced-motion:reduce){#rg-launch{animation:none}}';

  function put(){
    if(document.getElementById('rg-launch'))return;
    var s=document.createElement('style');
    s.id='rg-launch-style';s.textContent=CSS;
    (document.head||document.documentElement).appendChild(s);
    var a=document.createElement('a');
    a.id='rg-launch';
    /* One level up is the collection, whether that is a folder on a disk or
     * the Pages site. Relative so it works from file:// as well. */
    a.href='../';
    a.setAttribute('aria-label','Back to the Retro Games launcher');
    a.innerHTML='<span class="rg-c">◀</span>Retro Games';
    var host=document.body||document.documentElement;
    host.appendChild(a);
    /* Did the flow put it near the bottom? If not, this page keeps its
     * interface somewhere other than the body, and the link belongs there. */
    try{
      var r=a.getBoundingClientRect();
      if(r.top<(window.innerHeight||0)*0.5){
        var best=null,area=0,all=document.body.querySelectorAll('*');
        for(var i=0;i<all.length;i++){
          var el=all[i];
          if(el===a||el.contains(a))continue;
          var cs=window.getComputedStyle(el);
          if(cs.position!=='fixed'&&cs.position!=='absolute')continue;
          var q=el.getBoundingClientRect();
          if(q.height<window.innerHeight*0.8)continue;
          if(q.width*q.height>area){area=q.width*q.height;best=el;}
        }
        if(best)best.appendChild(a);
      }
    }catch(e){}
  }
  if(document.body)put();
  else document.addEventListener('DOMContentLoaded',put);
})();
</script>
<!-- launcher:end -->
