<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Archon — The Light and the Dark</title>
<meta name="description" content="Archon: The Light and the Dark — a browser remake of the 1983 strategy-and-combat classic. Play in any browser, desktop or mobile.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<!-- Installed to the home screen, the game runs without the browser's bars. iOS has no
     Fullscreen API, so this is the only way to get a full screen on an iPhone. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0e1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Archon">
<style>
:root{--bg:#0e1016;--panel:#171b26;--panel2:#1f2534;--ink:#e9edf6;--dim:#97a1b8;--gold:#d8b45a;--line:#2a3145}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#eef0f6;--panel:#fff;--panel2:#f2f4fa;--ink:#131722;--dim:#5b6479;--line:#d6dbe8}
}
:root[data-theme="dark"]{--bg:#0e1016;--panel:#171b26;--panel2:#1f2534;--ink:#e9edf6;--dim:#97a1b8;--line:#2a3145}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;
  padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
#wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;flex:1}
#status{font-size:13px;line-height:1.35;min-height:34px;padding:6px 8px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
#status b{color:var(--gold)}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.padrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.padcol{display:flex;flex-direction:column;align-items:center;gap:5px}
/* A round stick beats nine buttons for a real-time duel: one thumb, eight ways,
   and no gap to fall into between two of them. */
.stick{display:none;width:152px;height:152px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 42%,var(--panel2),var(--panel));
  border:1px solid var(--line);touch-action:none;flex:0 0 auto}
.stick::after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed var(--line);opacity:.5}
.stick .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
  border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .06s linear}
.stick.on .knob{background:var(--gold);border-color:var(--gold)}
body.stickmode .stick{display:block}
body.stickmode .dpad{display:none}
.padlabel{font-size:10px;letter-spacing:.12em;font-weight:700;opacity:.75}
.padlabel.light{color:#d5df7c}
.padlabel.dark{color:#a89aff}
/* Rotated only when the second player sits opposite, across a device lying flat. */
body.facing .padrow.flip{transform:rotate(180deg)}
/* On the board only the player to move has a live pad. */
.padrow.idle{opacity:.34}
.padrow.idle .btn{pointer-events:none}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,44px);gap:4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-size:17px;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer}
.btn:active,.btn.on{background:var(--gold);color:#10131c;border-color:var(--gold)}
.abtn{width:60px;height:60px;border-radius:50%;font-size:14px;font-weight:700}
.sbtn{padding:8px 12px;border-radius:10px;font-size:13px;height:40px}
#overlay{position:absolute;inset:0;background:rgba(8,10,16,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;padding:16px;text-align:center;overflow-y:auto}
#overlay.hidden{display:none}
h1{font-size:22px;margin:0;letter-spacing:.14em;color:var(--gold);font-weight:800}
.sub{font-size:12px;color:var(--dim);margin:0 0 4px;max-width:340px;line-height:1.45}
.menuitem{width:min(300px,86%);padding:11px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);font-size:14px;cursor:pointer;color:var(--ink)}
.menuitem.sel{border-color:var(--gold);background:var(--gold);color:#10131c;font-weight:700}
.spellgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(340px,94%)}
.spellgrid .menuitem{width:auto;padding:9px 6px;font-size:12px}
.menuitem.used{opacity:.32}
small.tip{color:var(--dim);font-size:11px;max-width:330px;line-height:1.45}
button{font:inherit;cursor:pointer}
.soundrow{display:flex;align-items:center;gap:12px;margin:6px 0 12px;font-size:11px;color:var(--dim)}
#sound{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:9px 12px;min-height:40px}
#stage{border-radius:0;background:#000}
canvas{image-rendering:pixelated}
.btn{touch-action:none}
#full,#install{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  padding:9px 12px;min-height:40px;border-radius:10px}
#install{border-color:var(--gold);color:var(--gold)}
#install[hidden]{display:none}

/* ---- full game mode: the page gets out of the way and the machine fills the screen ---- */
body.gamemode{position:fixed;inset:0;padding:0;background:#000;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;
  /* the board is lit by its own luminance, so the chrome around it stays dark
     even on a phone set to the light colour scheme */
  --panel:#171b26;--panel2:#1f2534;--ink:#e9edf6;--dim:#97a1b8;--line:#2a3145}
body.gamemode #wrap{position:relative;max-width:none;width:100%;height:100%;gap:0;padding:0}
body.gamemode #status{position:absolute;left:0;right:0;top:0;z-index:3;height:26px;min-height:0;
  padding:5px 168px 5px 8px;border:0;border-radius:0;background:rgba(8,10,16,.72);color:#e9edf6;
  font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body.gamemode #stage{position:absolute;aspect-ratio:auto;border:0;border-radius:0;background:#000}
body.gamemode #pads{position:absolute;inset:0;z-index:2;pointer-events:none}
body.gamemode .padrow{position:absolute;left:0;right:0;pointer-events:none;
  padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
body.gamemode .padrow>*{pointer-events:auto}
body.gamemode #pad1{bottom:calc(env(safe-area-inset-bottom) + 6px);align-items:flex-end}
body.gamemode #pad2{top:calc(env(safe-area-inset-top) + 34px);align-items:flex-start}
/* Side by side on a phone held in landscape: an edge each, stacked so nobody's
   buttons end up over the board. */
@media (orientation:landscape){
  body.gamemode.twop:not(.facing) .padrow{position:absolute;width:auto;left:auto;right:auto;
    top:calc(env(safe-area-inset-top) + 30px);bottom:calc(env(safe-area-inset-bottom) + 6px);
    flex-direction:column;justify-content:center;gap:10px}
  body.gamemode.twop:not(.facing) #pad1{left:6px;align-items:flex-start}
  body.gamemode.twop:not(.facing) #pad2{right:6px;align-items:flex-end}
}
body.gamemode .btn{background:rgba(31,37,52,.82)}
body.gamemode .btn:active,body.gamemode .btn.on{background:var(--gold);color:#10131c}
body.gamemode .soundrow{position:absolute;right:6px;top:2px;z-index:4;margin:0;gap:6px}
body.gamemode #audio-status{display:none}
body.gamemode #sound,body.gamemode #full,body.gamemode #install{padding:2px 7px;min-height:0;
  font-size:10px;opacity:.85;border-radius:7px}
body.gamemode #install{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="status" role="status">Loading…</div>
  <div id="stage"><canvas id="cv"></canvas><div id="overlay"></div></div>
  <div id="pads">
    <div class="padrow flip" id="pad2" style="display:none">
      <div class="padcol">
        <div class="padlabel dark">DARK · P2</div>
        <div class="stick" data-stick="2"><div class="knob"></div></div>
        <div class="dpad">
          <div class="btn" data-k="2U,2L">↖</div><div class="btn" data-k="2U">▲</div><div class="btn" data-k="2U,2R">↗</div>
          <div class="btn" data-k="2L">◀</div><div class="btn" data-k="2C">●</div><div class="btn" data-k="2R">▶</div>
          <div class="btn" data-k="2D,2L">↙</div><div class="btn" data-k="2D">▼</div><div class="btn" data-k="2D,2R">↘</div>
        </div>
      </div>
      <div class="padcol">
        <div style="display:flex;gap:8px"><div class="btn abtn" data-k="2A">A</div><div class="btn abtn" data-k="2B">B</div></div>
        <div class="btn sbtn" data-k="2SPELL">SPELL</div>
      </div>
    </div>
    <div class="padrow" id="pad1">
      <div class="padcol">
        <div class="padlabel light" id="lbl1">LIGHT · P1</div>
        <div class="stick" data-stick="1"><div class="knob"></div></div>
      <div class="dpad">
        <div class="btn" data-k="1U,1L">↖</div><div class="btn" data-k="1U">▲</div><div class="btn" data-k="1U,1R">↗</div>
        <div class="btn" data-k="1L">◀</div><div class="btn" data-k="1C">●</div><div class="btn" data-k="1R">▶</div>
        <div class="btn" data-k="1D,1L">↙</div><div class="btn" data-k="1D">▼</div><div class="btn" data-k="1D,1R">↘</div>
      </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="display:flex;gap:8px">
          <div class="btn abtn" data-k="1A">A</div><div class="btn abtn" data-k="1B">B</div>
        </div>
        <div style="display:flex;gap:6px">
          <div class="btn sbtn" data-k="SPELL">SPELL</div><div class="btn sbtn" data-k="MENU">MENU</div>
        </div>
      </div>
    </div>
  </div>
  <div class="soundrow"><button id="sound" type="button" aria-pressed="true">SOUND ON</button><button id="full" type="button" aria-pressed="false">FULL SCREEN</button><button id="install" type="button" hidden>INSTALL</button><span id="audio-status">Tap a control to enable audio</span></div>
</div>
<script>
"use strict";
/* ============ data ============ */
const N=9, POWER=[[0,4],[8,4],[4,0],[4,8],[4,4]];
const isPower=(x,y)=>POWER.some(p=>p[0]===x&&p[1]===y);
const opp=s=>s==="L"?"D":"L";

const TYPES={
 wizard      :{n:"Wizard",      s:"L",F:5,S:3,I:3,L:3,mv:"teleport",r:3,sp:"normal",atk:"missile"},
 djinni      :{n:"Djinni",      s:"L",F:3,S:3,I:3,L:5,mv:"flying",  r:4,sp:"normal",atk:"missile"},
 phoenix     :{n:"Phoenix",     s:"L",F:5,S:1,I:1,L:5,mv:"flying",  r:5,sp:"normal",atk:"burst"},
 unicorn     :{n:"Unicorn",     s:"L",F:3,S:5,I:5,L:3,mv:"ground",  r:4,sp:"normal",atk:"missile"},
 golem       :{n:"Golem",       s:"L",F:5,S:1,I:1,L:5,mv:"ground",  r:3,sp:"slow",  atk:"missile"},
 valkyrie    :{n:"Valkyrie",    s:"L",F:3,S:1,I:3,L:3,mv:"flying",  r:3,sp:"normal",atk:"missile"},
 archer      :{n:"Archer",      s:"L",F:1,S:3,I:3,L:1,mv:"ground",  r:3,sp:"normal",atk:"missile"},
 knight      :{n:"Knight",      s:"L",F:1,S:6,I:6,L:1,mv:"ground",  r:3,sp:"normal",atk:"melee"},
 sorceress   :{n:"Sorceress",   s:"D",F:3,S:5,I:3,L:3,mv:"teleport",r:3,sp:"normal",atk:"missile"},
 dragon      :{n:"Dragon",      s:"D",F:6,S:3,I:1,L:6,mv:"flying",  r:4,sp:"normal",atk:"missile"},
 shapeshifter:{n:"Shapeshifter",s:"D",F:3,S:3,I:3,L:4,mv:"flying",  r:5,sp:"normal",atk:"missile"},
 basilisk    :{n:"Basilisk",    s:"D",F:5,S:5,I:5,L:1,mv:"ground",  r:3,sp:"normal",atk:"missile"},
 troll       :{n:"Troll",       s:"D",F:5,S:1,I:1,L:5,mv:"ground",  r:3,sp:"slow",  atk:"missile"},
 banshee     :{n:"Banshee",     s:"D",F:3,S:6,I:1,L:3,mv:"flying",  r:3,sp:"normal",atk:"burst"},
 manticore   :{n:"Manticore",   s:"D",F:1,S:1,I:3,L:3,mv:"ground",  r:3,sp:"normal",atk:"missile"},
 goblin      :{n:"Goblin",      s:"D",F:1,S:6,I:6,L:1,mv:"ground",  r:3,sp:"normal",atk:"melee"},
 elemental   :{n:"Elemental",   s:"*",F:4,S:4,I:4,L:4,mv:"flying",  r:0,sp:"normal",atk:"missile"}
};
const START_L=[["wizard",0,4],["djinni",0,3],["phoenix",0,5],["unicorn",0,2],["unicorn",0,6],
 ["golem",0,1],["golem",0,7],["valkyrie",0,0],["valkyrie",0,8],["archer",1,0],["archer",1,8],
 ["knight",1,1],["knight",1,2],["knight",1,3],["knight",1,4],["knight",1,5],["knight",1,6],["knight",1,7]];
const START_D=[["sorceress",8,4],["dragon",8,5],["shapeshifter",8,3],["basilisk",8,2],["basilisk",8,6],
 ["troll",8,1],["troll",8,7],["banshee",8,0],["banshee",8,8],["manticore",7,0],["manticore",7,8],
 ["goblin",7,1],["goblin",7,2],["goblin",7,3],["goblin",7,4],["goblin",7,5],["goblin",7,6],["goblin",7,7]];
const SPELLS=[
 {k:"teleport",n:"Teleport",d:"Teleport a friendly icon; an enemy destination starts combat."},
 {k:"heal",n:"Heal",d:"Fully heal a friendly icon."},
 {k:"shift",n:"Shift Time",d:"Reverse the luminance cycle."},
 {k:"exchange",n:"Exchange",d:"Swap any two icons, except imprisoned icons or power-point occupants."},
 {k:"summon",n:"Summon Elemental",d:"An elemental fights an enemy icon."},
 {k:"revive",n:"Revive",d:"Return a fallen icon beside your spellcaster."},
 {k:"imprison",n:"Imprison",d:"Freeze an enemy icon in place."}
];
// The original board's oscillating cross and diagonal arms (manual, page 2).
const C64_CYCLE=["#ffffff","#7dc9ca","#70a44f","#8e44ad","#40318d","#000000"];
function tileKind(x,y){
  if(x===0&&y===4)return "L";
  if(x===8&&y===4)return "D";
  if(x===4||y===4||Math.abs(x-4)+Math.abs(y-4)===5)return "O";
  return (x+y)%2===0?"D":"L";
}
const KIND=[...Array(N)].map((_,x)=>[...Array(N)].map((_,y)=>tileKind(x,y)));

/* ============ hand-drawn icons (100x100 space) ============ */
function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,7);c.fill();}
function ln(c,pts,w){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.lineWidth=w;c.lineCap="round";c.lineJoin="round";c.stroke();}
const ICONS={
 wizard(c,ink,bg){ poly(c,[[50,40],[28,88],[72,88]]);
   ell(c,50,32,9,9); poly(c,[[50,2],[32,30],[68,30]]);
   c.fillStyle=bg; poly(c,[[50,10],[42,27],[58,27]]); c.fillStyle=ink;
   poly(c,[[42,38],[58,38],[50,62]]);
   c.strokeStyle=ink; ln(c,[[76,22],[72,90]],5); ell(c,77,17,7,7); },
 djinni(c,ink,bg){ poly(c,[[34,42],[66,42],[58,72],[42,72]]);
   ell(c,50,28,11,10); poly(c,[[36,20],[64,20],[60,11],[40,11]]);
   c.strokeStyle=ink; ln(c,[[42,72],[24,82],[50,90],[76,82],[58,72]],5);
   ln(c,[[34,46],[16,38]],5); ln(c,[[66,46],[84,38]],5);
   c.fillStyle=bg; ell(c,45,27,2.6,2.6); ell(c,55,27,2.6,2.6); c.fillStyle=ink; },
 phoenix(c,ink,bg){ ell(c,50,54,10,17);
   poly(c,[[42,44],[10,14],[16,44],[6,42],[38,64]]);
   poly(c,[[58,44],[90,14],[84,44],[94,42],[62,64]]);
   ell(c,50,32,8,8); poly(c,[[50,29],[63,34],[50,38]]);
   poly(c,[[44,70],[56,70],[62,94],[50,80],[38,94]]); },
 unicorn(c,ink,bg){ poly(c,[[38,88],[36,52],[46,36],[72,30],[78,40],[58,48],[56,88]]);
   poly(c,[[54,32],[62,4],[67,31]]);
   poly(c,[[44,34],[28,18],[33,44],[20,40],[38,60]]);
   c.fillStyle=bg; ell(c,62,40,3,3); c.fillStyle=ink; },
 golem(c,ink,bg){ poly(c,[[30,36],[70,36],[74,76],[26,76]]);
   poly(c,[[38,14],[62,14],[62,34],[38,34]]);
   poly(c,[[14,40],[26,40],[26,72],[14,72]]); poly(c,[[74,40],[86,40],[86,72],[74,72]]);
   poly(c,[[32,78],[46,78],[46,94],[32,94]]); poly(c,[[54,78],[68,78],[68,94],[54,94]]);
   c.strokeStyle=bg; ln(c,[[44,40],[56,54],[44,70]],3.5);
   c.fillStyle=bg; ell(c,44,23,3,3); ell(c,56,23,3,3); c.fillStyle=ink; c.strokeStyle=ink; },
 valkyrie(c,ink,bg){ poly(c,[[50,40],[32,88],[68,88]]); ell(c,50,28,10,10);
   poly(c,[[40,24],[12,6],[21,30],[38,34]]); poly(c,[[60,24],[88,6],[79,30],[62,34]]);
   c.strokeStyle=ink; ln(c,[[76,14],[70,94]],4); poly(c,[[70,2],[81,18],[68,18]]); },
 archer(c,ink,bg){ ell(c,42,24,9,9); poly(c,[[36,34],[50,34],[54,70],[34,70]]);
   poly(c,[[34,70],[42,70],[38,94]]); poly(c,[[46,70],[56,70],[58,94]]);
   c.strokeStyle=ink; c.beginPath(); c.arc(62,50,27,-1.15,1.15); c.lineWidth=5; c.stroke();
   ln(c,[[73,25],[73,75]],2.5); ln(c,[[48,50],[88,50]],3.5); poly(c,[[85,43],[97,50],[85,57]]); },
 knight(c,ink,bg){ poly(c,[[34,20],[66,20],[70,48],[50,58],[30,48]]);
   c.fillStyle=bg; poly(c,[[36,30],[64,30],[64,38],[36,38]]); c.fillStyle=ink;
   poly(c,[[40,4],[60,4],[57,18],[43,18]]);
   poly(c,[[30,60],[70,60],[64,92],[36,92]]);
   c.strokeStyle=ink; ln(c,[[82,16],[82,76]],5); ln(c,[[72,30],[92,30]],5); },
 sorceress(c,ink,bg){ poly(c,[[50,38],[26,90],[74,90]]); ell(c,50,28,9,10);
   poly(c,[[38,17],[62,17],[70,64],[58,30],[42,30],[30,64]]);
   poly(c,[[43,2],[57,2],[63,18],[37,18]]);
   c.strokeStyle=ink; ln(c,[[62,52],[73,46]],5);
   ell(c,80,43,8,8); c.fillStyle=bg; ell(c,80,43,3.5,3.5); c.fillStyle=ink; },
 dragon(c,ink,bg){ poly(c,[[30,72],[52,54],[74,60],[80,76],[58,84],[34,86]]);
   poly(c,[[46,58],[22,12],[52,32],[72,8],[73,54]]);
   poly(c,[[74,58],[96,44],[97,59],[86,64]]);
   c.fillStyle=bg; ell(c,88,52,3,3); c.fillStyle=ink;
   poly(c,[[79,44],[85,28],[88,44]]);
   c.strokeStyle=ink; ln(c,[[32,82],[12,88],[7,68]],5); poly(c,[[9,58],[18,72],[2,72]]); },
 shapeshifter(c,ink,bg){ c.beginPath(); c.moveTo(22,60);
   c.bezierCurveTo(18,20,82,16,78,60); c.bezierCurveTo(78,84,70,74,62,88);
   c.bezierCurveTo(56,74,44,74,38,88); c.bezierCurveTo(30,74,22,84,22,60); c.closePath(); c.fill();
   c.fillStyle=bg; ell(c,40,50,6,9); ell(c,60,50,6,9); c.fillStyle=ink;
   ell(c,24,20,5,5); ell(c,78,16,4,4); ell(c,50,8,3,3); },
 basilisk(c,ink,bg){ c.strokeStyle=ink; c.lineCap="round";

/* ============ movement rules ============ */
function legalMoves(x,y){
  const p=G.grid[x][y]; if(!p||p.imprisoned)return [];
  const T=TYPES[p.t], out=[];
  if(T.mv==="ground"){                 // orthogonal only, cannot pass through an occupied square
    const dist=[...Array(N)].map(()=>Array(N).fill(-1)); dist[x][y]=0;
    const q=[[x,y]];
    while(q.length){
      const [cx,cy]=q.shift(); if(dist[cx][cy]>=T.r)continue;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy;
        if(nx<0||ny<0||nx>=N||ny>=N||dist[nx][ny]!==-1)continue;
        dist[nx][ny]=dist[cx][cy]+1;
        const occ=G.grid[nx][ny];
        if(occ){ if(occ.side!==p.side)out.push([nx,ny]); continue; }
        out.push([nx,ny]); q.push([nx,ny]);
      }
    }
  } else {                             // flying and teleport ignore obstacles and diagonals
    for(let nx=0;nx<N;nx++)for(let ny=0;ny<N;ny++){
      if(nx===x&&ny===y)continue;
      if(Math.max(Math.abs(nx-x),Math.abs(ny-y))>T.r)continue;
      const occ=G.grid[nx][ny]; if(occ&&occ.side===p.side)continue;
      out.push([nx,ny]);
    }
  }
  return out;
}

/* ============ turn engine ============ */
function beginTurn(){
  const side=G.turn;
  for(const {p,x,y} of pieces(side)){          // regeneration
    const c=tileColor(x,y);
    if(isPower(x,y))p.hp=Math.min(maxHP(p.t),p.hp+7);
    else p.hp=Math.min(maxHP(p.t),p.hp+3);
    if(p.imprisoned&&((p.side==="L"&&G.lum===0)||(p.side==="D"&&G.lum===5)))p.imprisoned=false;
  }
  const w=checkWin(); if(w!==null){gameOver(w);return;}
  const movable=pieces(side).some(({x,y})=>legalMoves(x,y).length);
  if(!movable&&!(spellcaster(side)&&!spellcaster(side).p.imprisoned&&hasSpell(side))){gameOver(opp(side));return;}
  const sc=spellcaster(side), any=pieces(side)[0];
  G.cursor=sc?{x:sc.x,y:sc.y}:(any?{x:any.x,y:any.y}:{x:4,y:4});
  G.sel=null;G.moves=[];G.target=null;
  G.turnPhase="banner";
  G.banner={text:(side==="L"?"LIGHT":"DARK")+(isCPU(side)?" — CPU":"")+" TO MOVE",
            until:performance.now()+(isCPU(side)?800:650),side};
  G.msg=isCPU(side)?"Thinking…":"Select an icon, then its destination.";
}
function completeTurn(msg){

  const w=checkWin(); if(w!==null){gameOver(w);return;}
  if(G.turn==="D"){                    // luminance advances one step per full round
    G.lum+=G.lumDir;
    if(G.lum>=5){G.lum=5;G.lumDir=-1;} else if(G.lum<=0){G.lum=0;G.lumDir=1;}
    G.round++;

function checkWin(){
  const l=pieces("L"), d=pieces("D");

  if(!d.length)return "L";
  if(!l.length)return "D";
  for(const s of ["L","D"])
    if(POWER.every(([x,y])=>{const p=G.grid[x][y];return p&&p.side===s;}))return s;
  if(d.length===1&&d[0].p.imprisoned)return "L";
  if(l.length===1&&l[0].p.imprisoned)return "D";

function makeBarriers(x,y){
  let seed=(x+1)*743+(y+1)*1597;
  const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  const cells=[];
  for(let row=0;row<5;row++)for(let col=0;col<8;col++){
    const bx=22+col*38,by=16+row*38;
    if((col<2||col>5)&&Math.abs(by-AH/2)<30)continue;
    cells.push({x:bx,y:by,w:10,h:12,phase:rand()});
  }
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]];}
  return cells.slice(0,14);

function barrierState(b,c=G.combat){
  // The barrier's own six-colour cycle is independent of the strategic clock.
  const phase=(c.time/12+b.phase)%1;
  const level=Math.min(5,Math.floor((phase<.5?phase:1-phase)*12));
  const difference=Math.abs(level-c.lum);

function barrierFactor(x,y,r=0){

    .filter(([x,y])=>x>=10&&x<=AW-10&&y>=10&&y<=AH-10&&!blocked(x,y));
  options.sort((a,z)=>Math.hypot(a[0]-f.x,a[1]-f.y)-Math.hypot(z[0]-f.x,z[1]-f.y));

  const ny=Math.max(10,Math.min(AH-10,f.y+dy*speed));

  const L=cpu();
  const dx=e.x-f.x,dy=e.y-f.y,d=Math.hypot(dx,dy)||1;
  let aimX=Math.abs(dx)<8?0:Math.sign(dx),aimY=Math.abs(dy)<8?0:Math.sign(dy);
  const aligned=Math.abs(dx)<10||Math.abs(dy)<10||Math.abs(Math.abs(dx)-Math.abs(dy))<12;
  const close=f.atk==="melee"?d<24:f.atk==="burst"?d<34:aligned;
  const busy=f.atk==="missile"&&G.combat.shots.some(s=>s.owner===f);
  if(aiRand()>L.aim){                       // a shot loosed a little off the line
    if(aiRand()<.5)aimX=0; else aimY=0;
    if(!aimX&&!aimY)aimX=Math.sign(dx)||1;
  }
  if(close&&f.cd<=0&&!busy&&aiRand()<L.fire)return [aimX,aimY,true];
  if(aiRand()>L.react)return [0,0,false];   // and a beat of hesitation before moving
  let ix=aimX,iy=aimY;
  if(f.atk==="missile"){
    if(d<90){ix=-aimX;iy=-aimY;}
    else if(d<170){if(Math.abs(dx)>Math.abs(dy)){ix=0;iy=aimY;}else{ix=aimX;iy=0;}}
    const shot=L.dodge&&G.combat.shots.find(s=>s.side!==f.side&&Math.hypot(s.x-f.x,s.y-f.y)<65);
    if(shot){ix=-Math.sign(shot.vy);iy=Math.sign(shot.vx);}
  }
  if(blocked(f.x+ix*14,f.y+iy*14)){
    const sign=(Math.floor(elapsed/2)%2)?1:-1;
    const candidates=[[iy*sign,-ix*sign],[0,sign],[sign,0],[-sign,0],[0,-sign]];
    const step=candidates.find(([x,y])=>!blocked(f.x+x*14,f.y+y*14)&&f.x+x*14>10&&f.x+x*14<AW-10&&f.y+y*14>10&&f.y+y*14<AH-10);
    if(step)[ix,iy]=step;
  }
  return [ix,iy,false];
}
function combatStep(dt,now){
  const c=G.combat;
  if(c.over&&now>c.over&&!c.shots.length&&c.a.swing<=0&&c.b.swing<=0){finishCombat();return;}
  c.time+=dt;
  for(const b of c.barriers){
    const solid=barrierState(b).solid;
    if(solid&&!b.wasSolid)for(const f of [c.a,c.b]){
      if(f.x+8>b.x&&f.x-8<b.x+b.w&&f.y+8>b.y&&f.y-8<b.y+b.h)ejectFromBarrier(f,b);
    }
    b.wasSolid=solid;
  }
  const pair=[c.a,c.b],snap=pair.map(f=>({x:f.x,y:f.y}));
  const cmd=pair.map((f,i)=>{
    if(isCPU(f.side))return aiInput(f,snap[1-i],c.time);
    const prefix=G.mode!=="pvp"||f===c.p1?"1":"2";
    return [(keys[prefix+"R"]?1:0)-(keys[prefix+"L"]?1:0),
      (keys[prefix+"D"]?1:0)-(keys[prefix+"U"]?1:0),!!(keys[prefix+"A"]||(prefix==="1"&&keys["1C"]))];
  });
  pair.forEach((f,i)=>{
    const [ix,iy,fire]=cmd[i];
    if(ix||iy){const m=Math.hypot(ix,iy);f.fx=ix/m;f.fy=iy/m;}
    const rooted=fire||(f.icon==="phoenix"&&f.swing>0);
    if(f.hp>0&&(ix||iy)&&!rooted)moveFighter(f,f.fx*f.speed*dt,f.fy*f.speed*dt);
    const prev=f.cd;f.cd=Math.max(0,f.cd-dt*1000);
    if(prev>0&&f.cd===0&&!fire&&!c.over)readySound(f.side);
    f.flash=Math.max(0,f.flash-dt*1000);f.swing=Math.max(0,f.swing-dt*1000);
  });
  const dmgQ=[];
  pair.forEach((f,i)=>{if(!c.over&&f.hp>0&&cmd[i][2]&&f.cd<=0)doAttack(f,pair[1-i],dmgQ);});
  // Phoenix and Banshee attacks hurt throughout the time spent in their area.
  pair.forEach((f,i)=>{if(f.hp>0&&f.atk==="burst"&&f.swing>0&&Math.hypot(f.x-pair[1-i].x,f.y-pair[1-i].y)<34)
    dmgQ.push({t:pair[1-i],d:f.dmg*dt*3});});
  dmgQ.forEach(ev=>hurt(ev.t,ev.d));
  for(const s of c.shots){
    // Substeps prevent fast bolts from tunnelling through narrow obstacles.
    const steps=Math.max(1,Math.ceil(Math.hypot(s.vx,s.vy)*dt/3));
    for(let i=0;i<steps&&!s.dead;i++){
      const factor=barrierFactor(s.x,s.y,2);
      if(factor===0){s.dead=true;break;}
      s.x+=s.vx*dt/steps*factor;s.y+=s.vy*dt/steps*factor;
      if(s.x<0||s.x>AW||s.y<0||s.y>AH||blocked(s.x,s.y,2)){s.dead=true;break;}
      const e=s.owner===c.a?c.b:c.a;
      if(Math.hypot(s.x-e.x,s.y-e.y)<11){s.dead=true;hurt(e,s.dmg);}
    }
  }
  c.shots=c.shots.filter(s=>!s.dead);
  // No invented sudden-death timer: a duel ends when an icon is defeated.
  if(!c.over&&(c.a.hp<=0||c.b.hp<=0)){c.over=now+900;clearKeys();tone(300,35,.6,"sawtooth",.4);}
}
function finishCombat(){
  const c=G.combat, {x,y}=c, att=c.a.p, def=c.b.p;
  const aAlive=c.a.hp>0, bAlive=c.b.hp>0;
  document.getElementById("pad2").style.display="none";
  let msg;
  if(aAlive&&!bAlive){
    att.hp=Math.min(maxHP(att.t),Math.max(1,c.a.hp/c.a.healthScale));
    G.grid[x][y]=(att.t==="elemental")?null:att;     // the elemental departs after its fight
    G.dead[def.side].push(def.t);
    msg=TYPES[att.t].n+" defeats "+TYPES[def.t].n+" on "+sqName(x,y)+".";
  } else if(bAlive&&!aAlive){
    def.hp=Math.min(maxHP(def.t),Math.max(1,c.b.hp/c.b.healthScale)); G.grid[x][y]=def;
    if(att.t!=="elemental")G.dead[att.side].push(att.t);
    msg=TYPES[def.t].n+" holds "+sqName(x,y)+".";
  } else {
    G.grid[x][y]=null;
    if(att.t!=="elemental")G.dead[att.side].push(att.t);
    G.dead[def.side].push(def.t); msg="Both icons fall on "+sqName(x,y)+".";
  }
  G.combat=null; G.phase="play"; G.quiet=0; layout(); completeTurn(msg);
}

/* ============ spells ============ */
const spellImmune=(x,y,caster)=>{const p=G.grid[x][y];return !!p&&p.side!==caster&&isPower(x,y);};
function openSpells(){
  if(G.phase!=="play"||G.turnPhase!=="select"||!G.human[G.turn])return;
  const side=G.turn;
  if(!spellcaster(side)){G.msg="Your spellcaster has fallen — no magic remains.";return;}
  if(spellcaster(side).p.imprisoned){G.msg="An imprisoned mage cannot cast spells.";return;}
  showOverlay(`<h1>SPELLS</h1><p class="sub">Each may be cast once per game. Casting uses your turn.</p>
   <div class="spellgrid">${SPELLS.map((s,i)=>
     `<div class="menuitem ${G.spells[side][s.k]?"used":""} ${i===0?"sel":""}" data-spell="${s.k}">
      <b>${s.n}</b><br><span style="font-size:11px;opacity:.75">${s.d}</span></div>`).join("")}</div>
   <div class="menuitem" data-spell="cancel">Back</div>`);
  G.turnPhase="spellmenu";
}
function castSpell(k){
  const side=G.turn;
  if(k==="cancel"||G.spells[side][k]){hideOverlay();G.turnPhase="select";return;}
  hideOverlay(); G.turnPhase="select";
  if(k==="shift"){G.spells[side].shift=true;
    if(G.lum>=5||G.lum<=0){G.lum=G.lum>=5?0:5;G.lumDir=G.lum===0?1:-1;} else G.lumDir*=-1;
    completeTurn("Time shifts — the luminance cycle reverses."); return;}
  if(k==="revive"){
    const list=[...new Set(G.dead[side])];
    if(!list.length){G.msg="No fallen icons to revive.";return;}
    showOverlay(`<h1>REVIVE</h1><p class="sub">Choose a fallen icon.</p>`+
      list.map((t,i)=>`<div class="menuitem ${i?"":"sel"}" data-revive="${t}">${TYPES[t].n}</div>`).join("")+
      `<div class="menuitem" data-revive="cancel">Back</div>`);
    G.turnPhase="revivemenu"; return;
  }
  G.target={spell:k,step:1,first:null}; G.msg=targetPrompt();
}
function targetPrompt(){
  const t=G.target; if(!t)return "";
  const m={teleport:["Select a friendly icon.","Select an empty square or an enemy icon."],
    heal:["Select a friendly icon to heal.",""],
    exchange:["Select the first icon.","Select the second icon."],
    summon:["Select an enemy icon to face the elemental.",""],
    imprison:["Select an enemy icon to imprison.",""],
    revive:["","Select an empty square beside your spellcaster."]};
  return "Casting "+SPELLS.find(s=>s.k===t.spell).n+" — "+m[t.spell][t.step-1];
}
function spellTarget(x,y){
  const t=G.target, side=G.turn, p=G.grid[x][y];
  const bad=m=>{G.msg=m+" "+targetPrompt();};
  const done=msg=>{G.spells[side][t.spell]=true;G.target=null;completeTurn(msg);};
  switch(t.spell){
    case "heal":
      if(!p||p.side!==side)return bad("Must be a friendly icon.");
      if(isPower(x,y))return bad("A power point already restores it.");
      p.hp=maxHP(p.t); return done(TYPES[p.t].n+" is made whole.");
    case "imprison":
      if(!p||p.side===side)return bad("Must be an enemy icon.");
      if(spellImmune(x,y,side))return bad("Power points ward off spells.");
      if((p.side==="L"&&G.lum===0)||(p.side==="D"&&G.lum===5))return bad("It would break free at once.");
      p.imprisoned=true; return done(TYPES[p.t].n+" is bound in place.");
    case "summon":
      if(!p||p.side===side)return bad("Must be an enemy icon.");
      if(spellImmune(x,y,side))return bad("Power points ward off spells.");
      G.spells[side].summon=true; G.target=null;
      startCombat(mk("elemental",side),p,x,y); return;
    case "teleport":
      if(t.step===1){ if(!p||p.side!==side)return bad("Must be a friendly icon.");
        if(p.imprisoned||isPower(x,y))return bad("Cannot teleport an imprisoned icon or a power-point occupant.");
        t.first=[x,y]; t.step=2; G.msg=targetPrompt(); return; }
      if(p?.side===side||(p&&isPower(x,y)))return bad("Cannot target a friendly icon or a protected enemy.");
      {const icon=G.grid[t.first[0]][t.first[1]];G.grid[t.first[0]][t.first[1]]=null;
       if(p){G.spells[side].teleport=true;G.target=null;startCombat(icon,p,x,y);return;}
       G.grid[x][y]=icon;return done("The icon vanishes and reappears on "+sqName(x,y)+".");}
    case "exchange":
      if(!p)return bad("Select an occupied square.");
      if(p.imprisoned||isPower(x,y))return bad("Not while imprisoned or on a power point.");
      if(t.step===1){t.first=[x,y];t.step=2;G.msg=targetPrompt();return;}
      {const [ax,ay]=t.first; if(ax===x&&ay===y)return bad("Choose a different icon.");
       const tmp=G.grid[ax][ay]; G.grid[ax][ay]=p; G.grid[x][y]=tmp;
       return done("Two icons trade places.");}
    case "revive":{
      const sc=spellcaster(side); if(!sc){G.target=null;return;}
      if(p||Math.max(Math.abs(x-sc.x),Math.abs(y-sc.y))!==1)
        return bad("Must be empty and adjacent to your spellcaster.");
      G.grid[x][y]=mk(t.reviveType,side);
      const i=G.dead[side].indexOf(t.reviveType); if(i>=0)G.dead[side].splice(i,1);
      return done(TYPES[t.reviveType].n+" returns to the board.");}
  }
}

/* ============ CPU board play ============ */
// A heuristic, not measured win probabilities; avoids stale odds from the old arena.
function winOdds(mine,theirs,side){
  const strength=t=>{const a=TYPES[t];return (3+a.F*2.3)*(a.atk==="melee"?.6:1)*(1+a.I*.12)*maxHP(t);};
  const a=strength(mine),b=strength(theirs);
  return a/(a+b);
}
const pieceValue=t=>{const T=TYPES[t];return T.F+T.S+T.I+T.L*1.4+((t==="wizard"||t==="sorceress")?22:0);};
function cpuMove(){
  const side=G.turn; let best=null,bs=-1e9;
  const foes=pieces(opp(side));
  const push=Math.min(40,G.quiet||0);          // grows while no blood is drawn
  const nearestFoe=(x,y)=>foes.reduce((m,o)=>
    Math.min(m,Math.abs(o.x-x)+Math.abs(o.y-y)),99);
  // Where can the enemy strike next turn? Without this a side simply walks into
  // range and is punished, which would hand the game to whoever moves second.
  const threat=[...Array(N)].map(()=>[...Array(N)].map(()=>[]));
  for(const f of foes){
    if(f.p.imprisoned)continue;
    for(const [mx,my] of legalMoves(f.x,f.y))threat[mx][my].push(f.p);
  }
  for(const {p,x,y} of pieces(side)){
    if(p.imprisoned)continue;
    for(const [nx,ny] of legalMoves(x,y)){
      const tgt=G.grid[nx][ny]; let s=0;
      if(tgt){
        const bgc=tileColor(nx,ny);
        let pw=winOdds(p.t,tgt.t,side);
        pw*= (p.hp/maxHP(p.t))/((tgt.hp/maxHP(tgt.t))||1);   // wounds shift the odds
        if(bgc===side)pw*=1.25; else if(bgc===opp(side))pw*=0.8;
        pw=Math.max(.03,Math.min(.97,pw));
        s+=(pw*pieceValue(tgt.t)*1.5-(1-pw)*pieceValue(p.t)*1.3)*(1+push*0.04);
        if(isPower(nx,ny))s+=18;
      }
      if(isPower(nx,ny))s+=34;
      if(isPower(x,y))s-=30;
      const c=tileColor(nx,ny); if(c===side)s+=6; else if(c===opp(side))s-=6;
      s-=(Math.abs(nx-4)+Math.abs(ny-4))*0.7;
      s-=nearestFoe(nx,ny)*(0.25+push*0.07);
      if(p.t==="wizard"||p.t==="sorceress"){s-=10; if(tgt)s-=30;}
      const hurtme=threat[nx][ny].reduce((worst,f)=>{
        let od=winOdds(p.t,f.t,side)*((p.hp/maxHP(p.t))/((f.hp/maxHP(f.t))||1));
        return Math.min(worst,Math.max(.03,Math.min(.97,od)));
      },1);
      s-=(1-hurtme)*pieceValue(p.t)*1.15*Math.max(0.12,1-push*0.03)*cpu().caution;  // caution, fading
      s+=(p.hp/maxHP(p.t))*3 + aiRand()*cpu().noise;
      if(s>bs){bs=s;best={x,y,nx,ny};}
    }
  }
  if(!best){completeTurn("No legal move — the turn passes.");return;}
  G.cursor={x:best.nx,y:best.ny};
  startMove(best.x,best.y,best.nx,best.ny);
}

/* ============ input ============ */
let menuSel=0;
function menuKey(k){
  const items=[...ov.querySelectorAll(".menuitem")]; if(!items.length)return;
  const a=padAction(k);
  if(a==="U"||a==="L")menuSel=(menuSel-1+items.length)%items.length;
  if(a==="D"||a==="R")menuSel=(menuSel+1)%items.length;
  items.forEach((el,i)=>el.classList.toggle("sel",i===menuSel));
  if(a==="A"||a==="C")items[menuSel].click();
}
/* Two players share one device, so each pad drives its own side: in a hot seat
   game pad 1 is the Light and pad 2 is the Dark, and a pad is dead on the other
   side's turn rather than quietly moving their cursor. With one human, the single
   pad drives whichever side that human plays. */
function padOwner(k){return k&&(k[0]==="1"||k[0]==="2")?+k[0]:1;}
function padSide(n){return G.mode==="pvp"?(n===1?"L":"D"):null;}
function padActive(n){const side=padSide(n);return side===null||side===G.turn;}
const padAction=k=>k&&(k[0]==="1"||k[0]==="2")?k.slice(1):k;
function press(k){
  if(k==="FULL"){toggleGameMode();return;}
  if(G.phase==="menu"||G.phase==="over"||G.turnPhase==="spellmenu"||G.turnPhase==="revivemenu"){menuKey(k);return;}
  if(G.phase==="combat")return;
  const n=padOwner(k), act=padAction(k);
  if(act==="MENU"){mainMenu();return;}
  if(act==="SPELL"){if(padActive(n))openSpells();return;}
  if(G.phase!=="play"||G.turnPhase!=="select"||!G.human[G.turn])return;
  if(!padActive(n))return;
  const c=G.cursor;
  if(act==="U")c.y=Math.max(0,c.y-1);
  if(act==="D")c.y=Math.min(N-1,c.y+1);
  if(act==="L")c.x=Math.max(0,c.x-1);
  if(act==="R")c.x=Math.min(N-1,c.x+1);
  if(act==="B"){ if(G.target){G.target=null;G.msg="Spell cancelled.";}
                else {G.sel=null;G.moves=[];G.msg="Select an icon, then its destination.";} }
  if(act==="A"||act==="C"){
    if(G.target){spellTarget(c.x,c.y);return;}
    if(G.sel&&G.moves.some(m=>m[0]===c.x&&m[1]===c.y)){startMove(G.sel.x,G.sel.y,c.x,c.y);return;}
    const p=G.grid[c.x][c.y];
    if(p&&p.side===G.turn){
      if(p.imprisoned){G.msg=TYPES[p.t].n+" is imprisoned and cannot move.";return;}
      G.sel={x:c.x,y:c.y}; G.moves=legalMoves(c.x,c.y);
      const T=TYPES[p.t];
      G.msg=T.n+" — life "+Math.round(p.hp)+"/"+maxHP(p.t)+", "+T.mv+" "+T.r+
        (G.moves.length?"":" — no legal moves");
    } else {G.sel=null;G.moves=[];}
  }
}
/* ============ full game mode ============ */
/* The controls only feel like a machine when the page stops behaving like a page:
   fullscreen, no scrolling or zooming, and pads placed over the board's dead space. */
const NAV=typeof navigator==="object"&&navigator?navigator:null;
const bodyEl=document.body||{classList:{add(){},remove(){}}};
const stageEl=document.getElementById("stage"), fullBtn=document.getElementById("full");
let gameMode=false, wakeLock=null, wantGameMode=false;
const SAFE={top:0,right:0,bottom:0,left:0};   // CSS px of canvas reserved for chrome and pads
const BAR=26;   // height of the game-mode status strip, matching the stylesheet
try{wantGameMode=localStorage.getItem("archon.gamemode")==="1";}catch(e){}

function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function requestFS(){
  const el=document.documentElement;if(!el)return;
  try{const r=el.requestFullscreen?.({navigationUI:"hide"})??el.webkitRequestFullscreen?.();
    if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
function exitFS(){try{const r=document.exitFullscreen?.()??document.webkitExitFullscreen?.();
  if(r&&r.catch)r.catch(()=>{});}catch(e){}}
function keepAwake(){
  if(!NAV?.wakeLock?.request)return;
  try{NAV.wakeLock.request("screen").then(l=>{wakeLock=l;}).catch(()=>{});}catch(e){}
}
function releaseAwake(){try{wakeLock?.release?.();}catch(e){}wakeLock=null;}
function setGameMode(on){
  gameMode=!!on; wantGameMode=gameMode;
  bodyEl.classList?.[gameMode?"add":"remove"]("gamemode");
  fullBtn?.setAttribute?.("aria-pressed",gameMode?"true":"false");
  if(fullBtn)fullBtn.textContent=gameMode?"EXIT FULL":"FULL SCREEN";

}
/* Fullscreen only succeeds inside a user gesture, so every caller is a tap or a key. */
function toggleGameMode(){

  else{setGameMode(true);requestFS();}
}
function enterGameModeIfWanted(){if(wantGameMode&&!gameMode){setGameMode(true);requestFS();}}

/* Where the second player is sitting decides which way their pad faces: beside you,
   both pads read the right way up; opposite you, across a device lying flat, theirs
   is turned around. Nothing else about the game changes. */
let seating="side";
try{if(localStorage.getItem("archon.seating")==="facing")seating="facing";}catch(e){}
function setSeating(v){
  seating=v==="facing"?"facing":"side";
  try{localStorage.setItem("archon.seating",seating);}catch(e){}
  applySeating();
}
function applySeating(){
  const two=G.mode==="pvp";
  bodyEl.classList?.[two?"add":"remove"]("twop");
  bodyEl.classList?.[two&&seating==="facing"?"add":"remove"]("facing");
  layout();
}
/* The second pad belongs on screen for the whole hot seat game, not only inside a
   duel: the Dark player moves their own icons on the board with it. The pad that is
   not to move goes quiet, so nobody wonders whose turn it is. */
function updatePadState(){
  const p1=document.getElementById("pad1"), p2=document.getElementById("pad2");
  const two=G.mode==="pvp"&&(G.phase==="play"||G.phase==="combat");
  const want=two?"flex":"none";
  if(p2&&p2.style&&p2.style.display!==want){p2.style.display=want;layout();}
  const board=G.phase==="play"&&G.turnPhase==="select";
  const idle=n=>G.mode==="pvp"&&board&&!padActive(n);
  p1?.classList?.toggle?.("idle",idle(1));
  p2?.classList?.toggle?.("idle",idle(2));
}

/* ---- installed as an app ----
   iOS Safari has no Fullscreen API: requestFullscreen simply is not there, so a tab
   keeps its address bar and toolbar whatever the page does. The way to a real full
   screen on an iPhone is Add to Home Screen, which relaunches this page standalone
   with no browser chrome at all. Android and desktop Chrome install it from the
   beforeinstallprompt event instead, and either way the launch is a game, not a page. */
const MM=typeof matchMedia==="function"?matchMedia:null;
function isStandalone(){
  if(NAV&&NAV.standalone===true)return true;                   // iOS home-screen launch
  if(!MM)return false;
  try{return MM("(display-mode: standalone)").matches||MM("(display-mode: fullscreen)").matches;}
  catch(e){return false;}
}
function isIOS(){
  if(!NAV)return false;
  const ua=NAV.userAgent||"";
  return /iP(hone|od|ad)/.test(ua)||(/Mac/.test(NAV.platform||"")&&NAV.maxTouchPoints>1);
}
const installBtn=document.getElementById("install");
let installPrompt=null;
function showInstall(on){if(installBtn)installBtn.hidden=!on;}
addEventListener("beforeinstallprompt",e=>{           // Chrome: we drive the install
  e.preventDefault();installPrompt=e;showInstall(true);
});
addEventListener("appinstalled",()=>{installPrompt=null;showInstall(false);});
installBtn?.addEventListener?.("click",()=>{
  if(installPrompt){installPrompt.prompt();installPrompt=null;showInstall(false);return;}

/* The board is drawn as a square, so game mode sizes the stage square too and
   lets the pads sit in the letterboxed space beside or below it. */
function layout(){
  const st=stageEl;
  if(!st?.style){fit();return;}
  if(!gameMode){
    st.style.width=st.style.height=st.style.left=st.style.top="";
    SAFE.top=SAFE.right=SAFE.bottom=SAFE.left=0; fit(); return;
  }
  const vw=typeof innerWidth==="number"?innerWidth:0, vh=typeof innerHeight==="number"?innerHeight:0;
  if(!vw||!vh){fit();return;}
  const landscape=vw>vh;
  const pad1=document.getElementById("pad1"), pad2=document.getElementById("pad2");
  const shown=el=>el&&el.style?.display!=="none";
  const h=el=>shown(el)?(el.getBoundingClientRect?.().height||0):0;
  // Widest single control column in a pad row (the d-pad or the button cluster).
  const colW=el=>shown(el)?Array.prototype.reduce.call(el.children||[],
    (m,c)=>Math.max(m,c.getBoundingClientRect?.().width||0),0):0;
  // Landscape puts the pads in the letterbox either side of the play area;
  // portrait stacks them under it (and above it, for the second player).
  // Two players in landscape each keep a column at their own edge; one player's pad
  // spreads across the bottom, so only its widest control column is reserved.
  const rowW=el=>shown(el)?(el.getBoundingClientRect?.().width||0):0;
  const twoCols=G.mode==="pvp"&&seating!=="facing"&&shown(pad2);
  const cols=landscape?Math.round(twoCols?Math.max(rowW(pad1),rowW(pad2))
    :Math.max(colW(pad1),colW(pad2)))+12:0;
  const stacked=landscape&&twoCols;
  const top=BAR+(!landscape&&shown(pad2)?Math.round(h(pad2))+8:0);
  const bottom=landscape?8:Math.round(h(pad1))+10;   // a little air under the board
  const band=Math.max(120,vh-top-bottom);
  const avail=Math.max(160,vw-2*cols);
  // The canvas takes the entire screen; SAFE is the part of it the play area may use,
  // and the drawing code centres the board or the arena inside that.
  st.style.left="0px"; st.style.top="0px";
  st.style.width=vw+"px"; st.style.height=vh+"px";
  SAFE.top=top; SAFE.bottom=bottom; SAFE.left=cols; SAFE.right=cols;
  fit();
}

function safeRect(){
  const r=cv.getBoundingClientRect?.(), d=(r&&r.width)?cv.width/r.width:1;

/* The 9x9 board is square, so it is the largest square that fits the safe rectangle. */

/* Full screen means the screen is used: the space beside a square board carries each

/* Portrait leaves a band over and under the board rather than beside it. */
function drawBands(g){
  const rows=[{side:"L",y:g.oy-1,dir:-1,h:g.oy},{side:"D",y:g.oy+g.S+1,dir:1,h:cv.height-g.oy-g.S}];
  for(const r of rows){
    if(r.h<g.s*.9)continue;
    const pad=Math.max(6,g.s*.1), label=r.y+r.dir*pad;
    ctx.fillStyle=INK[r.side];
    ctx.font=`700 ${Math.round(g.s*.22)}px sans-serif`;
    ctx.textAlign="left"; ctx.textBaseline=r.dir<0?"bottom":"top";
    const alive=G.grid.flat().filter(p=>p&&p.side===r.side).length;
    ctx.fillText((r.side==="L"?"LIGHT":"DARK")+" · "+alive+" icons",g.ox+pad,label);
    const fallen=G.dead[r.side]||[]; if(!fallen.length)continue;
    const size=Math.min(g.s*.55,(g.S-pad*2)/Math.max(6,fallen.length));
    const cy=label+r.dir*(g.s*.3+size/2);
    if(cy-size/2<0||cy+size/2>cv.height)continue;
    ctx.globalAlpha=.42;
    fallen.forEach((t,i)=>drawIcon(ctx,t,g.ox+g.S-pad-size/2-i*size,cy,size*.8,INK[r.side],"rgba(0,0,0,0)"));

  if(cols[0].w<g.s*1.4){drawBands(g);return;}      // portrait: the room is above and below
  for(const c of cols){
    if(c.w<g.s*1.4)continue;                       // too narrow to read
    const cx=c.x+c.w/2, top=g.oy+pad;
    ctx.fillStyle=INK[c.side];
    ctx.font=`700 ${Math.round(g.s*.24)}px sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText(c.side==="L"?"LIGHT":"DARK",cx,top);
    const alive=G.grid.flat().filter(p=>p&&p.side===c.side).length;
    ctx.fillStyle="rgba(151,161,184,.9)";
    ctx.font=`${Math.round(g.s*.2)}px sans-serif`;
    ctx.fillText(alive+" icons",cx,top+g.s*.3);

function drawArena(){
  const c=G.combat,a=safeRect();
  const sc=Math.min(a.w/(AW+22),a.h/(AH+40)),ox=a.x+(a.w-AW*sc)/2,oy=a.y+(a.h-AH*sc)/2;
  ctx.fillStyle="#000000";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
  ctx.fillStyle=C64_CYCLE[c.lum];ctx.fillRect(0,0,AW,AH);
  for(const b of c.barriers){
    const state=barrierState(b);if(state.level===c.lum)continue;

    ctx.fillRect(b.x+2,b.y,b.w-4,b.h);ctx.fillRect(b.x,b.y+3,b.w,b.h-6);

      for(let r=10;r<=34;r+=8){ctx.beginPath();ctx.arc(f.x,f.y,r,0,Math.PI*2);ctx.stroke();}
    }
    if(f.atk==="melee"&&f.swing>0){ctx.strokeStyle=INK[f.side];ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(f.x+f.fx*8,f.y+f.fy*8);ctx.lineTo(f.x+f.fx*24,f.y+f.fy*24);ctx.stroke();}
    ctx.globalAlpha=f.flash>0?.45:1;
    if(!(f.icon==="phoenix"&&f.swing>0))drawIcon(ctx,f.icon,Math.round(f.x),Math.round(f.y),22,INK[f.side],C64_CYCLE[c.lum]);
    ctx.globalAlpha=1;
  }
  for(const [f,x] of [[c.p1,-8],[c.p2,AW+3]]){
    ctx.fillStyle="#333333";ctx.fillRect(x,0,5,AH);
    const h=AH*Math.max(0,Math.min(1,f.hp/f.max));ctx.fillStyle=INK[f.side];ctx.fillRect(x,AH-h,5,h);
  }
  ctx.font="7px monospace";ctx.textBaseline="bottom";
  ctx.fillStyle=INK.L;ctx.textAlign="left";ctx.fillText(c.p1.name.toUpperCase(),0,-5);
  ctx.fillStyle=INK.D;ctx.textAlign="right";ctx.fillText(c.p2.name.toUpperCase(),AW,-5);
  ctx.fillStyle="#ffffff";ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText("HOLD FIRE + DIRECTION TO AIM · RELEASE TO MOVE",AW/2,AH+8);
  ctx.restore();
}
function render(){
  if(G.phase==="combat"&&G.combat)drawArena(); else drawBoard();
  let s=G.msg;
  if(G.phase==="combat"&&G.combat){
    s="<b>Combat</b> on "+sqName(G.combat.x,G.combat.y)+" — "+
      (G.combat.bg==="L"?"light ground favours Light":
       G.combat.bg==="D"?"dark ground favours Dark":"neutral ground")+".";
  } else if(G.phase==="play"){
    s=`<b>${G.turn==="L"?"Light":"Dark"}${isCPU(G.turn)?" (CPU)":""}</b> · ${G.msg}`;
  }
  statusEl.innerHTML=s;
}
/* ============ thumbsticks ============ */
/* The C64 stick had eight ways and no dead buttons between them. These sticks
   quantise to the same eight, so combat aiming is a push of the thumb rather
   than a search for the right little square; the board repeats while held. */
let controls="stick";
try{if(localStorage.getItem("archon.controls")==="dpad")controls="dpad";}catch(e){}
function applyControls(){
  bodyEl.classList?.[controls==="stick"?"add":"remove"]("stickmode");
  layout();
}
function setControls(v){
  controls=v==="dpad"?"dpad":"stick";
  try{localStorage.setItem("archon.controls",controls);}catch(e){}
  clearKeys();applyControls();
}
const DEAD=.34;                       // how far the thumb must travel to count
function stickDirs(nx,ny){
  const mag=Math.hypot(nx,ny);
  if(mag<DEAD)return{U:false,D:false,L:false,R:false};
  const oct=((Math.round(Math.atan2(ny,nx)/(Math.PI/4))%8)+8)%8;   // 0=right, clockwise
  const tbl=[[0,0,0,1],[0,1,0,1],[0,1,0,0],[0,1,1,0],[0,0,1,0],[1,0,1,0],[1,0,0,0],[1,0,0,1]];
  const [u,d,l,r]=tbl[oct];
  return{U:!!u,D:!!d,L:!!l,R:!!r};
}
const STICK={1:{on:false,dirs:{},next:0},2:{on:false,dirs:{},next:0}};
function stickApply(n,nx,ny,now){
  const st=STICK[n], dirs=stickDirs(nx,ny), pre=String(n);
  let changed=false;
  for(const d of ["U","D","L","R"]){
    const key=pre+d, want=!!dirs[d];
    if(!!keys[key]===want)continue;
    keys[key]=want; changed=true;
    if(want)press(key);            // the board steps on the edge, as a tap would
  }
  if(changed)st.next=(now||0)+300;  // then repeats, slower at first
  st.dirs=dirs;
}
function stickRelease(n){
  const pre=String(n);
  for(const d of ["U","D","L","R"])keys[pre+d]=false;
  STICK[n].on=false;STICK[n].dirs={};
}
/* Held directions repeat on the board only: combat reads the keys every frame. */
function stickRepeat(now){
  if(G.phase!=="play"||G.turnPhase!=="select")return;
  for(const n of [1,2]){
    const st=STICK[n];
    if(!st.on)continue;
    const held=["U","D","L","R"].filter(d=>st.dirs[d]);
    if(!held.length){st.next=0;continue;}
    if(now<st.next)continue;
    st.next=now+150;
    for(const d of held)press(String(n)+d);
  }
}
for(const el of (document.querySelectorAll?.(".stick")||[])){
  const n=+(el.dataset?.stick||1), knob=el.firstElementChild;
  const centre=()=>{const r=el.getBoundingClientRect?.()||{left:0,top:0,width:152,height:152};
    return{cx:r.left+r.width/2,cy:r.top+r.height/2,rad:(r.width||152)/2};};
  const track=e=>{
    const {cx,cy,rad}=centre();
    const dx=(e.clientX-cx)/rad, dy=(e.clientY-cy)/rad;
    const mag=Math.hypot(dx,dy)||1, k=Math.min(1,.62/mag);
    if(knob?.style)knob.style.transform=`translate(${(dx*rad*k).toFixed(1)}px,${(dy*rad*k).toFixed(1)}px)`;
    stickApply(n,dx,dy,performance.now?.()||0);
  };
  const stop=()=>{
    if(knob?.style)knob.style.transform="";
    el.classList?.remove("on");stickRelease(n);
  };
  el.addEventListener?.("pointerdown",e=>{
    e.preventDefault?.();unlockAudio?.();
    try{el.setPointerCapture?.(e.pointerId);}catch(err){}
    STICK[n].on=true;el.classList?.add("on");track(e);
  });
  el.addEventListener?.("pointermove",e=>{if(STICK[n].on){e.preventDefault?.();track(e);}});
  for(const ev of ["pointerup","pointercancel","lostpointercapture"])
    el.addEventListener?.(ev,e=>{e.preventDefault?.();stop();});
}

/* ============ gamepads ============ */
/* A real stick is the point of game mode: pad 1 drives Light, a second pad drives Dark.
   Only edges are applied, so a gamepad never clears a key the keyboard or a thumb holds. */
const GP={prev:[{},{}]};
function padState(gp,pre){
  const now={},bt=gp.buttons||[],ax=gp.axes||[];
  const on=n=>!!(bt[n]&&(bt[n].pressed||bt[n].value>.5));
  const ah=typeof ax[0]==="number"?ax[0]:0, av=typeof ax[1]==="number"?ax[1]:0;
  now[pre+"U"]=on(12)||av<-.45; now[pre+"D"]=on(13)||av>.45;
  now[pre+"L"]=on(14)||ah<-.45; now[pre+"R"]=on(15)||ah>.45;
  now[pre+"A"]=on(0)||on(7)||on(5);            // A / triggers: fire and confirm
  now[pre+"B"]=on(1)||on(6)||on(4);            // B / shoulders: cancel
  if(pre==="1"){now.SPELL=on(2);now.MENU=on(3)||on(9);now.FULL=on(8);}
  else now["2SPELL"]=on(2);
  return now;
}
function pollGamepads(){
  if(!NAV?.getGamepads)return;
  let list; try{list=NAV.getGamepads()||[];}catch(e){return;}
  const pads=Array.prototype.filter.call(list,Boolean);
  for(let i=0;i<2;i++){
    const gp=pads[i], prev=GP.prev[i], now=gp?padState(gp,i===0?"1":"2"):{};
    for(const k of Object.keys(now)){
      if(now[k]&&!prev[k]){keys[k]=true;press(k);}
      else if(!now[k]&&prev[k])keys[k]=false;
    }
    for(const k of Object.keys(prev))if(prev[k]&&!now[k])keys[k]=false;
    GP.prev[i]=now;
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  try{
    pollGamepads();stickRepeat(now);
    if(G.phase==="combat"&&G.combat&&!document.hidden)combatStep(dt,now);
    else if(G.phase==="play"){
      if(G.turnPhase==="banner"&&now>G.banner.until){
        G.banner=null; G.turnPhase="select";
        if(isCPU(G.turn))G.cpuAt=now+420;
      }
      else if(G.turnPhase==="select"&&isCPU(G.turn)&&now>G.cpuAt)cpuMove();
      else if(G.turnPhase==="anim"){G.anim.t+=dt; if(G.anim.t>=G.anim.dur)arrive();}
    }
    render();updatePadState();
  }catch(err){console.error(err);}
  requestAnimationFrame(loop);
}
layout(); applySeating(); applyControls(); mainMenu(); requestAnimationFrame(loop);
</script>
</body>
