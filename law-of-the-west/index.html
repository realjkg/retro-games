<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Law of the West — Gold Gulch</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Law of the West">
<meta name="theme-color" content="#120d09">
<meta name="description" content="Law of the West: a browser recreation of the 1985 Commodore 64 western. Ten people come up the street of Gold Gulch and you wear the only badge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23120d09'/%3E%3Cpath d='M50 16l8 22h23l-18 14 7 22-20-14-20 14 7-22-18-14h23z' fill='%23d8a441'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --sign:#e8cf6a;--npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
  --selbg:rgba(216,164,65,.17);
  --dlg:1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
    --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
  }
}
:root[data-theme="dark"]{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
}
:root[data-theme="light"]{
  --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
  --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
}
/* Nothing here is text to select: a long press on a control should hold the
   control, not raise the selection handles or the callout menu. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-drag:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* the two static zones: scene above, the matrix below */
#top{position:relative;flex:1 1 50%;min-height:0;background:#000;overflow:hidden}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
#bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  gap:8px;padding:2px 6px;font-size:10px;line-height:13px;color:var(--sign);
  background:rgba(10,7,4,.78);pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
/* The picture is 4:3, so upright the scene zone is exactly that and the words
   take whatever is left: no black band between the street and the dialogue. */
@media (orientation:portrait){#top{flex:0 0 auto;aspect-ratio:4/3}}
#bottom{flex:1 1 50%;min-height:0;display:flex;flex-direction:column;gap:4px;padding:6px;
  background:var(--panel);border-top:2px solid var(--line)}
/* The words must never be cut off: every line sizes to its own content, and the
   panel scrolls as a last resort rather than clipping what a character said. */
#panel{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* The four replies share whatever the visitor's line leaves, up to a limit, so
   the room under them becomes tap area instead of dead space. */
#replies{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px}
/* The matrix is set the way the machine set it: upper case, one width per
   character, tightly stacked. */
.npc,.choice{overflow-wrap:break-word;word-break:normal;hyphens:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  text-transform:uppercase;letter-spacing:.01em}
.npc{color:var(--npc);font-size:calc(13px * var(--dlg));line-height:1.3;padding:5px 6px 7px;flex:0 0 auto;
  border-bottom:2px solid var(--line)}
/* A reply is a number in its own column and the words beside it, so a line that
   wraps hangs under its own text rather than under the number. */
.choice{font-size:calc(12px * var(--dlg));line-height:1.3;padding:4px 7px;
  border:1px solid transparent;border-left:4px solid transparent;border-radius:4px;
  color:var(--ink);cursor:pointer;flex:1 1 auto;max-height:82px;min-height:0;
  display:grid;grid-template-columns:auto 1fr;gap:0 7px;
  align-content:center;align-items:start}
.choice .num{color:var(--gold);opacity:.75;font-weight:700}
.choice .txt{min-width:0}
.choice.empty{flex:0 0 0;max-height:0;padding:0;border:0;overflow:hidden}
.choice.sel{background:var(--selbg);border-color:var(--sel);font-weight:700}
.choice.sel .num{color:var(--sel);opacity:1}
.choice.dim{opacity:.55}
/* A note is a line of information, not something to press. */
.choice.note{cursor:default;flex:0 0 auto;max-height:none;font-size:calc(11px * var(--dlg))}
/* An action that should not swell to fill the screen on its own. */
.choice.act{flex:0 0 auto}
/* The reckoning, as a table rather than a run-on line: name left, count right. */
.choice.table{cursor:default;flex:0 0 auto;max-height:none;display:block;padding:5px 7px}
.tbl{display:grid;grid-template-columns:1fr auto;gap:3px 14px;
  font-size:calc(11px * var(--dlg));line-height:1.35}
.tbl .k{color:var(--dim)}
.tbl .v{color:var(--gold);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.choice.dim.sel{opacity:.8;background:none}
.choice.locked{opacity:.5;font-style:italic}
.choice.locked.sel{background:var(--panel2);color:var(--dim);border-color:var(--line);font-weight:400}
#pads{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,34px);gap:3px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none;-webkit-touch-callout:none}
/* the reply lines are controls as much as the pad is */
.choice{touch-action:manipulation;-webkit-touch-callout:none}
.btn:active{background:var(--sel);color:var(--selink)}
.abtn{width:58px;height:58px;border-radius:50%;font-size:12px;font-weight:700}
.sbtn{padding:6px 9px;font-size:11px;min-height:32px}
#meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim)}
@media (max-height:700px){ #meta{display:none} }

/* ---- full game mode ---- *
 * The page is already one screenful; game mode takes the browser's chrome with
 * it, stops every page gesture that could interrupt a held direction, and in
 * landscape puts the scene on one side and the words and controls on the other,
 * so a thumb never crosses the street. */
body.gamemode{background:#000;touch-action:none}
body.gamemode #app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.gamemode #top{flex:1 1 46%}
body.gamemode #bottom{flex:1 1 54%;border-top-width:3px}
body.gamemode #meta{display:none}
body.gamemode .npc{font-size:calc(14px * var(--dlg))}
body.gamemode .choice{font-size:calc(13px * var(--dlg));padding:6px 8px}

@media (orientation:portrait){body.gamemode #top{flex:0 0 auto;aspect-ratio:4/3}}
body.gamemode .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,42px)}
body.gamemode .abtn{width:68px;height:68px}
@media (orientation:landscape){
  body.gamemode #app{flex-direction:row}
  body.gamemode #top{flex:1 1 50%;height:100%}
  body.gamemode #bottom{flex:1 1 50%;height:100%;border-top:0;border-left:3px solid var(--line)}
  body.gamemode #pads{margin-top:auto}
  body.gamemode .npc{font-size:13px}
  body.gamemode .choice{font-size:12px;padding:5px 7px}
  body.gamemode .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,34px)}
  body.gamemode .abtn{width:56px;height:56px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <canvas id="scene" width="320" height="200" aria-label="Main street, Gold Gulch"></canvas>
    <div id="bar"><span id="mode">TALKING — up to draw</span><span id="score">Standing 0</span></div>
  </div>
  <div id="bottom">
    <div id="panel" role="group" aria-label="Dialogue">
      <div id="line0" class="npc">LAW OF THE WEST — GOLD GULCH</div>
      <div id="replies">
        <div id="line1" class="choice sel" data-cmd="choose" data-index="0"></div>
        <div id="line2" class="choice" data-cmd="choose" data-index="1"></div>
        <div id="line3" class="choice" data-cmd="choose" data-index="2"></div>
        <div id="line4" class="choice" data-cmd="choose" data-index="3"></div>
      </div>
    </div>
    <div id="pads">
      <div class="dpad">
        <div></div><div class="btn" data-cmd="up">▲</div><div></div>
        <div class="btn" data-cmd="left">◀</div><div class="btn sbtn" data-cmd="holster">HOL</div><div class="btn" data-cmd="right">▶</div>
        <div></div><div class="btn" data-cmd="down">▼</div><div></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div class="btn abtn" data-cmd="fire">FIRE</div>
        <div style="display:flex;gap:5px">
          <button class="btn sbtn" id="mute" type="button" data-cmd="mute" aria-pressed="true">SOUND ON</button>
          <button class="btn sbtn" id="full" type="button" data-cmd="full" aria-pressed="false">FULL</button>
        </div>
      </div>
    </div>
    <div id="meta"><span>Up draws · down holsters · 1-4 or FIRE to speak · m mutes · g full screen</span></div>
  </div>
</div>
<script>
"use strict";
/* ===== sid-audio.js ===== */
/* ============ audio — SID (MOS 6581) idiom ============ *
 * Pulse oscillators with pulse-width modulation, a resonant multimode
 * lowpass, ring modulation, 23-bit LFSR noise and 4-bit ADSR levels.
 * Everything synthesised at run time. No samples, no files, nothing
 * lifted from any commercial release. SOUNDS is plain data so the same
 * definitions can be rendered offline to wav for auditioning.
 *
 * voice fields:
 *   w    "pulse" | "saw" | "tri" | "noise"
 *   f0   start frequency (Hz)        f1  end frequency (sweep, optional)
 *   pw   pulse width 0..1            pw1 end width (PWM sweep, optional)
 *   ring ring-modulator ratio against f0 (optional, tri/pulse only)
 *   cut  filter cutoff (Hz)          cut1 end cutoff (sweep, optional)
 *   res  filter resonance 0..15      dur seconds      vol 0..1
 *   dly  start offset (seconds)
 *   seq  [[semitoneOffset, startSec, durSec], ...] for melodic phrases   */
const SID_CLK=985248, FRAME=1/50;          // PAL machine, 50 Hz play routine
const sidF=f=>Math.round(f*16777216/SID_CLK)*SID_CLK/16777216;   // 16-bit register
const sid4=v=>Math.round(Math.max(0,Math.min(1,v))*15)/15;       // 4-bit level
const sidCut=c=>Math.round(Math.max(30,Math.min(12000,c))/12000*2047)/2047*12000;
const SOUNDS={
  step:    [{w:"noise",f0:1,dur:0.07,vol:0.16,cut:420,cut1:180,res:4}],
  click:   [{w:"pulse",f0:1400,pw:0.5,dur:0.03,vol:0.13,cut:5000,res:2}],
  select:  [{w:"pulse",f0:520,f1:1040,pw:0.3,pw1:0.6,dur:0.09,vol:0.2,cut:4200,res:5}],
  deny:    [{w:"saw",f0:190,f1:96,dur:0.22,vol:0.22,cut:1400,cut1:380,res:9}],
  creak:   [{w:"saw",f0:88,f1:150,dur:0.34,vol:0.15,cut:600,cut1:2600,res:12}],
  door:    [{w:"saw",f0:70,f1:128,dur:0.45,vol:0.16,cut:520,cut1:2200,res:13},
            {w:"noise",f0:1,dur:0.12,vol:0.2,cut:300,cut1:110,res:5,dly:0.44}],
  tell:    [{w:"tri",f0:330,f1:520,ring:1.51,dur:0.5,vol:0.18,cut:3000,cut1:5200,res:10},
            {w:"pulse",f0:82,pw:0.12,pw1:0.45,dur:0.55,vol:0.14,cut:900,res:8}],
  gunshot: [{w:"noise",f0:1,dur:0.2,vol:0.3,cut:7000,cut1:260,res:6},
            {w:"pulse",f0:150,f1:48,pw:0.5,dur:0.16,vol:0.26,cut:1600,cut1:300,res:4},
            {w:"noise",f0:1,dur:0.5,vol:0.08,cut:1100,cut1:180,res:9,dly:0.06}],
  ricochet:[{w:"pulse",f0:2400,f1:640,pw:0.08,pw1:0.5,dur:0.26,vol:0.16,
             cut:6000,cut1:1500,res:12}],
  hit:     [{w:"noise",f0:1,dur:0.11,vol:0.26,cut:2400,cut1:200,res:5},
            {w:"tri",f0:120,f1:62,dur:0.18,vol:0.22,cut:900,res:3}],
  wound:   [{w:"noise",f0:1,dur:0.14,vol:0.2,cut:900,cut1:180,res:7},
            {w:"tri",f0:95,f1:58,dur:0.3,vol:0.2,cut:600,res:4}],
  death:   [{w:"saw",f0:220,f1:44,dur:0.8,vol:0.26,cut:3200,cut1:180,res:11},
            {w:"pulse",f0:110,f1:40,pw:0.2,pw1:0.5,dur:0.85,vol:0.18,cut:1200,cut1:200,res:8}],
  holster: [{w:"noise",f0:1,dur:0.09,vol:0.12,cut:1800,cut1:700,res:8},
            {w:"saw",f0:130,f1:96,dur:0.14,vol:0.1,cut:900,cut1:1800,res:11,dly:0.03}],
  /* melodic cues — seq entries are [semitones from f0, start, length]     */
  respect: [{w:"pulse",f0:98,pw:0.3,pw1:0.5,vol:0.21,cut:1100,cut1:1600,res:7,
             seq:[[0,0,0.3],[7,0.32,0.15],[12,0.48,0.55]]},
            {w:"tri",f0:49,vol:0.2,cut:420,res:3,
             seq:[[0,0,0.46],[0,0.48,0.6]]}],
  disgrace:[{w:"pulse",f0:98,f1:92,pw:0.14,pw1:0.06,vol:0.22,cut:1300,cut1:520,res:14,
             seq:[[0,0,0.2],[-1,0.22,0.2],[-3,0.44,0.55]]},
            {w:"tri",f0:49,f1:46,vol:0.18,cut:420,cut1:260,res:5,
             seq:[[0,0,0.55],[-2,0.55,0.55]]}],
  /* An identity sting rather than a melody: a three-note motif, answered twice,
     low in the register. The high voice is a glint, never the lead. */
  title:   [{w:"pulse",f0:146.83,vol:0.19,cut:1500,cut1:2100,pw:0.16,pw1:0.5,res:9,
             seq:[[0,0,0.9],[7,0.95,0.55],[10,1.55,1.5],
                  [0,3.4,0.75],[7,4.2,0.5],[3,4.75,1.1],
                  [0,6.1,1.9]]},
            {w:"tri",f0:73.42,vol:0.2,cut:520,res:3,
             seq:[[0,0,1.55],[0,1.55,1.8],[7,3.4,1.35],[0,4.75,1.3],[0,6.1,1.9]]},
            {w:"pulse",f0:1174.66,pw:0.5,vol:0.035,cut:5200,res:6,
             seq:[[0,1.6,0.14],[7,3.5,0.14],[0,6.2,0.4]]}],
  dusk:    [{w:"pulse",f0:110,pw:0.22,pw1:0.5,vol:0.17,cut:1800,cut1:900,res:8,
             seq:[[0,0,0.5],[-2,0.52,0.5],[-3,1.04,0.4],[-4,1.46,0.4],
                  [-5,1.88,0.45],[-7,2.35,0.6]]},
            {w:"tri",f0:55,vol:0.19,cut:480,cut1:240,res:3,
             seq:[[0,0,1.05],[-5,1.06,1.25],[-12,2.35,1.6]]},
            {w:"pulse",f0:110,pw:0.3,pw1:0.12,vol:0.15,cut:1400,cut1:120,res:12,
             seq:[[-12,2.95,1.5]]}],
  /* ---- the rest of the day: cues for the parts the first table did not cover.
     Data only; the synthesis above is untouched. ---- */

  /* dawn and dusk bracket the day. dawn answers dusk: same idiom, rising. */
  dawn:    [{w:"pulse",f0:146.83,pw:0.26,pw1:0.46,vol:0.17,cut:1400,cut1:2400,res:7,
             seq:[[0,0,0.55],[7,0.58,0.55],[12,1.16,0.55],[19,1.74,1.3]]},
            {w:"tri",f0:73.42,vol:0.2,cut:480,cut1:700,res:3,
             seq:[[0,0,1.13],[7,1.16,1.13],[0,2.32,1.4]]},
            {w:"pulse",f0:1174.66,pw:0.5,vol:0.035,cut:5000,res:6,
             seq:[[0,1.2,0.12],[7,1.8,0.12],[12,2.4,0.4]]}],
  /* the star going on, at the head of the day */
  badge:   [{w:"pulse",f0:523.25,pw:0.22,pw1:0.48,vol:0.17,cut:4000,res:6,
             seq:[[0,0,0.09],[4,0.09,0.09],[7,0.18,0.09],[12,0.27,0.34]]},
            {w:"tri",f0:130.81,vol:0.12,cut:1100,res:3,seq:[[0,0,0.2],[7,0.2,0.42]]}],

  /* arrivals. Who comes up the street is audible before it is visible. */
  hooves:  [{w:"noise",f0:1,dur:0.06,vol:0.2,cut:300,cut1:120,res:6},
            {w:"tri",f0:74,f1:52,dur:0.09,vol:0.2,cut:420,res:4},
            {w:"noise",f0:1,dur:0.06,vol:0.19,cut:320,cut1:120,res:6,dly:0.17},
            {w:"tri",f0:70,f1:50,dur:0.09,vol:0.19,cut:420,res:4,dly:0.17},
            {w:"noise",f0:1,dur:0.06,vol:0.21,cut:340,cut1:130,res:6,dly:0.31},
            {w:"tri",f0:78,f1:54,dur:0.09,vol:0.2,cut:440,res:4,dly:0.31},
            {w:"noise",f0:1,dur:0.07,vol:0.22,cut:300,cut1:110,res:6,dly:0.46},
            {w:"tri",f0:66,f1:46,dur:0.11,vol:0.21,cut:400,res:4,dly:0.46}],
  wagon:   [{w:"noise",f0:1,dur:0.9,vol:0.13,cut:520,cut1:240,res:7},
            {w:"saw",f0:52,f1:63,dur:0.9,vol:0.12,cut:420,cut1:900,res:11},
            {w:"noise",f0:1,vol:0.1,cut:1600,cut1:600,res:9,
             seq:[[0,0.1,0.04],[0,0.34,0.04],[0,0.58,0.04],[0,0.8,0.05]]}],
  spurs:   [{w:"pulse",f0:2100,pw:0.12,pw1:0.4,ring:1.47,vol:0.1,cut:6200,res:11,
             seq:[[0,0,0.05],[3,0.13,0.05],[-2,0.27,0.07]]}],
  crowd:   [{w:"noise",f0:1,dur:0.85,vol:0.11,cut:380,cut1:240,res:5},
            {w:"saw",f0:96,f1:112,dur:0.8,vol:0.06,cut:300,cut1:520,res:8}],
  wind:    [{w:"noise",f0:1,dur:1.3,vol:0.13,cut:280,cut1:1100,res:4},
            {w:"noise",f0:1,dur:0.9,vol:0.08,cut:1400,cut1:320,res:6,dly:0.5}],
  /* The saloon reads from rhythm: off-beats pushed late and played lighter, with
     a flattened third leaning on the major over an oom-pah bass. */
  piano:   [{w:"pulse",f0:196,pw:0.34,pw1:0.18,vol:0.15,cut:2400,res:5,
             seq:[[0,0,0.2],[7,0.32,0.2],[7,0.64,0.2],[4,0.96,0.34]]},
            {w:"pulse",f0:392,pw:0.24,pw1:0.12,vol:0.075,cut:3000,res:6,
             seq:[[4,0.23,0.07],[10,0.55,0.07],[3,0.87,0.07],[0,1.19,0.14]]},
            {w:"tri",f0:98,vol:0.16,cut:700,res:3,
             seq:[[0,0,0.3],[7,0.32,0.3],[0,0.64,0.3],[-5,0.96,0.45]]}],
  /* a killing has a bell after it */
  churchbell:[{w:"tri",f0:220,ring:1.503,dur:1.6,vol:0.42,cut:4200,cut1:1400,res:9},
            {w:"tri",f0:110,dur:1.7,vol:0.3,cut:1400,cut1:600,res:4},
            {w:"tri",f0:219,ring:1.497,dur:1.2,vol:0.26,cut:3600,cut1:1200,res:9,dly:0.9}],

const GATE={step:90,click:30,hit:60,ricochet:70};
const SND=(function(){
  const AC=window.AudioContext||window.webkitAudioContext;
  let ac=null,bus=null,nz=null,on=true; const lastAt={};
  function noiseBuf(c){                       // SID's 23-bit LFSR
    const n=(c.sampleRate*2)|0, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    let r=0x7ffff8, held=1, acc=0; const inc=(SID_CLK/256)/c.sampleRate;
    for(let i=0;i<n;i++){ acc+=inc;
      while(acc>=1){ acc-=1;
        const fb=((r>>22)^(r>>17))&1; r=((r<<1)|fb)&0x7fffff; held=(r&0x100000)?1:-1; }
      d[i]=held; }
    return b;
  }
  function ctx(){
    if(!AC)return null;
    if(!ac){ ac=new AC(); bus=ac.createGain(); bus.gain.value=0.3;
             bus.connect(ac.destination); nz=noiseBuf(ac); }
    if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
    return ac;
  }
  /* a pulse of variable width: saw minus the same saw delayed by width/f */
  function pulseSource(c,v,t0,dur,steps){
    const a=c.createOscillator(), b=c.createOscillator(), inv=c.createGain();
    const dl=c.createDelay(0.05), out=c.createGain();
    a.type="sawtooth"; b.type="sawtooth"; inv.gain.value=-1;
    steps.forEach(({t,f,pw})=>{
      a.frequency.setValueAtTime(f,t); b.frequency.setValueAtTime(f,t);
      dl.delayTime.setValueAtTime(Math.min(0.049,Math.max(0.0001,pw/f)),t); });
    a.connect(out); b.connect(inv); inv.connect(dl); dl.connect(out);
    a.start(t0); b.start(t0); a.stop(t0+dur+0.05); b.stop(t0+dur+0.05);
    return out;
  }
  function voice(v,t0base,dest){
    const c=ctx(); if(!c)return;
    const notes=v.seq||[[0,0,v.dur]];
    for(const [st,ns,nd] of notes){
      const t0=t0base+(v.dly||0)+ns, dur=nd, mul=Math.pow(2,st/12);
      const n=Math.max(2,Math.round(dur/FRAME));
      const steps=[];
      for(let k=0;k<=n;k++){ const u=k/n;
        steps.push({ t:t0+u*dur,
          f:sidF((v.f1?v.f0*Math.pow(v.f1/v.f0,u):v.f0)*mul),
          pw:(v.pw==null?0.5:(v.pw1==null?v.pw:v.pw+(v.pw1-v.pw)*u)),
          cut:sidCut(v.cut1?v.cut*Math.pow(v.cut1/v.cut,u):(v.cut||8000)),
          g:sid4((v.vol==null?0.2:v.vol)*Math.pow(1-u,1.5)) }); }
      let src;
      if(v.w==="pulse") src=pulseSource(c,v,t0,dur,steps);
      else if(v.w==="noise"){ const s=c.createBufferSource();
        s.buffer=nz; s.loop=true; s.start(t0); s.stop(t0+dur+0.05); src=s; }
      else { const o=c.createOscillator(); o.type=v.w==="saw"?"sawtooth":"triangle";
        steps.forEach(s=>o.frequency.setValueAtTime(s.f,s.t));
        o.start(t0); o.stop(t0+dur+0.05); src=o; }
      let node=src;
      if(v.ring){                              // ring modulation: multiply by a second voice
        const rg=c.createGain(); rg.gain.value=0;
        const m=c.createOscillator(); m.type="triangle";
        steps.forEach(s=>m.frequency.setValueAtTime(sidF(s.f*v.ring),s.t));
        m.connect(rg.gain); node.connect(rg); m.start(t0); m.stop(t0+dur+0.05);
        node=rg;
      }
      const flt=c.createBiquadFilter();
      flt.type="lowpass"; flt.Q.value=0.7+(v.res==null?4:v.res)*0.75;
      steps.forEach(s=>flt.frequency.setValueAtTime(s.cut,s.t));
      const env=c.createGain();
      steps.forEach(s=>env.gain.setValueAtTime(s.g,s.t));
      env.gain.setValueAtTime(0,t0+dur+0.002);
      node.connect(flt); flt.connect(env); env.connect(dest||bus);
    }
  }
  function play(name){
    if(!on)return; const list=SOUNDS[name]; if(!list)return;
    const ms=GATE[name];
    if(ms){const t=performance.now(); if(lastAt[name]&&t-lastAt[name]<ms)return; lastAt[name]=t;}
    const c=ctx(); if(!c)return;
    list.forEach(v=>voice(v,c.currentTime));
  }
  /* A character's theme runs on its own gain so a drawn gun can cut it off
   * mid-bar, which is the one thing an entrance theme has to be able to do.
   * The synthesis is the same; only where the last node connects changes. */
  let themeGain=null, themeName=null;
  function cut(){
    const c=ctx(); if(!c||!themeGain)return;
    const g=themeGain; themeGain=null; themeName=null;
    try{g.gain.setValueAtTime(g.gain.value,c.currentTime);
        g.gain.linearRampToValueAtTime(0,c.currentTime+0.05);}catch(e){}
    setTimeout(()=>{try{g.disconnect();}catch(e){}},400);
  }
  function theme(name){
    if(!on)return; const list=SOUNDS[name]; if(!list)return;
    const c=ctx(); if(!c)return;
    cut();
    themeGain=c.createGain(); themeGain.gain.value=1; themeGain.connect(bus);
    themeName=name;
    const g=themeGain;
    list.forEach(v=>voice(v,c.currentTime,g));
  }
  const API={unlock(){ctx();}, get on(){return on;}, theme, cut,
    get playing(){return themeName;},
    toggle(){on=!on; if(!on)cut(); else{ctx();play("select");} return on;}};
  Object.keys(SOUNDS).forEach(k=>API[k]=()=>play(k));
  return API;
})();

/* ============ content ============
 * An original recreation of the 1985 game's structure, not a port and not a
 * copy: eleven callers over one day, in the documented order, each a tree of
 * three exchanges with one visitor line and four replies at every node. Every
 * word here is newly written; no dialogue, artwork or music of the original is
 * reproduced.
 *
 * A node is either a round - {npc, replies:[4]} - or a terminal in `ends`.
 * A reply carries exactly one of:
 *   next    another round node, one exchange deeper (three at most)
 *   end     a terminal in this encounter's `ends`
 *   action  "draw"      he goes for it now
 *           "ambush"    he was never going to talk
 *           "delayed"   he walks, then turns and fires
 *           "surrender" hands up, arrest available
 *           "depart"    he leaves, and that is that
 * Drawing your own gun is always available and is not a menu line.
 *
 * A terminal emits flags the day counts: tip_train, tip_stage, tip_bank, date,
 * arrest, surrender, depart, offended, doctor_civil, doctor_insulted.
 */

     {text:"\"State your business or move along.\"", next:"prickly"}]},
   cordial:{npc:"Passing through. I came up on the westbound and I'd as soon not go back down on it.",
    replies:[
     {text:"\"Trouble on the line?\"", next:"train"},
     {text:"\"Room at the hotel, if you're staying.\"", end:"peaceful"},
     {text:"\"What's wrong with the westbound?\"", next:"train"},
     {text:"\"Then buy a horse and stop loitering.\"", end:"offended"}]},
   business:{npc:"I heard a sheriff here lasted eleven days. I heard some other things I'd want a reason to repeat.",
    replies:[
     {text:"\"The reason is the badge. Say it plain.\"", next:"train"},
     {text:"\"I'll take it kindly, and remember who told me.\"", next:"train"},
     {text:"\"Then keep them. I've enough to do.\"", end:"peaceful"},
     {text:"\"Repeat them now or in a cell.\"", end:"offended"}]},
   wary:{npc:"A man can look at a street. There's no law against standing still that I know of.",
    replies:[
     {text:"\"None at all. Stand somewhere I can see you.\"", end:"peaceful"},
     {text:"\"There's none. There's a law about what you're not saying.\"", next:"train"},
     {text:"\"Empty your coat pockets for me.\"", end:"offended"},
     {text:"\"Move.\"", end:"offended"}]},
   prickly:{npc:"You've a hard way with a stranger who's done nothing. That's how the last one started, I'd guess.",
    replies:[
     {text:"\"You're right. Start again — what did you hear?\"", next:"train"},
     {text:"\"The last one is why I'm careful.\"", end:"peaceful"},
     {text:"\"Done nothing yet. I'm early, that's all.\"", action:"delayed"},
     {text:"\"Then we'll see how you finish.\"", action:"draw"}]},
   train:{npc:"…There's men meaning to take the westbound where it slows at the cut. Payroll car. That's all I know and it's more than I should say.",
    replies:[
     {text:"\"Much obliged. Nobody hears it from me.\"", end:"tip"},
     {text:"\"Names.\"", end:"tip_hard"},
     {text:"\"Why tell me at all?\"", end:"tip"},
     {text:"\"If you're in it, say so now.\"", action:"delayed"}]}},
  ends:{
   tip:{text:"He tells it once, quietly, and is gone up the street before you have thanked him twice.",
        flags:["tip_train","depart"], authority:1},
   tip_hard:{text:"He gives you the cut, the hour and no names at all, and makes it clear that is the whole of it.",
        flags:["tip_train"], authority:0},
   peaceful:{text:"He touches his hat and goes on up the boardwalk, and the street closes behind him.",
        flags:["depart"], authority:0},
   offended:{text:"He looks at you the way a man looks at weather, and walks away without another word.",
        flags:["depart","offended"], authority:-1}}},

 /* 2 ---------------------------------------------------------------- */
 {id:"rose", name:"Miss Rose", place:"SALOON", theme:"th_rose",
  armed:false, arrive:["piano","bottle"],
  rounds:{
   opening:{npc:"Well. The badge came in for a drink at last. Sit where I can see you, Sheriff — it's the only view worth having.",
    replies:[
     {text:"\"Coffee, if the pot's honest.\"", next:"easy"},
     {text:"\"Who's been drinking here that shouldn't be?\"", next:"askers"},
     {text:"\"You see everyone who comes through that door.\"", next:"askers"},
     {text:"\"I'm working, Miss Rose.\"", next:"cool"}]},
   easy:{npc:"Honest as anything in this town. Sit long enough and the room will tell you things it wouldn't tell a stranger.",
    replies:[
     {text:"\"Then I'll sit. What's the room saying?\"", next:"stage"},
     {text:"\"You could tell me quicker.\"", next:"stage"},
     {text:"\"I'd rather hear what you think.\"", next:"warm"},
     {text:"\"I haven't the afternoon.\"", end:"ordinary"}]},
   askers:{npc:"Two men, three nights, one table. They asked what day the coach runs heavy. I told them I pour whiskey, not timetables.",
    replies:[
     {text:"\"Did they take that for an answer?\"", next:"stage"},
     {text:"\"You told them right. What else?\"", next:"stage"},
     {text:"\"Describe them.\"", next:"stage"},
     {text:"\"And you waited until now to mention it?\"", end:"ordinary"}]},
   cool:{npc:"Everybody's working. I've been working since five and I'll be working when you're asleep with your boots on.",
    replies:[
     {text:"\"Fair. Start again — sit with me a minute.\"", next:"warm"},
     {text:"\"Then work, and tell me what you've seen.\"", next:"stage"},
     {text:"\"I'll come back when there's less noise.\"", end:"ordinary"},
     {text:"\"Mind your tone with the law.\"", end:"cold"}]},
   warm:{npc:"You're better company than the badge suggested. There's a supper at the hotel Saturday, and nobody has asked me to it.",
    replies:[
     {text:"\"Then nobody has any sense. Saturday.\"", end:"date"},
     {text:"\"Saturday, if the town lets me.\"", end:"date"},
     {text:"\"Ask me again when the streets are quiet.\"", end:"ordinary"},
     {text:"\"I don't keep company in this town.\"", end:"cold"}]},
   stage:{npc:"Thursday's coach carries the mine's money. They knew that before they asked. Whoever told them drinks here too.",
    replies:[
     {text:"\"Thursday. I'm obliged to you.\"", end:"tip"},
     {text:"\"Point him out when he comes in.\"", end:"tip"},
     {text:"\"Anything else about Thursday?\"", end:"tip"},
     {text:"\"Keep your voice down and keep pouring.\"", end:"ordinary"}]}},
  ends:{
   tip:{text:"She wipes the bar where it is already clean, and says Thursday once more, quietly, in case you missed it.",
        flags:["tip_stage"], authority:1},
   date:{text:"\"Saturday,\" she says, and goes back down the bar with the particular walk of a woman who has won something.",
        flags:["date"], authority:1},
   ordinary:{text:"She nods, unsurprised, and the saloon closes over the conversation like water.",
        flags:["depart"], authority:0},
   cold:{text:"She turns to the next man at the bar and does not turn back.",
        flags:["depart","offended"], authority:-1}}},

 /* 3 ---------------------------------------------------------------- */
 {id:"kid", name:"The Mexicali Kid", place:"STREET", theme:"th_kid",
  armed:true, arrive:["hooves","spurs"],
  rounds:{
   opening:{npc:"They're offering four hundred dollars for me two counties over, Sheriff. I came to see what you'd offer.",
    replies:[
     {text:"\"A cell, three meals, and a judge in the spring.\"", next:"terms"},
     {text:"\"Four hundred says somebody wants you badly.\"", next:"talk"},
     {text:"\"Take your hand away from your belt first.\"", next:"belt"},
     {text:"\"I'll offer what you're standing on.\"", action:"draw"}]},
   terms:{npc:"A judge. In the spring. And between now and the spring I'd be in that little room of yours with the one window.",
    replies:[
     {text:"\"It's a poor room. It's better than the alternative.\"", next:"yield"},
     {text:"\"You'd be alive in it.\"", next:"yield"},
     {text:"\"Walk in on your own and I'll say so to the judge.\"", next:"yield"},
     {text:"\"Or you can try the street. Your choice.\"", action:"draw"}]},
   talk:{npc:"Wanting and having are two horses, Sheriff. Nobody has ever had me.",
    replies:[
     {text:"\"There's a first day for everything.\"", next:"yield"},
     {text:"\"Then ride on before somebody tries.\"", next:"leave"},
     {text:"\"Four hundred buys a lot of men willing to try.\"", next:"leave"},
     {text:"\"Today's the day, Kid.\"", action:"draw"}]},
   belt:{npc:"My hand is where my hand lives. You're the one who keeps looking at it.",
    replies:[
     {text:"\"Then we'll both look somewhere else.\"", next:"leave"},
     {text:"\"Move it, slowly, and we'll talk about the spring.\"", next:"yield"},
     {text:"\"You came a long way to be careful.\"", next:"leave"},
     {text:"\"Move it or use it.\"", action:"draw"}]},
   leave:{npc:"Ride on. That's the first sensible thing said to me in this county.",
    replies:[
     {text:"\"Then take it and go.\"", action:"depart"},
     {text:"\"Go south. Don't come back through here.\"", action:"depart"},
     {text:"\"Go — but the four hundred rides with you.\"", action:"delayed"},
     {text:"\"You'll go in irons or not at all.\"", action:"draw"}]},
   yield:{npc:"…The spring, then. On your word, Sheriff, and your word had better be worth the ride.",
    replies:[
     {text:"\"It is. Hands where I can see them.\"", action:"surrender"},
     {text:"\"You have it. Walk ahead of me.\"", action:"surrender"},
     {text:"\"My word, and the judge's mercy after.\"", action:"surrender"},
     {text:"\"My word is a cell. Nothing after it.\"", action:"draw"}]}},
  ends:{}},

 /* 4 ---------------------------------------------------------------- */
 {id:"doctor", name:"The Doctor", place:"DOCTOR", theme:"th_doctor",
  armed:false, arrive:["crowd"], doctor:true, roots:["opening","opening_drunk"],
  rounds:{
   /* Which of the two he opens with is settled at dawn, not by the player. */
   opening_drunk:{npc:"Sheriff. I have had a night of it and a bottle after the night, and I am ashamed of neither. Ask me what you like, but ask it slowly.",
    replies:[
     {text:"\"Then sit down and take the coffee instead.\"", next:"coffee"},
     {text:"\"Slowly, then. What have you heard this week?\"", next:"listen"},
     {text:"\"You're the only doctor in sixty miles, Doc.\"", next:"coffee"},
     {text:"\"A drunk doctor is no doctor at all.\"", next:"sour"}]},
   coffee:{npc:"…The pot is on the stove and it is yesterday's. You would have to pour it yourself and stand over me while I drank it, and you have a street to walk.",
    replies:[
     {text:"\"The street will keep. Drink it.\"", end:"sobered"},
     {text:"\"I'll pour, and stand here till it's gone.\"", end:"sobered"},
     {text:"\"Drink it or don't. I've said my piece.\"", end:"still_drinking"},
     {text:"\"Sleep it off. Try to be useful by dark.\"", end:"insulted"}]},
   opening:{npc:"Sheriff. I dug a ball out of a freighter's shoulder at four this morning and I'd like to know whether I'll be doing it again tonight.",
    replies:[
     {text:"\"Not if the day goes the way I mean it to.\"", next:"civil"},
     {text:"\"You hear things in that surgery. What have you heard?\"", next:"listen"},
     {text:"\"That depends on who walks up this street.\"", next:"civil"},
     {text:"\"Doctors bury opinions with the patients, Doc.\"", next:"sour"}]},
   civil:{npc:"Then we understand each other. I've no objection to the law. I object to sewing up what it leaves behind.",
    replies:[
     {text:"\"So do I. I'd rather arrest than shoot.\"", next:"listen"},
     {text:"\"Keep your kit ready anyway.\"", next:"listen"},
     {text:"\"You'd rather I let men walk?\"", end:"grudging"},
     {text:"\"Stick to your trade and I'll keep to mine.\"", end:"insulted"}]},
   listen:{npc:"A man under laudanum says what he wouldn't say sober. One of them said a good deal about the bank's back wall.",
    replies:[
     {text:"\"Go on. I'll keep his name out of it.\"", end:"bank"},
     {text:"\"When was this?\"", end:"bank"},
     {text:"\"That's worth knowing. Thank you.\"", end:"bank"},
     {text:"\"You should have come to me at four this morning.\"", end:"grudging"}]},
   sour:{npc:"My trade is what's left of men like you when the day is over. I'd remember that, if I were the one wearing the star.",
    replies:[
     {text:"\"You're right, and I'm sorry for it. Say your piece.\"", next:"listen"},
     {text:"\"I'll remember. I'd still take a warning if you have one.\"", next:"listen"},
     {text:"\"Remember it yourself. I've a street to walk.\"", end:"insulted"},
     {text:"\"Keep your sermon for the ones who don't make it.\"", end:"insulted"}]}},
  ends:{
   bank:{text:"He tells you the hour and the wall, and then goes back inside to boil his instruments, which is his way of ending a conversation.",
         flags:["tip_bank","doctor_civil"], authority:1},
   grudging:{text:"\"At four this morning I had my hands inside a man,\" he says, and shuts the door. He will still come if you are shot, but he will not hurry.",
         flags:["tip_bank"], authority:0},
   insulted:{text:"\"Then don't send for me,\" he says, loud enough for the street. Several people hear him say it.",
         flags:["doctor_insulted","offended"], authority:-1},
   sobered:{text:"He drinks it scalding, twice, and by the second cup his hands have stopped and he is looking at you like a man again.",
         flags:["doctor_sober","doctor_civil"], authority:1},
   still_drinking:{text:"He puts the cork back in the bottle and sets it where he can reach it, which is the whole of his answer.",
         flags:[], authority:0}}},

 /* 5 ---------------------------------------------------------------- */
 {id:"shotgun", name:"Dude with a New Gun", place:"STREET", theme:"th_shotgun",
  armed:true, arrive:["spurs","crowd"],
  rounds:{
   opening:{npc:"Look at it, Sheriff. Forty dollars in Kansas City and it come out of the crate oiled. You'll not see another like it this side of the river.",
    replies:[
     {text:"\"That's a handsome piece of work. Mind the hammer.\"", next:"admire"},
     {text:"\"Forty dollars is a deal of money for a man to be carrying.\"", next:"money"},
     {text:"\"Put it back in the leather while we talk.\"", next:"order"},
     {text:"\"A new gun and an old habit. Which one brought you here?\"", next:"probe"}]},
   admire:{npc:"You know guns, then. Most men see a gun and see trouble coming. I see forty dollars of Kansas City work and a thing that fits my hand.",
    replies:[
     {text:"\"I see both. Keep it pointed at the dirt.\"", next:"intent"},
     {text:"\"Where does a man your age come by forty dollars?\"", next:"intent"},
     {text:"\"Show me how it sits in the holster.\"", end:"holstered"},
     {text:"\"Sell it before somebody makes you use it.\"", next:"proud"}]},
   money:{npc:"I had a piece of work up in Ellsworth. Honest, most of it. The part that wasn't is not written down anywhere a man could go and read it.",
    replies:[
     {text:"\"Then we'll leave it unwritten. Mind how you go.\"", end:"holstered"},
     {text:"\"Tell me the part that wasn't.\"", next:"intent"},
     {text:"\"Nothing stays unwritten. Hand me the gun.\"", next:"proud"},
     {text:"\"Ellsworth. I'll wire them tonight.\"", action:"delayed"}]},
   order:{npc:"It's in my hand because it's mine. You'd be the first man in this town to tell me where to keep my own property, and I've been here a week.",
    replies:[
     {text:"\"Then hold it and listen. Nobody's taking it.\"", next:"intent"},
     {text:"\"I'll be the first and the last. Holster it.\"", next:"proud"},
     {text:"\"Your property. My street.\"", next:"proud"},
     {text:"\"Holster it or lose the hand.\"", action:"draw"}]},
   probe:{npc:"Habits. Every man's got habits. Mine is shooting bottles off the corral rail of an evening, and there is no law in this territory about bottles.",
    replies:[
     {text:"\"There isn't. Shoot bottles and we'll stay friends.\"", end:"holstered"},
     {text:"\"Bottles don't cost forty dollars. What does?\"", next:"intent"},
     {text:"\"There's a law about what comes after bottles.\"", next:"intent"},
     {text:"\"Shoot one now and I'll show you the law.\"", action:"ambush"}]},
   proud:{npc:"You've a way of speaking to a man that gets a town a new sheriff every spring. I'll put it away when I am done looking at it and not before.",
    replies:[
     {text:"\"Look at it, then. I'll wait.\"", end:"holstered"},
     {text:"\"Last spring's sheriff. What became of him?\"", end:"warned"},
     {text:"\"You're done. Set it on the rail.\"", action:"surrender"},
     {text:"\"You'll put it away now or in the dust.\"", action:"draw"}]},
   intent:{npc:"…All right. A man at the livery says the bank's takings go out Friday in a flour sack. I only wanted to know if a sheriff would be watching.",
    replies:[
     {text:"\"Now I am. Set the gun down and walk to the jail.\"", action:"surrender"},
     {text:"\"Who is the man at the livery?\"", end:"tip"},
     {text:"\"You've told me. Go home and stay there.\"", end:"warned"},
     {text:"\"You wanted to know. Now you do.\"", action:"draw"}]}},
  ends:{
   holstered:{text:"He turns it over once more, the way a man does with a thing he has paid too much for, and puts it away.",
        flags:["depart"], authority:1},
   tip:{text:"He gives the name at the livery and the day with it, and looks like a man who has set down something heavy.",
        flags:["tip_bank","depart"], authority:1},
   warned:{text:"He goes, and not toward the livery, and the new gun stays in the leather the whole length of the street.",
        flags:["depart"], authority:0}}},

 /* 6 ---------------------------------------------------------------- */
 {id:"willie", name:"Little Willy", place:"STREET", theme:"th_willie",
  armed:false, arrive:["crowd"],
  rounds:{
   opening:{npc:"Sheriff! I ain't supposed to be up this end of town and I ain't supposed to tell you neither, so you can't say it was me that said it.",
    replies:[
     {text:"\"Nobody hears it from me, Willy. Sit on the rail.\"", next:"kind"},
     {text:"\"What's it worth, then? I've a nickel says a nickel.\"", next:"deal"},
     {text:"\"Say it quick, then. I've a street to walk.\"", next:"brisk"},
     {text:"\"If you've done something, say so now.\"", next:"stern"}]},
   kind:{npc:"You're the only one calls me Willy instead of boy. Ma says a sheriff's got no time for boys. You've got some, though, ain't you.",
    replies:[
     {text:"\"As much as this takes. Go on.\"", next:"secret"},
     {text:"\"I've time for anybody who saw something.\"", next:"secret"},
     {text:"\"Not much of it. What did you see?\"", next:"clam"},
     {text:"\"Then don't waste it. Out with it.\"", next:"clam"}]},
   deal:{npc:"A nickel! Mister Hanley gives a nickel for sweeping out the whole store. A secret's got to be worth more than sweeping a store.",
    replies:[
     {text:"\"It is. Tell it and we'll settle after.\"", next:"secret"},
     {text:"\"Two bits if it's true and if it's mine first.\"", next:"secret"},
     {text:"\"You don't sell what you know to the law, Willy.\"", next:"clam"},
     {text:"\"I don't buy from boys. Go home.\"", end:"sent"}]},
   brisk:{npc:"I can say it fast. I only want to know first whether I'm saying it to the sheriff or to the man who drinks coffee with my ma of a Sunday.",
    replies:[
     {text:"\"To the sheriff. Your ma hears nothing.\"", next:"secret"},
     {text:"\"To both, and neither of them tells.\"", next:"secret"},
     {text:"\"To the sheriff. That's the only one here today.\"", next:"clam"},
     {text:"\"You're saying it to a man in a hurry.\"", next:"clam"}]},
   stern:{npc:"I ain't done nothing! I only saw a thing. Seeing ain't doing. Ma says seeing ain't doing and she says it about you as well.",
    replies:[
     {text:"\"Your ma's right and I'm sorry. What did you see?\"", next:"secret"},
     {text:"\"Seeing isn't doing. Telling isn't either. Go on.\"", next:"secret"},
     {text:"\"Then seeing is what I want. Quickly.\"", next:"clam"},
     {text:"\"Boys who see things get shot at. Home.\"", end:"scared"}]},
   secret:{npc:"Two men been out back of the bank with a rope, measuring along the wall. They gave me a nickel not to say and I already spent it on liquorice.",
    replies:[
     {text:"\"Then it's paid for already. You did right, Willy.\"", end:"tip"},
     {text:"\"Measuring with a rope. What day was that?\"", end:"tip"},
     {text:"\"You keep the liquorice. I'll keep the rope.\"", end:"tip"},
     {text:"\"You took their money? Get home.\"", end:"scared"}]},
   clam:{npc:"…No. I promised. A promise is a promise even when it's a bad one, Ma says. Ask me something else and I'll answer that.",
    replies:[
     {text:"\"Then keep it. That's a fair thing to do.\"", end:"kept"},
     {text:"\"Come and find me when it stops being a promise.\"", end:"kept"},
     {text:"\"Promises don't hold against the law, son.\"", end:"kept"},
     {text:"\"You'll say it now or say it in the jail.\"", end:"scared"}]}},
  ends:{
   tip:{text:"He tells it in one breath and then again slower, in case the first time was too fast, and runs for the corner before you can thank him.",
        flags:["tip_bank","depart"], authority:1},
   kept:{text:"He goes off up the boardwalk with it still in him, walking slowly, hoping the whole way to be called back.",
        flags:["depart"], authority:0},
   sent:{text:"He shrugs the way a boy shrugs when he has decided not to mind, and goes back down toward the store.",
        flags:["depart"], authority:0},
   scared:{text:"He runs. Two women outside the milliner's watch him go, and then look at you for rather a long time.",
        flags:["depart","offended"], authority:-1}}},

 /* 7 ---------------------------------------------------------------- */
 {id:"april", name:"Miss April", place:"SCHOOL", theme:"th_april",
  armed:false, arrive:["crowd"],
  rounds:{
   opening:{npc:"Sheriff. The children have been at the window all morning saying the new sheriff would be shot before dinner. I told them that was not arithmetic.",
    replies:[
     {text:"\"Nor is it manners. What are they learning instead?\"", next:"warm"},
     {text:"\"They may be better at it than arithmetic. What have they seen?\"", next:"seen"},
     {text:"\"Keep them at the window. They see more than I do.\"", next:"seen"},
     {text:"\"Then teach them to mind their own business.\"", next:"cool"}]},
   warm:{npc:"Long division, and not gracefully. It is a quiet post. A woman may go a month here without being asked a single question worth answering.",
    replies:[
     {text:"\"Then ask me one. I'll try to be worth it.\"", next:"supper"},
     {text:"\"I'll ask you one a day if it helps.\"", next:"supper"},
     {text:"\"Ask the window, then. What does it show?\"", next:"window"},
     {text:"\"Quiet is what I'm paid for, ma'am.\"", end:"ordinary"}]},
   seen:{npc:"The schoolhouse looks down the grade to where the westbound slows. The children count the cars. Lately they have been counting men instead.",
    replies:[
     {text:"\"Men. Where, and how many?\"", next:"window"},
     {text:"\"Children count better than deputies. Go on.\"", next:"window"},
     {text:"\"Keep them counting. I'll come back at four.\"", next:"supper"},
     {text:"\"Children imagine. Don't bring me imagining.\"", end:"alienated"}]},
   cool:{npc:"I have taught in three towns, Sheriff, and been told to mind my business in every one of them. It has never once been good advice.",
    replies:[
     {text:"\"It wasn't this time either. I'm sorry — go on.\"", next:"window"},
     {text:"\"Then give me yours instead of minding it.\"", next:"window"},
     {text:"\"In this town it is the only advice I have.\"", end:"ordinary"},
     {text:"\"Three towns, and not one of them kept you.\"", end:"alienated"}]},
   supper:{npc:"There is a supper at the hotel on Saturday. I have been asked twice already by men I do not care for, and I am running out of ways to say no.",
    replies:[
     {text:"\"Then say yes to one you haven't met properly.\"", end:"date"},
     {text:"\"Say no again and let me ask you on Sunday.\"", end:"date"},
     {text:"\"I'd take you, if the town lets me. It may not.\"", end:"date"},
     {text:"\"I'd stay clear of hotel suppers this week.\"", end:"ordinary"}]},
   window:{npc:"Four men, three mornings, at the cut where the grade slows the westbound. They were not counting cars. One of them had a rifle rolled in a blanket.",
    replies:[
     {text:"\"At the cut. That's a day's work you've done.\"", end:"tip"},
     {text:"\"Keep the children inside tomorrow morning.\"", end:"tip"},
     {text:"\"A rifle in a blanket. Anything else?\"", end:"tip"},
     {text:"\"Four men and a blanket is not evidence.\"", end:"alienated"}]}},
  ends:{
   tip:{text:"She writes the hour on a slate in a clear hand, turns it round for you to read, and wipes it off again with her sleeve.",
        flags:["tip_train"], authority:1},
   date:{text:"\"Saturday,\" she says, and goes back in to the long division with something in her step that was not there before.",
        flags:["date"], authority:1},
   ordinary:{text:"She closes the schoolhouse door quietly, which somehow says a great deal more than slamming it would have.",
        flags:["depart"], authority:0},
   alienated:{text:"\"Good day, Sheriff,\" she says, in the voice she keeps for boys who have not done the work.",
        flags:["depart","offended"], authority:-1}}},

 /* 8 ---------------------------------------------------------------- */
 {id:"gambler", name:"The Gambler", place:"SALOON", theme:"th_gambler",
  armed:true, arrive:["piano","crowd"],
  rounds:{
   opening:{npc:"Sheriff. Sit in. Four hands teaches a man more about a town than a year of asking questions, and I have learned that nobody here can bluff.",
    replies:[
     {text:"\"I don't play. I'll watch a hand.\"", next:"watch"},
     {text:"\"Show me the deck you've been learning with.\"", next:"deck"},
     {text:"\"Stand up and turn out your sleeves.\"", next:"sleeves"},
     {text:"\"You've cleaned out two freighters this week. Out.\"", next:"hard"}]},
   watch:{npc:"Watch, then. It is an honest game with honest men and I have had honest luck for eleven nights running, which is a thing that happens.",
    replies:[
     {text:"\"Eleven nights is a deal of luck for one man.\"", next:"caught"},
     {text:"\"Deal one hand face up and I'll believe you.\"", next:"caught"},
     {text:"\"Enjoy the twelfth somewhere else.\"", next:"leave"},
     {text:"\"Luck like that gets a man buried, not rich.\"", next:"leave"}]},
   deck:{npc:"It is the house's deck. Ask the man behind the bar. I have not carried my own cards since Natchez, and Natchez was a misunderstanding.",
    replies:[
     {text:"\"Natchez. Tell me about the misunderstanding.\"", next:"caught"},
     {text:"\"Then you'll not mind me cutting it.\"", next:"caught"},
     {text:"\"That's a long way to come for a misunderstanding.\"", next:"leave"},
     {text:"\"Hand it here, house deck or not.\"", next:"caught"}]},
   sleeves:{npc:"…I will stand. I will not turn out anything in front of six men who owe me money. You can see the difficulty in it, Sheriff.",
    replies:[
     {text:"\"Then step outside and turn them out there.\"", next:"caught"},
     {text:"\"I can. Outside, or here in front of all of them.\"", next:"caught"},
     {text:"\"I see six men who'd like their money back.\"", next:"leave"},
     {text:"\"Turn them out or I'll turn them out for you.\"", action:"draw"}]},
   hard:{npc:"Two freighters who could not count. That is not cheating, that is arithmetic, and there is no statute against arithmetic in this territory.",
    replies:[
     {text:"\"There's one against what's up your left cuff.\"", next:"caught"},
     {text:"\"Give them back their wages and we're square.\"", next:"leave"},

   caught:{npc:"…A holdout clip. Well. Eleven good nights. What is it precisely that you would like me to do about it now, Sheriff?",

 /* 9 ---------------------------------------------------------------- */
 {id:"deputy", name:"The Deputy", place:"JAIL", theme:"th_deputy",
  armed:true, arrive:["hooves"],
  rounds:{
   opening:{npc:"Sheriff! There's men at the bank. There was. I run the whole way from the corner and now I ain't certain what I saw, but I'm certain I saw it.",
    replies:[
     {text:"\"Slow down. Tell it in the order it happened.\"", next:"order"},
     {text:"\"How many, and were they mounted?\"", next:"count"},
     {text:"\"You're certain or you're not. Which is it?\"", next:"press"},
     {text:"\"You've been certain twice this week already.\"", next:"sting"}]},
   order:{npc:"I come round by the assay office and there was two horses stood at the bank's back wall with nobody holding them. Horses don't stand like that.",
    replies:[
     {text:"\"No, they don't. Go on — what else?\"", next:"confirm"},
     {text:"\"Two horses. Anything in the alley?\"", next:"confirm"},
     {text:"\"Horses stand where they're tied, Deputy.\"", next:"doubt"},
     {text:"\"You ran all this way to tell me about horses.\"", next:"doubt"}]},
   count:{npc:"Two. Maybe three. Mounted — no, stood, and one up on the boardwalk in a coat that was wrong for the weather we're having.",
    replies:[
     {text:"\"A coat wrong for the weather is worth the run.\"", next:"confirm"},
     {text:"\"Three men and a heavy coat. Where's your gun?\"", next:"confirm"},
     {text:"\"Two, maybe three. That is not a report.\"", next:"doubt"},
     {text:"\"Come back when the number stops moving.\"", next:"doubt"}]},
   press:{npc:"…Certain. I am certain. I'd not have run if I wasn't and I'd not be stood here letting you look at me like that either.",
    replies:[
     {text:"\"Then I'm certain too. Get the shotgun.\"", next:"confirm"},
     {text:"\"Good man. Tell me the rest as we walk.\"", next:"confirm"},
     {text:"\"You've been certain about a deal of things.\"", next:"doubt"},
     {text:"\"Looking at you is all I've done. Try being right.\"", next:"doubt"}]},
   sting:{npc:"Twice, and both times you went and both times it was nothing, and you have not let me forget either of them. This one is not nothing.",
    replies:[
     {text:"\"Then this is the one that counts. Show me.\"", next:"confirm"},
     {text:"\"You're right. I've been hard on you. Go on.\"", next:"confirm"},
     {text:"\"Third time pays for all, they say. Prove it.\"", next:"doubt"},
     {text:"\"Three for three, then. Sit down, Deputy.\"", next:"doubt"}]},
   confirm:{npc:"Back wall, two horses, and the coat. If you want me at the front I'll take the front, and if you want me nowhere I'll take that too.",
    replies:[
     {text:"\"Take the front. I'll come round the back.\"", end:"ready"},
     {text:"\"You've done well. Get the shotgun and follow.\"", end:"ready"},
     {text:"\"Nowhere. Stay here and mind the jail.\"", end:"alone"},
     {text:"\"You'll take the back, and you'll go first.\"", end:"pushed"}]},
   doubt:{npc:"…All right. All right, Sheriff. Maybe it was horses. I'll go back by the corner and look again, and I'll not run this time.",
    replies:[
     {text:"\"Look again. Come straight to me either way.\"", end:"ready"},
     {text:"\"No. We'll both look, and we'll look now.\"", end:"ready"},
     {text:"\"Do that. And Deputy — walk, don't run.\"", end:"dismissed"},
     {text:"\"Don't trouble. Mind the jail and let me work.\"", end:"dismissed"}]}},
  ends:{
   ready:{text:"He is out of the door before you are, and for once in the day you are following a man who knows where he is going.",
        flags:["tip_bank"], authority:1},
   alone:{text:"He takes the keys and the chair by the stove, and does not look up when you go out.",
        flags:["tip_bank"], authority:0},
   pushed:{text:"He goes where he is sent, white about the mouth, and the men on the boardwalk watch him being sent.",
        flags:["tip_bank","offended"], authority:-1},
   dismissed:{text:"He hangs his hat back on the nail and says nothing at all, which from him is a great deal.",
        flags:["depart"], authority:-1}}},

 /* 10 --------------------------------------------------------------- */
 {id:"belle", name:"Belle", place:"CORRAL", theme:"th_belle",
  armed:true, arrive:["hooves"],
  rounds:{
   opening:{npc:"You'll be wanting the two steers with the Bar-K burn on them. They're in my corral and I'll not pretend they walked in there by themselves.",
    replies:[
     {text:"\"You'll not pretend. That's a start. Why are they there?\"", next:"why"},
     {text:"\"Then they can walk out again, and you with them.\"", next:"out"},
     {text:"\"Whose iron did the second burn, Belle?\"", next:"iron"},
     {text:"\"Two steers is a rope in this territory.\"", next:"rope"}]},
   why:{npc:"Because Kinch at the Bar-K runs his stock over my water and calls it open range. I took two. He has taken my water for three years running.",
    replies:[
     {text:"\"Three years is a grievance, not a defence.\"", next:"square"},
     {text:"\"Then we'll take it to the judge, water and all.\"", next:"square"},
     {text:"\"Drive them back tonight and I'll speak for you.\"", next:"turn"},
     {text:"\"He'll get the judge and you'll get the rope.\"", next:"square"}]},
   out:{npc:"They can. I'll walk them back myself at first light and Kinch can count them twice. It is what I meant to do before you came up the hill.",
    replies:[
     {text:"\"Then I'll ride out and watch him count.\"", next:"turn"},
     {text:"\"First light. I'll be here at first light.\"", next:"turn"},
     {text:"\"You'll walk them back now, and I'll follow.\"", next:"square"},
     {text:"\"You meant nothing of the kind.\"", next:"square"}]},
   iron:{npc:"Mine. I burned it over his and I made a poor job of it, which you can see from where you are stood, and I did not much care that you could.",
    replies:[
     {text:"\"A poor job and an honest answer. Sit down.\"", next:"turn"},
     {text:"\"You cared, or you'd not have said it that way.\"", next:"turn"},
     {text:"\"Then come down to the jail and say it again.\"", next:"square"},
     {text:"\"Careless and a thief. Hands where I see them.\"", next:"square"}]},
   rope:{npc:"It is. It's a rope for a man as well. You'll notice nobody has hung Kinch over the water, and nobody in this county is going to.",
    replies:[
     {text:"\"Nobody's hanging anybody today. Talk to me.\"", next:"turn"},
     {text:"\"Then let me be the first to ask him about it.\"", next:"turn"},
     {text:"\"Kinch isn't stood in front of me. You are.\"", next:"square"},
     {text:"\"Keep talking and we'll see about the rope.\"", action:"draw"}]},
   square:{npc:"…So it's the jail. Say it straight out, Sheriff, and let me fetch my coat. I would rather that than be talked round to it by degrees.",
    replies:[
     {text:"\"It's the jail, and I'll speak to the judge for you.\"", action:"surrender"},
     {text:"\"Fetch it. The water goes in the record too.\"", action:"surrender"},
     {text:"\"No jail. Drive them back and we never spoke.\"", action:"depart"},
     {text:"\"Fetch your coat, and be quick about it.\"", action:"delayed"}]},
   turn:{npc:"You are the first man off that road in three years to say a thing to me that was not about cattle. There is a dance at the grange on Saturday.",
    replies:[
     {text:"\"Then I'll come up the road again Saturday.\"", end:"date"},
     {text:"\"Saturday, and I'll not mention cattle once.\"", end:"date"},
     {text:"\"Drive them back first. Then ask me again.\"", end:"steers"},
     {text:"\"I came about the steers, Belle. Only the steers.\"", end:"steers"}]}},
  ends:{
   date:{text:"She whistles the dog off the gate and walks you as far as the road, which is further than she has walked anybody in three years.",
        flags:["date"], authority:1},
   steers:{text:"She drives them back at first light, Kinch counts them twice, and she does not look at you once the whole way down.",
        flags:["depart"], authority:1}}},

  rounds:{}, ends:{}}

const written=e=>!!(e.rounds&&e.rounds.opening);

/* ============ the pixel grid ============
 * A 320x200 logical screen, presented in 4:3 the way a C64 was. The sheriff
 * stands in the left foreground, seen from behind and drawn in the largest
 * blocks on the screen; the visitor stands deeper in the street, smaller and
 * finer. The hitboxes are read off the visitor's own grid, so what the
 * crosshair is over is what the bullet finds, for every one of them.
 */
const SCENE={w:320,h:200};
const CELL=2;                            // the block the street furniture is built on

/* ============ the eleven figures ============
 * Each caller is his own 24x20 grid, painted two scene-pixels to a cell with a
 * one-pixel dark contour round the silhouette. No two share a grid: the hats,
 * the coat length, the skirt, the boy's height and the gambler's tails are what
 * tell them apart at this size, not the colours.
 *   . nothing  H hat   R hair  F face  E eye     C coat   K coat shadow
 *   W linen    L legs and skirts       A skin    G gunmetal
 *   B dark (belts, boots, bags)        S star    P prop (bag, slate, cards, rope)
 * `raise` is the sparse overlay for the hand coming up, and `box` gives the
 * cells the bullet has to find: torso, weapon at rest, weapon raised.        */
/* A caller is 24 pixels across and 28 cells tall drawn two pixels to the row:
 * 24 by 56 on the screen, the proportions a man has at this distance rather
 * than the squat block a square cell gave. */

/* ===== engine.js ===== */
/* ============ engine ============
 * The day, the trees, the gun and the reckoning. No DOM, no words.
 *   intro -> approach -> dialogue -> aiming -> tell -> duel -> resolve
 *         -> interlude -> summary
 * Everything random goes through G.rng so a test can seed it.
 */
"use strict";

const RULES={
  ROUNDS:3,
  TELL_MIN:400, TELL_MAX:900,
  TELLS:{ambush:[120,260], delayed:[300,620], draw:[380,820]},
  FIRE_MIN:260, FIRE_MAX:420,
  REFLEX_MIN:1500, REFLEX_MAX:2600,
  AIM_STEP:0.02, AIM_FLOOR:120, AIM_CEIL:500,
  SIGMA_WIDE:0.95, SIGMA_TIGHT:0.42,
  ZONE_TIGHT:0.30, ZONE_WIDE:0.62,
  WOUNDS:2
};
/* Where each job falls in the day. Every job sits after the callers who could
 * have warned about it: the stage after Rose, the train after Miss April, the
 * bank after the Doctor, the new gun, Willy and the Deputy. */
const INTERLUDES=[{after:4,job:"stage"},{after:8,job:"train"},{after:10,job:"bank"}];

const mulberry32=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
const rnd=(g,a,b)=>a+(b-a)*g.rng();
function absNormal(g,sigma){
  const u=Math.max(1e-9,g.rng()), v=g.rng();
  return Math.abs(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))*sigma;
}

function rawDay(opts){
  const seed=opts&&opts.seed;
  return {
    phase:"intro", encounter:0, node:"opening", round:1,
    rng:seed==null?Math.random:mulberry32(seed),
    alive:true, wounds:0,
    authority:0, arrests:0, dates:0, badGuysShot:0, innocentsKilled:0, crimesMissed:0,
    tips:{train:false,stage:false,bank:false},
    doctor:{met:false,disposition:0,sober:true,alive:true},
    met:[], flags:[], log:[], results:[],
    mode:"talk", aim:{x:0.5,y:0.5}, reflex:null, pending:null,
    duel:null, tell:null, outcome:null, ending:null, interlude:null, over:null
  };
}
/* Whether the doctor has been up all night with a bottle is settled before the
 * day starts, not by anything the sheriff does; what he does about it is his. */
function newDay(opts){const G=rawDay(opts); G.doctor.sober=G.rng()>=0.3; return G;}
const newGame=newDay;                      // the page calls it this
/* During a robbery the man in front of the sheriff is the robber, not the next
 * caller, and every rule below reads him through the same accessor. */
const who=G=>(G.interlude?JOBS[G.interlude]:CAST[G.encounter])||null;
const nodeOf=G=>{const e=who(G);return e&&e.rounds?e.rounds[G.node]:null;};

/* ---- arrival and conversation ---- */
function beginEncounter(G){
  const e=who(G);
  if(!e)return finish(G,"dusk");
  G.phase="approach"; G.round=1;
  G.node=(e.doctor&&!G.doctor.sober&&e.rounds.opening_drunk)?"opening_drunk":"opening";
  G.outcome=null; G.ending=null; G.duel=null; G.tell=null;
  G.mode="talk"; G.reflex=null; G.aim={x:0.5,y:0.5};
  if(e.doctor)G.doctor.met=true;
  if(!G.met.includes(e.id))G.met.push(e.id);
  return e;
}
function openDialogue(G){
  const e=who(G);
  if(!e)return finish(G,"dusk");
  if(e.forcedDuel)return theyDraw(G,"draw");           // the last one never talks
  if(!written(e))return resolve(G,"unwritten");
  G.phase="dialogue"; return nodeOf(G);
}
/* One of four replies. Each either goes a round deeper, ends the encounter,
 * or is answered with a hand rather than a sentence. */
function say(G,index){
  if(G.phase!=="dialogue")return null;
  const n=nodeOf(G); if(!n)return null;
  const reply=n.replies[index]; if(!reply)return null;
  if(reply.action)return act(G,reply.action);
  if(reply.end)return terminal(G,reply.end);
  if(reply.next){
    G.node=reply.next; G.round++;
    if(G.round>RULES.ROUNDS)return terminal(G,Object.keys(who(G).ends)[0]);
    return {next:nodeOf(G)};
  }
  return null;
}
function act(G,kind){
  if(kind==="draw")return theyDraw(G,"draw");
  if(kind==="ambush")return theyDraw(G,"ambush");
  if(kind==="delayed"){G.pending="delayed";return resolve(G,"turns_away");}
  if(kind==="surrender"){
    G.arrests++; G.authority+=1; G.flags.push("surrender","arrest");
    return resolve(G,"surrendered");
  }
  if(kind==="depart"){G.flags.push("depart");return resolve(G,"departed");}
  return resolve(G,"nothing");
}
function terminal(G,id){
  const e=who(G), t=e.ends&&e.ends[id];
  if(!t)return resolve(G,"nothing");
  G.ending=t;
  for(const f of t.flags||[]){
    G.flags.push(f);
    if(f==="tip_train")G.tips.train=true;
    if(f==="tip_stage")G.tips.stage=true;
    if(f==="tip_bank")G.tips.bank=true;
    if(f==="date")G.dates++;
    if(f==="arrest")G.arrests++;
    if(f==="doctor_civil")G.doctor.disposition+=1;
    if(f==="doctor_insulted")G.doctor.disposition-=2;
    if(f==="doctor_sober")G.doctor.sober=true;
  }
  G.authority+=t.authority||0;
  return resolve(G,id);
}

/* ---- the gun, which is always available ---- */
function drawGun(G,nowMs){
  if(G.mode==="gun")return G.mode;
  G.mode="gun"; G.aim={x:0.5,y:0.5};
  if(G.phase==="dialogue")G.phase="aiming";            // drawing interrupts anything
  G.reflex={at:nowMs||0,limit:Math.round(rnd(G,RULES.REFLEX_MIN,RULES.REFLEX_MAX))};
  return G.mode;
}
function holster(G){
  if(G.mode!=="gun")return G.mode;
  G.mode="talk"; G.reflex=null;
  if(G.phase==="aiming")G.phase="dialogue";
  return G.mode;
}
function moveAim(G,dx,dy){
  if(G.mode!=="gun")return null;
  G.aim.x=Math.max(0,Math.min(1,G.aim.x+dx*RULES.AIM_STEP));
  G.aim.y=Math.max(0,Math.min(1,G.aim.y+dy*RULES.AIM_STEP));
  return G.aim;
}
function tick(G,nowMs){
  if(G.reflex&&nowMs-G.reflex.at>=G.reflex.limit){
    const e=who(G); G.reflex=null;
    if(e&&e.armed)return takeHit(G,"he answered the gun in his face");
    return resolve(G,"walked_away");
  }
  if(G.phase==="tell"&&G.tell&&nowMs-G.tell.at>=G.tell.delay){G.phase="duel";G.duel.drawn=true;}
  if(G.phase==="duel"&&G.duel&&G.duel.drawn&&!G.duel.fired&&G.tell){
    if(nowMs-(G.tell.at+G.tell.delay)>=G.duel.fireDelay){
      G.duel.fired=true; G.duel.result="too_slow";
      return takeHit(G,"outdrawn");
    }
  }
  return null;
}
const inBox=(px,py,b)=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h;
/* Every caller has his own boxes, off his own grid: the boy's are low and the
 * man with the long gun carries his across his chest. */
const weaponBox=G=>{const b=boxesFor(who(G));
  return (G.duel&&(G.duel.drawn||G.duel.initiator==="you"))?b.weaponRaised:b.weapon;};
function boxAt(G,x,y){
  const px=x*SCENE.w, py=y*SCENE.h;
  if(inBox(px,py,weaponBox(G)))return "weapon";
  if(inBox(px,py,boxesFor(who(G)).lethal))return "lethal";
  return null;
}
const boxCentre=b=>({x:(b.x+b.w/2)/SCENE.w,y:(b.y+b.h/2)/SCENE.h});
function aimAt(G,zone){
  G.aim=boxCentre(zone==="arm"?weaponBox(G):boxesFor(who(G)).lethal);
  if(G.duel)G.duel.zone=zone;
  return zone;
}
function theyDraw(G,why){
  const e=who(G);
  const span=RULES.TELLS[why]||[RULES.TELL_MIN,RULES.TELL_MAX];
  G.phase="tell";
  G.tell={at:0,why,delay:Math.round(rnd(G,span[0],span[1]))};
  G.duel={initiator:"them",drawn:false,fired:false,zone:"torso",why,
    fireDelay:Math.round(rnd(G,RULES.FIRE_MIN,RULES.FIRE_MAX)),
    latency:null,error:null,result:null};
  return {tell:G.tell,duel:G.duel};
}
function playerDraws(G){
  const e=who(G);
  G.phase="duel";
  G.duel={initiator:"you",drawn:true,fired:false,zone:"torso",unprovoked:true,
    fireDelay:Math.round(rnd(G,RULES.FIRE_MIN,RULES.FIRE_MAX)),
    latency:null,error:null,result:null};
  return {duel:G.duel};
}
/* Latency and aim are read apart: fast and wide, or slow and shot. */
function shoot(G,latencyMs){
  let d=G.duel, e=who(G);
  // read what the crosshair is over before drawing first changes his pose:
  // the player aimed at the hand on the hip, not at the hand he has not raised
  const box=boxAt(G,G.aim.x,G.aim.y);
  if(!d){playerDraws(G);d=G.duel;}
  if(!d||d.fired)return null;
  d.fired=true; d.latency=latencyMs; G.reflex=null;
  d.zone=box==="weapon"?"arm":(box==="lethal"?"torso":"off");
  const theirShot=(d.initiator==="them"&&G.tell)?G.tell.delay+d.fireDelay:Infinity;
  if(latencyMs>theirShot){d.result="too_slow";return takeHit(G,"outdrawn");}
  if(d.zone==="off"){d.result="miss";return theirReply(G);}
  const q=Math.max(0,Math.min(1,(latencyMs-RULES.AIM_FLOOR)/(RULES.AIM_CEIL-RULES.AIM_FLOOR)));
  const sigma=RULES.SIGMA_WIDE-(RULES.SIGMA_WIDE-RULES.SIGMA_TIGHT)*q;
  const err=absNormal(G,sigma); d.error=err;
  const other=d.zone==="torso"?"arm":"torso";
  const hit=err<RULES.ZONE_TIGHT?d.zone:(err<RULES.ZONE_WIDE?other:"miss");
  if(hit==="miss"){d.result="miss";return theirReply(G);}
  if(hit==="arm"){
    // there is nothing to shoot out of an unarmed caller's hand, and the town
    // can see that as well as the sheriff can
    if(!e.armed){d.result="wounded_innocent"; G.authority-=2; G.flags.push("offended");
      return resolve(G,"wounded_innocent");}
    d.result="disarm"; G.arrests++; G.authority+=1; G.flags.push("arrest");
    return resolve(G,"disarmed");
  }
  d.result="kill";
  if(e.doctor)G.doctor.alive=false;                     // there is no other one
  if(d.unprovoked||!e.armed){G.innocentsKilled++;G.authority-=2;return resolve(G,"innocent_killed");}
  G.badGuysShot++;
  return resolve(G,"killed_him");
}
function theirReply(G){
  const e=who(G);
  if(G.duel.initiator==="you"&&!e.armed)return resolve(G,"missed_him");
  return takeHit(G,"he answered your miss");
}
/* The doctor is the difference between a wound and a grave, and he is in one of
 * four states by the time the sheriff needs him:
 *   dead        nothing is survivable; the town has no other one
 *   hostile     he will not come, and the first ball is the last thing
 *   drunk       he comes and makes a poor job of it: one wound, no more
 *   civil       alive, sober and well disposed — patched up, and the day goes on
 *   neutral     alive and sober but owing nothing: one wound, no more
 * Not having met him yet counts as neutral; he is in the town either way. */
function doctorState(G){
  const d=G.doctor;
  if(!d.alive)return "dead";
  if(d.disposition<0)return "hostile";
  if(!d.sober)return "drunk";
  return d.disposition>0?"civil":"neutral";
}
function takeHit(G,why){
  G.wounds++;
  const state=doctorState(G);
  if(state==="dead"){
    G.alive=false;
    return finish(G,"killed",why||"no doctor left in Gold Gulch to send for");
  }
  if(state==="hostile"){
    G.alive=false;
    return finish(G,"killed",why||"the doctor would not come");
  }
  if(state==="civil")return resolve(G,"doctor_saved");
  if(G.wounds>=RULES.WOUNDS){
    G.alive=false;
    return finish(G,"killed",why||(state==="drunk"
      ?"a second ball, and the doctor's hands no steadier"
      :"a second ball, and nobody owing you a favour"));
  }
  return resolve(G,state==="drunk"?"doctor_drunk":"doctor_came");
}

/* ---- resolution, interludes and the reckoning ---- */
function resolve(G,outcome){
  G.phase="resolve"; G.outcome=outcome;
  G.mode="talk"; G.reflex=null; G.aim={x:0.5,y:0.5};
  G.results.push({encounter:G.encounter,who:who(G)?who(G).id:null,outcome,
    duel:G.duel?G.duel.result:null});
  return {outcome,ending:G.ending};
}
/* A job the sheriff was warned about is one he can be standing in front of. */
function interludeDue(G){
  const done=G.encounter+1;
  return INTERLUDES.find(i=>i.after===done&&!G.results.some(r=>r.outcome==="job_"+i.job));
}
/* The job is a scene, not a line of bookkeeping: being told about it puts the
 * sheriff in front of it with his own gun still in the leather. */
function runInterlude(G,job){
  G.interlude=job; G.phase="interlude";
  G.ending=null; G.outcome=null; G.duel=null; G.tell=null;
  G.mode="talk"; G.reflex=null; G.aim={x:0.5,y:0.5};
  G.results.push({encounter:G.encounter,who:job,outcome:"job_"+job});
  return {interlude:job,warned:!!G.tips[job]};
}
/* Entering it: warned, and it is a gunfight; unwarned, and it is a report. */
function enterJob(G){
  const job=G.interlude; if(!job)return null;
  if(!G.tips[job]){
    G.crimesMissed++; G.authority-=1;
    return resolve(G,"job_missed");
  }
  G.authority+=1;
  return theyDraw(G,"ambush");
}
function nextEncounter(G){
  if(G.phase==="summary")return null;
  if(G.phase==="interlude"&&G.interlude)return enterJob(G);   // walk into it
  if(G.pending){                         // he had not finished after all
    const why=G.pending; G.pending=null;
    G.ending=null; G.outcome=null;
    return theyDraw(G,why);
  }
  const due=interludeDue(G);
  if(due&&G.interlude!==due.job)return runInterlude(G,due.job);
  G.interlude=null;
  G.encounter++;
  if(G.encounter>=CAST.length)return finish(G,"dusk");
  return beginEncounter(G);
}
/* The seven dimensions the day is judged on. */
function finish(G,why,how){
  const cats={
    "authority maintained": G.authority,
    "crooks captured":      G.arrests,
    "romance":              G.dates,
    "bad guys shot":        G.badGuysShot,
    "wounds survived":      G.wounds,
    "innocents killed":     G.innocentsKilled,
    "crimes missed":        G.crimesMissed
  };
  const score=G.authority*40+G.arrests*120+G.dates*60+G.badGuysShot*30
    -G.innocentsKilled*200-G.crimesMissed*100-G.wounds*40+(G.alive?100:0);
  G.phase="summary";
  G.over={why,how:how||null,categories:cats,score,
    tips:{...G.tips},met:G.met.length,alive:G.alive};
  return G.over;
}

/* ============ presentation and input ============
 * Two static zones, as the original had them: the scene fills the top half,
 * framed from behind the sheriff's holster, and the five-line dialogue matrix
 * fills the bottom. One rAF loop, wrapped, drives both.                      */
"use strict";
const cv=document.getElementById("scene"), ctx=cv.getContext("2d");
const panel=document.getElementById("panel");
const lineEls=[0,1,2,3,4].map(i=>document.getElementById("line"+i));

let screen=null, cueAt=0;           // the sound test, which is not a game phase
let build={at:0,rows:0};            // the block-load cadence
let flash=0, bodyFall=0, said="", react="";

/* ---- layout: the canvas keeps the scene's proportions inside the top half ---- */
function fit(){
  const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2.5);
  cv.width=Math.max(160,Math.round(r.width*d));
  cv.height=Math.max(100,Math.round(r.height*d));
}
addEventListener("resize",()=>{fit();paint();});
/* 320x200 was shown on a 4:3 screen, so the logical picture is stretched into
 * the largest 4:3 rectangle the canvas holds rather than into a square grid. */
const sceneGeom=()=>{
  const w=Math.min(cv.width,cv.height*4/3), h=w*3/4;
  return {sx:w/SCENE.w,sy:h/SCENE.h,ox:(cv.width-w)/2,oy:(cv.height-h)/2};
};


/* ---- the palette and the two painters everything else is built from ---- *
 * The C64's sixteen colours are the whole palette, and every shape is placed on
 * integer pixels so nothing on screen has a soft edge. */
const C64={blk:"#000000",wht:"#ffffff",red:"#68372b",cyn:"#70a4b2",pur:"#6f3d86",
  grn:"#588d43",blu:"#352879",yel:"#b8c76f",org:"#6f4f25",brn:"#433900",
  lrd:"#9a6759",dgy:"#444444",gry:"#6c6c6c",lgn:"#9ad284",lbl:"#6c5eb5",lgy:"#959595"};
const px=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),
  Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
const lerp=(x,x0,y0,x1,y1)=>y0+(y1-y0)*(x-x0)/(x1-x0||1);

/* ---- figures ---- *
 * A caller is a 24x20 grid painted two pixels to a cell, with a one-pixel dark
 * rim on every edge that meets the air. The rim is what keeps a figure legible
 * against a lit window or a dark doorway. */
function cellColour(ch,look){
  switch(ch){
    case "H":return look.H; case "R":return look.R||look.H;
    case "C":return look.C; case "K":return look.K||look.C;
    case "L":return look.L||look.C; case "W":return look.W||C64.wht;
    case "F":return look.F||C64.lrd; case "A":return look.F||C64.lrd;
    case "E":return C64.blk; case "B":return C64.blk;
    case "G":return C64.lgy; case "S":return C64.yel;
    case "P":return look.P||C64.brn;
    default:return null;
  }
}
const LOOK={
  stranger:{H:C64.brn,C:C64.dgy,K:"#2e2e2e",L:C64.dgy,W:C64.lgy},
  rose:    {H:C64.brn,R:C64.brn,C:C64.red,K:"#54291f",L:C64.red,W:C64.wht},

function figureRows(fig,pose){
  const rows=fig.rows.slice();
  const over=pose==="raise"?fig.raise:(pose==="surrender"?SURRENDER:null);
  if(over)for(const k of Object.keys(over))rows[+k]=over[k].padEnd(SPR.w,".").slice(0,SPR.w);
  return rows;
}
/* The silhouette is stamped a pixel larger in black and the colours laid over
 * it, which gives a one-pixel rim at any cell size: that rim is what keeps a
 * figure legible against a lit window or a dark doorway. */
function drawFigure(rows,x0,y0,look,cw,ch){
  const w=cw||FIGCW, h=ch||FIGCH, at=(r,c)=>(rows[r]&&rows[r][c])||".";
  ctx.fillStyle=C64.blk;
  for(let r=0;r<rows.length;r++)for(let c=0;c<SPR.w;c++){
    if(cellColour(at(r,c),look)===null)continue;
    ctx.fillRect(Math.round(x0+c*w)-1,Math.round(y0+r*h)-1,w+2,h+2);
  }
  for(let r=0;r<rows.length;r++)for(let c=0;c<SPR.w;c++){
    const col=cellColour(at(r,c),look); if(!col)continue;
    px(x0+c*w,y0+r*h,w,h,col);
  }
}
function visitor(enc,pose){
  const fig=figureOf(enc), look=LOOK[enc.figure||enc.id]||LOOK.robber;
  const rows=figureRows(fig,pose);
  let lowest=0;
  for(let r=0;r<rows.length;r++)if(/[^.]/.test(rows[r]))lowest=r;
  ctx.fillStyle="rgba(0,0,0,.35)";                   // his shadow, on the grid
  ctx.fillRect(SPRX+4*FIGCW,SPRY+(lowest+1)*FIGCH,16*FIGCW,FIGCH);
  drawFigure(rows,SPRX,SPRY,look);
}

  C:"#c9a227", c:"#8a6f18",                   // brass

const OWN_X=0, OWN_Y=0;
function ownGun(out){
  const rows=out?SHERIFF.drawn:SHERIFF.holstered;
  // He is a foot from the camera and the town is fifty: a cast shadow two
  // pixels down and right lifts him off it, the way a sprite sits over a plate.
  ctx.fillStyle="rgba(0,0,0,.42)";
  for(let r=0;r<rows.length;r++){
    const line=rows[r];
    for(let c=0;c<line.length;c++)
      if(SHERIFF_LOOK[line[c]])ctx.fillRect(OWN_X+c+2,OWN_Y+r+2,1,1);
  }
  for(let r=0;r<rows.length;r++){
    const line=rows[r];
    for(let c=0;c<line.length;c++){
      const k=SHERIFF_LOOK[line[c]]; if(!k)continue;
      px(OWN_X+c,OWN_Y+r,1,1,k);
    }
  }
}

/* ---- the street ---- *
 * The 1985 frame, drawn with the craft the machine's artists used: ordered
 * dithering between two colours wherever a flat field would show, clapboard
 * siding on every wall, framed and mullioned windows, panelled doors, awnings
 * with the shadow they cast, plank boardwalks, and light that comes from the
 * left so every edge knows which side it is on. Nothing has a soft edge.
 */
const HORIZON=118;
const PEOPLE=[{x:206,w:5,h:13},{x:216,w:5,h:12},{x:120,w:5,h:13}];
const hash=(a,b)=>((a*73856093)^(b*19349663))>>>0;
/* A 4x4 ordered matrix: the one a C64 artist would have dithered with. */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dither(x,y,w,h,a,b,amount){
  const t=Math.round(Math.max(0,Math.min(1,amount))*16);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){
    const X=Math.round(x)+i, Y=Math.round(y)+j;
    ctx.fillStyle=BAYER[(j&3)*4+(i&3)]<t?b:a;
    ctx.fillRect(X,Y,1,1);
  }
}
function skyband(y0,y1,a,b){
  const n=y1-y0;
  for(let j=0;j<n;j++)dither(0,y0+j,SCENE.w,1,a,b,j/(n-1||1));
}
