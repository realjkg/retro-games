<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Law of the West — Gold Gulch</title>
<meta name="description" content="Law of the West: a browser recreation of the 1985 Commodore 64 western. Ten people come up the street of Gold Gulch and you wear the only badge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23120d09'/%3E%3Cpath d='M50 16l8 22h23l-18 14 7 22-20-14-20 14 7-22-18-14h23z' fill='%23d8a441'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
    --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
  }
}
:root[data-theme="dark"]{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
}
:root[data-theme="light"]{
  --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
  --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* the two static zones: scene above, the matrix below */
#top{position:relative;flex:1 1 50%;min-height:0;background:#000;overflow:hidden}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
#bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  gap:8px;padding:3px 6px;font-size:11px;color:var(--ink);background:rgba(10,7,4,.55);
  pointer-events:none}
#bottom{flex:1 1 50%;min-height:0;display:flex;flex-direction:column;gap:4px;padding:6px;
  background:var(--panel);border-top:2px solid var(--line)}
#panel{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
.npc{color:var(--npc);font-size:14px;line-height:1.3;padding:4px 6px;min-height:2.6em;
  border-bottom:1px solid var(--line)}
.choice{font-size:13px;line-height:1.25;padding:5px 6px;border:1px solid transparent;
  border-radius:6px;color:var(--ink);cursor:pointer}
.choice.sel{background:var(--sel);color:var(--selink);font-weight:700;border-color:var(--sel)}
.choice.dim{opacity:.45}
#pads{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,34px);gap:3px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none}
.btn:active{background:var(--sel);color:var(--selink)}
.abtn{width:58px;height:58px;border-radius:50%;font-size:12px;font-weight:700}
.sbtn{padding:6px 9px;font-size:11px;min-height:32px}
#meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim)}

/* ---- full game mode ---- *
 * The page is already one screenful; game mode takes the browser's chrome with
 * it, stops every page gesture that could interrupt a held direction, and in
 * landscape puts the scene on one side and the words and controls on the other,
 * so a thumb never crosses the street. */
body.gamemode{background:#000;touch-action:none}
body.gamemode #app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.gamemode #top{flex:1 1 46%}
body.gamemode #bottom{flex:1 1 54%;border-top-width:3px}
body.gamemode #meta{display:none}
body.gamemode .npc{font-size:15px}
body.gamemode .choice{font-size:14px;padding:7px 8px}
body.gamemode .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,42px)}
body.gamemode .abtn{width:68px;height:68px}
@media (orientation:landscape){
  body.gamemode #app{flex-direction:row}
  body.gamemode #top{flex:1 1 50%;height:100%}
  body.gamemode #bottom{flex:1 1 50%;height:100%;border-top:0;border-left:3px solid var(--line)}
  body.gamemode #pads{margin-top:auto}
  body.gamemode .npc{font-size:13px}
  body.gamemode .choice{font-size:12px;padding:5px 7px}
  body.gamemode .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,34px)}
  body.gamemode .abtn{width:56px;height:56px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <canvas id="scene" width="320" height="200" aria-label="Main street, Gold Gulch"></canvas>
    <div id="bar"><span id="mode">TALKING — up to draw</span><span id="score">Standing 0</span></div>
  </div>
  <div id="bottom">
    <div id="panel" role="group" aria-label="Dialogue">
      <div id="line0" class="npc">LAW OF THE WEST — GOLD GULCH</div>
      <div id="line1" class="choice sel" data-cmd="choose" data-index="0"></div>
      <div id="line2" class="choice" data-cmd="choose" data-index="1"></div>
      <div id="line3" class="choice" data-cmd="choose" data-index="2"></div>
      <div id="line4" class="choice" data-cmd="choose" data-index="3"></div>
    </div>
    <div id="pads">
      <div class="dpad">
        <div></div><div class="btn" data-cmd="up">▲</div><div></div>
        <div class="btn" data-cmd="left">◀</div><div class="btn sbtn" data-cmd="holster">HOL</div><div class="btn" data-cmd="right">▶</div>
        <div></div><div class="btn" data-cmd="down">▼</div><div></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div class="btn abtn" data-cmd="fire">FIRE</div>
        <div style="display:flex;gap:5px">
          <button class="btn sbtn" id="mute" type="button" data-cmd="mute" aria-pressed="true">SOUND ON</button>
          <button class="btn sbtn" id="full" type="button" data-cmd="full" aria-pressed="false">FULL</button>
        </div>
      </div>
    </div>
    <div id="meta"><span>Up draws · down holsters · 1-4 or FIRE to speak · m mutes · g full screen</span></div>
  </div>
</div>
<script>
"use strict";
/* ===== sid-audio.js ===== */
/* ============ audio — SID (MOS 6581) idiom ============ *
 * Pulse oscillators with pulse-width modulation, a resonant multimode
 * lowpass, ring modulation, 23-bit LFSR noise and 4-bit ADSR levels.
 * Everything synthesised at run time. No samples, no files, nothing
 * lifted from any commercial release. SOUNDS is plain data so the same
 * definitions can be rendered offline to wav for auditioning.
 *
 * voice fields:
 *   w    "pulse" | "saw" | "tri" | "noise"
 *   f0   start frequency (Hz)        f1  end frequency (sweep, optional)
 *   pw   pulse width 0..1            pw1 end width (PWM sweep, optional)
 *   ring ring-modulator ratio against f0 (optional, tri/pulse only)
 *   cut  filter cutoff (Hz)          cut1 end cutoff (sweep, optional)
 *   res  filter resonance 0..15      dur seconds      vol 0..1
 *   dly  start offset (seconds)
 *   seq  [[semitoneOffset, startSec, durSec], ...] for melodic phrases   */
const SID_CLK=985248, FRAME=1/50;          // PAL machine, 50 Hz play routine
const sidF=f=>Math.round(f*16777216/SID_CLK)*SID_CLK/16777216;   // 16-bit register
const sid4=v=>Math.round(Math.max(0,Math.min(1,v))*15)/15;       // 4-bit level
const sidCut=c=>Math.round(Math.max(30,Math.min(12000,c))/12000*2047)/2047*12000;
const SOUNDS={
  step:    [{w:"noise",f0:1,dur:0.07,vol:0.16,cut:420,cut1:180,res:4}],
  click:   [{w:"pulse",f0:1400,pw:0.5,dur:0.03,vol:0.13,cut:5000,res:2}],
  select:  [{w:"pulse",f0:520,f1:1040,pw:0.3,pw1:0.6,dur:0.09,vol:0.2,cut:4200,res:5}],
  deny:    [{w:"saw",f0:190,f1:96,dur:0.22,vol:0.22,cut:1400,cut1:380,res:9}],
  creak:   [{w:"saw",f0:88,f1:150,dur:0.34,vol:0.15,cut:600,cut1:2600,res:12}],
  door:    [{w:"saw",f0:70,f1:128,dur:0.45,vol:0.16,cut:520,cut1:2200,res:13},
            {w:"noise",f0:1,dur:0.12,vol:0.2,cut:300,cut1:110,res:5,dly:0.44}],
  tell:    [{w:"tri",f0:330,f1:520,ring:1.51,dur:0.5,vol:0.18,cut:3000,cut1:5200,res:10},
            {w:"pulse",f0:82,pw:0.12,pw1:0.45,dur:0.55,vol:0.14,cut:900,res:8}],
  gunshot: [{w:"noise",f0:1,dur:0.2,vol:0.3,cut:7000,cut1:260,res:6},
            {w:"pulse",f0:150,f1:48,pw:0.5,dur:0.16,vol:0.26,cut:1600,cut1:300,res:4},
            {w:"noise",f0:1,dur:0.5,vol:0.08,cut:1100,cut1:180,res:9,dly:0.06}],
  ricochet:[{w:"pulse",f0:2400,f1:640,pw:0.08,pw1:0.5,dur:0.26,vol:0.16,
             cut:6000,cut1:1500,res:12}],
  hit:     [{w:"noise",f0:1,dur:0.11,vol:0.26,cut:2400,cut1:200,res:5},
            {w:"tri",f0:120,f1:62,dur:0.18,vol:0.22,cut:900,res:3}],
  wound:   [{w:"noise",f0:1,dur:0.14,vol:0.2,cut:900,cut1:180,res:7},
            {w:"tri",f0:95,f1:58,dur:0.3,vol:0.2,cut:600,res:4}],
  death:   [{w:"saw",f0:220,f1:44,dur:0.8,vol:0.26,cut:3200,cut1:180,res:11},
            {w:"pulse",f0:110,f1:40,pw:0.2,pw1:0.5,dur:0.85,vol:0.18,cut:1200,cut1:200,res:8}],
  holster: [{w:"noise",f0:1,dur:0.09,vol:0.12,cut:1800,cut1:700,res:8},
            {w:"saw",f0:130,f1:96,dur:0.14,vol:0.1,cut:900,cut1:1800,res:11,dly:0.03}],
  /* melodic cues — seq entries are [semitones from f0, start, length]     */
  respect: [{w:"pulse",f0:98,pw:0.3,pw1:0.5,vol:0.21,cut:1100,cut1:1600,res:7,
             seq:[[0,0,0.3],[7,0.32,0.15],[12,0.48,0.55]]},
            {w:"tri",f0:49,vol:0.2,cut:420,res:3,
             seq:[[0,0,0.46],[0,0.48,0.6]]}],
  disgrace:[{w:"pulse",f0:98,f1:92,pw:0.14,pw1:0.06,vol:0.22,cut:1300,cut1:520,res:14,
             seq:[[0,0,0.2],[-1,0.22,0.2],[-3,0.44,0.55]]},
            {w:"tri",f0:49,f1:46,vol:0.18,cut:420,cut1:260,res:5,
             seq:[[0,0,0.55],[-2,0.55,0.55]]}],
  /* An identity sting rather than a melody: a three-note motif, answered twice,
     low in the register. The high voice is a glint, never the lead. */
  title:   [{w:"pulse",f0:146.83,vol:0.19,cut:1500,cut1:2100,pw:0.16,pw1:0.5,res:9,
             seq:[[0,0,0.9],[7,0.95,0.55],[10,1.55,1.5],
                  [0,3.4,0.75],[7,4.2,0.5],[3,4.75,1.1],
                  [0,6.1,1.9]]},
            {w:"tri",f0:73.42,vol:0.2,cut:520,res:3,
             seq:[[0,0,1.55],[0,1.55,1.8],[7,3.4,1.35],[0,4.75,1.3],[0,6.1,1.9]]},
            {w:"pulse",f0:1174.66,pw:0.5,vol:0.035,cut:5200,res:6,
             seq:[[0,1.6,0.14],[7,3.5,0.14],[0,6.2,0.4]]}],
  dusk:    [{w:"pulse",f0:110,pw:0.22,pw1:0.5,vol:0.17,cut:1800,cut1:900,res:8,
             seq:[[0,0,0.5],[-2,0.52,0.5],[-3,1.04,0.4],[-4,1.46,0.4],
                  [-5,1.88,0.45],[-7,2.35,0.6]]},
            {w:"tri",f0:55,vol:0.19,cut:480,cut1:240,res:3,
             seq:[[0,0,1.05],[-5,1.06,1.25],[-12,2.35,1.6]]},
            {w:"pulse",f0:110,pw:0.3,pw1:0.12,vol:0.15,cut:1400,cut1:120,res:12,
             seq:[[-12,2.95,1.5]]}],
  /* ---- the rest of the day: cues for the parts the first table did not cover.
     Data only; the synthesis above is untouched. ---- */

  /* dawn and dusk bracket the day. dawn answers dusk: same idiom, rising. */
  dawn:    [{w:"pulse",f0:146.83,pw:0.26,pw1:0.46,vol:0.17,cut:1400,cut1:2400,res:7,
             seq:[[0,0,0.55],[7,0.58,0.55],[12,1.16,0.55],[19,1.74,1.3]]},
            {w:"tri",f0:73.42,vol:0.2,cut:480,cut1:700,res:3,
             seq:[[0,0,1.13],[7,1.16,1.13],[0,2.32,1.4]]},
            {w:"pulse",f0:1174.66,pw:0.5,vol:0.035,cut:5000,res:6,

  /* the star going on, at the head of the day */
  badge:   [{w:"pulse",f0:523.25,pw:0.22,pw1:0.48,vol:0.17,cut:4000,res:6,
             seq:[[0,0,0.09],[4,0.09,0.09],[7,0.18,0.09],[12,0.27,0.34]]},
            {w:"tri",f0:130.81,vol:0.12,cut:1100,res:3,seq:[[0,0,0.2],[7,0.2,0.42]]}],

  /* arrivals. Who comes up the street is audible before it is visible. */
  hooves:  [{w:"noise",f0:1,dur:0.06,vol:0.2,cut:300,cut1:120,res:6},
            {w:"tri",f0:74,f1:52,dur:0.09,vol:0.2,cut:420,res:4},
            {w:"noise",f0:1,dur:0.06,vol:0.19,cut:320,cut1:120,res:6,dly:0.17},
            {w:"tri",f0:70,f1:50,dur:0.09,vol:0.19,cut:420,res:4,dly:0.17},
            {w:"noise",f0:1,dur:0.06,vol:0.21,cut:340,cut1:130,res:6,dly:0.31},
            {w:"tri",f0:78,f1:54,dur:0.09,vol:0.2,cut:440,res:4,dly:0.31},
            {w:"noise",f0:1,dur:0.07,vol:0.22,cut:300,cut1:110,res:6,dly:0.46},
            {w:"tri",f0:66,f1:46,dur:0.11,vol:0.21,cut:400,res:4,dly:0.46}],
  wagon:   [{w:"noise",f0:1,dur:0.9,vol:0.13,cut:520,cut1:240,res:7},
            {w:"saw",f0:52,f1:63,dur:0.9,vol:0.12,cut:420,cut1:900,res:11},
            {w:"noise",f0:1,vol:0.1,cut:1600,cut1:600,res:9,
             seq:[[0,0.1,0.04],[0,0.34,0.04],[0,0.58,0.04],[0,0.8,0.05]]}],
  spurs:   [{w:"pulse",f0:2100,pw:0.12,pw1:0.4,ring:1.47,vol:0.1,cut:6200,res:11,
             seq:[[0,0,0.05],[3,0.13,0.05],[-2,0.27,0.07]]}],
  crowd:   [{w:"noise",f0:1,dur:0.85,vol:0.11,cut:380,cut1:240,res:5},
            {w:"saw",f0:96,f1:112,dur:0.8,vol:0.06,cut:300,cut1:520,res:8}],
  wind:    [{w:"noise",f0:1,dur:1.3,vol:0.13,cut:280,cut1:1100,res:4},
            {w:"noise",f0:1,dur:0.9,vol:0.08,cut:1400,cut1:320,res:6,dly:0.5}],
  /* The saloon reads from rhythm: off-beats pushed late and played lighter, with
     a flattened third leaning on the major over an oom-pah bass. */

             seq:[[4,0.23,0.07],[10,0.55,0.07],[3,0.87,0.07],[0,1.19,0.14]]},
            {w:"tri",f0:98,vol:0.16,cut:700,res:3,
             seq:[[0,0,0.3],[7,0.32,0.3],[0,0.64,0.3],[-5,0.96,0.45]]}],
  /* a killing has a bell after it */
  churchbell:[{w:"tri",f0:220,ring:1.503,dur:1.6,vol:0.42,cut:4200,cut1:1400,res:9},
            {w:"tri",f0:110,dur:1.7,vol:0.3,cut:1400,cut1:600,res:4},
            {w:"tri",f0:219,ring:1.497,dur:1.2,vol:0.26,cut:3600,cut1:1200,res:9,dly:0.9}],

  penalty: [{w:"pulse",f0:520,f1:330,pw:0.3,dur:0.09,vol:0.13,cut:2200,cut1:900,res:7}],
  /* a robbery stopped, and a robbery not stopped */
  thread:  [{w:"pulse",f0:392,pw:0.25,pw1:0.5,vol:0.18,cut:3600,res:7,
             seq:[[0,0,0.11],[4,0.11,0.11],[7,0.22,0.11],[12,0.33,0.42]]},
            {w:"tri",f0:98,vol:0.15,cut:1100,res:3,seq:[[0,0,0.33],[12,0.33,0.42]]}],
  alarm:   [{w:"pulse",f0:990,pw:0.5,vol:0.18,cut:4800,res:8,
             seq:[[0,0,0.14],[-5,0.16,0.14],[0,0.32,0.14],[-5,0.48,0.14],
                  [0,0.64,0.14],[-5,0.8,0.18]]},
            {w:"saw",f0:124,dur:1,vol:0.1,cut:600,cut1:1500,res:10}],
  robbery: [{w:"saw",f0:260,f1:58,dur:1.1,vol:0.22,cut:2600,cut1:200,res:11},
            {w:"pulse",f0:98,f1:44,pw:0.2,pw1:0.5,dur:1.2,vol:0.16,cut:1000,cut1:220,res:8},
            {w:"noise",f0:1,vol:0.12,cut:2000,cut1:300,res:6,

  /* slot seven, if it goes that way: a suspended fourth that takes its time

  romance: [{w:"tri",f0:130.81,vol:0.19,cut:1100,cut1:1700,res:4,
             seq:[[0,0,0.55],[5,0.58,0.75],[9,1.36,0.5],[4,1.9,0.95]]},
            {w:"pulse",f0:65.41,pw:0.2,pw1:0.4,vol:0.12,cut:700,res:6,

            {w:"pulse",f0:1046.5,pw:0.5,vol:0.03,cut:4800,res:5,
             seq:[[9,1.4,0.12],[4,1.95,0.35]]}],

  /* the duel, either side of the tell */
  tension: [{w:"tri",f0:58,f1:44,dur:0.2,vol:0.5,cut:520,cut1:220,res:6},
            {w:"tri",f0:56,f1:42,dur:0.24,vol:0.44,cut:480,cut1:200,res:6,dly:0.36}],
  cock:    [{w:"noise",f0:1,dur:0.025,vol:0.14,cut:3200,cut1:1400,res:7},

const SND=(function(){

  let ac=null,bus=null,nz=null,on=true; const lastAt={};
  function noiseBuf(c){                       // SID's 23-bit LFSR
    const n=(c.sampleRate*2)|0, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    let r=0x7ffff8, held=1, acc=0; const inc=(SID_CLK/256)/c.sampleRate;
    for(let i=0;i<n;i++){ acc+=inc;
      while(acc>=1){ acc-=1;
        const fb=((r>>22)^(r>>17))&1; r=((r<<1)|fb)&0x7fffff; held=(r&0x100000)?1:-1; }
      d[i]=held; }

  }
  function ctx(){
    if(!AC)return null;
    if(!ac){ ac=new AC(); bus=ac.createGain(); bus.gain.value=0.3;
             bus.connect(ac.destination); nz=noiseBuf(ac); }
    if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
    return ac;
  }
  /* a pulse of variable width: saw minus the same saw delayed by width/f */
  function pulseSource(c,v,t0,dur,steps){
    const a=c.createOscillator(), b=c.createOscillator(), inv=c.createGain();
    const dl=c.createDelay(0.05), out=c.createGain();
    a.type="sawtooth"; b.type="sawtooth"; inv.gain.value=-1;
    steps.forEach(({t,f,pw})=>{
      a.frequency.setValueAtTime(f,t); b.frequency.setValueAtTime(f,t);
      dl.delayTime.setValueAtTime(Math.min(0.049,Math.max(0.0001,pw/f)),t); });
    a.connect(out); b.connect(inv); inv.connect(dl); dl.connect(out);
    a.start(t0); b.start(t0); a.stop(t0+dur+0.05); b.stop(t0+dur+0.05);
    return out;
  }
  function voice(v,t0base){
    const c=ctx(); if(!c)return;
    const notes=v.seq||[[0,0,v.dur]];
    for(const [st,ns,nd] of notes){
      const t0=t0base+(v.dly||0)+ns, dur=nd, mul=Math.pow(2,st/12);

      const steps=[];

          f:sidF((v.f1?v.f0*Math.pow(v.f1/v.f0,u):v.f0)*mul),

    const c=ctx(); if(!c)return;
    list.forEach(v=>voice(v,c.currentTime));
  }
  const API={unlock(){ctx();}, get on(){return on;},
    toggle(){on=!on; if(on){ctx();play("select");} return on;}};
  Object.keys(SOUNDS).forEach(k=>API[k]=()=>play(k));
  return API;
})();

/* ===== engine.js ===== */
/* ============ engine ============
 * All rules, no DOM and no writing. The state machine the page drives:
 *   intro -> approach -> dialogue -> aiming -> tell -> duel -> resolve -> summary
 * Every random draw goes through G.rng so a test can seed it.               */
"use strict";

const RULES={
  TURNS:3,
  TELL_MIN:400, TELL_MAX:900,        // ms of tell before his hand moves
  FIRE_MIN:260, FIRE_MAX:420,        // ms from his draw to his shot
  REFLEX_MIN:1500, REFLEX_MAX:2600,  // how long a drawn gun is tolerated
  AIM_STEP:0.055,                    // crosshair travel per input step, in scene widths
  AIM_FLOOR:120, AIM_CEIL:500,       // the latency window aim quality is read from
  SIGMA_WIDE:0.95, SIGMA_TIGHT:0.42, // shot spread, fast draw to steady draw
  ZONE_TIGHT:0.30, ZONE_WIDE:0.62,   // < tight hits what you aimed at, < wide the other
  WOUNDS:2,                          // wounds the sheriff carries before one is too many
  POINTS:{arrest:120, talked:80, clue:60, disarm:70, kill:20, lost:-60,
          murder:-260, killed_needless:-90, wounded:-50, drawn_on_unarmed:-120}
};

const mulberry32=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};
const rnd=(g,a,b)=>a+(b-a)*g.rng();
function absNormal(g,sigma){          // folded gaussian: the size of a shot's error
  const u=Math.max(1e-9,g.rng()), v=g.rng();
  return Math.abs(Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))*sigma;
}

function newGame(opts){
  const seed=opts&&opts.seed;
  return {
    phase:"intro", slot:0, turn:0, rng:seed==null?Math.random:mulberry32(seed),
    S:blankState(), safety:0, clues:[], favours:0, reputation:0,
    wounds:0, wounded:false, mode:"talk", aim:{x:0.5,y:0.5}, reflex:null,
    shots:0, hits:0, arrests:[], kills:[], disarms:[], murders:0, needlessKills:0,
    settled:[], points:0, log:[], results:[],
    duel:null, tell:null, outcome:null, ending:null, over:null
  };
}
const blankState=()=>({respect:0,fear:0,suspicion:0,evidence:0,drawRisk:0});
const who=G=>ENCOUNTERS[G.slot]||null;
const turnFor=(id,turn)=>(DIALOGUE[id]||[])[turn]||null;
const authored=id=>Array.isArray(DIALOGUE[id])&&DIALOGUE[id].length===RULES.TURNS;

function award(G,key,note){
  const p=RULES.POINTS[key]||0; G.points+=p;
  G.log.push({slot:G.slot,who:who(G)?who(G).id:null,key,points:p,note:note||""});
  return p;
}

/* ---- arrival and dialogue ---- */
function beginSlot(G){
  const e=who(G);
  if(!e)return finish(G,"dusk");
  G.phase="approach"; G.turn=0; G.S=blankState();
  G.outcome=null; G.ending=null; G.duel=null; G.tell=null;
  G.mode="talk"; G.reflex=null; G.aim={x:0.5,y:0.5};
  G.mood=Math.floor(G.rng()*3)-1;          // what mood he is in today
  return e;
}
/* An encounter with no authored dialogue is walked past rather than allowed to
 * dead-end the day: it settles as "unwritten" and the street moves on. */
function openDialogue(G){
  const e=who(G);
  if(!e)return finish(G,"dusk");
  if(!authored(e.id))return resolve(G,"unwritten");
  G.phase="dialogue"; return turnFor(e.id,0);
}

/* A reply moves the state by what the writing says it moves, plus a point of
 * temper either way on the draw risk, so the same four answers do not always
 * land on the same side of his patience. */
function respond(G,index){
  if(G.phase!=="dialogue")return null;
  const e=who(G), t=turnFor(e.id,G.turn);
  if(!t)return null;
  const reply=t.replies[index];
  if(!reply)return null;
  for(const [k,v] of Object.entries(reply.fx||{})){
    if(k in G.S)G.S[k]+=v; else if(k==="safety")G.safety+=v;
  }
  /* A point of temper either way each turn, on his patience and on one social
   * reading of the sheriff. Evidence is never jittered: the ledger says what
   * it says. */
  G.S.drawRisk+=Math.floor(G.rng()*3)-1;
  const social=["respect","fear","suspicion"].filter(k=>k in (reply.fx||{}));
  if(social.length){
    const k=social[Math.floor(G.rng()*social.length)];
    G.S[k]+=Math.floor(G.rng()*3)-1;
  }
  if(e.armed&&G.S.drawRisk>=e.drawAt+G.mood)return theyDraw(G,"provoked");
  G.turn++;
  if(G.turn>=RULES.TURNS)return settle(G);
  return {react:reply.react,next:turnFor(e.id,G.turn)};
}

/* ---- how an encounter lands when nobody has drawn ---- */
const CMP={">=":(a,b)=>a>=b,"<=":(a,b)=>a<=b,">":(a,b)=>a>b,"<":(a,b)=>a<b,
  "==":(a,b)=>a===b,"!=":(a,b)=>a!==b};
function value(G,name){
  if(name in G.S)return G.S[name];
  if(name==="safety")return G.safety;
  if(name==="favours")return G.favours;
  if(name==="wounds")return G.wounds;
  return 0;
}
const holds=(G,when)=>(when||[]).every(([n,op,v])=>(CMP[op]||CMP["=="])(value(G,n),v));
function settle(G){
  const e=who(G);
  // even a settled man can turn, and a riled one more easily
  if(e.armed&&G.rng()<(e.hostile||0)*(G.S.drawRisk>0?1.5:0.7))return theyDraw(G,"turned");
  /* First ending whose conditions hold, except that an ending may carry a
   * chance of its own: he nearly told you, and then did not. The fallback has
   * no chance of its own and always fires. */
  const ending=(e.endings||[]).find(x=>holds(G,x.when)&&
    (x.chance==null||G.rng()<x.chance));
  if(!ending)return resolve(G,"unwritten");
  G.ending=ending;
  for(const [k,v] of Object.entries(ending.fx||{})){
    if(k==="safety")G.safety+=v;
    else if(k==="clue"&&!G.clues.includes(v))G.clues.push(v);
    else if(k==="favour")G.favours+=1;
    else if(k in G.S)G.S[k]+=v;
  }
  if(ending.fx&&ending.fx.clue)award(G,"clue",ending.fx.clue);
  if(ending.award)award(G,ending.award,ending.id);
  G.points+=ending.points||0;
  G.settled.push({slot:G.slot,who:e.id,ending:ending.id});
  return resolve(G,ending.id);
}

/* ---- the gun hand ---- */
function drawGun(G,nowMs){
  if(G.mode==="gun")return G.mode;
  G.mode="gun"; G.aim={x:0.5,y:0.5};
  if(G.phase==="dialogue")G.phase="aiming";
  G.reflex={at:nowMs||0,limit:Math.round(rnd(G,RULES.REFLEX_MIN,RULES.REFLEX_MAX))};
  return G.mode;
}
function holster(G){
  if(G.mode!=="gun")return G.mode;
  G.mode="talk"; G.reflex=null;
  if(G.phase==="aiming")G.phase="dialogue";
  return G.mode;
}
function moveAim(G,dx,dy){
  if(G.mode!=="gun")return null;
  G.aim.x=Math.max(0,Math.min(1,G.aim.x+dx*RULES.AIM_STEP));
  G.aim.y=Math.max(0,Math.min(1,G.aim.y+dy*RULES.AIM_STEP));
  return G.aim;
}
/* Called every frame: his patience with a drawn gun, his tell, and his shot. */
function tick(G,nowMs){
  if(G.reflex&&nowMs-G.reflex.at>=G.reflex.limit){
    const e=who(G); G.reflex=null;
    if(e&&e.armed)return takeHit(G,"he answered the gun in his face");
    return resolve(G,"walked_away");
  }
  if(G.phase==="tell"&&G.tell&&nowMs-G.tell.at>=G.tell.delay){G.phase="duel";G.duel.drawn=true;}
  if(G.phase==="duel"&&G.duel&&G.duel.drawn&&!G.duel.fired&&G.tell){
    if(nowMs-(G.tell.at+G.tell.delay)>=G.duel.fireDelay){
      G.duel.fired=true; G.duel.result="too_slow";
      return takeHit(G,"outdrawn");
    }
  }
  return null;
}
const inBox=(px,py,b)=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h;
const weaponBox=G=>(G.duel&&(G.duel.drawn||G.duel.initiator==="you"))?HITBOX.weaponRaised:HITBOX.weapon;
function boxAt(G,x,y){
  const px=x*SCENE.w, py=y*SCENE.h;
  if(inBox(px,py,weaponBox(G)))return "weapon";
  if(inBox(px,py,HITBOX.lethal))return "lethal";
  return null;
}
const boxCentre=b=>({x:(b.x+b.w/2)/SCENE.w,y:(b.y+b.h/2)/SCENE.h});
function aimAt(G,zone){
  G.aim=boxCentre(zone==="arm"?weaponBox(G):HITBOX.lethal);
  if(G.duel)G.duel.zone=zone;
  return zone;
}

/* ---- duels ---- */
function theyDraw(G,why){
  const e=who(G);
  G.phase="tell";
  G.tell={at:0,why,delay:Math.round(rnd(G,RULES.TELL_MIN,RULES.TELL_MAX))};
  G.duel={initiator:"them",drawn:false,fired:false,zone:"torso",
    fireDelay:Math.round(rnd(G,RULES.FIRE_MIN,RULES.FIRE_MAX)-(e.nerve||0)*20),
    latency:null,error:null,result:null};
  return {tell:G.tell,duel:G.duel};
}
function playerDraws(G){
  const e=who(G);
  G.phase="duel";
  G.duel={initiator:"you",drawn:true,fired:false,zone:"torso",unprovoked:true,
    fireDelay:Math.round(rnd(G,RULES.FIRE_MIN,RULES.FIRE_MAX)-(e.nerve||0)*20),
    latency:null,error:null,result:null};
  return {duel:G.duel};
}
/* Latency and aim are read apart: a fast hand is a wide one, a slow hand is a
 * shot hand. Only a man who drew on you can beat you to it. */
function shoot(G,latencyMs){
  let d=G.duel, e=who(G);
  if(!d){playerDraws(G);d=G.duel;}
  if(!d||d.fired)return null;
  d.fired=true; d.latency=latencyMs; G.shots++; G.reflex=null;
  const box=boxAt(G,G.aim.x,G.aim.y);
  d.zone=box==="weapon"?"arm":(box==="lethal"?"torso":"off");
  const theirShot=(d.initiator==="them"&&G.tell)?G.tell.delay+d.fireDelay:Infinity;
  if(latencyMs>theirShot){d.result="too_slow";return takeHit(G,"outdrawn");}
  if(d.zone==="off"){d.result="miss";return theirReply(G);}
  const q=Math.max(0,Math.min(1,(latencyMs-RULES.AIM_FLOOR)/(RULES.AIM_CEIL-RULES.AIM_FLOOR)));
  const sigma=RULES.SIGMA_WIDE-(RULES.SIGMA_WIDE-RULES.SIGMA_TIGHT)*q;
  const err=absNormal(G,sigma); d.error=err;
  const other=d.zone==="torso"?"arm":"torso";
  const hit=err<RULES.ZONE_TIGHT?d.zone:(err<RULES.ZONE_WIDE?other:"miss");
  if(hit==="miss"){d.result="miss";return theirReply(G);}
  G.hits++;
  if(hit==="arm"){
    G.disarms.push(e.id); award(G,"disarm");
    G.arrests.push(e.id); award(G,"arrest");
    d.result="disarm"; return resolve(G,"disarmed");
  }
  G.kills.push(e.id); d.result="kill";
  if(d.unprovoked){                       // he never went for his gun
    G.murders++; award(G,!e.armed?"drawn_on_unarmed":"murder");
    return resolve(G,"murder");
  }
  award(G,"kill");
  if(G.S.drawRisk<4){                     // his hand moved, but a wound would have done
    G.needlessKills++; award(G,"killed_needless");
  }
  return resolve(G,"killed_him");
}
function theirReply(G){
  const e=who(G);
  if(G.duel.initiator==="you"&&!e.armed)return resolve(G,"missed_him");
  return takeHit(G,"he answered your miss");
}
/* A wound is carried, not cured: the day goes on until there is one too many.
 * A favour banked with someone in town buys one of them back. */
function takeHit(G,why){
  G.wounded=true; award(G,"wounded");
  if(G.favours>0){                       // somebody in town owes him, once
    G.favours--;
    return resolve(G,"rescued_from_street");
  }
  G.wounds++;
  if(G.wounds>=RULES.WOUNDS)return finish(G,"killed",why);
  return resolve(G,"wound_consequence");
}

/* ---- resolution and the day's end ---- */
function resolve(G,outcome){
  G.phase="resolve"; G.outcome=outcome;
  G.mode="talk"; G.reflex=null; G.aim={x:0.5,y:0.5};
  G.results.push({slot:G.slot,who:who(G)?who(G).id:null,outcome,
    duel:G.duel?G.duel.result:null,ending:G.ending?G.ending.id:null});
  return {outcome,ending:G.ending};
}
function nextSlot(G){
  if(G.phase==="summary")return null;
  G.slot++;
  if(G.slot>=ENCOUNTERS.length)return finish(G,"dusk");
  return beginSlot(G);
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));
function finish(G,why,how){
  const acc=G.shots?G.hits/G.shots:null;
  const done=G.results.filter(r=>r.outcome!=="unwritten").length;
  const cats={
    "crimes solved":  G.clues.length+Math.max(0,G.safety),
    "interactions":   done+"/"+ENCOUNTERS.length,
    "pacifism":       clamp(100-G.kills.length*16-G.needlessKills*24-G.murders*60+G.disarms.length*12,0,100),
    "marksmanship":   acc==null?null:Math.round(acc*100),
    "authority":      clamp(50+G.arrests.length*14+G.settled.length*8-G.murders*40,0,100),
    "mercy":          clamp(100-G.kills.length*22-G.murders*50+G.disarms.length*8,0,100),
    "evidence":       G.clues.length
  };
  G.phase="summary";
  G.over={why,how:how||null,categories:cats,points:G.points,rating:rating(G,why),
    verdict:verdict(G,why),clues:[...G.clues],safety:G.safety};
  return G.over;
}
/* One to twelve. Duty and crime prevention carry it; a killing costs. */
function rating(G,why){
  if(why==="killed")return 1;
  let r=2;
  r+=Math.min(3,G.clues.length);
  r+=Math.min(2,Math.floor(G.settled.length/2));
  r+=Math.min(2,Math.floor(G.disarms.length/2));
  r+=G.arrests.length>=2?1:0;
  r+=Math.max(0,Math.min(2,G.safety));
  r+=G.points>=500?1:0;
  r-=G.murders*3;
  r-=G.needlessKills;
  return Math.max(1,Math.min(12,r));
}
function verdict(G,why){
  if(why==="killed")return "buried in Gold Gulch";
  if(G.murders>=2)return "run out of town";
  const r=rating(G,why);
  if(r>=11)return "marshal of the territory";
  if(r>=9)return "sheriff of Gold Gulch";
  if(r>=6)return "town constable";
  if(r>=3)return "deputy on probation";
  return "run out of town";
}


/* ===== ui.js ===== */
/* ============ presentation and input ============
 * Two static zones, as the original had them: the scene fills the top half,
 * framed from behind the sheriff's holster, and the five-line dialogue matrix
 * fills the bottom. One rAF loop, wrapped, drives both.                      */
"use strict";
const cv=document.getElementById("scene"), ctx=cv.getContext("2d");
const panel=document.getElementById("panel");
const lineEls=[0,1,2,3,4].map(i=>document.getElementById("line"+i));
const scoreEl=document.getElementById("score");
const modeEl=document.getElementById("mode");
const muteBtn=document.getElementById("mute");

let G=newGame({}), cursor=0, started=false, lastFrame=0, drawnAt=0, firedLatency=null;
let build={at:0,rows:0};            // the block-load cadence
let flash=0, bodyFall=0, said="", react="";

/* ---- layout: the canvas keeps the scene's proportions inside the top half ---- */
function fit(){
  const r=cv.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2.5);
  cv.width=Math.max(160,Math.round(r.width*d));
  cv.height=Math.max(100,Math.round(r.height*d));
}
addEventListener("resize",fit);
const sceneGeom=()=>{
  const sc=Math.min(cv.width/SCENE.w,cv.height/SCENE.h);
  return {sc,ox:(cv.width-SCENE.w*sc)/2,oy:(cv.height-SCENE.h*sc)/2};
};

/* ---- the town, drawn as flat blocks in the machine's own manner ---- */
const PAL={sky:"#e8b46a",sky2:"#c9813f",dust:"#c49a63",road:"#a87f4e",
  wood:"#6b4a2a",wood2:"#54381f",dark:"#2a1c10",glass:"#3b2a18",sign:"#e8cf6a",
  skin:"#e0ac7a",steel:"#9aa0a8",cuff:"#4a5d80",ink:"#f2e6d2"};
const LOOK={
  deputy:{coat:"#3f4a60",hat:"#22293a"}, rainmaker:{coat:"#2e2a2c",hat:"#191718"},
  surveyor:{coat:"#5a6a5a",hat:"#e8dcc0"}, widow:{coat:"#4a3a44",hat:"#2a2028"},
  tuner:{coat:"#6a5a3a",hat:"#3a2f1e"},   locket:{coat:"#9a7a4a",hat:"#7a5a30"}};
function facade(name){
  ctx.fillStyle=PAL.wood;  ctx.fillRect(0,26,SCENE.w,86);
  ctx.fillStyle=PAL.wood2; ctx.fillRect(0,26,SCENE.w,8);
  for(let i=0;i<9;i++){ctx.fillStyle="rgba(0,0,0,.08)";ctx.fillRect(0,38+i*9,SCENE.w,2);}
  ctx.fillStyle=PAL.glass; ctx.fillRect(28,52,54,44); ctx.fillRect(238,52,54,44);
  ctx.fillStyle="rgba(232,207,106,.14)"; ctx.fillRect(30,54,50,40);
  ctx.fillStyle=PAL.dark;  ctx.fillRect(140,48,42,64);
  ctx.fillStyle=PAL.sign;  ctx.font="700 11px monospace";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(name,SCENE.w/2,32);
}
/* The visitor, facing the camera. Hitboxes in content.js follow this drawing. */
function visitor(c,armState){
  const look=LOOK[c.id]||LOOK.deputy, cx=FIG.cx, ground=FIG.ground;
  ctx.fillStyle="rgba(60,40,22,.35)";
  ctx.beginPath();ctx.ellipse(cx,ground+2,20,5,0,0,7);ctx.fill();
  ctx.fillStyle=look.coat; ctx.fillRect(cx-17,ground-58,34,44);       // torso
  ctx.fillRect(cx-15,ground-16,12,16); ctx.fillRect(cx+3,ground-16,12,16);
  ctx.fillStyle=PAL.dark; ctx.fillRect(cx-16,ground-4,13,5); ctx.fillRect(cx+3,ground-4,13,5);
  ctx.fillStyle=PAL.skin; ctx.fillRect(cx-8,ground-76,16,19);         // face
  ctx.fillStyle=PAL.dark; ctx.fillRect(cx-5,ground-70,4,3); ctx.fillRect(cx+2,ground-70,4,3);
  ctx.fillStyle=look.hat; ctx.fillRect(cx-19,ground-78,38,5); ctx.fillRect(cx-10,ground-88,20,11);
  ctx.fillStyle=PAL.dark; ctx.fillRect(cx-17,ground-22,34,5);         // gunbelt
  const arm=armState||0;                                               // 0 hanging, 1 rising, 2 levelled
  const hx=FIG.handX, hy=ground-(arm===0?46:arm===1?62:74);
  ctx.fillStyle=look.coat; ctx.fillRect(cx-25,ground-56,9,arm===0?30:18);
  ctx.fillStyle=PAL.skin;  ctx.fillRect(hx-5,hy,11,8);
  if(c.armed){ctx.fillStyle=PAL.steel;ctx.fillRect(hx-13,hy+1,10,5);
    ctx.fillStyle=PAL.dark;ctx.fillRect(hx-4,hy+5,5,5);}
}
/* Our own side of it: the sheriff's right arm and gun across the low corner. */
function ownGun(out){
  const y=SCENE.h-(out?118:88);          // the sheriff's own arm, inside the frame
  ctx.fillStyle=PAL.cuff; ctx.fillRect(SCENE.w-104,y+22,64,30);
  ctx.fillStyle=PAL.skin; ctx.fillRect(SCENE.w-118,y+16,30,18);
  if(out){
    ctx.fillStyle=PAL.steel; ctx.fillRect(SCENE.w-150,y+8,42,9);
    ctx.fillStyle=PAL.dark;  ctx.fillRect(SCENE.w-126,y+17,12,14);
    ctx.fillStyle=PAL.steel; ctx.fillRect(SCENE.w-134,y+4,14,6);
  } else {
    ctx.fillStyle=PAL.dark;  ctx.fillRect(SCENE.w-120,y+30,22,16);   // holstered
    ctx.fillStyle=PAL.steel; ctx.fillRect(SCENE.w-116,y+26,10,6);
  }
}
function crosshair(){
  const a=G.aim, x=a.x*SCENE.w, y=a.y*SCENE.h;   // the same mapping boxAt uses
  ctx.strokeStyle=PAL.ink; ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-15,y);ctx.lineTo(x-4,y); ctx.moveTo(x+4,y);ctx.lineTo(x+15,y);
  ctx.moveTo(x,y-15);ctx.lineTo(x,y-4); ctx.moveTo(x,y+4);ctx.lineTo(x,y+15);
  ctx.stroke();
}
function drawScene(now){
  const g=sceneGeom();
  ctx.fillStyle="#000"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(g.ox,g.oy); ctx.scale(g.sc,g.sc);
  const c=who(G);
  const sky=["#f2c988","#e8b46a","#dda059","#c9813f"];
  for(let i=0;i<4;i++){ctx.fillStyle=sky[i];ctx.fillRect(0,i*7,SCENE.w,7);}
  ctx.fillStyle=PAL.dust; ctx.fillRect(0,26,SCENE.w,SCENE.h-26);
  if(c)facade(c.place||"STREET");
  ctx.fillStyle=PAL.road; ctx.fillRect(0,112,SCENE.w,SCENE.h-112);
  if(c&&build.rows>=6){
    const arm=G.duel?(G.duel.drawn?2:1):(G.phase==="tell"?1:0);
    if(G.outcome==="killed_him"||G.outcome==="murder"){
      ctx.save();ctx.translate(SCENE.w*0.46,170);ctx.rotate(Math.min(1.4,bodyFall));
      ctx.translate(-SCENE.w*0.46,-170);visitor(c,0);ctx.restore();
    } else visitor(c,arm);
  }
  ownGun(G.mode==="gun");
  if(G.mode==="gun"&&build.rows>=6)crosshair();
  if(flash>0){ctx.fillStyle="rgba(255,242,192,"+Math.min(1,flash*6)+")";
    ctx.fillRect(0,0,SCENE.w,SCENE.h);}
  // the block-load cadence: the scene arrives in rows before anything is live
  if(build.rows<10){
    ctx.fillStyle="#000";
    ctx.fillRect(0,build.rows*(SCENE.h/10),SCENE.w,SCENE.h-build.rows*(SCENE.h/10));
  }
  ctx.fillStyle="rgba(20,14,8,.6)"; ctx.fillRect(0,SCENE.h-12,SCENE.w,12);
  ctx.fillStyle=PAL.ink; ctx.font="700 8px monospace";
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText((c?c.title.toUpperCase():"GOLD GULCH")+"   "+(G.slot+1)+" OF "+ENCOUNTERS.length,5,SCENE.h-6);
  ctx.textAlign="right";
  ctx.fillText(G.wounds?"WOUNDED":"UNHURT",SCENE.w-5,SCENE.h-6);
  ctx.restore();
}

/* ---- the five-line matrix ---- */
function beat(){const e=who(G);return e?turnFor(e.id,G.turn):null;}
function paint(){
  const b=beat(), live=build.rows>=10;
  if(G.phase==="summary"){return paintSummary();}
  if(G.phase==="intro"){
    lineEls[0].textContent="LAW OF THE WEST — GOLD GULCH";
    lineEls[0].className="npc";
    lineEls[1].textContent="Press FIRE or Enter to pin on the badge";
    lineEls[1].className="choice sel";
    const written=ENCOUNTERS.filter(e=>Array.isArray(DIALOGUE[e.id])).length;
    lineEls[2].textContent=written+" of "+ENCOUNTERS.length+
      " encounters written. The rest are walked past for now."+
      (gameMode?"":"  ·  FULL or g for full screen.");
    lineEls[2].className="choice dim";
    for(let i=3;i<5;i++){lineEls[i].textContent="";lineEls[i].className="choice";}
    modeEl.textContent="GOLD GULCH"; scoreEl.textContent="";
    return;
  }
  lineEls[0].className="npc";
  if(G.phase==="resolve"){
    lineEls[0].textContent=G.ending?G.ending.text:outcomeLine();
    lineEls[1].textContent=(G.slot>=ENCOUNTERS.length-1)?"1. End the day":"1. Walk on down the street";
    lineEls[1].className="choice sel";
    for(let i=2;i<5;i++){lineEls[i].textContent="";lineEls[i].className="choice";}
    scoreEl.textContent="Standing "+G.points+"   clues "+G.clues.length;
    modeEl.textContent=who(G)?who(G).title.toUpperCase():"";
    return;
  }
  lineEls[0].textContent=!b?"["+(who(G)?who(G).title:"this encounter")+" is not written yet]"
    :(react||said||b.say);
  const replies=b?b.replies:[];
  for(let i=0;i<4;i++){
    const r=replies[i];
    lineEls[i+1].textContent=r?(i+1)+". "+r.t:"";
    lineEls[i+1].className="choice"+(live&&G.mode==="talk"&&cursor===i?" sel":"")+
      (G.mode==="gun"?" dim":"");
  }
  modeEl.textContent=G.mode==="gun"?"GUN DRAWN — down to holster":"TALKING — up to draw";
  scoreEl.textContent="Standing "+G.points+"   clues "+G.clues.length;
}
const OUTCOME_LINES={
  disarmed:"His gun is in the dust and his wrists are in irons.",
  killed_him:"He is dead on the boardwalk, and the street saw who fired.",
  murder:"You shot a man whose hand never moved. The street saw that too.",
  missed_him:"Your shot goes into the facade behind him. Nobody moves.",
  wound_consequence:"You are hit. It will keep until sundown, and no longer.",
  rescued_from_street:"A wagon you did not send comes up the street. Somebody who owes you a favour gets you off it and closes the hole.",
  walked_away:"He looks at the gun in your hand, decides against all of it, and leaves.",
  unwritten:"[this encounter has no authored ending yet]"
};
const outcomeLine=()=>OUTCOME_LINES[G.outcome]||"The matter settles.";
function paintSummary(){
  const o=G.over;
  lineEls[0].className="npc";
  lineEls[0].textContent="RATING "+o.rating+" OF 12 — "+o.verdict.toUpperCase();
  const cats=Object.entries(o.categories);
  lineEls[1].className="choice"; lineEls[1].textContent=cats.slice(0,3).map(([k,v])=>k+" "+v).join("   ");
  lineEls[2].className="choice"; lineEls[2].textContent=cats.slice(3,5).map(([k,v])=>k+" "+v).join("   ");
  lineEls[3].className="choice"; lineEls[3].textContent=cats.slice(5).map(([k,v])=>k+" "+v).join("   ");
  lineEls[4].className="choice sel"; lineEls[4].textContent="1. Ride in again";
  scoreEl.textContent="Standing "+o.points;
  modeEl.textContent="SUNDOWN";
}

/* ---- full game mode ---- */
const NAV=typeof navigator==="object"&&navigator?navigator:null;
const bodyEl=document.body||{classList:{add(){},remove(){}}};
const fullBtn=document.getElementById("full");
let gameMode=false, wakeLock=null, wantGameMode=false;
try{wantGameMode=localStorage.getItem("lotw.gamemode")==="1";}catch(e){}
const fsElement=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
function requestFS(){
  const el=document.documentElement; if(!el)return;
  try{const r=el.requestFullscreen?.({navigationUI:"hide"})??el.webkitRequestFullscreen?.();
    if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
function exitFS(){try{const r=document.exitFullscreen?.()??document.webkitExitFullscreen?.();
  if(r&&r.catch)r.catch(()=>{});}catch(e){}}
function keepAwake(){if(!NAV?.wakeLock?.request)return;
  try{NAV.wakeLock.request("screen").then(l=>{wakeLock=l;}).catch(()=>{});}catch(e){}}
function releaseAwake(){try{wakeLock?.release?.();}catch(e){}wakeLock=null;}
function setGameMode(on){
  gameMode=!!on; wantGameMode=gameMode;
  bodyEl.classList?.[gameMode?"add":"remove"]("gamemode");
  fullBtn?.setAttribute?.("aria-pressed",gameMode?"true":"false");
  if(fullBtn)fullBtn.textContent=gameMode?"EXIT":"FULL";
  try{localStorage.setItem("lotw.gamemode",gameMode?"1":"0");}catch(e){}
  if(gameMode)keepAwake(); else releaseAwake();
  fit(); paint();
}
/* Fullscreen is only granted inside a user gesture, so every caller is a tap
 * or a key. Where the API is missing - iPhone Safari - the layout still goes. */
function toggleGameMode(){
  if(gameMode){exitFS();setGameMode(false);}
  else{setGameMode(true);requestFS();}
}
function enterGameModeIfWanted(){if(wantGameMode&&!gameMode){setGameMode(true);requestFS();}}
document.addEventListener?.("fullscreenchange",()=>{if(!fsElement()&&gameMode)setGameMode(false);});
document.addEventListener?.("webkitfullscreenchange",()=>{if(!fsElement()&&gameMode)setGameMode(false);});
for(const t of ["gesturestart","gesturechange","gestureend"])
  document.addEventListener?.(t,e=>{e.preventDefault?.();});
document.addEventListener?.("contextmenu",e=>{if(gameMode||e.target?.closest?.("[data-cmd]"))e.preventDefault?.();});
document.addEventListener?.("dblclick",e=>{if(gameMode)e.preventDefault?.();});
document.addEventListener?.("visibilitychange",()=>{if(!document.hidden&&gameMode)keepAwake();});

/* ---- input, one control set for the pad and the keyboard ---- */
function startDay(){
  SND.unlock(); started=true; enterGameModeIfWanted();
  G=newGame({}); cursor=0; said=""; react="";
  beginSlot(G); openDialogue(G); newScene();
  SND.badge();
}
function newScene(){
  build={at:performance.now(),rows:0};
  said=""; react=""; cursor=0;
  SND.door(); setTimeout(()=>SND.step(),260);
}
function up(){
  if(G.phase==="intro")return;
  if(G.mode==="talk"&&(G.phase==="dialogue"||G.phase==="tell")){
    drawGun(G,performance.now()); drawnAt=performance.now(); SND.holster(); paint(); return;
  }
  if(G.mode==="gun"){moveAim(G,0,-1);SND.click();}
}
function down(){
  if(G.mode==="gun"){
    // down walks the crosshair down the scene; pulled past the bottom it
    // holsters, which is the way out of a stand-off. HOL and Escape do it at once.
    if(G.aim.y>=0.995){holster(G);SND.holster();paint();return;}
    moveAim(G,0,1); SND.click(); return;
  }
  if(G.phase==="dialogue"&&build.rows>=10){cursor=(cursor+1)%4;SND.click();paint();}
}
function left(){if(G.mode==="gun"){moveAim(G,-1,0);SND.click();}
  else if(G.phase==="dialogue"){cursor=(cursor+3)%4;SND.click();paint();}}
function right(){if(G.mode==="gun"){moveAim(G,1,0);SND.click();}
  else if(G.phase==="dialogue"){cursor=(cursor+1)%4;SND.click();paint();}}
function fire(){
  if(G.phase==="intro"){startDay();paint();return;}
  if(G.phase==="summary"){startDay();paint();return;}
  if(G.phase==="resolve"){advance();return;}
  if(G.mode==="gun"){
    const lat=Math.round(performance.now()-(G.tell?G.tell.at:drawnAt));
    SND.gunshot(); flash=0.16;
    const before=G.outcome;
    shoot(G,Math.max(60,lat));
    afterShot(before);
    return;
  }
  if(G.phase!=="dialogue"||build.rows<10)return;
  const b=beat(); if(!b){SND.deny();return;}
  const replies=b.replies.filter(r=>r.tone!=="draw");
  const chosen=replies[cursor]; if(!chosen){SND.deny();return;}
  SND.select();
  const r=respond(G,b.replies.indexOf(chosen));
  react=r&&r.react?r.react:"";
  if(G.phase==="tell"){G.tell.at=performance.now();SND.tell();SND.tension();}
  if(G.phase==="resolve")settleSound();
  paint();
}
function choose(i){                       // the 1-4 keys and the tapped lines
  if(G.phase!=="dialogue"||G.mode!=="talk")return;
  cursor=Math.max(0,Math.min(3,i)); fire();
}
function afterShot(before){
  const d=G.duel;
  if(!d)return;
  settleSound();
  if(G.phase==="summary")endSound();
  paint();
}
function settleSound(){
  const o=G.outcome;
  if(G.ending){                                   // an authored ending
    if(G.ending.award==="arrest"){SND.thread();SND.respect();}
    else if(G.ending.award==="talked"){SND.clue();SND.point();}
    else if(G.ending.points<0){SND.alarm();SND.penalty();}
    else SND.clock();
    if(G.ending.fx&&G.ending.fx.clue)SND.clue();
  }
  else if(o==="disarmed"){SND.ricochet();SND.wound();}
  else if(o==="killed_him"){SND.hit();SND.death();bodyFall=0.01;}
  else if(o==="murder"){SND.hit();SND.death();SND.disgrace();bodyFall=0.01;}
  else if(o==="missed_him")SND.ricochet();
  else if(o==="wound_consequence"){SND.gunshot();SND.hit();}
  else if(o==="rescued_from_street"){SND.gunshot();SND.hit();setTimeout(()=>SND.patch(),400);}
  else if(o==="walked_away")SND.step();
  else SND.clock();
  if(G.phase==="summary")endSound();
}
function endSound(){
  SND.dusk();
  setTimeout(()=>{(G.over&&G.over.rating>=7)?SND.respect():SND.disgrace();},700);
}
function advance(){
  if(G.phase==="summary")return;
  const r=nextSlot(G);
  if(G.phase==="summary"){endSound();paint();return;}
  openDialogue(G); newScene(); SND.clock(); paint();
}
const CONTROL={up,down,left,right,fire,
  full:toggleGameMode,
  holster:()=>{holster(G);paint();},
  mute:()=>{const on=SND.toggle();muteBtn.textContent=on?"SOUND ON":"SOUND OFF";
    muteBtn.setAttribute("aria-pressed",on?"true":"false");}};
/* Every on-screen control carries data-cmd; the same names are the key map, so
 * a control can never exist that no handler covers. */
document.querySelectorAll("[data-cmd]").forEach(el=>{
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); SND.unlock();
    const cmd=el.dataset.cmd;
    if(cmd==="choose")choose(+el.dataset.index);
    else if(CONTROL[cmd])CONTROL[cmd]();
    else SND.deny();
    paint();
  });
});
const KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
  Enter:"fire"," ":"fire",Escape:"holster",m:"mute",g:"full",F11:"full"};
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  SND.unlock();
  if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(+e.key-1);paint();return;}
  const cmd=KEYS[e.key]||KEYS[(e.key||"").toLowerCase()];
  if(!cmd)return;
  e.preventDefault();
  CONTROL[cmd]();
  paint();
});

/* ---- the loop ----
 * One rAF loop, wrapped. Where there is no rAF - a headless harness - the
 * frame function is exposed instead so a test can step time itself. */
const RAF=typeof requestAnimationFrame==="function"?requestAnimationFrame:null;
function frame(now){
  try{
    if(build.rows<10&&now-build.at>60*build.rows){
      build.rows++;
      if(build.rows===10){if(G.phase!=="intro")SND.creak();paint();}
    }
    if(flash>0)flash-=1/60;
    if(bodyFall>0&&bodyFall<1.4)bodyFall+=0.06;
    if(G.phase!=="intro"&&G.phase!=="summary"){
      const before=G.phase;
      const ev=tick(G,now);
      if(ev&&G.phase==="resolve"){settleSound();paint();}
      if(before==="tell"&&G.phase==="duel"){SND.holster();}
    }
    drawScene(now);
  }catch(err){console.error(err);}
  if(RAF)RAF(frame);
}
globalThis.__frame=frame;
fit(); paint(); if(RAF)RAF(frame);

</script>
