<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Law of the West — Gold Gulch</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Law of the West">
<meta name="theme-color" content="#120d09">
<!-- No manifest and no worker here on purpose: this page fetches nothing, and a
     home-screen launch runs chrome-free on the apple-mobile-web-app tags above. -->

<meta name="description" content="Law of the West: a browser recreation of the 1985 Commodore 64 western. Ten people come up the street of Gold Gulch and you wear the only badge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23120d09'/%3E%3Cpath d='M50 16l8 22h23l-18 14 7 22-20-14-20 14 7-22-18-14h23z' fill='%23d8a441'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --sign:#e8cf6a;--npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
  --selbg:rgba(216,164,65,.17);
  --dlg:1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
    --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
  }
}
:root[data-theme="dark"]{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
}
:root[data-theme="light"]{
  --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
  --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
}
/* Nothing here is text to select: a long press on a control should hold the
   control, not raise the selection handles or the callout menu. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-drag:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* the two static zones: scene above, the matrix below */
#top{position:relative;flex:1 1 50%;min-height:0;background:#000;overflow:hidden}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
#bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  gap:8px;padding:2px 6px;font-size:10px;line-height:13px;color:var(--sign);
  background:rgba(10,7,4,.78);pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
/* The picture is 4:3, so upright the scene zone is exactly that and the words
   take whatever is left: no black band between the street and the dialogue. */
@media (orientation:portrait){#top{flex:0 0 auto;aspect-ratio:4/3}}
#bottom{flex:1 1 50%;min-height:0;display:flex;flex-direction:column;gap:4px;padding:6px;
  background:var(--panel);border-top:2px solid var(--line)}
/* The words must never be cut off: every line sizes to its own content, and the
   panel scrolls as a last resort rather than clipping what a character said. */
#panel{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* The four replies share whatever the visitor's line leaves, up to a limit, so
   the room under them becomes tap area instead of dead space. */
#replies{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px}
/* The matrix is set the way the machine set it: upper case, one width per
   character, tightly stacked. */
.npc,.choice{overflow-wrap:break-word;word-break:normal;hyphens:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  text-transform:uppercase;letter-spacing:.01em}
.npc{color:var(--npc);font-size:calc(13px * var(--dlg));line-height:1.3;padding:5px 6px 7px;flex:0 0 auto;
  border-bottom:2px solid var(--line)}
/* A reply is a number in its own column and the words beside it, so a line that
   wraps hangs under its own text rather than under the number. */
.choice{font-size:calc(12px * var(--dlg));line-height:1.3;padding:4px 7px;
  border:1px solid transparent;border-left:4px solid transparent;border-radius:4px;
  color:var(--ink);cursor:pointer;flex:1 1 auto;max-height:82px;min-height:0;
  display:grid;grid-template-columns:auto 1fr;gap:0 7px;
  align-content:center;align-items:start}
.choice .num{color:var(--gold);opacity:.75;font-weight:700}
.choice .txt{min-width:0}
.choice.empty{flex:0 0 0;max-height:0;padding:0;border:0;overflow:hidden}
.choice.sel{background:var(--selbg);border-color:var(--sel);font-weight:700}
.choice.sel .num{color:var(--sel);opacity:1}
.choice.dim{opacity:.55}
/* A note is a line of information, not something to press. */
.choice.note{cursor:default;flex:0 0 auto;max-height:none;font-size:calc(11px * var(--dlg))}
/* An action that should not swell to fill the screen on its own. */
.choice.act{flex:0 0 auto}
/* The reckoning, as a table rather than a run-on line: name left, count right. */
.choice.table{cursor:default;flex:0 0 auto;max-height:none;display:block;padding:5px 7px}
.tbl{display:grid;grid-template-columns:1fr auto;gap:3px 14px;
  font-size:calc(11px * var(--dlg));line-height:1.35}
.tbl .k{color:var(--dim)}
.tbl .v{color:var(--gold);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.choice.dim.sel{opacity:.8;background:none}
.choice.locked{opacity:.5;font-style:italic}
.choice.locked.sel{background:var(--panel2);color:var(--dim);border-color:var(--line);font-weight:400}
#pads{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,34px);gap:3px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none;-webkit-touch-callout:none}
/* the reply lines are controls as much as the pad is */
.choice{touch-action:manipulation;-webkit-touch-callout:none}
.btn:active{background:var(--sel);color:var(--selink)}
.abtn{width:58px;height:58px;border-radius:50%;font-size:12px;font-weight:700}
.sbtn{padding:6px 9px;font-size:11px;min-height:32px}
#meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim)}
@media (max-height:700px){ #meta{display:none} }

/* ---- full game mode ---- *
 * The page is already one screenful; game mode takes the browser's chrome with
 * it, stops every page gesture that could interrupt a held direction, and in
 * landscape puts the scene on one side and the words and controls on the other,
 * so a thumb never crosses the street. */
body.gamemode{background:#000;touch-action:none}
body.gamemode #app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.gamemode #top{flex:1 1 46%}
body.gamemode #bottom{flex:1 1 54%;border-top-width:3px}
body.gamemode #meta{display:none}
body.gamemode .npc{font-size:calc(14px * var(--dlg))}
body.gamemode .choice{font-size:calc(13px * var(--dlg));padding:6px 8px}

@media (orientation:portrait){body.gamemode #top{flex:0 0 auto;aspect-ratio:4/3}}
body.gamemode .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,42px)}
body.gamemode .abtn{width:68px;height:68px}
/* Landscape: the scene zone is itself 4:3, so the picture fills it edge to
   edge instead of being letterboxed inside a full-height column. Its width is
   whichever is smaller — a shade under two thirds of the window, or as wide as
   the window is tall allows — so on a phone held sideways the street runs the
   full height and the words keep a column they can be read in. */
@media (orientation:landscape){
  /* Sideways the two zones sit beside each other whether or not the day was
     opened full screen: a picture letterboxed into a wide short box was the
     worst of both, black down each side and the street too small to read. */
  #app{flex-direction:row;align-items:center}
  /* svh, not vh: a toolbar sliding in or out must not resize the street. */
  #top{flex:0 1 auto;width:min(62%,calc((100svh - 6px) * 4 / 3));
    height:auto;aspect-ratio:4/3}
  #bottom{flex:1 1 0;min-width:0;height:100%;align-self:stretch;
    border-top:0;border-left:2px solid var(--line)}
  #pads{margin-top:auto}
  body.gamemode #bottom{border-left-width:3px}
  body.gamemode #pads{margin-top:auto}
  body.gamemode .npc{font-size:13px}
  body.gamemode .choice{font-size:12px;padding:5px 7px}
  body.gamemode .dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,34px)}
  body.gamemode .abtn{width:56px;height:56px}
}
/* Every pressable control carries its own touch-action. The shared zoom
   guard below steps aside for anything pressable - it has to, or it eats
   the click that a fast second press makes - and it does that on the
   understanding that a control is already exempt from double-tap zoom.
   .menuitem never was, so double-tapping a menu button zoomed the page. */
.menuitem,#sound,#fs,#install,button,a{touch-action:manipulation}
</style>
</head>
<body>
<!-- arcade:start -->
<script data-shared="arcade">
/* ---- the coin-op bits every game here shares ----
 *
 * A high score table with three-letter initials, the entry screen that goes
 * with it, and one save slot. Eight games, one implementation, so the letters
 * are chosen the same way in all of them: three cells, the live one lit and
 * blinking, up and down to turn the letter, left and right to move along, fire
 * to take it. Type the letters straight in if you have a keyboard.
 *
 * The screen is built out of DOM rather than drawn into each game's canvas.
 * Half of these games draw their menus and half write markup, and the point of
 * this is that the entry screen is the same one everywhere; a canvas version
 * would have had to be written twice and would have drifted.
 *
 * Nothing here assumes anything about the page it is in beyond document.body.
 * It reads the host's colours through CSS custom properties where they exist
 * and falls back to its own where they do not.
 *
 * This file is the one copy. tools/sync-arcade.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  /* In a browser globalThis is window and this is the same object; under a test
   * harness the page's script runs in a context where they are not, and an
   * Arcade hung only on `window` would leave the bare name undefined. */
  var root=(typeof globalThis!=='undefined'&&globalThis)||window;
  if(typeof document==='undefined'||root.Arcade)return;

  /* Storage is namespaced per game, and every touch of it is guarded: it is
   * absent in a file:// sandbox on some browsers and throws on read in private
   * mode on others, and a high score table is never worth a dead page. */
  function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
  function put(k,v){try{localStorage.setItem(k,String(v));return true;}catch(e){return false;}}
  function drop(k){try{localStorage.removeItem(k);}catch(e){}}
  function readJSON(k,d){
    var raw=get(k,null);
    if(raw===null)return d;
    try{var v=JSON.parse(raw);return v===null?d:v;}catch(e){return d;}
  }

  /* A-Z, then the digits, then the three marks an arcade cabinet usually gave
   * you. A blank is last so it is one step back from A. */
  var GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-!_';
  var BLANK='_';                       /* drawn as a space, stored as a space */

  var CSS=''+
  '.ac-wrap{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'+
    'justify-content:center;padding:14px;background:rgba(6,5,10,.93);'+
    'font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;'+
    '-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}'+
  '.ac-card{width:min(380px,100%);max-height:100%;overflow-y:auto;text-align:center;'+
    'background:var(--panel,#14141f);border:1px solid var(--line,#2e2e42);'+
    'border-radius:12px;padding:14px 12px;color:var(--ink,#e6e6f2)}'+
  '.ac-h{font-size:15px;letter-spacing:.16em;font-weight:800;margin:0 0 2px;'+
    'color:var(--gold,#e8c63a)}'+
  '.ac-sub{font-size:11.5px;line-height:1.5;color:var(--dim,#9a8b76);margin:0 0 10px}'+
  '.ac-cells{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}'+
  '.ac-cell{width:52px;height:64px;display:flex;align-items:center;justify-content:center;'+
    'font-size:34px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'border:2px solid var(--line,#2e2e42);border-radius:8px;background:var(--panel2,#1e1e2d);'+
    'color:var(--ink,#e6e6f2)}'+
  /* the live cell: lit, and blinking so it is unmistakably the one you are on */
  '.ac-cell.on{border-color:var(--gold,#e8c63a);color:#16130a;'+
    'background:var(--gold,#e8c63a);animation:ac-blink 1s steps(1,end) infinite}'+
  '@keyframes ac-blink{0%,55%{opacity:1}56%,100%{opacity:.45}}'+
  '@media (prefers-reduced-motion:reduce){.ac-cell.on{animation:none}}'+
  '.ac-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}'+
  '.ac-b{background:var(--panel2,#1e1e2d);border:1px solid var(--line,#2e2e42);'+
    'border-radius:9px;color:var(--ink,#e6e6f2);font:inherit;font-size:15px;'+
    'padding:10px 4px;cursor:pointer;touch-action:manipulation}'+
  '.ac-b:active{background:var(--gold,#e8c63a);color:#16130a;border-color:var(--gold,#e8c63a)}'+
  '.ac-b.wide{grid-column:span 4;font-size:13px;font-weight:700;letter-spacing:.06em}'+
  '.ac-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'font-size:13px;line-height:1.85;text-align:left;margin:4px 0 10px}'+
  '.ac-row{display:flex;gap:8px;align-items:baseline;padding:0 4px;border-radius:5px}'+
  '.ac-row.me{background:rgba(232,198,58,.16);color:var(--gold,#e8c63a)}'+
  '.ac-rank{width:2.2em;color:var(--dim,#9a8b76);text-align:right}'+
  '.ac-ini{width:3.6em;letter-spacing:.18em}'+
  '.ac-sc{flex:1;text-align:right;font-weight:700}'+
  '.ac-x{width:7.5em;text-align:right;color:var(--dim,#9a8b76);font-size:11px}'+
  '.ac-empty{color:var(--dim,#9a8b76);font-size:12px;padding:12px 0}';

  function styles(){
    if(document.getElementById('ac-style'))return;
    var s=document.createElement('style');
    s.id='ac-style';s.textContent=CSS;
    (document.head||document.documentElement).appendChild(s);
  }

  var cfg={game:'game',slots:8,title:'HIGH SCORES',extraLabel:''};

  var K={
    scores:function(){return 'arcade.'+cfg.game+'.scores';},
    slot:function(){return 'arcade.'+cfg.game+'.slot';},
    last:function(){return 'arcade.'+cfg.game+'.initials';}
  };

  function table(){
    var rows=readJSON(K.scores(),[]);
    if(!rows||!rows.length||typeof rows.length!=='number')return[];
    return rows.filter(function(r){
      return r&&typeof r.score==='number'&&isFinite(r.score);
    }).map(function(r){
      return{ini:String(r.ini||'AAA').slice(0,3),score:Math.floor(r.score),
        at:r.at||0,extra:r.extra===undefined?'':String(r.extra)};
    }).sort(function(a,b){return b.score-a.score||a.at-b.at;}).slice(0,cfg.slots);
  }
  /* A score gets in if the table is short or it beats the last row. Ties go to
   * whoever got there first, which is what the sort above does. */
  function qualifies(score){
    if(typeof score!=='number'||!isFinite(score)||score<=0)return false;
    var t=table();
    return t.length<cfg.slots||score>t[t.length-1].score;
  }
  function record(ini,score,extra){
    var t=table();
    var row={ini:String(ini||'AAA').toUpperCase().slice(0,3),score:Math.floor(score),
      at:Date.now(),extra:extra===undefined?'':String(extra)};
    t.push(row);
    t.sort(function(a,b){return b.score-a.score||a.at-b.at;});
    t=t.slice(0,cfg.slots);
    put(K.scores(),JSON.stringify(t));
    put(K.last(),row.ini);
    return row;
  }

  /* ---- the screens ---- */
  var open=null;                       /* the overlay on screen, if any */
  function close(){
    if(!open)return;
    document.removeEventListener('keydown',open.key,true);
    if(open.el&&open.el.parentNode)open.el.parentNode.removeChild(open.el);
    open=null;
  }
  /* Can this document be built on at all? A page with no createElement is not
   * a page a screen can be put on, and the answer must be no rather than a
   * throw: the moment this is asked is the moment a game has just ended, and a
   * high score table is never worth taking the game down with it. */
  function buildable(){
    return !!(document&&typeof document.createElement==='function'&&document.body&&
      typeof document.body.appendChild==='function');
  }
  function frame(){
    styles();
    var w=document.createElement('div');w.className='ac-wrap';
    var c=document.createElement('div');c.className='ac-card';
    w.appendChild(c);
    document.body.appendChild(w);
    return{wrap:w,card:c};
  }
  function button(parent,label,fn,cls){
    var b=document.createElement('button');
    b.type='button';b.className='ac-b'+(cls?' '+cls:'');b.textContent=label;
    b.addEventListener('click',function(e){e.preventDefault();fn();});
    parent.appendChild(b);
    return b;
  }
  function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function show(opts){
    opts=opts||{};
    if(!buildable()){if(opts.onClose)opts.onClose();return null;}
    close();
    var f=frame(),rows=table();
    var h=document.createElement('p');h.className='ac-h';h.textContent=cfg.title;
    f.card.appendChild(h);
    if(opts.sub){
      var sb=document.createElement('p');sb.className='ac-sub';sb.textContent=opts.sub;
      f.card.appendChild(sb);
    }
    var list=document.createElement('div');list.className='ac-rows';
    if(!rows.length){
      var e=document.createElement('div');e.className='ac-empty';
      e.textContent='Nobody has been here yet.';
      list.appendChild(e);
    }
    rows.forEach(function(r,i){
      var row=document.createElement('div');
      row.className='ac-row'+(opts.mark&&r.at===opts.mark?' me':'');
      row.innerHTML='<span class="ac-rank">'+(i+1)+'</span>'+
        '<span class="ac-ini"></span><span class="ac-sc"></span>'+
        (cfg.extraLabel?'<span class="ac-x"></span>':'');
      row.querySelector('.ac-ini').textContent=r.ini;
      row.querySelector('.ac-sc').textContent=fmt(r.score);
      if(cfg.extraLabel)row.querySelector('.ac-x').textContent=r.extra||'';
      list.appendChild(row);
    });
    f.card.appendChild(list);
    var pad=document.createElement('div');pad.className='ac-pad';
    f.card.appendChild(pad);
    var done=opts.onClose||function(){};
    button(pad,'BACK',function(){close();done();},'wide');
    open={el:f.wrap,key:function(ev){
      if(ev.key==='Escape'||ev.key==='Enter'||ev.key===' '){
        ev.preventDefault();ev.stopPropagation();close();done();
      }
    }};
    document.addEventListener('keydown',open.key,true);
    return f;
  }

  /* The entry screen. Three cells, the live one lit; the rest is one keydown
   * handler taken at the capture phase so the game underneath never sees the
   * letters being chosen. */
  function entry(score,extra,then){
    if(!buildable()){then(null);return null;}
    close();
    var f=frame();
    var seed=(get(K.last(),'AAA')+'AAA').slice(0,3).toUpperCase();
    var idx=[0,1,2].map(function(i){
      var p=GLYPHS.indexOf(seed[i]);return p<0?0:p;
    });
    var at=0,fin=false;

    var h=document.createElement('p');h.className='ac-h';
    h.textContent='NEW HIGH SCORE';
    var sub=document.createElement('p');sub.className='ac-sub';
    sub.textContent=fmt(Math.floor(score))+(extra?'  ·  '+extra:'')+
      '  —  enter your initials';
    f.card.appendChild(h);f.card.appendChild(sub);

    var cells=document.createElement('div');cells.className='ac-cells';
    var cellEls=[0,1,2].map(function(){
      var d=document.createElement('div');d.className='ac-cell';
      cells.appendChild(d);return d;
    });
    f.card.appendChild(cells);
    function paint(){
      for(var i=0;i<3;i++){
        var g=GLYPHS[idx[i]];
        cellEls[i].textContent=g===BLANK?' ':g;
        cellEls[i].className='ac-cell'+(i===at?' on':'');
      }
    }
    function turn(d){idx[at]=(idx[at]+d+GLYPHS.length)%GLYPHS.length;paint();}
    function move(d){at=Math.max(0,Math.min(2,at+d));paint();}
    function setGlyph(ch){
      var p=GLYPHS.indexOf(ch);
      if(p<0)return false;
      idx[at]=p;
      if(at<2){at++;}
      paint();return true;
    }
    function finish(){
      if(fin)return;
      fin=true;
      var ini=idx.map(function(i){
        var g=GLYPHS[i];return g===BLANK?' ':g;
      }).join('').replace(/\s+$/,'');
      if(!ini)ini='AAA';
      var row=record(ini,score,extra);
      close();
      then(row);
    }

    var pad=document.createElement('div');pad.className='ac-pad';
    f.card.appendChild(pad);
    button(pad,'◀',function(){move(-1);});
    button(pad,'▲',function(){turn(1);});
    button(pad,'▼',function(){turn(-1);});
    button(pad,'▶',function(){move(1);});
    button(pad,'ENTER',finish,'wide');

    open={el:f.wrap,key:function(ev){
      var k=ev.key;
      var used=true;
      if(k==='ArrowUp'||k==='w'||k==='W')turn(1);
      else if(k==='ArrowDown'||k==='s'||k==='S')turn(-1);
      else if(k==='ArrowLeft'||k==='a'||k==='A')move(-1);
      else if(k==='ArrowRight'||k==='d'||k==='D')move(1);
      else if(k==='Enter')finish();
      else if(k==='Backspace'){if(at>0)move(-1);else turn(0);}
      else if(k&&k.length===1&&setGlyph(k.toUpperCase())){/* typed straight in */}
      else used=false;
      if(used){ev.preventDefault();ev.stopPropagation();}
    }};
    document.addEventListener('keydown',open.key,true);
    paint();
    return f;
  }

  root.Arcade={
    /* name the game once, at boot */
    init:function(o){
      o=o||{};
      cfg.game=String(o.game||'game');
      cfg.slots=Math.max(1,Math.min(20,o.slots||8));
      if(o.title)cfg.title=String(o.title);
      cfg.extraLabel=o.extraLabel?String(o.extraLabel):'';
      return this;
    },
    glyphs:GLYPHS,
    table:table,
    qualifies:qualifies,
    /* Offer the entry screen if the score is worth one; `then` gets the row
     * that was written, or null if it was not a high score at all. */
    submit:function(score,extra,then){
      then=then||function(){};
      if(!qualifies(score)||!buildable()){then(null);return false;}
      entry(score,extra,then);
      return true;
    },
    /* whether a screen can be put up here at all */
    canAsk:buildable,
    show:function(opts){show(opts);return this;},
    close:close,
    isOpen:function(){return !!open;},
    /* for the tests and for a player who wants their table back */
    clear:function(){drop(K.scores());return this;},
    record:record,
    /* ---- the save slot ----
     * One per game. What goes in it is the game's business; all this does is
     * keep it, namespaced, and admit when it could not. */
    save:function(state){
      try{return put(K.slot(),JSON.stringify({v:1,at:Date.now(),state:state}));}
      catch(e){return false;}
    },
    load:function(){
      var s=readJSON(K.slot(),null);
      return s&&s.state!==undefined?s.state:null;
    },
    savedAt:function(){
      var s=readJSON(K.slot(),null);
      return s&&s.at?s.at:0;
    },
    hasSave:function(){return this.load()!==null;},
    clearSave:function(){drop(K.slot());return this;}
  };
})();
</script>
<!-- arcade:end -->

<script data-shared="no-zoom">
/* ---- the pinch and the double tap ---- *
 *
 * iOS Safari has ignored `user-scalable=no` and `maximum-scale` in the viewport
 * meta tag since iOS 10. Every one of these pages carried both and neither did
 * anything, so a double tap anywhere - on the glass, on a control, on the black
 * - zoomed the page, and a zoomed page puts the controls off the edge of the
 * screen. In a game with a clock running that is not an inconvenience, it is a
 * death, and full screen does not help because the zoom is applied to the
 * visual viewport on top of whatever the layout is doing.
 *
 * Three things are needed and the meta tag is none of them:
 *
 *   1. gesturestart / gesturechange / gestureend. This is how WebKit offers a
 *      pinch, and it exists on no other engine.
 *   2. A non-passive touchend that eats the second tap of a double tap. It has
 *      to be non-passive or preventDefault is ignored outright, and it has to
 *      be touchend rather than dblclick, because the zoom is committed before
 *      a dblclick is ever dispatched.
 *   3. A way back for a player who is zoomed already, because neither of the
 *      above can un-zoom a page that is. Rewriting the viewport meta is the
 *      only lever a page has over WebKit's zoom, and it only fires on a real
 *      change, so the content is toggled rather than re-set.
 *
 * This file is the one copy. tools/sync-nozoom.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  var D=document, W=window;
  if(!D.addEventListener)return;
  for(var i=0,g=["gesturestart","gesturechange","gestureend"];i<g.length;i++)
    D.addEventListener(g[i],function(e){e.preventDefault();},{passive:false});
  /* Eating the second tap of a double tap eats the click the browser makes
   * out of it, and every game here has controls that listen for one - so on a
   * control this would cost the player every second press of a fast mash,
   * which in a game about pressing fire quickly is worse than the zoom. The
   * controls do not need it: a button carrying touch-action none or
   * manipulation is already exempt from double-tap zoom on every engine that
   * honours it. So the guard leaves anything pressable alone and covers the
   * rest of the page, which is where the zoom was coming from. */
  var PRESSABLE="button,a,input,select,textarea,label,[data-cmd],[role=button]";
  function pressable(t){
    return !!(t&&t.closest&&t.closest(PRESSABLE));
  }
  var lastTap=0;
  D.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTap<=350&&e.cancelable&&!pressable(e.target))e.preventDefault();
    lastTap=now;
  },{passive:false});
  /* A second finger is a pinch wherever it lands, and no game here wants one. */
  D.addEventListener("touchstart",function(e){
    if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault();
  },{passive:false});

  var vv=W.visualViewport, meta=D.querySelector('meta[name="viewport"]');
  if(!vv||!meta)return;
  var base=meta.getAttribute("content"), fixing=false;
  function unzoom(){
    if(fixing||vv.scale<=1.01)return;
    fixing=true;
    meta.setAttribute("content",base+", minimum-scale=1");
    W.setTimeout(function(){
      meta.setAttribute("content",base);
      fixing=false;
      if(W.scrollTo)W.scrollTo(0,0);
    },50);
  }
  vv.addEventListener("resize",unzoom);
  vv.addEventListener("scroll",unzoom);
  W.__unzoom=unzoom;                 // so a harness can ask for it directly
})();
</script>
<!-- no-zoom:end -->
