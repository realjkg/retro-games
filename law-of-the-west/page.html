<meta name="description" content="Law of the West: a browser recreation of the 1985 Commodore 64 western. Ten people come up the street of Gold Gulch and you wear the only badge.">

<style>
:root{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --sign:#e8cf6a;--npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
  --selbg:rgba(216,164,65,.17);
  --dlg:1;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
    --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
  }
}
:root[data-theme="dark"]{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2016; --ink:#f2e6d2; --dim:#b09a7c;
  --gold:#d8a441; --line:#40311f; --npc:#e8cf6a; --sel:#d8a441; --selink:#1a1207;
}
:root[data-theme="light"]{
  --bg:#efe4d2; --panel:#fbf4e6; --panel2:#f3e8d4; --ink:#241a10; --dim:#6b5638;
  --gold:#8a5a12; --line:#d2bc98; --npc:#7a4c06; --sel:#8a5a12; --selink:#fdf6e8;
}
/* Nothing here is text to select: a long press on a control should hold the
   control, not raise the selection handles or the callout menu. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-drag:none;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* the two static zones: scene above, the matrix below */
#top{position:relative;flex:1 1 50%;min-height:0;background:#000;overflow:hidden}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
#bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  gap:8px;padding:2px 6px;font-size:10px;line-height:13px;color:var(--sign);
  background:rgba(10,7,4,.78);pointer-events:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
/* The picture is 4:3, so upright the scene zone is exactly that and the words
   take whatever is left: no black band between the street and the dialogue. */
@media (orientation:portrait){#top{flex:0 0 auto;aspect-ratio:4/3}}
#bottom{flex:1 1 50%;min-height:0;display:flex;flex-direction:column;gap:4px;padding:6px;
  background:var(--panel);border-top:2px solid var(--line)}
/* The words must never be cut off: every line sizes to its own content, and the
   panel scrolls as a last resort rather than clipping what a character said. */
#panel{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* The four replies share whatever the visitor's line leaves, up to a limit, so
   the room under them becomes tap area instead of dead space. */
#replies{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:3px}
/* The matrix is set the way the machine set it: upper case, one width per
   character, tightly stacked. */
.npc,.choice{overflow-wrap:break-word;word-break:normal;hyphens:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  text-transform:uppercase;letter-spacing:.01em}
.npc{color:var(--npc);font-size:calc(13px * var(--dlg));line-height:1.3;padding:5px 6px 7px;flex:0 0 auto;
  border-bottom:2px solid var(--line)}
/* A reply is a number in its own column and the words beside it, so a line that
   wraps hangs under its own text rather than under the number. */
.choice{font-size:calc(12px * var(--dlg));line-height:1.3;padding:4px 7px;
  border:1px solid transparent;border-left:4px solid transparent;border-radius:4px;
  color:var(--ink);cursor:pointer;flex:1 1 auto;max-height:82px;min-height:0;
  display:grid;grid-template-columns:auto 1fr;gap:0 7px;
  align-content:center;align-items:start}
.choice .num{color:var(--gold);opacity:.75;font-weight:700}
.choice .txt{min-width:0}
.choice.empty{flex:0 0 0;max-height:0;padding:0;border:0;overflow:hidden}
.choice.sel{background:var(--selbg);border-color:var(--sel);font-weight:700}
.choice.sel .num{color:var(--sel);opacity:1}
.choice.dim{opacity:.55}
/* A note is a line of information, not something to press. */
.choice.note{cursor:default;flex:0 0 auto;max-height:none;font-size:calc(11px * var(--dlg))}
/* An action that should not swell to fill the screen on its own. */
.choice.act{flex:0 0 auto}
/* The reckoning, as a table rather than a run-on line: name left, count right. */
.choice.table{cursor:default;flex:0 0 auto;max-height:none;display:block;padding:5px 7px}
.tbl{display:grid;grid-template-columns:1fr auto;gap:3px 14px;
  font-size:calc(11px * var(--dlg));line-height:1.35}
.tbl .k{color:var(--dim)}
.tbl .v{color:var(--gold);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.choice.dim.sel{opacity:.8;background:none}
.choice.locked{opacity:.5;font-style:italic}
.choice.locked.sel{background:var(--panel2);color:var(--dim);border-color:var(--line);font-weight:400}
#pads{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none;-webkit-touch-callout:none}
/* the reply lines are controls as much as the pad is */
.choice{touch-action:manipulation;-webkit-touch-callout:none}
.btn:active{background:var(--sel);color:var(--selink)}
.abtn{width:58px;height:58px;border-radius:50%;font-size:12px;font-weight:700}
.sbtn{padding:6px 9px;font-size:11px;min-height:32px}
#meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim)}
@media (max-height:700px){ #meta{display:none} }

/* ---- full game mode ---- *
 * The page is already one screenful; game mode takes the browser's chrome with
 * it, stops every page gesture that could interrupt a held direction, and in
 * landscape puts the scene on one side and the words and controls on the other,
 * so a thumb never crosses the street. */
body.gamemode{background:#000;touch-action:none}
body.gamemode #app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.gamemode #top{flex:1 1 46%}
body.gamemode #bottom{flex:1 1 54%;border-top-width:3px}
body.gamemode #meta{display:none}
body.gamemode .npc{font-size:calc(14px * var(--dlg))}
body.gamemode .choice{font-size:calc(13px * var(--dlg));padding:6px 8px}

@media (orientation:portrait){body.gamemode #top{flex:0 0 auto;aspect-ratio:4/3}}
body.gamemode .abtn{width:68px;height:68px}
/* The stick takes the d-pad's place, and grows with the rest of it. */
body.gamemode .jstick{width:152px;height:152px}
body.gamemode .jstick .jknob{width:64px;height:64px;margin:-32px 0 0 -32px}
/* Landscape: the scene zone is itself 4:3, so the picture fills it edge to
   edge instead of being letterboxed inside a full-height column. Its width is
   whichever is smaller — a shade under two thirds of the window, or as wide as
   the window is tall allows — so on a phone held sideways the street runs the
   full height and the words keep a column they can be read in. */
@media (orientation:landscape){
  /* Sideways the two zones sit beside each other whether or not the day was
     opened full screen: a picture letterboxed into a wide short box was the
     worst of both, black down each side and the street too small to read. */
  #app{flex-direction:row;align-items:center}
  /* svh, not vh: a toolbar sliding in or out must not resize the street. */
  #top{flex:0 1 auto;width:min(62%,calc((100svh - 6px) * 4 / 3));
    height:auto;aspect-ratio:4/3}
  #bottom{flex:1 1 0;min-width:0;height:100%;align-self:stretch;
    border-top:0;border-left:2px solid var(--line)}
  #pads{margin-top:auto}
  body.gamemode #bottom{border-left-width:3px}
  body.gamemode #pads{margin-top:auto}
  body.gamemode .npc{font-size:13px}
  body.gamemode .choice{font-size:12px;padding:5px 7px}
  body.gamemode .abtn{width:56px;height:56px}
  body.gamemode .jstick{width:126px;height:126px}
  body.gamemode .jstick .jknob{width:54px;height:54px;margin:-27px 0 0 -27px}
}
/* Every pressable control carries its own touch-action. The shared zoom
   guard below steps aside for anything pressable - it has to, or it eats
   the click that a fast second press makes - and it does that on the
   understanding that a control is already exempt from double-tap zoom.
   .menuitem never was, so double-tapping a menu button zoomed the page. */
.menuitem,#sound,#fs,#install,button,a{touch-action:manipulation}
</style>
</head>
<body>
<!-- stick:start -->
<script data-shared="stick">
/* ---- the Apple IIe joystick, on the glass ---- *
 *
 * The machines these games came off had a stick, not a d-pad: two pots and two
 * buttons, and the games were written for it. A three-by-three grid of buttons
 * is a later idea from a different console, and on a phone it is the worse of
 * the two - nine targets a thumb finds by feel, with hard edges between them,
 * so a thumb drifting from the left button to the up one crosses the corner
 * and stops the player dead mid-stride.
 *
 * This is the stick instead: one round gate, a knob that follows the thumb, and
 * the pointer taken captive on the way down so a thumb that slides off the pad
 * keeps steering instead of handing the gesture back to the page. That last
 * part is also why it helps with the zoom - a captured pointer inside a
 * touch-action:none gate is not a scroll, a pull-to-refresh, the first finger
 * of a pinch, or a long press the browser can put a magnifier on top of. The
 * guard in shared/no-zoom.js still does its half; this stops the control
 * surface itself from ever starting one of those gestures.
 *
 * The games below still read directions, not angles, so the vector is turned
 * back into up/down/left/right - four ways or eight - and handed over on the
 * edge, when a direction is entered or left. A game wires it to the same key
 * state its d-pad set and nothing else about the game changes.
 *
 * One copy. tools/sync-stick.js writes it into each page that uses it.
 *
 *   Stick.make({host:'#stickhost', ways:4, onDirs:function(now,was){...}})
 *
 * host  element or selector, the gate is built inside it | ways 4 or 8
 * axes  'xy' (default), 'x' or 'y' | dead  deadzone 0..1, default .34
 * label aria-label | unlock  called on the way down, for the audio unlock
 * onDirs(now,was) only when the set changes | onMove(x,y,held) every move
 *
 * It returns {el,x,y,held,dirs,radius,release} and keeps x/y/held/dirs live.
 */
(function(root){
  'use strict';
  var D=root&&root.document;
  var CSS=
   '.jstick{position:relative;width:136px;height:136px;border-radius:50%;flex:0 0 auto;'+
     'background:var(--panel2,#2a2f45);border:1px solid var(--line,#4a5170);'+
     'touch-action:none;cursor:grab;-webkit-touch-callout:none;'+
     '-webkit-user-select:none;user-select:none;-webkit-user-drag:none;'+
     '-webkit-tap-highlight-color:transparent}'+
   '.jstick .jring{position:absolute;inset:13px;border-radius:50%;'+
     'border:1px dashed var(--line,#4a5170);opacity:.55;pointer-events:none}'+
   '.jstick .jtick{position:absolute;background:var(--dim,#8a90ad);opacity:.5;'+
     'pointer-events:none}'+
   '.jstick .j-u,.jstick .j-d{left:50%;width:2px;height:7px;margin-left:-1px}'+
   '.jstick .j-l,.jstick .j-r{top:50%;height:2px;width:7px;margin-top:-1px}'+
   '.jstick .j-u{top:4px}.jstick .j-d{bottom:4px}'+
   '.jstick .j-l{left:4px}.jstick .j-r{right:4px}'+
   '.jstick .jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;'+
     'margin:-29px 0 0 -29px;border-radius:50%;'+
     /* The knob has to read against the gate in nine different palettes, two
      * of which flip for light mode. --dim is the one mid-tone every game
      * defines and the only one that contrasts with --panel2 both ways round;
      * a game that wants its own can set --knob. */
     'background:var(--knob,var(--dim,#46537a));'+
     'border:2px solid var(--line,#4a5170);pointer-events:none;'+
     'box-shadow:0 2px 0 rgba(0,0,0,.35) inset;transition:background .08s linear}'+
   '.jstick.on{cursor:grabbing}'+
   '.jstick.on .jknob{background:var(--gold,#e8c06a);border-color:var(--gold,#e8c06a)}'+
   /* The middle cell of the d-pad was never a direction in any of these games -
    * it was WALK, HOVER, MENU, HOLSTER. A round gate has no middle cell to put
    * it in, so it stands beside the stick instead of being quietly lost. */
   '.jstickwrap{display:flex;flex-direction:column;align-items:center;gap:6px;'+
     'flex:0 0 auto}'+
   '.jstickwrap .jaside{display:flex;gap:6px;align-items:center}'+
   '@media (max-width:360px){.jstick{width:116px;height:116px}'+
     '.jstick .jknob{width:50px;height:50px;margin:-25px 0 0 -25px}}';

  function css(){
    if(!D||!D.head||D.getElementById('jstick-css'))return;
    var st=D.createElement('style');
    st.id='jstick-css';
    st.appendChild(D.createTextNode(CSS));
    D.head.appendChild(st);
  }

  function clamp(v,a,b){return v<a?a:v>b?b:v;}

  /* Four-way is winner-takes-all: the bigger component wins, so a thumb that
   * wanders off true never gives a diagonal a game cannot use. Eight-way calls
   * a direction pushed once its component is better than a third of the throw,
   * which puts the diagonal wedges at roughly the same width as the straights. */
  function dirsOf(x,y,ways,dead){
    var d={u:false,d:false,l:false,r:false};
    var m=Math.sqrt(x*x+y*y);
    if(m<dead)return d;
    if(ways===8){
      if(y<-0.38*m)d.u=true; else if(y>0.38*m)d.d=true;
      if(x<-0.38*m)d.l=true; else if(x>0.38*m)d.r=true;
    }else if(Math.abs(x)>=Math.abs(y)){
      if(x<0)d.l=true; else d.r=true;
    }else{
      if(y<0)d.u=true; else d.d=true;
    }
    return d;
  }
  function same(a,b){return a.u===b.u&&a.d===b.d&&a.l===b.l&&a.r===b.r;}

  /* The test harnesses run each game's script in a bare vm with a document
   * stubbed down to what the game asks for, and none of them has a head to
   * hang a stylesheet on. A control surface that cannot be built is not an
   * error there - it is a page with no pads - so this refuses softly and the
   * game runs on its keyboard. */
  function buildable(){
    return !!(D&&D.createElement&&D.head&&D.querySelector);
  }

  function make(o){
    o=o||{};
    if(!buildable())return null;
    var host=null;
    try{host=typeof o.host==='string'?D.querySelector(o.host):o.host;}catch(e){}
    if(!host||!host.appendChild)return null;
    css();
    var axes=o.axes||'xy', ways=o.ways===8?8:4;
    var dead=typeof o.dead==='number'?o.dead:0.34;

    var el=D.createElement('div');
    el.className='jstick';
    el.setAttribute('role','application');
    el.setAttribute('aria-label',o.label||'Joystick');
    var html='<i class="jring" aria-hidden="true"></i>';
    if(axes.indexOf('y')>=0)
      html+='<i class="jtick j-u" aria-hidden="true"></i><i class="jtick j-d" aria-hidden="true"></i>';
    if(axes.indexOf('x')>=0)
      html+='<i class="jtick j-l" aria-hidden="true"></i><i class="jtick j-r" aria-hidden="true"></i>';
    html+='<i class="jknob" aria-hidden="true"></i>';
    el.innerHTML=html;
    host.appendChild(el);
    var knob=el.querySelector('.jknob');

    var S={el:el,x:0,y:0,held:false,dirs:dirsOf(0,0,ways,dead),radius:radius,
           release:release};

    /* The throw is measured off the knob rather than guessed, because the gate
     * and the knob are both sized in a media query and a guessed number let the
     * knob ride out over its own rim. */
    function radius(){
      var r=el.getBoundingClientRect();
      var kw=(knob&&knob.offsetWidth)||52;
      if(!r||!r.width)return 48;
      return Math.max(16,r.width/2-kw/2-3);
    }
    function paint(dx,dy){
      if(knob)knob.style.transform='translate('+Math.round(dx)+'px,'+Math.round(dy)+'px)';
    }
    function settle(x,y,held){
      S.x=x;S.y=y;S.held=held;
      var next=dirsOf(x,y,ways,dead), was=S.dirs;
      if(!same(next,was)){S.dirs=next; if(o.onDirs)o.onDirs(next,was);}
      if(o.onMove)o.onMove(x,y,held);
    }
    function moveTo(ev){
      var r=el.getBoundingClientRect(), R=radius();
      var dx=axes.indexOf('x')>=0?ev.clientX-(r.left+r.width/2):0;
      var dy=axes.indexOf('y')>=0?ev.clientY-(r.top+r.height/2):0;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d>R){dx=dx/d*R;dy=dy/d*R;}
      paint(dx,dy);
      settle(clamp(dx/R,-1,1),clamp(dy/R,-1,1),true);
    }
    function release(){
      id=null;
      el.classList.remove('on');
      paint(0,0);
      settle(0,0,false);
    }

    var id=null;
    el.addEventListener('pointerdown',function(e){
      if(e.preventDefault)e.preventDefault();
      if(o.unlock)o.unlock();
      try{el.setPointerCapture&&el.setPointerCapture(e.pointerId);}catch(err){}
      id=e.pointerId; el.classList.add('on');
      moveTo(e);
    });
    el.addEventListener('pointermove',function(e){
      if(id!==e.pointerId)return;
      if(e.preventDefault)e.preventDefault();
      moveTo(e);
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
      el.addEventListener(ev,function(e){ if(id===e.pointerId)release(); });
    });
    /* A pointer the page loses track of entirely - the tab going away mid-dive,
     * a gesture the browser takes over - must still let go, or the player comes
     * back to a character walking into a wall. */
    if(root.addEventListener){
      root.addEventListener('blur',function(){if(S.held)release();});
      D.addEventListener('visibilitychange',function(){if(D.hidden&&S.held)release();});
    }

    /* A keyboard is a stick with four positions, and the knob has to say so or
     * the player on a keyboard is looking at a control that never moves. */
    S.showKeys=function(kx,ky){
      if(S.held)return;
      var R=radius();
      paint(kx*R,ky*R);
      el.classList.toggle('on',!!(kx||ky));
    };
    return S;
  }

  root.Stick={make:make,dirsOf:dirsOf,buildable:buildable,css:CSS};
})(typeof window!=='undefined'?window:this);
</script>
<!-- stick:end -->
<div id="app">
  <div id="top">
    <canvas id="scene" width="320" height="200" aria-label="Main street, Gold Gulch"></canvas>
    <div id="bar"><span id="mode">TALKING — up to draw</span><span id="score">Standing 0</span></div>
  </div>
  <div id="bottom">
    <div id="panel" role="group" aria-label="Dialogue">
      <div id="line0" class="npc">LAW OF THE WEST — GOLD GULCH</div>
      <div id="replies">
        <div id="line1" class="choice sel" data-cmd="choose" data-index="0"></div>
        <div id="line2" class="choice" data-cmd="choose" data-index="1"></div>
        <div id="line3" class="choice" data-cmd="choose" data-index="2"></div>
        <div id="line4" class="choice" data-cmd="choose" data-index="3"></div>
      </div>
    </div>
    <div id="pads">
      <!-- The sights used to be run with four buttons and a corner you could
           not reach. shared/stick.js builds a stick into #stickhost instead:
           eight ways, so a diagonal is a push rather than two presses at once.
           HOLSTER was the middle cell and was never a direction. -->
      <div class="jstickwrap">
        <div id="stickhost"></div>
        <div class="jaside">
          <div class="btn sbtn" data-cmd="holster">HOL</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        <div class="btn abtn" data-cmd="fire">FIRE</div>
        <div style="display:flex;gap:5px">
          <button class="btn sbtn" id="mute" type="button" data-cmd="mute" aria-pressed="true">SOUND ON</button>
          <button class="btn sbtn" id="full" type="button" data-cmd="full" aria-pressed="false">FULL</button>
        </div>
      </div>
    </div>
    <div id="meta"><span>Up draws · down holsters · 1-4 or FIRE to speak · m mutes · g full screen</span></div>
  </div>
</div>

<!-- no-zoom:start -->
<script data-shared="no-zoom">
/* ---- the pinch and the double tap ---- *
 *
 * iOS Safari has ignored `user-scalable=no` and `maximum-scale` in the viewport
 * meta tag since iOS 10. Every one of these pages carried both and neither did
 * anything, so a double tap anywhere - on the glass, on a control, on the black
 * - zoomed the page, and a zoomed page puts the controls off the edge of the
 * screen. In a game with a clock running that is not an inconvenience, it is a
 * death, and full screen does not help because the zoom is applied to the
 * visual viewport on top of whatever the layout is doing.
 *
 * Three things are needed and the meta tag is none of them:
 *
 *   1. gesturestart / gesturechange / gestureend. This is how WebKit offers a
 *      pinch, and it exists on no other engine.
 *   2. A non-passive touchend that eats the second tap of a double tap. It has
 *      to be non-passive or preventDefault is ignored outright, and it has to
 *      be touchend rather than dblclick, because the zoom is committed before
 *      a dblclick is ever dispatched.
 *   3. A way back for a player who is zoomed already, because neither of the
 *      above can un-zoom a page that is. Rewriting the viewport meta is the
 *      only lever a page has over WebKit's zoom, and it only fires on a real
 *      change, so the content is toggled rather than re-set.
 *
 * This file is the one copy. tools/sync-nozoom.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  var D=document, W=window;
  if(!D.addEventListener)return;
  for(var i=0,g=["gesturestart","gesturechange","gestureend"];i<g.length;i++)
    D.addEventListener(g[i],function(e){e.preventDefault();},{passive:false});
  /* Eating the second tap of a double tap eats the click the browser makes
   * out of it, and every game here has controls that listen for one - so on a
   * control this would cost the player every second press of a fast mash,
   * which in a game about pressing fire quickly is worse than the zoom. The
   * controls do not need it: a button carrying touch-action none or
   * manipulation is already exempt from double-tap zoom on every engine that
   * honours it. So the guard leaves anything pressable alone and covers the
   * rest of the page, which is where the zoom was coming from. */
  var PRESSABLE="button,a,input,select,textarea,label,[data-cmd],[role=button]";
  function pressable(t){
    return !!(t&&t.closest&&t.closest(PRESSABLE));
  }
  var lastTap=0;
  D.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTap<=350&&e.cancelable&&!pressable(e.target))e.preventDefault();
    lastTap=now;
  },{passive:false});
  /* A second finger is a pinch wherever it lands, and no game here wants one. */
  D.addEventListener("touchstart",function(e){
    if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault();
  },{passive:false});

  /* ---- the long press ---- *
   *
   * The other half of the same complaint. Holding a control down - which is
   * what a player does with FIRE, and what a stuck thumb does with a d-pad -
   * raises iOS's own callout: the magnifier, the selection handles, the
   * copy/define bubble, the drag-out ghost of an image. While that is up the
   * page has stopped receiving the press, so the control is dead until the
   * player lets go and taps somewhere to dismiss it. There is no event to
   * cancel; it is suppressed with CSS or not at all, and no game here had a
   * single one of these four properties set on a single control.
   *
   * This goes in first in the head rather than last, so it is a default a
   * page can still override - the joystick pads ask for touch-action:none
   * and must keep it. Inputs are left out of the selection rules: the only
   * typing in the collection is the three-letter initials, and a field the
   * player cannot select is a field they cannot correct. */
  var head=D.head||D.getElementsByTagName("head")[0];
  if(head){
    var st=D.createElement("style");
    st.setAttribute("data-nozoom","press");
    st.appendChild(D.createTextNode(
      /* .stick/.jstick/#stick are the joysticks. They are plain divs, so
       * nothing in PRESSABLE matched them - and a stick is the one control a
       * player holds down for seconds at a time, which is precisely when iOS
       * offers the callout. They were the biggest hole in this list. */
      PRESSABLE+",canvas,.menuitem,.stick,.jstick,#stick{-webkit-touch-callout:none;"+
      "-webkit-user-select:none;user-select:none;"+
      "-webkit-user-drag:none;"+
      "-webkit-tap-highlight-color:transparent}"+
      "input,textarea{-webkit-user-select:auto;user-select:auto}"+
      "button,a,label,[data-cmd],[role=button],.menuitem{touch-action:manipulation}"+
      "img{-webkit-user-drag:none}"));
    head.insertBefore(st,head.firstChild);
  }

  var vv=W.visualViewport, meta=D.querySelector('meta[name="viewport"]');
  if(!vv||!meta)return;
  var base=meta.getAttribute("content"), fixing=false;
  function unzoom(){
    if(fixing||vv.scale<=1.01)return;
    fixing=true;
    meta.setAttribute("content",base+", minimum-scale=1");
    W.setTimeout(function(){
      meta.setAttribute("content",base);
      fixing=false;
      if(W.scrollTo)W.scrollTo(0,0);
    },50);
  }
  vv.addEventListener("resize",unzoom);
  vv.addEventListener("scroll",unzoom);
  W.__unzoom=unzoom;                 // so a harness can ask for it directly
})();
</script>
<!-- no-zoom:end -->
<!-- launcher:start -->
<script data-shared="launcher">
/* ---- the way back to the launcher ----
 *
 * Every game here is its own page, and until now only one of them had a link
 * back to the collection it belongs to: open a game directly, or install it to
 * a home screen, and the rest of the cabinet was unreachable without editing
 * the address bar.
 *
 * Where it goes took two tries and a measurement.
 *
 * Seven of these pages are flex columns whose wrap has flex:1, so the last
 * child of the body settles at the bottom of the viewport on its own: under
 * the controls, covering nothing. Law of the West is not one of them - its
 * whole interface is a position:fixed #app over a body with no flow at all,
 * and appended there the link landed at the top of the page and shoved the
 * game down it.
 *
 * Pinning it to the bottom of the viewport instead fixed that one and broke
 * seven: measured against every control on every page, a fixed chip sat on a
 * full-screen button in five of them and on Galaga's thumb stick.
 *
 * So it goes in the flow; and if the flow turns out not to have put it near
 * the bottom - which is what a body with nothing in it looks like from here -
 * it moves into whatever element is actually covering the screen and rides
 * that one's layout instead.
 *
 * The lettering is the collection's own: monospace, wide-spaced, upper case,
 * and split a little cyan to the left and magenta to the right the way a
 * mistuned tube did it.
 *
 * This file is the one copy. tools/sync-launcher.js writes it into each page
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  if(typeof document==='undefined')return;
  if(document.getElementById('rg-launch'))return;

  var CSS=''+
  '#rg-launch{display:block;margin:8px auto calc(env(safe-area-inset-bottom) + 2px);'+
    'padding:6px 13px;border-radius:999px;flex:0 0 auto;'+
    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;'+
    'font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;'+
    'text-decoration:none;color:#fff8e6;background:rgba(10,7,19,.72);'+
    'border:1px solid rgba(255,210,127,.32);text-align:center;width:max-content;'+
    'max-width:92%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;'+
    'text-shadow:-1px 0 0 rgba(56,232,255,.75),1px 0 0 rgba(255,62,165,.75),'+
      '0 0 10px rgba(255,210,127,.45)}'+
  '#rg-launch:hover,#rg-launch:focus-visible{border-color:rgba(255,210,127,.7);'+
    'background:rgba(20,14,32,.9);outline:none}'+
  '#rg-launch:active{transform:translateY(1px)}'+
  '#rg-launch .rg-c{color:#ffd27f;text-shadow:none;margin-right:.5em}'+
  /* a tube that has been on a while */
  '@keyframes rg-flick{0%,96%,100%{opacity:1}97%{opacity:.78}98%{opacity:1}99%{opacity:.88}}'+
  '#rg-launch{animation:rg-flick 9s steps(1) infinite}'+
  '@media (prefers-reduced-motion:reduce){#rg-launch{animation:none}}';

  function put(){
    if(document.getElementById('rg-launch'))return;
    var s=document.createElement('style');
    s.id='rg-launch-style';s.textContent=CSS;
    (document.head||document.documentElement).appendChild(s);
    var a=document.createElement('a');
    a.id='rg-launch';
    /* One level up is the collection, whether that is a folder on a disk or
     * the Pages site. Relative so it works from file:// as well. */
    a.href='../';
    a.setAttribute('aria-label','Back to the Retro Games launcher');
    a.innerHTML='<span class="rg-c">◀</span>Retro Games';
    var host=document.body||document.documentElement;
    host.appendChild(a);
    /* Did the flow put it near the bottom? If not, this page keeps its
     * interface somewhere other than the body, and the link belongs there. */
    try{
      var r=a.getBoundingClientRect();
      if(r.top<(window.innerHeight||0)*0.5){
        var best=null,area=0,all=document.body.querySelectorAll('*');
        for(var i=0;i<all.length;i++){
          var el=all[i];
          if(el===a||el.contains(a))continue;
          var cs=window.getComputedStyle(el);
          if(cs.position!=='fixed'&&cs.position!=='absolute')continue;
          var q=el.getBoundingClientRect();
          if(q.height<window.innerHeight*0.8)continue;
          if(q.width*q.height>area){area=q.width*q.height;best=el;}
        }
        if(best)best.appendChild(a);
      }
    }catch(e){}
  }
  if(document.body)put();
  else document.addEventListener('DOMContentLoaded',put);
})();
</script>
<!-- launcher:end -->
</body>
