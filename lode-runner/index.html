<script data-shared="no-zoom">
/* ---- the pinch and the double tap ---- *
 *
 * iOS Safari has ignored `user-scalable=no` and `maximum-scale` in the viewport
 * meta tag since iOS 10. Every one of these pages carried both and neither did
 * anything, so a double tap anywhere - on the glass, on a control, on the black
 * - zoomed the page, and a zoomed page puts the controls off the edge of the
 * screen. In a game with a clock running that is not an inconvenience, it is a
 * death, and full screen does not help because the zoom is applied to the
 * visual viewport on top of whatever the layout is doing.
 *
 * Three things are needed and the meta tag is none of them:
 *
 *   1. gesturestart / gesturechange / gestureend. This is how WebKit offers a
 *      pinch, and it exists on no other engine.
 *   2. A non-passive touchend that eats the second tap of a double tap. It has
 *      to be non-passive or preventDefault is ignored outright, and it has to
 *      be touchend rather than dblclick, because the zoom is committed before
 *      a dblclick is ever dispatched.
 *   3. A way back for a player who is zoomed already, because neither of the
 *      above can un-zoom a page that is. Rewriting the viewport meta is the
 *      only lever a page has over WebKit's zoom, and it only fires on a real
 *      change, so the content is toggled rather than re-set.
 *
 * This file is the one copy. tools/sync-nozoom.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  var D=document, W=window;
  if(!D.addEventListener)return;
  for(var i=0,g=["gesturestart","gesturechange","gestureend"];i<g.length;i++)
    D.addEventListener(g[i],function(e){e.preventDefault();},{passive:false});
  /* Eating the second tap of a double tap eats the click the browser makes
   * out of it, and every game here has controls that listen for one - so on a
   * control this would cost the player every second press of a fast mash,
   * which in a game about pressing fire quickly is worse than the zoom. The
   * controls do not need it: a button carrying touch-action none or
   * manipulation is already exempt from double-tap zoom on every engine that
   * honours it. So the guard leaves anything pressable alone and covers the
   * rest of the page, which is where the zoom was coming from. */
  var PRESSABLE="button,a,input,select,textarea,label,[data-cmd],[role=button]";
  function pressable(t){
    return !!(t&&t.closest&&t.closest(PRESSABLE));
  }
  var lastTap=0;
  D.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTap<=350&&e.cancelable&&!pressable(e.target))e.preventDefault();
    lastTap=now;
  },{passive:false});
  /* A second finger is a pinch wherever it lands, and no game here wants one. */
  D.addEventListener("touchstart",function(e){
    if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault();
  },{passive:false});

  /* ---- the long press ---- *
   *
   * The other half of the same complaint. Holding a control down - which is
   * what a player does with FIRE, and what a stuck thumb does with a d-pad -
   * raises iOS's own callout: the magnifier, the selection handles, the
   * copy/define bubble, the drag-out ghost of an image. While that is up the
   * page has stopped receiving the press, so the control is dead until the
   * player lets go and taps somewhere to dismiss it. There is no event to
   * cancel; it is suppressed with CSS or not at all, and no game here had a
   * single one of these four properties set on a single control.
   *
   * This goes in first in the head rather than last, so it is a default a
   * page can still override - the joystick pads ask for touch-action:none
   * and must keep it. Inputs are left out of the selection rules: the only
   * typing in the collection is the three-letter initials, and a field the
   * player cannot select is a field they cannot correct. */
  var head=D.head||D.getElementsByTagName("head")[0];
  if(head){
    var st=D.createElement("style");
    st.setAttribute("data-nozoom","press");
    st.appendChild(D.createTextNode(
      /* .stick/.jstick/#stick are the joysticks. They are plain divs, so
       * nothing in PRESSABLE matched them - and a stick is the one control a
       * player holds down for seconds at a time, which is precisely when iOS
       * offers the callout. They were the biggest hole in this list. */
      PRESSABLE+",canvas,.menuitem,.stick,.jstick,#stick{-webkit-touch-callout:none;"+
      "-webkit-user-select:none;user-select:none;"+
      "-webkit-user-drag:none;"+
      "-webkit-tap-highlight-color:transparent}"+
      "input,textarea{-webkit-user-select:auto;user-select:auto}"+
      "button,a,label,[data-cmd],[role=button],.menuitem{touch-action:manipulation}"+
      "img{-webkit-user-drag:none}"));
    head.insertBefore(st,head.firstChild);
  }

  var vv=W.visualViewport, meta=D.querySelector('meta[name="viewport"]');
  if(!vv||!meta)return;
  var base=meta.getAttribute("content"), fixing=false;
  function unzoom(){
    if(fixing||vv.scale<=1.01)return;
    fixing=true;
    meta.setAttribute("content",base+", minimum-scale=1");
    W.setTimeout(function(){
      meta.setAttribute("content",base);
      fixing=false;
      if(W.scrollTo)W.scrollTo(0,0);
    },50);
  }
  vv.addEventListener("resize",unzoom);
  vv.addEventListener("scroll",unzoom);
  W.__unzoom=unzoom;                 // so a harness can ask for it directly
})();
</script>

<script data-shared="launcher">
/* ---- the way back to the launcher ----
 *
 * Every game here is its own page, and until now only one of them had a link
 * back to the collection it belongs to: open a game directly, or install it to
 * a home screen, and the rest of the cabinet was unreachable without editing
 * the address bar.
 *
 * Where it goes took two tries and a measurement.
 *
 * Seven of these pages are flex columns whose wrap has flex:1, so the last
 * child of the body settles at the bottom of the viewport on its own: under
 * the controls, covering nothing. Law of the West is not one of them - its
 * whole interface is a position:fixed #app over a body with no flow at all,
 * and appended there the link landed at the top of the page and shoved the
 * game down it.
 *
 * Pinning it to the bottom of the viewport instead fixed that one and broke
 * seven: measured against every control on every page, a fixed chip sat on a
 * full-screen button in five of them and on Galaga's thumb stick.
 *
 * So it goes in the flow; and if the flow turns out not to have put it near
 * the bottom - which is what a body with nothing in it looks like from here -
 * it moves into whatever element is actually covering the screen and rides
 * that one's layout instead.
 *
 * The lettering is the collection's own: monospace, wide-spaced, upper case,
 * and split a little cyan to the left and magenta to the right the way a
 * mistuned tube did it.
 *
 * This file is the one copy. tools/sync-launcher.js writes it into each page
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  if(typeof document==='undefined')return;
  if(document.getElementById('rg-launch'))return;

  var CSS=''+
  '#rg-launch{display:block;margin:8px auto calc(env(safe-area-inset-bottom) + 2px);'+
    'padding:6px 13px;border-radius:999px;flex:0 0 auto;'+
    'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;'+
    'font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;'+
    'text-decoration:none;color:#fff8e6;background:rgba(10,7,19,.72);'+
    'border:1px solid rgba(255,210,127,.32);text-align:center;width:max-content;'+
    'max-width:92%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;'+
    'text-shadow:-1px 0 0 rgba(56,232,255,.75),1px 0 0 rgba(255,62,165,.75),'+
      '0 0 10px rgba(255,210,127,.45)}'+
  '#rg-launch:hover,#rg-launch:focus-visible{border-color:rgba(255,210,127,.7);'+
    'background:rgba(20,14,32,.9);outline:none}'+
  '#rg-launch:active{transform:translateY(1px)}'+
  '#rg-launch .rg-c{color:#ffd27f;text-shadow:none;margin-right:.5em}'+
  /* a tube that has been on a while */
  '@keyframes rg-flick{0%,96%,100%{opacity:1}97%{opacity:.78}98%{opacity:1}99%{opacity:.88}}'+
  '#rg-launch{animation:rg-flick 9s steps(1) infinite}'+
  '@media (prefers-reduced-motion:reduce){#rg-launch{animation:none}}';

  function put(){
    if(document.getElementById('rg-launch'))return;
    var s=document.createElement('style');
    s.id='rg-launch-style';s.textContent=CSS;
    (document.head||document.documentElement).appendChild(s);
    var a=document.createElement('a');
    a.id='rg-launch';
    /* One level up is the collection, whether that is a folder on a disk or
     * the Pages site. Relative so it works from file:// as well. */
    a.href='../';
    a.setAttribute('aria-label','Back to the Retro Games launcher');
    a.innerHTML='<span class="rg-c">◀</span>Retro Games';
    var host=document.body||document.documentElement;
    host.appendChild(a);
    /* Did the flow put it near the bottom? If not, this page keeps its
     * interface somewhere other than the body, and the link belongs there. */
    try{
      var r=a.getBoundingClientRect();
      if(r.top<(window.innerHeight||0)*0.5){
        var best=null,area=0,all=document.body.querySelectorAll('*');
        for(var i=0;i<all.length;i++){
          var el=all[i];
          if(el===a||el.contains(a))continue;
          var cs=window.getComputedStyle(el);
          if(cs.position!=='fixed'&&cs.position!=='absolute')continue;
          var q=el.getBoundingClientRect();
          if(q.height<window.innerHeight*0.8)continue;
          if(q.width*q.height>area){area=q.width*q.height;best=el;}
        }
        if(best)best.appendChild(a);
      }
    }catch(e){}
  }
  if(document.body)put();
  else document.addEventListener('DOMContentLoaded',put);
})();
</script>
