<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Lode Runner — Bungeling Empire</title>
<meta name="description" content="Lode Runner: a browser recreation of Doug Smith's 1983 Broderbund classic. Dig through the brick, outwit the guards, take back the gold — with the level generator the original was famous for.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<!-- Installed to the home screen the game runs with no browser chrome at all,
     which is the only way to stop iOS sliding its toolbars over a game in play. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#04040a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lode Runner">
<style>
:root{--bg:#0a0a12;--panel:#14141f;--panel2:#1e1e2d;--ink:#e6e6f2;--dim:#9a9ab4;--gold:#e8c63a;
  --line:#2e2e42;--hi:#5ad1e6}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#e9e9f2;--panel:#fff;--panel2:#f2f2f8;--ink:#16161f;
    --dim:#5c5c74;--line:#d2d2e0}
}
:root[data-theme="dark"]{--bg:#0a0a12;--panel:#14141f;--panel2:#1e1e2d;--ink:#e6e6f2;--dim:#9a9ab4;
  --line:#2e2e42}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Nothing here is text to select: a long press on a control should hold the
   control, not raise iOS Safari's selection handles and its Copy callout. */
html,body,.btn,.menuitem,#status,#overlay,#sound,#fs,.soundrow,canvas,#editbar,.pal{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;min-height:100dvh;
  padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
#wrap{width:100%;max-width:620px;display:flex;flex-direction:column;gap:6px;flex:1}
#status{font-size:13px;line-height:1.35;min-height:34px;padding:6px 8px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
#status b{color:var(--gold)}
#stage{position:relative;width:100%;aspect-ratio:7/4;background:#000;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;touch-action:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#pads{margin-top:auto}
.padrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font-size:16px;line-height:1.05;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;cursor:pointer;touch-action:none;text-align:center}
.btn small{font-size:9px;font-weight:600;letter-spacing:.03em;opacity:.65;text-transform:uppercase}
.btn:active,.btn.on{background:var(--gold);color:#16130a;border-color:var(--gold)}
.btn:active small,.btn.on small{opacity:.8}
.btn.lit{border-color:var(--gold);color:var(--gold)}
.acts{display:grid;grid-template-columns:auto auto;gap:8px;align-items:center;justify-items:center}
.abtn{width:70px;height:70px;border-radius:50%;font-size:11px;font-weight:700;letter-spacing:.02em}
.sbtn{width:70px;height:38px;border-radius:10px;font-size:11px;font-weight:700}
/* A narrow phone could not fit the pads: the d-pad and the action buttons are
   fixed pixel sizes, and at 320px they added up to more than the screen. The
   page then scrolled sideways, which is exactly what it looks like - the
   player pans a little and the buttons are half off the wrong edge, still
   there, still ignoring a thumb that is now landing beside them. */
@media (max-width:360px){
  .abtn{width:60px;height:60px}
  .sbtn{width:60px;height:38px}
  /* and the lettering with them, or a label sits wider than the button it is
     on and reads as spilled ink rather than as a control. */
  .abtn,.sbtn{font-size:10px;letter-spacing:0}
  .btn small{font-size:8px}
}
#overlay{position:absolute;inset:0;background:rgba(6,6,12,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;overflow-y:auto}
#overlay.hidden{display:none}
/* Over the title art the overlay is only a scrim, so the tower shows through. */
#overlay.splash{background:linear-gradient(rgba(4,4,10,0) 0%,rgba(4,4,10,0) 40%,rgba(4,4,10,.92) 66%);
  justify-content:flex-end;gap:6px;padding:10px 12px 12px}
#overlay.splash h1{font-size:16px;margin-bottom:2px;text-shadow:0 1px 3px #000}
#overlay.splash .menuitem{width:min(280px,80%);padding:9px;background:rgba(20,20,34,.92);
  border-color:#4a4a6a;color:#e6e6f2}
#overlay.splash .menuitem.sel{background:var(--gold);border-color:var(--gold);color:#16130a}
#overlay.splash .sub,#overlay.splash small.tip{color:#c9c9e0;text-shadow:0 1px 2px #000}
#overlay.splash small.tip{font-size:10px}
#overlay.splash.card{background:linear-gradient(rgba(4,4,10,.66),rgba(4,4,10,.93) 58%);
  justify-content:center}
h1{font-size:22px;margin:0;letter-spacing:.16em;color:var(--gold);font-weight:800}
.sub{font-size:12px;color:var(--dim);margin:0 0 4px;max-width:380px;line-height:1.45}
.menuitem{width:min(320px,88%);padding:11px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);font-size:14px;cursor:pointer;color:var(--ink)}
.menuitem.sel{border-color:var(--gold);background:var(--gold);color:#16130a;font-weight:700}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:min(340px,94%)}
.row2 .menuitem,.row3 .menuitem{width:auto}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(340px,94%)}
small.tip{color:var(--dim);font-size:11px;max-width:380px;line-height:1.5}
button{font:inherit;cursor:pointer}
.soundrow{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:11px;color:var(--dim)}
#sound,#fs{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;min-height:40px}
/* The generator's palette and its buttons stand in for the pads while editing. */
#editbar{display:none;flex-direction:column;gap:6px;margin-top:auto}
body.editing #editbar{display:flex}
body.editing #pads{display:none}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pal .btn{height:46px;font-size:11px;font-weight:700}
.editrow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.editrow .btn{height:40px;font-size:11px;font-weight:700}
#slug{width:100%;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);
  color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;height:52px;resize:none;
  -webkit-user-select:text;user-select:text}
/* Full screen: the tower and the controls, nothing else. The page goes black in
   both colour schemes so there is no doubt which mode you are in. */
/* svh is the viewport with the browser's toolbars showing. Sizing to it means a
   toolbar sliding in or out no longer resizes the game mid-play; the strip the
   bars vacate just stays dark. dvh and vh are there for older browsers. */
body.fs{padding:0;height:100vh;height:100dvh;height:100svh;min-height:0;overflow:hidden;
  background:#04040a;color:#e6e6f2;
  /* Full screen paints the page dark whatever the system theme is, and the
     way each of these games did that was to hardcode colours onto .btn.
     The stick is not a .btn: in light mode it kept the light palette and
     sat on the black as a white disc. Anything built from the palette
     follows now, because the palette itself goes dark here. */
  --panel2:#1e1e2d;--line:#2e2e42;--dim:#9a9ab4;--gold:#e8c63a}
body.fs .btn{background:#14141f;border-color:#2e2e42;color:#e6e6f2}
body.fs .btn:active,body.fs .btn.on{background:#e8c63a;color:#16130a;border-color:#e8c63a}
body.fs .btn.lit{border-color:#e8c63a;color:#e8c63a}
body.fs #sound,body.fs #fs{background:#14141f;border-color:#2e2e42;color:#e6e6f2}
body.fs #fs{border-color:#e8c63a;color:#e8c63a}
body.fs #wrap{max-width:none;flex:1;min-height:0;height:auto;gap:4px;
  padding:env(safe-area-inset-top) 6px calc(env(safe-area-inset-bottom) + 4px)}
body.fs #status{display:none}
/* The screen takes as much room as its own shape allows and no more, so the
   space the page chrome gave back goes to the pads instead of to black bars. */
body.fs #stage{width:min(100%,calc(58dvh * 7 / 4));max-width:100%;margin:0 auto;border-radius:0;
  border-left:0;border-right:0}
body.fs canvas{object-fit:contain;background:#000}
body.fs .jstick{width:clamp(126px,40vw,182px);height:clamp(126px,40vw,182px)}
body.fs .jstick .jknob{width:clamp(54px,17vw,78px);height:clamp(54px,17vw,78px);
  margin:calc(clamp(54px,17vw,78px) / -2) 0 0 calc(clamp(54px,17vw,78px) / -2)}
body.fs .abtn{width:clamp(60px,20vw,92px);height:clamp(60px,20vw,92px);font-size:12px}
body.fs .sbtn{width:clamp(60px,20vw,92px);height:clamp(34px,9vw,44px);font-size:12px}
body.fs .soundrow{margin:2px 0 0;gap:8px}
body.fs #audio-status{display:none}
@media (orientation:landscape) and (max-height:560px){
  /* Held sideways there is no room below the screen, so the pads flank it the
     way a handheld does: pad under the left thumb, digs under the right. */
  body.fs #wrap{flex-direction:row;align-items:center;justify-content:space-between;
    gap:6px;padding:4px 8px}
  body.fs #pads,body.fs .padrow{display:contents}
  body.fs .jstickwrap{order:1}
  body.fs .jstick{width:144px;height:144px}
  body.fs .jstick .jknob{width:62px;height:62px;margin:-31px 0 0 -31px}
  body.fs #stage{order:2;width:min(60vw,calc((100svh - 12px) * 7 / 4));max-width:60vw;margin:0}
  body.fs .acts{order:3}
  body.fs .abtn{width:66px;height:66px;font-size:10px}
  body.fs .sbtn{width:66px;height:34px;font-size:10px}
  body.fs .soundrow{position:fixed;left:50%;bottom:2px;transform:translateX(-50%);
    margin:0;z-index:5;font-size:10px}
  body.fs #sound,body.fs #fs{padding:6px 10px;min-height:32px;font-size:11px}
}
/* Every pressable control carries its own touch-action. The shared zoom
   guard below steps aside for anything pressable - it has to, or it eats
   the click that a fast second press makes - and it does that on the
   understanding that a control is already exempt from double-tap zoom.
   .menuitem never was, so double-tapping a menu button zoomed the page. */
.menuitem,#sound,#fs,#install,button,a{touch-action:manipulation}
</style>
</head>
<body>
<!-- stick:start -->
<script data-shared="stick">
/* ---- the Apple IIe joystick, on the glass ---- *
 *
 * The machines these games came off had a stick, not a d-pad: two pots and two
 * buttons, and the games were written for it. A three-by-three grid of buttons
 * is a later idea from a different console, and on a phone it is the worse of
 * the two - nine targets a thumb finds by feel, with hard edges between them,
 * so a thumb drifting from the left button to the up one crosses the corner
 * and stops the player dead mid-stride.
 *
 * This is the stick instead: one round gate, a knob that follows the thumb, and
 * the pointer taken captive on the way down so a thumb that slides off the pad
 * keeps steering instead of handing the gesture back to the page. That last
 * part is also why it helps with the zoom - a captured pointer inside a
 * touch-action:none gate is not a scroll, a pull-to-refresh, the first finger
 * of a pinch, or a long press the browser can put a magnifier on top of. The
 * guard in shared/no-zoom.js still does its half; this stops the control
 * surface itself from ever starting one of those gestures.
 *
 * The games below still read directions, not angles, so the vector is turned
 * back into up/down/left/right - four ways or eight - and handed over on the
 * edge, when a direction is entered or left. A game wires it to the same key
 * state its d-pad set and nothing else about the game changes.
 *
 * One copy. tools/sync-stick.js writes it into each page that uses it.
 *
 *   Stick.make({host:'#stickhost', ways:4, onDirs:function(now,was){...}})
 *
 * host  element or selector, the gate is built inside it | ways 4 or 8
 * axes  'xy' (default), 'x' or 'y' | dead  deadzone 0..1, default .34
 * label aria-label | unlock  called on the way down, for the audio unlock
 * onDirs(now,was) only when the set changes | onMove(x,y,held) every move
 *
 * It returns {el,x,y,held,dirs,radius,release} and keeps x/y/held/dirs live.
 */
(function(root){
  'use strict';
  var D=root&&root.document;
  var CSS=
   '.jstick{position:relative;width:136px;height:136px;border-radius:50%;flex:0 0 auto;'+
     'background:var(--panel2,#2a2f45);border:1px solid var(--line,#4a5170);'+
     'touch-action:none;cursor:grab;-webkit-touch-callout:none;'+
     '-webkit-user-select:none;user-select:none;-webkit-user-drag:none;'+
     '-webkit-tap-highlight-color:transparent}'+
   '.jstick .jring{position:absolute;inset:13px;border-radius:50%;'+
     'border:1px dashed var(--line,#4a5170);opacity:.55;pointer-events:none}'+
   '.jstick .jtick{position:absolute;background:var(--dim,#8a90ad);opacity:.5;'+
     'pointer-events:none}'+
   '.jstick .j-u,.jstick .j-d{left:50%;width:2px;height:7px;margin-left:-1px}'+
   '.jstick .j-l,.jstick .j-r{top:50%;height:2px;width:7px;margin-top:-1px}'+
   '.jstick .j-u{top:4px}.jstick .j-d{bottom:4px}'+
   '.jstick .j-l{left:4px}.jstick .j-r{right:4px}'+
   '.jstick .jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;'+
     'margin:-29px 0 0 -29px;border-radius:50%;'+
     /* The knob has to read against the gate in nine different palettes, two
      * of which flip for light mode. --dim is the one mid-tone every game
      * defines and the only one that contrasts with --panel2 both ways round;
      * a game that wants its own can set --knob. */
     'background:var(--knob,var(--dim,#46537a));'+
     'border:2px solid var(--line,#4a5170);pointer-events:none;'+
     'box-shadow:0 2px 0 rgba(0,0,0,.35) inset;transition:background .08s linear}'+
   '.jstick.on{cursor:grabbing}'+
   '.jstick.on .jknob{background:var(--gold,#e8c06a);border-color:var(--gold,#e8c06a)}'+
   /* The middle cell of the d-pad was never a direction in any of these games -
    * it was WALK, HOVER, MENU, HOLSTER. A round gate has no middle cell to put
    * it in, so it stands beside the stick instead of being quietly lost. */
   '.jstickwrap{display:flex;flex-direction:column;align-items:center;gap:6px;'+
     'flex:0 0 auto}'+
   '.jstickwrap .jaside{display:flex;gap:6px;align-items:center}'+
   '@media (max-width:360px){.jstick{width:116px;height:116px}'+
     '.jstick .jknob{width:50px;height:50px;margin:-25px 0 0 -25px}}';

  function css(){
    if(!D||!D.head||D.getElementById('jstick-css'))return;
    var st=D.createElement('style');
    st.id='jstick-css';
    st.appendChild(D.createTextNode(CSS));
    D.head.appendChild(st);
  }

  function clamp(v,a,b){return v<a?a:v>b?b:v;}

  /* Four-way is winner-takes-all: the bigger component wins, so a thumb that
   * wanders off true never gives a diagonal a game cannot use. Eight-way calls
   * a direction pushed once its component is better than a third of the throw,
   * which puts the diagonal wedges at roughly the same width as the straights. */
  function dirsOf(x,y,ways,dead){
    var d={u:false,d:false,l:false,r:false};
    var m=Math.sqrt(x*x+y*y);
    if(m<dead)return d;
    if(ways===8){
      if(y<-0.38*m)d.u=true; else if(y>0.38*m)d.d=true;
      if(x<-0.38*m)d.l=true; else if(x>0.38*m)d.r=true;
    }else if(Math.abs(x)>=Math.abs(y)){
      if(x<0)d.l=true; else d.r=true;
    }else{
      if(y<0)d.u=true; else d.d=true;
    }
    return d;
  }
  function same(a,b){return a.u===b.u&&a.d===b.d&&a.l===b.l&&a.r===b.r;}

  /* The test harnesses run each game's script in a bare vm with a document
   * stubbed down to what the game asks for, and none of them has a head to
   * hang a stylesheet on. A control surface that cannot be built is not an
   * error there - it is a page with no pads - so this refuses softly and the
   * game runs on its keyboard. */
  function buildable(){
    return !!(D&&D.createElement&&D.head&&D.querySelector);
  }

  function make(o){
    o=o||{};
    if(!buildable())return null;
    var host=null;
    try{host=typeof o.host==='string'?D.querySelector(o.host):o.host;}catch(e){}
    if(!host||!host.appendChild)return null;
    css();
    var axes=o.axes||'xy', ways=o.ways===8?8:4;
    var dead=typeof o.dead==='number'?o.dead:0.34;

    var el=D.createElement('div');
    el.className='jstick';
    el.setAttribute('role','application');
    el.setAttribute('aria-label',o.label||'Joystick');
    var html='<i class="jring" aria-hidden="true"></i>';
    if(axes.indexOf('y')>=0)
      html+='<i class="jtick j-u" aria-hidden="true"></i><i class="jtick j-d" aria-hidden="true"></i>';
    if(axes.indexOf('x')>=0)
      html+='<i class="jtick j-l" aria-hidden="true"></i><i class="jtick j-r" aria-hidden="true"></i>';
    html+='<i class="jknob" aria-hidden="true"></i>';
    el.innerHTML=html;
    host.appendChild(el);
    var knob=el.querySelector('.jknob');

    var S={el:el,x:0,y:0,held:false,dirs:dirsOf(0,0,ways,dead),radius:radius,
           release:release};

    /* The throw is measured off the knob rather than guessed, because the gate
     * and the knob are both sized in a media query and a guessed number let the
     * knob ride out over its own rim. */
    function radius(){
      var r=el.getBoundingClientRect();
      var kw=(knob&&knob.offsetWidth)||52;
      if(!r||!r.width)return 48;
      return Math.max(16,r.width/2-kw/2-3);
    }
    function paint(dx,dy){
      if(knob)knob.style.transform='translate('+Math.round(dx)+'px,'+Math.round(dy)+'px)';
    }
    function settle(x,y,held){
      S.x=x;S.y=y;S.held=held;
      var next=dirsOf(x,y,ways,dead), was=S.dirs;
      if(!same(next,was)){S.dirs=next; if(o.onDirs)o.onDirs(next,was);}
      if(o.onMove)o.onMove(x,y,held);
    }
    function moveTo(ev){
      var r=el.getBoundingClientRect(), R=radius();
      var dx=axes.indexOf('x')>=0?ev.clientX-(r.left+r.width/2):0;
      var dy=axes.indexOf('y')>=0?ev.clientY-(r.top+r.height/2):0;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d>R){dx=dx/d*R;dy=dy/d*R;}
      paint(dx,dy);
      settle(clamp(dx/R,-1,1),clamp(dy/R,-1,1),true);
    }
    function release(){
      id=null;
      el.classList.remove('on');
      paint(0,0);
      settle(0,0,false);
    }

    var id=null;
    el.addEventListener('pointerdown',function(e){
      if(e.preventDefault)e.preventDefault();
      if(o.unlock)o.unlock();
      try{el.setPointerCapture&&el.setPointerCapture(e.pointerId);}catch(err){}
      id=e.pointerId; el.classList.add('on');
      moveTo(e);
    });
    el.addEventListener('pointermove',function(e){
      if(id!==e.pointerId)return;
      if(e.preventDefault)e.preventDefault();
      moveTo(e);
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){
      el.addEventListener(ev,function(e){ if(id===e.pointerId)release(); });
    });
    /* A pointer the page loses track of entirely - the tab going away mid-dive,
     * a gesture the browser takes over - must still let go, or the player comes
     * back to a character walking into a wall. */
    if(root.addEventListener){
      root.addEventListener('blur',function(){if(S.held)release();});
      D.addEventListener('visibilitychange',function(){if(D.hidden&&S.held)release();});
    }

    /* A keyboard is a stick with four positions, and the knob has to say so or
     * the player on a keyboard is looking at a control that never moves. */
    S.showKeys=function(kx,ky){
      if(S.held)return;
      var R=radius();
      paint(kx*R,ky*R);
      el.classList.toggle('on',!!(kx||ky));
    };
    return S;
  }

  root.Stick={make:make,dirsOf:dirsOf,buildable:buildable,css:CSS};
})(typeof window!=='undefined'?window:this);
</script>
<!-- stick:end -->
<!-- arcade:start -->
<script data-shared="arcade">
/* ---- the coin-op bits every game here shares ----
 *
 * A high score table with three-letter initials, the entry screen that goes
 * with it, and one save slot. Eight games, one implementation, so the letters
 * are chosen the same way in all of them: three cells, the live one lit and
 * blinking, up and down to turn the letter, left and right to move along, fire
 * to take it. Type the letters straight in if you have a keyboard.
 *
 * The screen is built out of DOM rather than drawn into each game's canvas.
 * Half of these games draw their menus and half write markup, and the point of
 * this is that the entry screen is the same one everywhere; a canvas version
 * would have had to be written twice and would have drifted.
 *
 * Nothing here assumes anything about the page it is in beyond document.body.
 * It reads the host's colours through CSS custom properties where they exist
 * and falls back to its own where they do not.
 *
 * This file is the one copy. tools/sync-arcade.js writes it into each game
 * between its markers, and the check in CI fails if any of them drifts.
 */
(function(){
  /* In a browser globalThis is window and this is the same object; under a test
   * harness the page's script runs in a context where they are not, and an
   * Arcade hung only on `window` would leave the bare name undefined. */
  var root=(typeof globalThis!=='undefined'&&globalThis)||window;
  if(typeof document==='undefined'||root.Arcade)return;

  /* Storage is namespaced per game, and every touch of it is guarded: it is
   * absent in a file:// sandbox on some browsers and throws on read in private
   * mode on others, and a high score table is never worth a dead page. */
  function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
  function put(k,v){try{localStorage.setItem(k,String(v));return true;}catch(e){return false;}}
  function drop(k){try{localStorage.removeItem(k);}catch(e){}}
  function readJSON(k,d){
    var raw=get(k,null);
    if(raw===null)return d;
    try{var v=JSON.parse(raw);return v===null?d:v;}catch(e){return d;}
  }

  /* A-Z, then the digits, then the three marks an arcade cabinet usually gave
   * you. A blank is last so it is one step back from A. */
  var GLYPHS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-!_';
  var BLANK='_';                       /* drawn as a space, stored as a space */

  var CSS=''+
  '.ac-wrap{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'+
    'justify-content:center;padding:14px;background:rgba(6,5,10,.93);'+
    'font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;'+
    '-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}'+
  '.ac-card{width:min(380px,100%);max-height:100%;overflow-y:auto;text-align:center;'+
    'background:var(--panel,#14141f);border:1px solid var(--line,#2e2e42);'+
    'border-radius:12px;padding:14px 12px;color:var(--ink,#e6e6f2)}'+
  '.ac-h{font-size:15px;letter-spacing:.16em;font-weight:800;margin:0 0 2px;'+
    'color:var(--gold,#e8c63a)}'+
  '.ac-sub{font-size:11.5px;line-height:1.5;color:var(--dim,#9a8b76);margin:0 0 10px}'+
  '.ac-cells{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}'+
  '.ac-cell{width:52px;height:64px;display:flex;align-items:center;justify-content:center;'+
    'font-size:34px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'border:2px solid var(--line,#2e2e42);border-radius:8px;background:var(--panel2,#1e1e2d);'+
    'color:var(--ink,#e6e6f2)}'+
  /* the live cell: lit, and blinking so it is unmistakably the one you are on */
  '.ac-cell.on{border-color:var(--gold,#e8c63a);color:#16130a;'+
    'background:var(--gold,#e8c63a);animation:ac-blink 1s steps(1,end) infinite}'+
  '@keyframes ac-blink{0%,55%{opacity:1}56%,100%{opacity:.45}}'+
  '@media (prefers-reduced-motion:reduce){.ac-cell.on{animation:none}}'+
  '.ac-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}'+
  '.ac-b{background:var(--panel2,#1e1e2d);border:1px solid var(--line,#2e2e42);'+
    'border-radius:9px;color:var(--ink,#e6e6f2);font:inherit;font-size:15px;'+
    'padding:10px 4px;cursor:pointer;touch-action:manipulation}'+
  '.ac-b:active{background:var(--gold,#e8c63a);color:#16130a;border-color:var(--gold,#e8c63a)}'+
  '.ac-b.wide{grid-column:span 4;font-size:13px;font-weight:700;letter-spacing:.06em}'+
  '.ac-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'font-size:13px;line-height:1.85;text-align:left;margin:4px 0 10px}'+
  '.ac-row{display:flex;gap:8px;align-items:baseline;padding:0 4px;border-radius:5px}'+
  '.ac-row.me{background:rgba(232,198,58,.16);color:var(--gold,#e8c63a)}'+
  '.ac-rank{width:2.2em;color:var(--dim,#9a8b76);text-align:right}'+
  '.ac-ini{width:3.6em;letter-spacing:.18em}'+
  '.ac-sc{flex:1;text-align:right;font-weight:700}'+
  '.ac-x{width:7.5em;text-align:right;color:var(--dim,#9a8b76);font-size:11px}'+
  '.ac-empty{color:var(--dim,#9a8b76);font-size:12px;padding:12px 0}'+
  '.ac-slot{display:flex;width:100%;align-items:baseline;justify-content:space-between;'+
    'gap:12px;margin-bottom:6px;text-align:left}'+
  '.ac-slot .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;'+
    'letter-spacing:.18em;font-weight:700;font-size:15px}'+
  '.ac-slot .w{font-size:11px;opacity:.7;text-align:right}'+
  '.ac-slot.on{border-color:var(--gold,#e8c63a)}';

  function styles(){
    if(document.getElementById('ac-style'))return;
    var s=document.createElement('style');
    s.id='ac-style';s.textContent=CSS;
    (document.head||document.documentElement).appendChild(s);
  }

  var cfg={game:'game',slots:8,title:'HIGH SCORES',extraLabel:''};

  var K={
    scores:function(){return 'arcade.'+cfg.game+'.scores';},
    slots:function(){return 'arcade.'+cfg.game+'.slots';},
    last:function(){return 'arcade.'+cfg.game+'.initials';}
  };

  function table(){
    var rows=readJSON(K.scores(),[]);
    if(!rows||!rows.length||typeof rows.length!=='number')return[];
    return rows.filter(function(r){
      return r&&typeof r.score==='number'&&isFinite(r.score);
    }).map(function(r){
      return{ini:String(r.ini||'AAA').slice(0,3),score:Math.floor(r.score),
        at:r.at||0,extra:r.extra===undefined?'':String(r.extra)};
    }).sort(function(a,b){return b.score-a.score||a.at-b.at;}).slice(0,cfg.slots);
  }
  /* A score gets in if the table is short or it beats the last row. Ties go to
   * whoever got there first, which is what the sort above does. */
  function qualifies(score){
    if(typeof score!=='number'||!isFinite(score)||score<=0)return false;
    var t=table();
    return t.length<cfg.slots||score>t[t.length-1].score;
  }
  function record(ini,score,extra){
    var t=table();
    var row={ini:String(ini||'AAA').toUpperCase().slice(0,3),score:Math.floor(score),
      at:Date.now(),extra:extra===undefined?'':String(extra)};
    t.push(row);
    t.sort(function(a,b){return b.score-a.score||a.at-b.at;});
    t=t.slice(0,cfg.slots);
    put(K.scores(),JSON.stringify(t));
    put(K.last(),row.ini);
    return row;
  }

  /* ---- save slots, one per set of initials ----
   * A table of saves the same shape as the table of scores: your three letters
   * are the name on it, so two people can leave a game half finished on the
   * same machine and each pick up their own. Oldest goes when it is full. */
  function slots(){
    var raw=readJSON(K.slots(),{});
    if(!raw||typeof raw!=='object'||raw.length!==undefined)return[];
    var out=[];
    for(var k in raw){
      if(!Object.prototype.hasOwnProperty.call(raw,k))continue;
      var v=raw[k];
      if(!v||v.state===undefined)continue;
      out.push({ini:String(k).slice(0,3),at:v.at||0,
        extra:v.extra===undefined?'':String(v.extra),state:v.state});
    }
    return out.sort(function(a,b){return b.at-a.at;});
  }
  function slotFor(ini){
    ini=String(ini||'').toUpperCase().slice(0,3);
    var all=slots();
    for(var i=0;i<all.length;i++)if(all[i].ini===ini)return all[i];
    return null;
  }
  function writeSlot(ini,state,extra){
    ini=String(ini||'AAA').toUpperCase().slice(0,3);
    var all=slots().filter(function(s){return s.ini!==ini;});
    all.unshift({ini:ini,at:Date.now(),extra:extra===undefined?'':String(extra),state:state});
    all=all.slice(0,cfg.slots);
    var obj={};
    all.forEach(function(s){obj[s.ini]={at:s.at,extra:s.extra,state:s.state};});
    var ok=put(K.slots(),JSON.stringify(obj));
    if(ok)put(K.last(),ini);
    return ok?slotFor(ini):null;
  }
  function dropSlot(ini){
    ini=String(ini||'').toUpperCase().slice(0,3);
    var obj={};
    slots().forEach(function(s){if(s.ini!==ini)obj[s.ini]={at:s.at,extra:s.extra,state:s.state};});
    put(K.slots(),JSON.stringify(obj));
  }
  /* "3 minutes ago", near enough — a save slot wants to know how stale it is,
   * not what the clock said. */
  function ago(t){
    var d=Math.max(0,Date.now()-t), m=Math.round(d/60000);
    if(m<1)return'just now';
    if(m<60)return m+(m===1?' minute':' minutes')+' ago';
    var h=Math.round(m/60);
    if(h<24)return h+(h===1?' hour':' hours')+' ago';
    var dy=Math.round(h/24);
    return dy+(dy===1?' day':' days')+' ago';
  }

  /* ---- the screens ---- */
  var open=null;                       /* the overlay on screen, if any */
  function close(){
    if(!open)return;
    document.removeEventListener('keydown',open.key,true);
    if(open.el&&open.el.parentNode)open.el.parentNode.removeChild(open.el);
    open=null;
  }
  /* Can this document be built on at all? A page with no createElement is not
   * a page a screen can be put on, and the answer must be no rather than a
   * throw: the moment this is asked is the moment a game has just ended, and a
   * high score table is never worth taking the game down with it. */
  function buildable(){
    return !!(document&&typeof document.createElement==='function'&&document.body&&
      typeof document.body.appendChild==='function');
  }
  function frame(){
    styles();
    var w=document.createElement('div');w.className='ac-wrap';
    var c=document.createElement('div');c.className='ac-card';
    w.appendChild(c);
    document.body.appendChild(w);
    return{wrap:w,card:c};
  }
  function button(parent,label,fn,cls){
    var b=document.createElement('button');
    b.type='button';b.className='ac-b'+(cls?' '+cls:'');b.textContent=label;
    b.addEventListener('click',function(e){e.preventDefault();fn();});
    parent.appendChild(b);
    return b;
  }
  function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
  function show(opts){
    opts=opts||{};
    if(!buildable()){if(opts.onClose)opts.onClose();return null;}
    close();
    var f=frame(),rows=table();
    var h=document.createElement('p');h.className='ac-h';h.textContent=cfg.title;
    f.card.appendChild(h);
    if(opts.sub){
      var sb=document.createElement('p');sb.className='ac-sub';sb.textContent=opts.sub;
      f.card.appendChild(sb);
    }
    var list=document.createElement('div');list.className='ac-rows';
    if(!rows.length){
      var e=document.createElement('div');e.className='ac-empty';
      e.textContent='Nobody has been here yet.';
      list.appendChild(e);
    }
    rows.forEach(function(r,i){
      var row=document.createElement('div');
      row.className='ac-row'+(opts.mark&&r.at===opts.mark?' me':'');
      row.innerHTML='<span class="ac-rank">'+(i+1)+'</span>'+
        '<span class="ac-ini"></span><span class="ac-sc"></span>'+
        (cfg.extraLabel?'<span class="ac-x"></span>':'');
      row.querySelector('.ac-ini').textContent=r.ini;
      row.querySelector('.ac-sc').textContent=fmt(r.score);
      if(cfg.extraLabel)row.querySelector('.ac-x').textContent=r.extra||'';
      list.appendChild(row);
    });
    f.card.appendChild(list);
    var pad=document.createElement('div');pad.className='ac-pad';
    f.card.appendChild(pad);
    var done=opts.onClose||function(){};
    button(pad,'BACK',function(){close();done();},'wide');
    open={el:f.wrap,key:function(ev){
      if(ev.key==='Escape'||ev.key==='Enter'||ev.key===' '){
        ev.preventDefault();ev.stopPropagation();close();done();
      }
    }};
    document.addEventListener('keydown',open.key,true);
    return f;
  }

  /* Three cells, the live one lit; one keydown handler taken at the capture
   * phase so the game underneath never sees the letters being chosen. Both the
   * high score entry and the save slot go through here, which is the point: a
   * player enters their initials the same way whatever they are for. */
  function letters(o,then){
    if(!buildable()){then(null);return null;}
    close();
    var f=frame();
    var seed=((o.seed||get(K.last(),'AAA'))+'AAA').slice(0,3).toUpperCase();
    var idx=[0,1,2].map(function(i){
      var p=GLYPHS.indexOf(seed[i]);return p<0?0:p;
    });
    var at=0,fin=false;

    var h=document.createElement('p');h.className='ac-h';
    h.textContent=o.title||'ENTER YOUR INITIALS';
    var sub=document.createElement('p');sub.className='ac-sub';
    sub.textContent=o.sub||'';
    f.card.appendChild(h);f.card.appendChild(sub);

    var cells=document.createElement('div');cells.className='ac-cells';
    var cellEls=[0,1,2].map(function(){
      var d=document.createElement('div');d.className='ac-cell';
      cells.appendChild(d);return d;
    });
    f.card.appendChild(cells);
    function paint(){
      for(var i=0;i<3;i++){
        var g=GLYPHS[idx[i]];
        cellEls[i].textContent=g===BLANK?' ':g;
        cellEls[i].className='ac-cell'+(i===at?' on':'');
      }
    }
    function turn(d){idx[at]=(idx[at]+d+GLYPHS.length)%GLYPHS.length;paint();}
    function move(d){at=Math.max(0,Math.min(2,at+d));paint();}
    function setGlyph(ch){
      var p=GLYPHS.indexOf(ch);
      if(p<0)return false;
      idx[at]=p;
      if(at<2){at++;}
      paint();return true;
    }
    function finish(){
      if(fin)return;
      fin=true;
      var ini=idx.map(function(i){
        var g=GLYPHS[i];return g===BLANK?' ':g;
      }).join('').replace(/\s+$/,'');
      if(!ini)ini='AAA';
      close();
      then(ini);
    }

    var pad=document.createElement('div');pad.className='ac-pad';
    f.card.appendChild(pad);
    button(pad,'◀',function(){move(-1);});
    button(pad,'▲',function(){turn(1);});
    button(pad,'▼',function(){turn(-1);});
    button(pad,'▶',function(){move(1);});
    button(pad,'ENTER',finish,'wide');

    if(o.cancel)button(pad,'NEVER MIND',function(){close();then(null);},'wide');
    open={el:f.wrap,key:function(ev){
      var k=ev.key;
      var used=true;
      if(k==='Escape'&&o.cancel){close();then(null);}
      else if(k==='ArrowUp'||k==='w'||k==='W')turn(1);
      else if(k==='ArrowDown'||k==='s'||k==='S')turn(-1);
      else if(k==='ArrowLeft'||k==='a'||k==='A')move(-1);
      else if(k==='ArrowRight'||k==='d'||k==='D')move(1);
      else if(k==='Enter')finish();
      else if(k==='Backspace'){if(at>0)move(-1);else turn(0);}
      else if(k&&k.length===1&&setGlyph(k.toUpperCase())){/* typed straight in */}
      else used=false;
      if(used){ev.preventDefault();ev.stopPropagation();}
    }};
    document.addEventListener('keydown',open.key,true);
    paint();
    return f;
  }

  root.Arcade={
    /* name the game once, at boot */
    init:function(o){
      o=o||{};
      cfg.game=String(o.game||'game');
      cfg.slots=Math.max(1,Math.min(20,o.slots||8));
      if(o.title)cfg.title=String(o.title);
      cfg.extraLabel=o.extraLabel?String(o.extraLabel):'';
      return this;
    },
    glyphs:GLYPHS,
    table:table,
    qualifies:qualifies,
    /* Offer the entry screen if the score is worth one; `then` gets the row
     * that was written, or null if it was not a high score at all. */
    submit:function(score,extra,then){
      then=then||function(){};
      if(!qualifies(score)||!buildable()){then(null);return false;}
      letters({title:'NEW HIGH SCORE',
        sub:fmt(Math.floor(score))+(extra?'  ·  '+extra:'')+'  —  enter your initials'},
        function(ini){then(ini?record(ini,score,extra):null);});
      return true;
    },
    /* the three-letter picker on its own, for anything else that wants one */
    letters:function(o,then){return letters(o||{},then||function(){});},
    /* whether a screen can be put up here at all */
    canAsk:buildable,
    show:function(opts){show(opts);return this;},
    close:close,
    isOpen:function(){return !!open;},
    /* for the tests and for a player who wants their table back */
    clear:function(){drop(K.scores());return this;},
    record:record,
    /* ---- save slots ----
     * What goes in one is the game's business; all this does is keep it under
     * three letters, namespaced per game, and admit when it could not. */
    slots:slots,
    slotFor:slotFor,
    writeSlot:writeSlot,
    dropSlot:dropSlot,
    hasSlots:function(){return slots().length>0;},
    clearSlots:function(){drop(K.slots());return this;},
    /* Ask for three letters, then keep the state under them. */
    saveAs:function(state,extra,then){
      then=then||function(){};
      if(!buildable()){then(null);return false;}
      letters({title:'SAVE',sub:'Three letters to keep it under',cancel:true},
        function(ini){then(ini?writeSlot(ini,state,extra):null);});
      return true;
    },
    /* Show what is saved and hand back the one that is chosen. */
    resume:function(then){
      then=then||function(){};
      var all=slots();
      if(!all.length||!buildable()){then(null);return false;}
      close();
      var f=frame();
      var h=document.createElement('p');h.className='ac-h';h.textContent='RESUME';
      var sb=document.createElement('p');sb.className='ac-sub';
      sb.textContent='Whose game?';
      f.card.appendChild(h);f.card.appendChild(sb);
      var list=document.createElement('div');list.className='ac-rows';
      f.card.appendChild(list);
      var pad=document.createElement('div');pad.className='ac-pad';
      f.card.appendChild(pad);
      var sel=0,rowEls=[];
      all.forEach(function(sl){
        var b=document.createElement('button');
        b.type='button';b.className='ac-b ac-slot';
        b.innerHTML='<span class="n"></span><span class="w"></span>';
        b.querySelector('.n').textContent=sl.ini;
        b.querySelector('.w').textContent=(sl.extra?sl.extra+'  ·  ':'')+ago(sl.at);
        b.addEventListener('click',function(e){e.preventDefault();close();then(sl);});
        list.appendChild(b);rowEls.push(b);
      });
      function paintSel(){
        rowEls.forEach(function(b,i){b.className='ac-b ac-slot'+(i===sel?' on':'');});
      }
      button(pad,'NEVER MIND',function(){close();then(null);},'wide');
      open={el:f.wrap,key:function(ev){
        var k=ev.key,used=true;
        if(k==='ArrowDown'||k==='s'||k==='S'){sel=(sel+1)%rowEls.length;paintSel();}
        else if(k==='ArrowUp'||k==='w'||k==='W'){sel=(sel-1+rowEls.length)%rowEls.length;paintSel();}
        else if(k==='Enter'||k===' '){close();then(all[sel]);}
        else if(k==='Escape'){close();then(null);}
        else used=false;
        if(used){ev.preventDefault();ev.stopPropagation();}
      }};
      document.addEventListener('keydown',open.key,true);
      paintSel();
      return true;
    }
  };
})();
</script>
<!-- arcade:end -->

<script>
'use strict';
/* Lode Runner — a browser recreation of the 1983 Broderbund game by Doug Smith.
   The playfield is the original's 28 x 16 grid of tiles and the level text uses
   the character set the Lode Runner level archives settled on, so a level
   written here reads the same way one written in 1983 does. */

const COLS=28, ROWS=16;
const EMPTY=0, BRICK=1, SOLID=2, LADDER=3, BAR=4, TRAP=5, GOLD=6;
// '&' is the runner, '0' a guard and 'S' a ladder that stays hidden until the
// last chest is taken; none of the three is a tile the map keeps.
const CHARS={' ':EMPTY,'.':EMPTY,'#':BRICK,'@':SOLID,'H':LADDER,'-':BAR,'X':TRAP,'$':GOLD,
  'S':EMPTY,'&':EMPTY,'0':EMPTY};
const GLYPH=[' ','#','@','H','-','X','$'];

/* Speeds are tiles per second. The runner is quicker than a guard, which is the
   only advantage he has, and everything falls at the same rate.

   A guard runs at a little under sixty per cent of the runner, and climbs at the
   same fraction. Keeping the two in step matters: when the ladder figure was the
   higher of the two a guard came up it almost as fast as you did, so climbing
   away — the main thing you have — barely worked, and they felt less like guards
   than like something that could not be shaken off. */
const RUN_WALK=7.4, RUN_CLIMB=5.6, RUN_BAR=7.4, FALL=12.5;
const GUARD_WALK=4.3, GUARD_CLIMB=3.3;
const DIG_TIME=0.40;      // the runner is rooted while the brick comes out
const HOLE_TIME=6.2;      // how long a hole stays open before the brick returns
const FILL_TIME=1.0;      // the closing part of HOLE_TIME, drawn growing back

/* ---------------------------------------------------------------- levels --- */

function parseLevel(spec){
  const rows=spec.rows, name=spec.name||'';
  const map=[], hidden=[], guards=[];
  let start={x:1,y:ROWS-2}, gold=0;
  for(let x=0;x<COLS;x++){map[x]=new Array(ROWS).fill(EMPTY);}
  for(let y=0;y<ROWS;y++){
    const line=(rows[y]||'').padEnd(COLS,' ');
    for(let x=0;x<COLS;x++){
      const ch=line[x];
      const t=CHARS[ch];
      map[x][y]=t===undefined?EMPTY:t;
      if(ch==='S')hidden.push({x,y});
      else if(ch==='&')start={x,y};
      else if(ch==='0')guards.push({x,y});
      else if(ch==='$')gold++;
    }
  }
  return {name,map,hidden,guards,start,gold};
}

// The level as text again, in the same character set, for the generator.
function levelText(L){
  const out=[];
  for(let y=0;y<ROWS;y++){
    let line='';
    for(let x=0;x<COLS;x++){
      if(L.start.x===x&&L.start.y===y){line+='&';continue;}
      if(L.guards.some(g=>g.x===x&&g.y===y)){line+='0';continue;}
      if(L.hidden.some(h=>h.x===x&&h.y===y)){line+='S';continue;}
      line+=GLYPH[L.map[x][y]];
    }
    out.push(line.replace(/\s+$/,''));
  }
  return out.join('\n');
}

function blankLevel(name){
  const rows=new Array(ROWS).fill('');
  rows[ROWS-1]='#'.repeat(COLS);
  rows[ROWS-2]='&';
  return parseLevel({name:name||'NEW LEVEL',rows});
}

/* ------------------------------------------------------------ world rules --- */

const G={};

function inB(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS;}
function tile(x,y){
  if(x<0||x>=COLS)return SOLID;      // the walls of the shaft
  if(y<0)return EMPTY;
  if(y>=ROWS)return SOLID;           // and its floor
  return G.map[x][y];
}
// A false brick looks like brick and is drawn like brick, but nothing rests on it.
function passable(x,y){const t=tile(x,y);return t!==BRICK&&t!==SOLID;}
function blocks(x,y){const t=tile(x,y);return t===BRICK||t===SOLID||t===LADDER;}

function holeAt(x,y){return G.holes.find(h=>h.x===x&&h.y===y&&h.open)||null;}

// A guard floundering in a hole is a floor: the runner is meant to walk over him.
function guardFloorAt(x,y){
  return G.guards.some(g=>!g.gone&&g.stuck>0&&g.x===x&&g.y===y);
}

function supported(a){
  const x=a.x,y=a.y,t=tile(x,y);
  if(t===LADDER||t===BAR)return true;
  if(y+1>=ROWS)return true;
  if(blocks(x,y+1))return true;
  return guardFloorAt(x,y+1);
}

function canUp(x,y){return tile(x,y)===LADDER&&y>0&&passable(x,y-1);}
function canDown(x,y){return y+1<ROWS&&passable(x,y+1)&&!guardFloorAt(x,y+1);}
function canSide(x,y,d){const nx=x+d;return nx>=0&&nx<COLS&&passable(nx,y);}

/* ---------------------------------------------------------------- actors --- */

function mkActor(x,y,guard){
  return {x,y,mx:0,my:0,p:0,face:1,guard:!!guard,anim:0,gold:0,stuck:0,
    respawn:0,gone:false,mode:'stand'};
}
const rx=a=>a.x+a.mx*a.p, ry=a=>a.y+a.my*a.p;
// The cell an actor counts as being in: the one it is closest to.
const cellX=a=>a.p<0.5?a.x:a.x+a.mx, cellY=a=>a.p<0.5?a.y:a.y+a.my;

function speedOf(a){
  if(a.mode==='fall')return FALL;
  if(a.guard)return a.my?GUARD_CLIMB:GUARD_WALK;
  if(a.my)return RUN_CLIMB;
  return tile(a.x,a.y)===BAR?RUN_BAR:RUN_WALK;
}

// Walks an actor for dt seconds, asking decide() for a direction each time it
// comes to rest on a cell. Distance left over at the end of a tile carries into
// the next one, so a frame boundary never costs a step.
function advance(a,dt,decide){
  let t=dt,spin=0;
  while(t>1e-7&&spin++<24){
    if(!a.mx&&!a.my){
      if(!decide(a)){a.p=0;break;}
      if(!a.mx&&!a.my){a.p=0;break;}
    }
    const spd=speedOf(a), need=(1-a.p)/spd;
    if(t<need){a.p+=spd*t;t=0;}
    else{t-=need;a.x+=a.mx;a.y+=a.my;a.p=0;a.mx=0;a.my=0;arrive(a);}
  }
  a.anim+=dt*(a.mx||a.my?1:0.35);
}

function arrive(a){
  if(a.guard)guardArrived(a);
  else heroArrived(a);
}

/* ----------------------------------------------------------------- runner --- */

const keys={up:false,down:false,left:false,right:false,digL:false,digR:false};

function decideHero(a){
  if(!supported(a)){a.mode='fall';a.my=1;return true;}
  a.mode=tile(a.x,a.y)===BAR?'hang':'stand';
  if(keys.up&&canUp(a.x,a.y)){a.my=-1;a.mode='climb';return true;}
  if(keys.down&&canDown(a.x,a.y)){a.my=1;a.mode='climb';return true;}
  if(keys.left&&canSide(a.x,a.y,-1)){a.mx=-1;a.face=-1;return true;}
  if(keys.right&&canSide(a.x,a.y,1)){a.mx=1;a.face=1;return true;}
  if(keys.left)a.face=-1;
  if(keys.right)a.face=1;
  return false;
}

function heroArrived(a){
  if(a.mode==='climb')sfx('rung');
  else if(a.mode!=='fall')sfx('step');
  if(tile(a.x,a.y)===GOLD){
    G.map[a.x][a.y]=EMPTY;
    G.taken++;
    addScore(SC_GOLD);
    sfx('gold');
    if(G.taken>=G.goldTotal)revealExit();
  }
}

function revealExit(){
  if(G.exitOpen)return;
  G.exitOpen=true;
  for(const h of G.hidden)if(G.map[h.x][h.y]===EMPTY)G.map[h.x][h.y]=LADDER;
  sfx('reveal');
  say('The last chest is yours — the ladder out of here is showing. Climb to the top.');
}

/* A dig takes the brick diagonally below and in front of the runner. It needs
   real brick (never the poured blocks), nothing sitting on top of it, and the
   runner standing on something — you cannot dig from a rope or in mid-air. */
function canDig(dir){
  const a=G.hero;
  if(G.state!=='play'||a.digT>0||a.mx||a.my)return false;
  const x=a.x+dir,y=a.y+1;
  if(!inB(x,y)||G.map[x][y]!==BRICK)return false;
  if(tile(x,y-1)!==EMPTY)return false;
  if(holeAt(x,y))return false;
  const here=tile(a.x,a.y);
  if(here===BAR||here===LADDER)return false;
  if(!blocks(a.x,a.y+1)&&!guardFloorAt(a.x,a.y+1))return false;
  if(G.guards.some(g=>!g.gone&&cellX(g)===x&&cellY(g)===y-1))return false;
  return true;
}

function tryDig(dir){
  if(!canDig(dir))return false;
  const a=G.hero;
  a.digT=DIG_TIME;a.digAt={x:a.x+dir,y:a.y+1};a.face=dir;a.mode='dig';
  sfx('dig');
  return true;
}

function openHole(x,y){
  G.map[x][y]=EMPTY;
  G.holes.push({x,y,t:HOLE_TIME,open:true});
}

function stepHoles(dt){
  for(let i=G.holes.length-1;i>=0;i--){
    const h=G.holes[i];
    h.t-=dt;
    if(h.t>0)continue;
    G.map[h.x][h.y]=BRICK;
    h.open=false;
    G.holes.splice(i,1);
    sfx('fill');
    for(const g of G.guards){
      if(!g.gone&&cellX(g)===h.x&&cellY(g)===h.y)buryGuard(g);
    }
    const a=G.hero;
    if(G.state==='play'&&cellX(a)===h.x&&cellY(a)===h.y)killHero('You were still in the hole when the brick came back.');
  }
}

/* ----------------------------------------------------------------- guards --- */

/* The guards do not take the shortest path. They look along the floor they are
   on for the column that brings them nearest the runner's row and commit to
   that direction, which is why they run past you, bunch up and drop into your
   holes. This is a reimplementation of the behaviour the original is described
   as having, not a disassembly of it. */

function vertReach(x,y,ty){
  let cy=y;
  if(ty<cy){while(cy>ty&&tile(x,cy)===LADDER&&passable(x,cy-1))cy--;}
  else if(ty>cy){while(cy<ty&&passable(x,cy+1)&&!guardFloorAt(x,cy+1))cy++;}
  return Math.abs(cy-ty);
}

function standable(x,y){
  const t=tile(x,y);
  return t===LADDER||t===BAR||blocks(x,y+1)||y+1>=ROWS||guardFloorAt(x,y+1);
}

function scanFloor(x,y,d,ty){
  let best=999,cx=x;
  for(let i=0;i<COLS;i++){
    const s=vertReach(cx,y,ty)*COLS+i;
    if(s<best)best=s;
    if(!standable(cx,y))break;          // walking off here means falling
    const nx=cx+d;
    if(!inB(nx,y)||!passable(nx,y))break;
    cx=nx;
  }
  return best;
}

function guardBusy(g){return g.stuck>0||g.respawn>0||g.gone;}

function decideGuard(g){
  if(guardBusy(g))return false;
  if(!supported(g)){g.mode='fall';g.my=1;return true;}
  g.mode='walk';
  const a=G.hero, ty=cellY(a), tx=cellX(a);
  if(g.y===ty){
    const d=tx<g.x?-1:1;
    if(tx!==g.x&&guardCanSide(g,d)){g.mx=d;g.face=d;return true;}
  }
  if(vertReach(g.x,g.y,ty)===0){
    if(ty<g.y&&canUp(g.x,g.y)&&!guardBlocked(g.x,g.y-1)){g.my=-1;g.mode='climb';return true;}
    if(ty>g.y&&canDown(g.x,g.y)&&!guardBlocked(g.x,g.y+1)){g.my=1;g.mode='climb';return true;}
  }
  const left=scanFloor(g.x,g.y,-1,ty), right=scanFloor(g.x,g.y,1,ty);
  let d=left<right?-1:right<left?1:(tx<g.x?-1:1);
  if(!guardCanSide(g,d))d=-d;
  if(!guardCanSide(g,d))return false;
  g.mx=d;g.face=d;
  return true;
}

function guardBlocked(x,y){
  return G.guards.some(o=>!o.gone&&o.stuck<=0&&(o.x===x&&o.y===y||o.x+o.mx===x&&o.y+o.my===y));
}
function guardCanSide(g,d){
  const nx=g.x+d;
  if(!canSide(g.x,g.y,d))return false;
  return !G.guards.some(o=>o!==g&&!o.gone&&(o.x===nx&&o.y===g.y||o.x+o.mx===nx&&o.y+o.my===g.y));
}

function guardArrived(g){
  // Gold on the floor goes in a guard's pocket, one bar at a time.
  if(tile(g.x,g.y)===GOLD&&!g.gold){G.map[g.x][g.y]=EMPTY;g.gold=1;}
  else if(g.gold&&tile(g.x,g.y)===EMPTY&&G.rng()<0.06&&standable(g.x,g.y)){
    g.gold=0;G.map[g.x][g.y]=GOLD;
  }
  const h=holeAt(g.x,g.y);
  if(h&&supported(g)&&g.stuck<=0){
    g.stuck=GUARD_STUCK;g.mode='stuck';
    addScore(SC_TRAP);
    sfx('trap');
    if(g.gold)dropGold(g);
  }
}

// What a guard is carrying pops out of the hole he fell into, which is the only
// way to get that chest back.
function dropGold(g){
  g.gold=0;
  const spots=[[g.x,g.y-1],[g.x-1,g.y-1],[g.x+1,g.y-1],[g.x,g.y]];
  for(const [x,y] of spots){
    if(inB(x,y)&&tile(x,y)===EMPTY&&!holeAt(x,y)){G.map[x][y]=GOLD;return;}
  }
  G.stash++;   // nowhere to put it; it comes back with him
}

function buryGuard(g){
  g.gone=true;g.respawn=SPAWN_WAIT;g.stuck=0;g.mx=0;g.my=0;g.p=0;
  addScore(SC_TRAP);
  sfx('bury');
  if(g.gold||G.stash>0){
    if(G.stash>0)G.stash--;
    g.gold=0;g.carryBack=true;
  }
}

function respawnGuard(g){
  const cols=[];
  for(let x=0;x<COLS;x++)for(let y=0;y<3;y++){
    if(tile(x,y)===EMPTY&&!G.guards.some(o=>o!==g&&!o.gone&&o.x===x&&o.y===y))cols.push([x,y]);
  }
  if(!cols.length)cols.push([Math.floor(COLS/2),0]);
  const pick=cols[Math.floor(G.rng()*cols.length)];
  g.x=pick[0];g.y=pick[1];g.gone=false;g.stuck=0;g.mx=0;g.my=0;g.p=0;g.mode='walk';
  if(g.carryBack){g.carryBack=false;g.gold=1;}
}

function stepGuards(dt){
  const many=Math.max(0,G.guards.length-1);
  const slow=Math.max(0.72,1-0.05*many);
  for(const g of G.guards){
    if(g.gone){
      g.respawn-=dt;
      if(g.respawn<=0)respawnGuard(g);
      continue;
    }
    if(g.stuck>0){
      g.stuck-=dt;
      if(g.stuck<=0&&!climbOut(g))g.stuck=0.35;   // hemmed in; try again shortly
      continue;
    }
    advance(g,dt*slow,decideGuard);
  }
}

// Out of the hole and onto the floor beside it, heading for the runner first.
function climbOut(g){
  if(!holeAt(g.x,g.y))return true;
  const toward=cellX(G.hero)<g.x?-1:1;
  for(const d of [toward,-toward]){
    const nx=g.x+d,ny=g.y-1;
    if(!inB(nx,ny)||!passable(nx,ny))continue;
    if(!G.guards.some(o=>o!==g&&!o.gone&&o.x===nx&&o.y===ny)){
      g.mx=d;g.my=-1;g.p=0;g.face=d;g.mode='walk';
      return true;
    }
  }
  return false;
}

/* ------------------------------------------------------------- game flow --- */

function mulberry(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;
    let t=Math.imul(a^a>>>15,1|a);
    t=(t+Math.imul(t^t>>>7,61|t))^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function levelSet(){return G.custom&&G.customSet.length?G.customSet:LEVELS;}

function loadLevel(i){
  const set=levelSet();
  if(G.slotIni&&G.started)Arcade.writeSlot(G.slotIni,
    {v:1,level:i,score:G.score,lives:G.lives,nextExtra:G.nextExtra,custom:!!G.custom},
    'LEVEL '+(i+1));
  const spec=set[((i%set.length)+set.length)%set.length];
  const L=parseLevel(spec);
  G.level=i;
  G.name=L.name;
  G.map=L.map;
  G.hidden=L.hidden;
  G.goldTotal=L.gold;
  G.taken=0;
  G.stash=0;
  G.exitOpen=false;
  G.holes=[];
  G.hero=mkActor(L.start.x,L.start.y,false);
  G.hero.digT=0;G.hero.digAt=null;
  G.guards=L.guards.map(g=>mkActor(g.x,g.y,true));
  G.state='play';
  G.clearT=0;
  say('Level '+(i+1)+(L.name?' — '+L.name:'')+'. '+L.gold+' chest'+(L.gold===1?'':'s')+' to lift.');
  return L;
}

/* What a slot holds. A level is the only place a run is worth picking up from,
 * so this is packed at the start of one and nowhere else. */
function packRun(){
  return{v:1,level:G.level,score:G.score,lives:G.lives,
    nextExtra:G.nextExtra,custom:!!G.custom};
}
function applyRun(r){
  if(!r||r.level===undefined)return false;
  G.custom=!!r.custom;
  newGame((r.level|0)+1);
  G.score=r.score|0;G.lives=Math.max(1,r.lives|0);
  G.nextExtra=r.nextExtra||SC_EXTRA;
  loadLevel(r.level|0);
  return true;
}
function newGame(startLevel,seed){
  G.rng=mulberry(seed===undefined?(Date.now()&0xffff):seed);
  G.score=0;
  G.lives=LIVES;
  G.nextExtra=SC_EXTRA;
  G.started=true;
  loadLevel((startLevel||1)-1);
}

function addScore(n){
  G.score+=n;
  if(G.score>=G.nextExtra){G.nextExtra+=SC_EXTRA;G.lives++;sfx('extra');}
}

function killHero(why){
  if(G.state!=='play')return;
  G.state='dead';
  G.deadT=1.3;
  G.lives--;
  sfx('death');
  say(why||'A guard had you.');
}

function completeLevel(){
  if(G.state!=='play')return;
  G.state='clear';
  G.clearT=1.8;
  addScore(SC_LEVEL);
  sfx('clear');
  say('Level '+(G.level+1)+' cleared. '+SC_LEVEL+' points.');
}

function touchedGuard(){
  const a=G.hero;
  if(a.digT>0)return false;
  const ax=rx(a),ay=ry(a);
  for(const g of G.guards){
    if(g.gone||g.stuck>0)continue;
    if(Math.abs(rx(g)-ax)<0.62&&Math.abs(ry(g)-ay)<0.62)return true;
  }
  return false;
}

function stepGame(dt){
  if(dt>0.05)dt=0.05;
  G.t=(G.t||0)+dt;
  if(G.state==='play'){
    const a=G.hero;
    if(a.digT>0){
      a.digT-=dt;
      if(a.digT<=0){
        if(a.digAt&&G.map[a.digAt.x][a.digAt.y]===BRICK)openHole(a.digAt.x,a.digAt.y);
        a.digAt=null;a.mode='stand';
      }
    }else{
      advance(a,dt,decideHero);
    }
    stepGuards(dt);
    stepHoles(dt);
    if(touchedGuard())killHero('A guard had you.');
    else if(G.exitOpen&&cellY(a)<=0)completeLevel();
  }else if(G.state==='dead'){
    stepHoles(dt);
    G.deadT-=dt;
    if(G.deadT<=0){
      if(G.lives<=0){
        G.state='over';say('Out of men. Final score '+G.score+'.');
        /* the table goes over the top of the card the loop is about to show */
        if(Arcade.qualifies(G.score))
          Arcade.submit(G.score,'LEVEL '+G.level,row=>Arcade.show({mark:row&&row.at}));
      }
      else loadLevel(G.level);
    }
  }else if(G.state==='clear'){
    G.clearT-=dt;
    if(G.clearT<=0){
      const set=levelSet();
      if(G.level+1>=set.length){G.state='won';say('Every level cleared. Final score '+G.score+'.');}
      else loadLevel(G.level+1);
    }
  }
}

function restartLevel(){
  if(G.state!=='play')return;
  killHero('You gave yourself up and started the level again.');
}

/* --------------------------------------------------------- level checking --- */

/* Which cells can the runner get to, allowing for digging? A level whose gold
   or whose way out is outside this set cannot be finished, so both the tests
   and the generator's CHECK button ask this question. */
function reachable(spec){
  const L=spec.map?spec:parseLevel(spec);
  const m=L.map;
  const T=(x,y)=>(x<0||x>=COLS?SOLID:y<0?EMPTY:y>=ROWS?SOLID:m[x][y]);
  const pass=(x,y)=>{const t=T(x,y);return t!==BRICK&&t!==SOLID;};
  const hid=new Set(L.hidden.map(h=>h.x+','+h.y));
  // With the gold gone the hidden ladders are real, so reachability is judged
  // with them in place.
  const passX=(x,y)=>pass(x,y)||hid.has(x+','+y);
  const ladder=(x,y)=>T(x,y)===LADDER||hid.has(x+','+y);
  const rest=(x,y)=>{
    if(y+1>=ROWS)return true;
    const t=T(x,y);
    if(t===LADDER||t===BAR||ladder(x,y))return true;
    const b=T(x,y+1);
    return b===BRICK||b===SOLID||b===LADDER||ladder(x,y+1);
  };
  const seen=new Set(), q=[[L.start.x,L.start.y]];
  const key=(x,y)=>x+','+y;
  seen.add(key(L.start.x,L.start.y));
  while(q.length){
    const [x,y]=q.pop();
    const push=(nx,ny)=>{
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
      if(!passX(nx,ny))return;
      const k=key(nx,ny);
      if(seen.has(k))return;
      seen.add(k);q.push([nx,ny]);
    };
    if(!rest(x,y)){push(x,y+1);continue;}          // falling: straight down only
    if(ladder(x,y))push(x,y-1);
    push(x,y+1);
    push(x-1,y);push(x+1,y);
    // Digging opens a way down through real brick with a clear cell above it.
    for(const d of [-1,1]){
      const bx=x+d;
      if(bx<0||bx>=COLS)continue;
      if(T(bx,y+1)===BRICK&&T(bx,y)===EMPTY&&rest(x,y))push(bx,y+1);
    }
  }
  return seen;
}

const topReached=seen=>{for(let x=0;x<COLS;x++)if(seen.has(x+',0'))return true;return false;};

/* A level is sound when the runner can get to every chest AND get back out from
   each of them. Checking only the way there would pass a pit you can fall into
   and never climb out of. */
function checkLevel(spec){
  const L=spec.map?spec:parseLevel(spec);
  const seen=reachable(L);
  const bad=[];
  if(!L.gold)bad.push('no gold');
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    if(L.map[x][y]!==GOLD)continue;
    if(!seen.has(x+','+y)){bad.push('gold at '+x+','+y+' cannot be reached');continue;}
    const out=reachable({map:L.map,hidden:L.hidden,start:{x,y}});
    if(!topReached(out))bad.push('there is no way back to the top from the gold at '+x+','+y);
  }
  if(!topReached(seen))bad.push('the top row cannot be reached');
  return bad;
}

/* ------------------------------------------------------------- rendering --- */

const cv=document.getElementById('cv');
const ctx=cv?cv.getContext('2d'):null;
const V={ts:16,ox:0,oy:0,w:448,h:256};

function sizeCanvas(){
  if(!cv)return;
  const box=cv.getBoundingClientRect?cv.getBoundingClientRect():{width:448,height:256};
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round((box.width||448)*dpr)), h=Math.max(1,Math.round((box.height||256)*dpr));
  if(cv.width!==w)cv.width=w;
  if(cv.height!==h)cv.height=h;
  V.w=w;V.h=h;
  // The board keeps its shape whatever shape the box is: the tile size is
  // whatever fits, and what is left over is black margin.
  V.ts=Math.max(4,Math.floor(Math.min(w/COLS,h/(ROWS+1))));
  V.ox=Math.floor((w-V.ts*COLS)/2);
  V.oy=Math.floor((h-V.ts*(ROWS+1))/2)+V.ts;
}

const C={brick:'#b4522a',brickDark:'#6d2f16',mortar:'#2a1409',solid:'#7b8aa0',solidDark:'#41506a',
  ladder:'#d8c84a',bar:'#d8c84a',gold:'#e8c63a',goldDark:'#8a6f12',hero:'#4fd8e8',heroDark:'#1d7f92',
  guard:'#e2564a',guardDark:'#8c231c',ink:'#e6e6f2',dim:'#8a8aa8'};

function px(x){return V.ox+x*V.ts;}
function py(y){return V.oy+y*V.ts;}

function drawBrick(x,y,cut){
  const s=V.ts,X=px(x),Y=py(y);
  const top=cut===undefined?0:cut;               // how much of the brick is gone
  ctx.fillStyle=C.mortar;ctx.fillRect(X,Y,s,s);
  ctx.fillStyle=C.brick;
  const hh=Math.max(1,Math.floor(s/2)-1);
  const rows=[[Y+1,hh,0],[Y+1+hh+1,s-hh-3,1]];
  for(const [ry0,rh,off] of rows){
    if(rh<=0)continue;
    if(ry0-Y<top*s)continue;                     // the dug part is not drawn
    const half=Math.floor(s/2);
    ctx.fillRect(X+1,ry0,half-1,rh);
    ctx.fillRect(X+half+1,ry0,s-half-2,rh);
    if(off){
      ctx.fillStyle=C.brickDark;
      ctx.fillRect(X+1,ry0+rh-1,s-2,1);
      ctx.fillStyle=C.brick;
    }
  }
}

function drawSolid(x,y){
  const s=V.ts,X=px(x),Y=py(y);
  ctx.fillStyle=C.solidDark;ctx.fillRect(X,Y,s,s);
  ctx.fillStyle=C.solid;ctx.fillRect(X+1,Y+1,s-2,s-3);
  ctx.fillStyle=C.solidDark;ctx.fillRect(X+1,Y+Math.floor(s/2),s-2,1);
}

function drawLadder(x,y){
  const s=V.ts,X=px(x),Y=py(y),w=Math.max(1,Math.round(s/10));
  ctx.fillStyle=C.ladder;
  ctx.fillRect(X+Math.round(s*0.2),Y,w,s);
  ctx.fillRect(X+Math.round(s*0.8)-w,Y,w,s);
  for(let i=0;i<2;i++){
    ctx.fillRect(X+Math.round(s*0.2),Y+Math.round(s*(0.22+i*0.42)),Math.round(s*0.6),w);
  }
}

function drawBar(x,y){
  const s=V.ts,X=px(x),Y=py(y),w=Math.max(1,Math.round(s/10));
  ctx.fillStyle=C.bar;
  ctx.fillRect(X,Y+Math.round(s*0.18),s,w);
}

function drawGold(x,y){
  const s=V.ts,X=px(x),Y=py(y);
  const gy=Y+Math.round(s*0.28),gh=Math.round(s*0.58),gw=Math.round(s*0.76);
  const gx=X+Math.round((s-gw)/2);
  ctx.fillStyle=C.goldDark;ctx.fillRect(gx,gy,gw,gh);
  ctx.fillStyle=C.gold;ctx.fillRect(gx+1,gy+1,gw-2,gh-2);
  ctx.fillStyle=C.goldDark;ctx.fillRect(gx+1,gy+Math.round(gh*0.45),gw-2,Math.max(1,Math.round(s/12)));
  ctx.fillStyle='#fff6c0';ctx.fillRect(gx+2,gy+2,Math.max(1,Math.round(gw/4)),Math.max(1,Math.round(s/10)));
}

function drawField(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,V.w,V.h);
  const fill=new Map();
  for(const h of G.holes)fill.set(h.x+','+h.y,h.t);
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    const t=G.map[x][y];
    if(t===BRICK)drawBrick(x,y);
    else if(t===TRAP)drawBrick(x,y);          // a false brick gives nothing away
    else if(t===SOLID)drawSolid(x,y);
    else if(t===LADDER)drawLadder(x,y);
    else if(t===BAR)drawBar(x,y);
    else if(t===GOLD)drawGold(x,y);
    else{
      const left=fill.get(x+','+y);
      if(left!==undefined&&left<FILL_TIME)drawBrick(x,y,left/FILL_TIME);
    }
  }
  // The runner's own dig, mid-swing.
  const a=G.hero;
  if(a&&a.digT>0&&a.digAt){
    const f=1-a.digT/DIG_TIME;
    drawBrick(a.digAt.x,a.digAt.y,f);
  }
}

function limb(X,Y,s,dx,dy,w){ctx.fillRect(X+Math.round(dx*s),Y+Math.round(dy*s),Math.max(1,Math.round(w*s)),Math.max(1,Math.round(s/8)));}

function drawMan(a,body,dark){
  const s=V.ts,X=px(rx(a)),Y=py(ry(a));
  const f=Math.floor(a.anim*7)%2;
  ctx.fillStyle=dark;
  ctx.fillRect(X+Math.round(s*0.3),Y+Math.round(s*0.08),Math.round(s*0.4),Math.round(s*0.26));
  ctx.fillStyle=body;
  ctx.fillRect(X+Math.round(s*0.33),Y+Math.round(s*0.11),Math.round(s*0.34),Math.round(s*0.2));
  const bw=Math.max(1,Math.round(s*0.2));
  ctx.fillRect(X+Math.round(s*0.4),Y+Math.round(s*0.32),bw,Math.round(s*0.32));
  const m=a.mode;
  if(m==='climb'){
    limb(X,Y,s,0.18+0.14*f,0.30,0.3);
    limb(X,Y,s,0.5-0.14*f,0.30,0.3);
    limb(X,Y,s,0.22+0.1*f,0.72,0.28);
    limb(X,Y,s,0.5-0.1*f,0.72,0.28);
  }else if(m==='hang'){
    limb(X,Y,s,0.2,0.2,0.6);
    limb(X,Y,s,0.24+0.16*f,0.68,0.24);
    limb(X,Y,s,0.5-0.12*f,0.74,0.24);
  }else if(m==='fall'){
    limb(X,Y,s,0.08,0.26,0.32);
    limb(X,Y,s,0.6,0.26,0.32);
    limb(X,Y,s,0.24,0.7,0.24);
    limb(X,Y,s,0.5,0.76,0.24);
  }else if(m==='dig'){
    limb(X,Y,s,a.face>0?0.56:0.1,0.42,0.34);
    limb(X,Y,s,0.24,0.74,0.22);
    limb(X,Y,s,0.5,0.74,0.22);
  }else if(m==='stuck'){
    limb(X,Y,s,0.1,0.22,0.3);
    limb(X,Y,s,0.6,0.22,0.3);
    limb(X,Y,s,0.3,0.78,0.36);
  }else{
    limb(X,Y,s,a.face>0?0.5:0.16,0.36,0.34);
    limb(X,Y,s,0.2+(f?0.02:0.16),0.72,0.26);
    limb(X,Y,s,0.5-(f?0.02:0.16),0.72,0.26);
  }
}

function drawActors(){
  for(const g of G.guards){
    if(g.gone)continue;
    drawMan(g,C.guard,C.guardDark);
    if(g.gold){
      const s=V.ts,X=px(rx(g)),Y=py(ry(g));
      ctx.fillStyle=C.gold;
      ctx.fillRect(X+Math.round(s*0.38),Y+Math.round(s*0.4),Math.round(s*0.24),Math.round(s*0.18));
    }
  }
  const a=G.hero;
  if(a&&G.state!=='dead')drawMan(a,C.hero,C.heroDark);
  else if(a){
    const s=V.ts,X=px(rx(a)),Y=py(ry(a));
    ctx.fillStyle=C.heroDark;
    ctx.fillRect(X+Math.round(s*0.15),Y+Math.round(s*0.6),Math.round(s*0.7),Math.round(s*0.2));
  }
}

function drawHUD(){
  const s=V.ts, y=V.oy-Math.round(s*0.25);
  ctx.fillStyle=C.dim;
  ctx.font=Math.max(8,Math.round(s*0.62))+'px ui-monospace,Menlo,Consolas,monospace';
  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';
  ctx.fillStyle=C.ink;
  ctx.fillText('SCORE '+String(G.score).padStart(6,'0'),px(0),y);
  ctx.textAlign='center';
  ctx.fillText('MEN '+Math.max(0,G.lives),px(COLS/2),y);
  ctx.textAlign='right';
  ctx.fillStyle=G.exitOpen?C.gold:C.ink;
  ctx.fillText('LEVEL '+(G.level+1)+'  GOLD '+(G.goldTotal-G.taken),px(COLS),y);
  ctx.textAlign='left';
}

/* The title screen is the tower itself, drawn and running: a runner crossing a
   rope, guards on the floors below, and the gold he is here for. */
function drawTitle(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,V.w,V.h);
  const s=V.ts;
  for(let y=4;y<ROWS;y+=3){
    for(let x=2;x<COLS-2;x++){
      if(y===10&&x>12&&x<17)continue;
      drawBrick(x,y);
    }
  }
  for(let y=5;y<=7;y++)drawLadder(6,y);
  for(let y=8;y<=10;y++)drawLadder(21,y);
  for(let x=11;x<18;x++)drawBar(x,9);
  for(const gx of [4,10,19,25])drawGold(gx,y0(gx)-1);
  const phase=(t*0.9)%1;
  const man={x:11+phase*6,y:9,mx:0,my:0,p:0,face:1,anim:t,mode:'hang'};
  drawMan(man,C.hero,C.heroDark);
  const g1={x:5+((t*0.5)%1)*6,y:6,mx:0,my:0,p:0,face:1,anim:t*0.8,mode:'walk'};
  const g2={x:20-((t*0.4)%1)*7,y:12,mx:0,my:0,p:0,face:-1,anim:t*0.7,mode:'walk'};
  drawMan(g1,C.guard,C.guardDark);
  drawMan(g2,C.guard,C.guardDark);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,V.w,V.h);
}
function y0(x){return x<8?6:x<14?3:x<22?12:9;}

/* ----------------------------------------------------------------- sound --- */

/* Nothing here is transcribed. The 1983 release carries no music or sound
   credit in any source reachable from here, so there was no score to arrange;
   what plays is new writing in the idiom of the machines the game ran on. */

// unlocked: no browser lets a page make a sound before the visitor has touched
// it, so nothing here builds an AudioContext until a gesture has said it may.
// Safari is the strict case: a context built outside a gesture stays suspended
// until something resumes it from inside one.
const A={ctx:null,on:true,music:true,master:null,next:0,step:0,unlocked:false};

function audioReady(){
  if(A.ctx||!A.on||!A.unlocked)return A.ctx;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  A.ctx=new AC();
  A.master=A.ctx.createGain();
  A.master.gain.value=0.5;
  A.master.connect(A.ctx.destination);
  try{ A.ctx.onstatechange=function(){
    if(A.on&&A.ctx&&A.ctx.state!=='running'){try{A.ctx.resume();}catch(e){}}
  }; }catch(e){}
  return A.ctx;
}

/* The Apple II had one bit of audio. A soft switch at $C030 flipped the speaker
   cone in or out, and that was the whole instrument: every sound the 1983 game
   made was a 6502 loop counting cycles between flips. Pitch is the gap between
   them; the only way to get quieter is to spend less of each cycle flipped out,
   which is why these have a duty cycle and not a volume envelope.

   So the effects here are not oscillators with the edges rounded off — they are
   built the way the machine built them, a buffer of hard +1 / -1 produced by
   simulating the flips, then run through a filter standing in for the small
   paper cone that had to reproduce it. */

const SPK_LP=3400, SPK_HP=300;

// Each segment is a stretch of flipping: f0 to f1 Hz over dur seconds, with the
// duty cycle sliding d0 to d1. noise:true picks the gap at random inside the
// range each cycle, which is how a one-bit speaker makes a scraping sound.
function speaker(segs,vol){
  const c=A.on?audioReady():null;
  if(!c||!c.createBuffer)return null;
  const sr=c.sampleRate||44100;
  const total=segs.reduce((a,s)=>a+s.dur,0);
  const n=Math.max(1,Math.ceil(sr*total));
  const buf=c.createBuffer(1,n,sr);
  const d=buf.getChannelData(0);
  let i=0,phase=0,gap=0;
  for(const s of segs){
    const len=Math.min(n-i,Math.floor(sr*s.dur));
    const d0=s.d0===undefined?0.5:s.d0, d1=s.d1===undefined?d0:s.d1;
    for(let k=0;k<len;k++,i++){
      const t=len>1?k/(len-1):0;
      if(phase>=1||!gap){
        phase-=phase>=1?1:0;
        // Math.random, deliberately: the scrape must never draw on G.rng, or
        // the game would deal a guard a different corner with the sound on.
        gap=s.noise?s.f0+(s.f1-s.f0)*Math.random():s.f0+(s.f1-s.f0)*t;
      }
      phase+=gap/sr;
      if(phase>=1)phase-=1;
      // Out for the duty part of the cycle, back in for the rest. Nothing in
      // between, because there is nothing in between to have.
      d[i]=phase<(d0+(d1-d0)*t)?1:-1;
    }
  }
  while(i<n)d[i++]=-1;
  const src=c.createBufferSource();
  src.buffer=buf;
  let node=src;
  if(c.createBiquadFilter){
    const lp=c.createBiquadFilter(),hp=c.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=SPK_LP;
    hp.type='highpass';hp.frequency.value=SPK_HP;
    node.connect(lp);lp.connect(hp);node=hp;
  }
  const g=c.createGain();
  g.gain.value=vol===undefined?0.2:vol;
  node.connect(g);g.connect(A.master);
  if(src.start)src.start();
  return buf;
}

const NOTE={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function hz(tok){
  if(!tok||tok==='.')return 0;
  const m=/^([a-g])(#?)(\d)$/.exec(tok);
  if(!m)return 0;
  const n=NOTE[m[1]]+(m[2]?1:0)+(parseInt(m[3],10)+1)*12;
  return 440*Math.pow(2,(n-69)/12);
}
function tuneFor(){
  if(!G.started||G.state==='title')return 'title';
  if(G.exitOpen)return 'run';
  return 'play';
}
function musicTick(){
  const c=(A.on&&A.music)?audioReady():null;
  if(!c)return;
  const T=TUNES[tuneFor()];
  const spb=60/T.bpm/4;
  const quiet=G.state==='dead'||G.state==='over'||G.paused;
  if(A.next<c.currentTime)A.next=c.currentTime+0.05;
  while(A.next<c.currentTime+0.3){
    const i=A.step%32;
    if(!quiet){
      const lead=hz(T.lead.split(/\s+/)[i]);
      const bass=hz(T.bass.split(/\s+/)[i]);
      if(lead)voice(lead,spb*1.6,'square',0.07,A.next);
      if(bass)voice(bass,spb*1.4,'triangle',0.1,A.next);
      if(T.drum.split(/\s+/)[i]==='x')voice(70,spb*0.8,'sawtooth',0.06,A.next);
    }
    A.next+=spb;A.step++;
  }
}
function voice(f,dur,type,vol,at){
  const c=A.ctx;
  if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,at);
  g.gain.setValueAtTime(vol,at);
  g.gain.exponentialRampToValueAtTime(0.0008,at+dur);
  o.connect(g);g.connect(A.master);
  o.start(at);o.stop(at+dur+0.02);
}

  G.goldTotal=L.gold;G.taken=0;G.exitOpen=false;G.holes=[];G.level=ED.slot;G.name=spec.name;
  editSlugOut();
  const s=$('e-slot');
  if(s)s.textContent=(ED.slot+1)+' / '+G.customSet.length;
}
function editSlugOut(){
  const t=$('slug');
  if(t)t.value=levelText(currentEdit());
}
function currentEdit(){
  return {map:G.map,hidden:G.hidden,guards:G.guards.map(g=>({x:g.x,y:g.y})),
    start:{x:G.hero.x,y:G.hero.y},gold:G.goldTotal,name:G.name};
}
function editCommit(){
  const L=currentEdit();
  G.customSet[ED.slot]={name:L.name||('MY LEVEL '+(ED.slot+1)),rows:levelText(L).split('\n')};
}
function buildPalette(){
  const p=$('palette');
  if(!p||p.innerHTML===undefined)return;
  p.innerHTML=PAL.map(([ch,name])=>
    '<button class="btn'+(ch===ED.tile?' on':'')+'" data-t="'+(ch===' '?'_':ch)+'">'+name+'</button>').join('');
  if(p.querySelectorAll)p.querySelectorAll('[data-t]').forEach(b=>{
    b.addEventListener('click',()=>{ED.tile=b.dataset.t==='_'?' ':b.dataset.t;buildPalette();});
  });
}
function editPaint(cx,cy){
  if(!inB(cx,cy))return;
  const ch=ED.tile;
  G.guards=G.guards.filter(g=>!(g.x===cx&&g.y===cy));
  G.hidden=G.hidden.filter(h=>!(h.x===cx&&h.y===cy));
  if(G.hero.x===cx&&G.hero.y===cy&&ch!=='&'){G.hero.x=-1;G.hero.y=-1;}
  if(ch==='0'){G.map[cx][cy]=EMPTY;G.guards.push(mkActor(cx,cy,true));}
  else if(ch==='&'){G.map[cx][cy]=EMPTY;G.hero=mkActor(cx,cy,false);G.hero.digT=0;}
  else if(ch==='S'){G.map[cx][cy]=EMPTY;G.hidden.push({x:cx,y:cy});}
  else G.map[cx][cy]=CHARS[ch];
  G.goldTotal=0;
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)if(G.map[x][y]===GOLD)G.goldTotal++;
  editCommit();
  editSlugOut();
}

/* ------------------------------------------------------------ input, run --- */

function pointerCell(ev){
  const box=cv.getBoundingClientRect();
  const x=(ev.clientX-box.left)*(cv.width/box.width)-V.ox;
  const y=(ev.clientY-box.top)*(cv.height/box.height)-V.oy;
  return {x:Math.floor(x/V.ts),y:Math.floor(y/V.ts)};
}

function hold(id,on,off){
  const b=$(id);
  if(!b||!b.addEventListener)return;
  const down=e=>{if(e.preventDefault)e.preventDefault();unlockAudio();b.classList.add('on');on();};
  const up=e=>{if(e&&e.preventDefault)e.preventDefault();b.classList.remove('on');if(off)off();};
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
  b.addEventListener('pointerleave',up);
}

const KEYMAP={
  ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
  w:'up',s:'down',a:'left',d:'right',
  i:'up',k:'down',j:'left',l:'right',
  u:'digL',o:'digR',z:'digL',x:'digR',',':'digL','.':'digR'
};

function keyName(e){
  if(e.key&&e.key.length===1)return e.key.toLowerCase();
  return e.key;
}

function toggleFull(){
  const b=document.body;
  const want=!(b.classList.contains&&b.classList.contains('fs'));
  b.classList.toggle('fs',want);
  const f=$('fs');
  if(f)f.textContent=want?'EXIT FULL SCREEN':'FULL SCREEN';
  const el=document.documentElement;
  try{
    if(want&&el.requestFullscreen)el.requestFullscreen();
    else if(!want&&document.exitFullscreen&&document.fullscreenElement)document.exitFullscreen();
  }catch(e){}
  sizeCanvas();
}

let last=0;
function frame(ts){
  const now=ts/1000;
  let dt=last?now-last:0;
  last=now;
  if(dt>0.1)dt=0.1;
  sizeCanvas();
  if(ctx){
    if(ED.on){drawField();drawActors();drawEditGrid();}
    else if(!G.started||G.state==='title'){drawTitle(now);}
    else{drawField();drawActors();drawHUD();}
  }
  if(!G.paused&&!ED.on&&G.started&&G.state!=='title')stepGame(dt);
  if(!ED.on&&!menuMode&&(G.state==='over'||G.state==='won'))showMenu(G.state);
  musicTick();
  showStick();
  requestAnimationFrame(frame);
}

function drawEditGrid(){
  ctx.strokeStyle='rgba(120,120,170,.25)';
  ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(px(x)+0.5,py(0));ctx.lineTo(px(x)+0.5,py(ROWS));ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(px(0),py(y)+0.5);ctx.lineTo(px(COLS),py(y)+0.5);ctx.stroke();}
  for(const h of G.hidden){
    ctx.strokeStyle='rgba(216,200,74,.8)';
    ctx.strokeRect(px(h.x)+1.5,py(h.y)+1.5,V.ts-3,V.ts-3);
  }
}

/* ------------------------------------------------------------------ boot --- */

G.score=0;G.lives=LIVES;G.level=0;G.state='title';G.started=false;G.paused=false;G.slotIni='';
G.startLevel=1;G.custom=false;G.customSet=[];G.holes=[];G.hidden=[];G.guards=[];
G.map=[];G.goldTotal=0;G.taken=0;G.exitOpen=false;G.stash=0;G.nextExtra=SC_EXTRA;
G.rng=mulberry(1);G.hero=mkActor(1,ROWS-2,false);G.hero.digT=0;G.t=0;
for(let x=0;x<COLS;x++)G.map[x]=new Array(ROWS).fill(EMPTY);
loadCustom();

/* The four direction buttons are a stick now. It sets the same four flags they
 * set, on the edge, so a held direction is a held key and everything reading
 * keys.* downstream is unchanged - which is the point of doing it this way. */
const DIRKEY={u:'up',d:'down',l:'left',r:'right'};
const stick=(typeof Stick!=='undefined')&&Stick.make({
  host:'#stickhost',ways:4,label:'Joystick: run and climb',
  unlock:unlockAudio,
  onDirs(now){ for(const d in DIRKEY)keys[DIRKEY[d]]=!!now[d]; }});
/* On a keyboard the arrows are the stick, and the knob has to say so or the
 * player is looking at a control that never moves. */
function showStick(){
  if(stick)stick.showKeys((keys.right?1:0)-(keys.left?1:0),(keys.down?1:0)-(keys.up?1:0));
}
hold('k-digl',()=>tryDig(-1));
hold('k-digr',()=>tryDig(1));

hold('k-pause',()=>showMenu('pause'));

document.addEventListener('pointerdown',unlockAudio,{capture:true});
document.addEventListener('keydown',unlockAudio,{capture:true});

const soundBtn=$('sound');
if(soundBtn&&soundBtn.addEventListener)soundBtn.addEventListener('click',()=>{

['e-test','e-save','e-clear','e-exit','e-prev','e-next','e-copy'].forEach(id=>{

if(cv&&cv.addEventListener){

addEventListener('keydown',e=>{

addEventListener('resize',sizeCanvas);

   A home-screen launch has no address bar and no toolbar, so nothing slides in

   full-screen layout; the worker keeps the game playable without a signal. */
function isStandaloneApp(){
  try{
    if(typeof navigator==="object"&&navigator&&navigator.standalone===true)return true;
    if(typeof matchMedia!=="function")return false;
    return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches;
  }catch(e){return false;}
}
if(typeof navigator==="object"&&navigator&&navigator.serviceWorker&&
