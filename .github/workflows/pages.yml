name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test archon/tests/combat.test.cjs
      - name: Install the Law of the West dev dependency
        run: npm --prefix law-of-the-west ci
      - run: node --test law-of-the-west/test/*.test.js
      - name: The committed page must match its sources
        run: |
          node law-of-the-west/tools/assemble.js
          git diff --exit-code law-of-the-west/index.html

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true turns GitHub Pages on for this repository if it is
      # not enabled yet, so the site exists without a manual settings change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
