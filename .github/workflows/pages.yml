name: Deploy GitHub Pages

# The tests run on pull requests as well as on main. They used to run only after
# a merge, which meant every pull request was mergeable the moment it existed and
# a red build was something you found out about afterwards.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per ref, not one for the whole repository: under a single shared
# group a pull request run cancels an in-flight deploy of main, which is what
# happened to run 34.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # every game carries its own copy of the zoom guard; they must not drift
      - run: node tools/sync-nozoom.js --check
      - run: node --test archon/tests/combat.test.cjs
      - run: node --test bards-tale/tests/*.test.cjs
      - run: node --test aztec/tests/tomb.test.cjs
      - run: node --test choplifter/tests/*.test.cjs
      - run: node --test drol/tests/*.test.cjs
      - run: node --test galaga/tests/*.test.cjs
      - run: node --test lode-runner/tests/*.test.cjs
      - run: node --test tapped/tests/*.test.cjs
      - name: Install the Law of the West dev dependency
        run: npm --prefix law-of-the-west ci
      - run: node --test law-of-the-west/test/*.test.js
      - name: The Drol artwork must match the Drol sprite
        run: |
          node drol/tools/render-art.js --check
      - name: The Choplifter artwork must match the Choplifter sprite
        run: |
          node choplifter/tools/render-art.js --check
      - name: The committed page must match its sources
        run: |
          node law-of-the-west/tools/assemble.js
          git diff --exit-code law-of-the-west/index.html

  deploy:
    needs: test
    # Nothing is published from a pull request; it is checked and no more.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true turns GitHub Pages on for this repository if it is
      # not enabled yet, so the site exists without a manual settings change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
